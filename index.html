 {"g": "= 0"}]}, {"stufe": "mittel", "aufgabe": "(−2)⁴", "loesung": "16", "quelle": "analog Grundwissen S. 147 (Potenzen negativer Zahlen)", "schritte": [{"g": "Die Klammer bedeutet: (−2) · (−2) · (−2) · (−2)"}, {"g": "Vier Minuszeichen → positiv", "op": "Vorzeichenregel"}, {"g": "= 16"}]}, {"stufe": "mittel", "aufgabe": "−5 · 3 + (−12) : (−4)", "loesung": "−12", "quelle": "analog Buch S. 86, Aufg. 2 (Punkt vor Strich mit Vorzeichen)", "schritte": [{"g": "Punkt vor Strich: −5 · 3 = −15"}, {"g": "(−12) : (−4) = 3", "op": "minus durch minus = plus"}, {"g": "−15 + 3 = −12"}]}, {"stufe": "mittel", "aufgabe": "−1/2 + 0,75", "loesung": "0,25", "quelle": "analog Buch S. 86, Aufg. 1 (Bruch und Dezimalzahl gemischt)", "schritte": [{"g": "Gleiche Darstellung wählen: −1/2 = −0,5"}, {"g": "−0,5 + 0,75 = 0,25"}]}], "titel": "Plus, Minus und die Vorzeichen im Griff", "test": [{"stufe": "mittel", "aufgabe": "Setze x = −3 in den Term x/2 − 4 ein.", "schritte": [{"g": "(−3)/2 − 4"}, {"g": "= −1,5 − 4"}, {"g": "= −5,5"}], "loesung": "−5,5", "hinweis": "Erst den Bruch berechnen, dann subtrahieren – das Minus bleibt erhalten.", "quelle": "Test Kap. 5, Aufg. 1c · Lösung S. 185 ✓"}, {"stufe": "schwer", "aufgabe": "Setze x = 5 in den Term −5 · (x + 4) − 3 ein.", "schritte": [{"g": "Klammer zuerst: 5 + 4 = 9"}, {"g": "−5 · 9 = −45"}, {"g": "−45 − 3 = −48"}], "loesung": "−48", "hinweis": "Klammer zuerst, dann das Minus vor der 5 mitnehmen.", "quelle": "Test Kap. 5, Aufg. 1d · Lösung S. 185 ✓"}]}, "B1": {"id": "B1", "titel": "Die binomischen Formeln knacken", "kerne": [{"name": "", "verstehen": ["Rechne (x + 3)². Das heißt (x + 3) · (x + 3). Multipliziere jeden mit jedem: x² + 3x + 3x + 9 = x² + 6x + 9. Genau das sagt die 1. binomische Formel → (a + b)² = a² + 2ab + b². Das mittlere Glied 2ab entsteht, weil das gemischte Produkt zweimal vorkommt.", "Warum das stimmt, siehst du an einem Bild – dem Flächenmodell. Zeichne ein Quadrat, dessen Seite a + b lang ist (erst ein Stück a, dann ein Stück b). Teile beide Seiten an dieser Stelle und ziehe die Linien quer durch – das große Quadrat zerfällt in vier Teile: oben links ein Quadrat mit Seite a (Fläche a · a = a²), unten rechts ein Quadrat mit Seite b (Fläche b · b = b²) und zwei gleich große Rechtecke mit den Seiten a und b (jedes hat die Fläche a · b). Das große Quadrat hat die Fläche (a + b)² – und alle vier Teile zusammen haben die Fläche a² + ab + ab + b² = a² + 2ab + b². Beides ist dieselbe Fläche, also → (a + b)² = a² + 2ab + b². So SIEHST du, warum das mittlere Glied doppelt vorkommt: Es gibt zwei Rechtecke. [BILD:v_b1_flaeche]", "Die 2. binomische Formel rechnest du genauso nach: (a − b)² heißt (a − b) · (a − b). Multipliziere jeden mit jedem → a · a = a², dann a · (−b) = −ab, dann (−b) · a = −ab, zuletzt (−b) · (−b) = +b² (Minus mal Minus gibt Plus!). Zusammen: a² − ab − ab + b² = a² − 2ab + b². Also → (a − b)² = a² − 2ab + b². Das Minus steht nur beim mittleren Glied – das b² am Ende bleibt Plus.", "Die 3. binomische Formel: (a + b)(a − b). Multipliziere jeden mit jedem → a · a = a², a · (−b) = −ab, b · a = +ab, b · (−b) = −b². Zusammen: a² − ab + ab − b². Die beiden mittleren Teile heben sich auf (−ab + ab = 0) – übrig bleibt a² − b². Also → (a + b)(a − b) = a² − b². Mit den drei Formeln rechnest du schneller und sicherer als mit Ausmultiplizieren – und du erkennst sie später beim Faktorisieren wieder."], "fallen": [{"falle": "Mittleres Glied vergessen", "falsch": "(x + 3)² = x² + 9", "richtig": "(x + 3)² = x² + 6x + 9", "warum": "Das gemischte Produkt kommt zweimal vor → 2 · x · 3 = 6x"}, {"falle": "2. und 3. binomische Formel verwechselt", "falsch": "(a − b)² = a² − b²", "richtig": "(a − b)² = a² − 2ab + b²", "warum": "a² − b² gehört zu (a + b)(a − b); beim Quadrat bleibt +b²"}], "ueben": [{"stufe": "leicht", "aufgabe": "(x + 2)²", "schritte": [{"g": "1. binomische Formel: (a + b)² = a² + 2ab + b²"}, {"g": "a = x, b = 2"}, {"g": "x² + 2 · x · 2 + 2² = x² + 4x + 4"}], "loesung": "x² + 4x + 4", "hinweis": "1. binomische Formel (a + b)² = a² + 2ab + b². Mittelglied → 2 · x · 2 = 4x."}, {"stufe": "leicht", "aufgabe": "(x − 5)²", "schritte": [{"g": "2. binomische Formel: (a − b)² = a² − 2ab + b²"}, {"g": "a = x, b = 5"}, {"g": "x² − 2 · x · 5 + 5² = x² − 10x + 25"}], "loesung": "x² − 10x + 25", "hinweis": "2. binomische Formel (a − b)² = a² − 2ab + b². Mittelglied → 2 · x · 5 = 10x, mit Minus."}, {"stufe": "leicht", "aufgabe": "(x + 4)(x − 4)", "schritte": [{"g": "3. binomische Formel: (a + b)(a − b) = a² − b²"}, {"g": "x² − 4² = x² − 16"}], "loesung": "x² − 16", "hinweis": "3. binomische Formel (a + b)(a − b) = a² − b². Hier: x² − 4² = x² − 16."}, {"stufe": "mittel", "aufgabe": "(4a + 3 − 2a) · (−4a + 2)", "schritte": [{"g": "Zuerst die erste Klammer zusammenfassen: 4a − 2a = 2a → (2a + 3)"}, {"g": "Jetzt jeden Summanden mit jedem: (2a + 3)(−4a + 2)"}, {"g": "2a · (−4a) = −8a²; 2a · 2 = 4a; 3 · (−4a) = −12a; 3 · 2 = 6"}, {"g": "4a − 12a = −8a"}, {"g": "Ergebnis: −8a² − 8a + 6"}], "loesung": "−8a² − 8a + 6", "hinweis": "Erst in der Klammer zusammenfassen, dann ausmultiplizieren.", "quelle": "Klassenarbeit 11/2019 (2. Test), Aufg. 1b · Lösung der Arbeit ✓"}, {"stufe": "mittel", "aufgabe": "(2a − b)(x + 3y)", "schritte": [{"g": "Keine binomische Formel – hier steht jede Klammer für sich"}, {"g": "Jeder Summand der ersten Klammer mal jeder der zweiten"}, {"g": "2a · x = 2ax und 2a · 3y = 6ay"}, {"g": "(−b) · x = −bx und (−b) · 3y = −3by"}, {"g": "Ergebnis: 2ax + 6ay − bx − 3by"}], "loesung": "2ax + 6ay − bx − 3by", "hinweis": "Jeder mit jedem – auf das Minus vor b achten.", "quelle": "Klassenarbeit 12/2019 (1. Schulaufgabe), Aufg. 4 · Lösung der Arbeit ✓"}, {"stufe": "mittel", "aufgabe": "(2x + 5)(2x − 5)", "schritte": [{"g": "3. binomische Formel (a + b)(a − b) = a² − b² mit a"}, {"g": "2x"}, {"g": "(2x)² = 4x², minus 5² = 25."}, {"g": "Ergebnis: 4x² − 25"}], "loesung": "4x² − 25", "hinweis": "3. binomische Formel: (a + b)(a − b) = a² − b² – hier steht 2x an der Stelle von a."}, {"stufe": "mittel", "aufgabe": "(5a − 2b)²", "schritte": [{"g": "2. binomische Formel"}, {"g": "(5a)² = 25a², Mittelglied 2 · 5a · 2b = 20ab mit Minus, dazu (2b)² = 4b²."}, {"g": "Ergebnis: 25a² − 20ab + 4b²"}], "loesung": "25a² − 20ab + 4b²", "hinweis": "2. binomische Formel."}, {"stufe": "mittel", "aufgabe": "Ergänze: x² − ▢x + 16 = (x − 4)²", "schritte": [{"g": "Rückwärts lesen"}, {"g": "2 · x · 4"}, {"g": "Ergebnis: 8"}], "loesung": "8", "hinweis": "Rückwärts lesen → 2 · x · 4"}, {"aufgabe": "Vereinfache: (2x + y)(2x − y) − 2(2x)²", "loesung": "−4x² − y²", "hinweis": "Im ersten Term steckt die 3. binomische Formel.", "schritte": [{"g": "(2x + y)(2x − y) = (2x)² − y² = 4x² − y²", "op": "3. binomische Formel"}, {"g": "2(2x)² = 2 · 4x² = 8x²", "op": "Klammer mit Hochzahl"}, {"g": "4x² − y² − 8x²"}, {"g": "Ergebnis: −4x² − y²"}], "quelle": "KA 2. Test Terme/binomische Formeln (Klasse 7, 11/2019), Aufg. 1a – 1:1; Lösung aus dem KA-Dossier ✓", "stufe": "schwer"}, {"aufgabe": "Vereinfache: (2x − 3)² − (x + 2) · (1/2 + x)", "loesung": "3x² − 14,5x + 8", "hinweis": "Erst die 2. binomische Formel, dann das zweite Produkt ausmultiplizieren.", "schritte": [{"g": "(2x − 3)² = 4x² − 12x + 9", "op": "2. binomische Formel"}, {"g": "(x + 2)(1/2 + x) = 0,5x + x² + 1 + 2x = x² + 2,5x + 1", "op": "jedes mit jedem"}, {"g": "4x² − 12x + 9 − (x² + 2,5x + 1)", "op": "Minus vor der Klammer"}, {"g": "Ergebnis: 3x² − 14,5x + 8"}], "quelle": "KA 1. Schulaufgabe Terme (Klasse 7, 12/2019), Aufg. 2c – 1:1; Lösung aus dem KA-Dossier ✓", "stufe": "schwer"}]}], "uplus": [{"aufgabe": "(x + 7)(x − 7)", "schritte": [{"g": "Plus und Minus derselben Zahl → 3. binomische Formel: (a + b)(a − b) = a² − b²"}, {"g": "Hier ist a = x und b = 7"}, {"g": "x² − 7² = x² − 49"}, {"g": "Ergebnis: x² − 49"}], "loesung": "x² − 49", "hinweis": "Plus und Minus derselben Zahl: die 3. binomische Formel.", "quelle": "Grundwissen-Band (3. binomische Formel) – Notation 1:1"}, {"aufgabe": "(5x + 2)²", "schritte": [{"g": "Eine Klammer im Quadrat mit Plus → 1. binomische Formel: (a + b)² = a² + 2ab + b²"}, {"g": "Hier ist a = 5x und b = 2"}, {"g": "a² = (5x)² = 25x²"}, {"g": "2ab = 2 · 5x · 2 = 20x"}, {"g": "b² = 2² = 4"}, {"g": "Ergebnis: 25x² + 20x + 4"}], "loesung": "25x² + 20x + 4", "hinweis": "Auch die Zahl vor dem x wird quadriert: (5x)² = 25x².", "quelle": "Grundwissen-Band (1. binomische Formel) – Notation 1:1"}], "transfer": [{"stufe": "", "aufgabe": "Begründe mit einer Skizze, warum (a + b)² = a² + 2ab + b² gilt.", "schritte": [{"g": "Zeichne ein Quadrat mit der Seitenlänge a + b (erst ein Stück a, dann ein Stück b)"}, {"g": "Teile beide Seiten an dieser Stelle und ziehe die Linien quer durch → 4 Teilflächen"}, {"g": "Oben links: Quadrat mit Seite a → Fläche a · a = a²"}, {"g": "Unten rechts: Quadrat mit Seite b → Fläche b · b = b²"}, {"g": "Dazu ZWEI gleich große Rechtecke mit den Seiten a und b → je a · b, zusammen 2ab"}, {"g": "Das große Quadrat hat die Fläche (a + b)² – die vier Teile zusammen: a² + 2ab + b²"}, {"g": "Beides ist dieselbe Fläche → (a + b)² = a² + 2ab + b² ✓"}], "loesung": "Das Flächenmodell zeigt es: Das große Quadrat mit der Seite a + b zerfällt in a², b² und ZWEI Rechtecke a · b – zusammen a² + 2ab + b².", "hinweis": "Quadrat mit Seite a + b zerlegen: ein Quadrat a², ein Quadrat b², zwei Rechtecke a · b. Gesamtfläche a² + 2ab + b².", "format": "SK", "loesungsbild": "v_b1_flaeche"}, {"stufe": "", "aufgabe": "Rechne geschickt im Kopf: a) 21² b) 19 · 21", "schritte": [{"g": "a) 21 = 20 + 1 → 1. binomische Formel: (a + b)² = a² + 2ab + b²"}, {"g": "(20 + 1)² = 20² + 2 · 20 · 1 + 1² = 400 + 40 + 1 = 441"}, {"g": "b) 19 · 21 = (20 − 1)(20 + 1) → 3. binomische Formel: (a + b)(a − b) = a² − b²"}, {"g": "20² − 1² = 400 − 1 = 399"}, {"g": "Ergebnis: 441 und 399"}], "loesung": "441 und 399", "hinweis": "a) (20 + 1)² = 400 + 40 + 1 = 441. b) (20 − 1)(20 + 1) = 400 − 1 = 399."}, {"stufe": "", "aufgabe": "Von einem Rechteck ist eine Seite 3 cm länger als die andere. Verlängert man beide Seiten um 1 cm, wächst der Flächeninhalt um 22 cm². Wie lang sind die ursprünglichen Seiten?", "schritte": [{"g": "Seiten x und x + 3 ansetzen; neue Fläche = alte Fläche + 22: (x + 1)(x + 4) = x(x + 3) + 22"}, {"g": "2x = 18"}, {"g": "x = 9. Seiten"}, {"g": "9 cm und 12 cm. Probe"}, {"g": "10 · 13 = 130 = 9 · 12 + 22 ✓"}, {"g": "Ergebnis: 9 cm und 12 cm"}], "loesung": "9 cm und 12 cm", "hinweis": "Seiten x und x + 3 ansetzen; neue Fläche = alte Fläche + 22: (x + 1)(x + 4) = x(x + 3) + 22."}], "wpool": [{"aufgabe": "(x + 1)²", "schritte": [{"g": "1. binomische Formel: (a + b)² = a² + 2ab + b²"}, {"g": "a = x, b = 1"}, {"g": "x² + 2 · x · 1 + 1² = x² + 2x + 1"}], "loesung": "x² + 2x + 1", "stufe": "mittel"}, {"aufgabe": "(x − 2)²", "schritte": [{"g": "2. binomische Formel: (a − b)² = a² − 2ab + b²"}, {"g": "a = x, b = 2"}, {"g": "x² − 2 · x · 2 + 2² = x² − 4x + 4"}], "loesung": "x² − 4x + 4", "stufe": "mittel"}, {"aufgabe": "(x + 5)(x − 5)", "schritte": [{"g": "3. binomische Formel: (a + b)(a − b) = a² − b²"}, {"g": "x² − 5² = x² − 25"}], "loesung": "x² − 25", "stufe": "mittel"}, {"aufgabe": "Rechne 31² im Kopf – Trick: 1. binomische Formel mit (30 + 1)².", "schritte": [{"g": "31 = 30 + 1 → 1. binomische Formel: (a + b)² = a² + 2ab + b²"}, {"g": "(30 + 1)² = 30² + 2 · 30 · 1 + 1² = 900 + 60 + 1 = 961"}], "loesung": "961", "stufe": "mittel"}, {"aufgabe": "Welche Formel steckt in a² − 49?", "schritte": [{"g": "a² − 49 ist eine Differenz zweier Quadrate: a² und 49 = 7²"}, {"g": "Das ist das Muster der 3. binomischen Formel: a² − b² = (a + b)(a − b)"}, {"g": "→ a² − 49 = (a + 7)(a − 7)"}, {"g": "Antwort: 3. (a + 7)(a − 7) — die 3. binomische Formel mit den Faktoren (a + 7) und (a − 7)"}], "loesung": "3. (a + 7)(a − 7)", "stufe": "mittel"}, {"stufe": "mittel", "aufgabe": "(2a + 3)²", "loesung": "4a² + 12a + 9", "quelle": "analog KA 2. Test binomische Formeln, Aufg. 1c", "schritte": [{"g": "1. binomische Formel: (x + y)² = x² + 2xy + y²"}, {"g": "(2a)² + 2 · 2a · 3 + 3²"}, {"g": "= 4a² + 12a + 9"}]}, {"stufe": "mittel", "aufgabe": "(3x − 1)²", "loesung": "9x² − 6x + 1", "quelle": "analog KA 2. Schulaufgabe, Aufg. 3a", "schritte": [{"g": "2. binomische Formel: (x − y)² = x² − 2xy + y²"}, {"g": "(3x)² − 2 · 3x · 1 + 1²"}, {"g": "= 9x² − 6x + 1"}]}, {"stufe": "mittel", "aufgabe": "(4y + 5)(4y − 5)", "loesung": "16y² − 25", "quelle": "analog KA 2. Test binomische Formeln, Aufg. 1a", "schritte": [{"g": "3. binomische Formel: (x + y)(x − y) = x² − y²"}, {"g": "(4y)² − 5²"}, {"g": "= 16y² − 25"}]}, {"stufe": "mittel", "aufgabe": "Welche binomische Formel steckt in x² + 10x + 25?", "loesung": "1. (x + 5)²", "quelle": "analog Buch S. 93 (binomische Formeln rückwärts erkennen)", "schritte": [{"g": "Erstes Glied x², letztes 25 = 5²"}, {"g": "Mittleres Glied +10x = 2 · x · 5 → passt zur 1. binomischen Formel"}, {"g": "x² + 10x + 25 = (x + 5)²"}, {"g": "Also steckt darin die 1. binomische Formel → 1. (x + 5)²"}]}, {"stufe": "mittel", "aufgabe": "(3x + 2)(3x − 2)", "loesung": "9x² − 4", "quelle": "analog Buch S. 93 (3. binomische Formel)", "schritte": [{"g": "3. binomische Formel: (a + b)(a − b) = a² − b²"}, {"g": "(3x)² − 2² = 9x² − 4"}]}, {"stufe": "mittel", "aufgabe": "(5 − a)²", "loesung": "25 − 10a + a²", "quelle": "analog KA 2. Schulaufgabe, Aufg. 3a (2. binomische Formel)", "schritte": [{"g": "2. binomische Formel: (x − y)² = x² − 2xy + y²"}, {"g": "5² − 2 · 5 · a + a²"}, {"g": "= 25 − 10a + a²"}]}], "test": [{"stufe": "mittel", "aufgabe": "Multipliziere aus: (3a + b)²", "schritte": [{"g": "Erste binomische Formel: (x + y)² = x² + 2xy + y²"}, {"g": "(3a)² + 2 · 3a · b + b²"}, {"g": "= 9a² + 6ab + b²"}], "loesung": "9a² + 6ab + b²", "hinweis": "Erste binomische Formel – das Mittelglied nicht vergessen.", "quelle": "Klassenarbeit 2. Test 11/2019, Aufg. 1c · Lösungsweg im Dossier ✓"}, {"stufe": "schwer", "aufgabe": "Vereinfache: (2x + y)(2x − y) − 2 · (2x)²", "schritte": [{"g": "Dritte binomische Formel: (2x)² − y² = 4x² − y²"}, {"g": "2 · (2x)² = 2 · 4x² = 8x²"}, {"g": "4x² − y² − 8x²"}, {"g": "= −4x² − y²"}], "loesung": "−4x² − y²", "hinweis": "Zuerst die dritte binomische Formel, dann den zweiten Teil abziehen.", "quelle": "Klassenarbeit 2. Test 11/2019, Aufg. 1a · Lösungsweg im Dossier ✓"}]}, "B2": {"id": "B2", "titel": "Potenzen – kurz geschrieben, viel drin", "kerne": [{"name": "", "verstehen": ["2⁵ heißt: fünfmal die 2 multiplizieren → 2 · 2 · 2 · 2 · 2 = 32. Die kleine Zahl (Exponent) zählt die Faktoren. Deshalb gilt → 2³ · 2⁴ = (2 · 2 · 2) · (2 · 2 · 2 · 2) = 2⁷ – bei gleicher Basis addierst du die Exponenten.", "Steht ein Produkt in der Klammer, wird jeder Faktor potenziert → (2x)³ = 2³ · x³ = 8x³. Und Vorsicht bei Minus → (−3)² = 9, aber −3² = −(3²) = −9. Ohne Klammer gehört das Minus nicht zur Basis – Potenz kommt vor dem Vorzeichen dran (Hoch vor Punkt vor Strich).", "Gerade Anzahl von Minusfaktoren gibt Plus, ungerade gibt Minus → (−2)³ = −8, (−2)⁴ = 16.", "Was bedeutet eine Hochzahl mit Minus? 2⁻³ ist KEIN negatives Ergebnis, sondern ein Kehrwert: a⁻ⁿ = 1/aⁿ. Also 2⁻³ = 1/2³ = 1/8 und 10⁻² = 1/100 = 0,01. Merke dir das Minus in der Hochzahl als „eins durch“ – das Ergebnis bleibt positiv. Besonders praktisch sind Zehnerpotenzen: 10¹ = 10, 10² = 100, 10³ = 1000 – die Hochzahl zählt die Nullen. Rückwärts gilt 10⁻¹ = 0,1, 10⁻² = 0,01, 10⁻³ = 0,001 – jetzt zählt die Hochzahl die Stellen hinter dem Komma. So schreibst du sehr große und sehr kleine Zahlen kurz: 35000 = 3,5 · 10⁴ und 0,00042 = 4,2 · 10⁻⁴; vorn steht dabei immer eine Zahl zwischen 1 und 10. In der App tippst du eine Minus-Hochzahl mit Dach und Minus, also 10^-3."], "fallen": [{"falle": "Exponenten multipliziert statt addiert", "falsch": "2³ · 2⁴ = 2¹²", "richtig": "2³ · 2⁴ = 2⁷", "warum": "Faktoren zählen → 3 + 4 = 7 Zweien"}, {"falle": "Klammer beim Quadrieren ignoriert", "falsch": "(−5x)² = −25x²", "richtig": "(−5x)² = 25x²", "warum": "(−5x) · (−5x): Minus mal Minus gibt Plus"}, {"falle": "Minus in der Hochzahl mit einem negativen Ergebnis verwechselt", "falsch": "2⁻³ = −8", "richtig": "2⁻³ = 1/8", "warum": "Die Minus-Hochzahl heißt „eins durch“ – 2⁻³ ist 1 geteilt durch 2³, das Ergebnis bleibt positiv"}], "ueben": [{"stufe": "leicht", "aufgabe": "2³ · 2²", "schritte": [{"g": "Gleiche Basis mal → Hochzahlen addieren"}, {"g": "2³ · 2² = 2³⁺² = 2⁵"}, {"g": "2⁵ = 32"}], "loesung": "2⁵ = 32", "hinweis": "Exponenten addieren"}, {"stufe": "leicht", "aufgabe": "x³ · x⁴", "schritte": [{"g": "Gleiche Basis mal → Hochzahlen addieren"}, {"g": "x³ · x⁴ = x³⁺⁴ = x⁷"}], "loesung": "x⁷", "hinweis": "Gleiche Basis"}, {"stufe": "leicht", "aufgabe": "Schreibe als Potenz: 3 · 3 · 3 · 3", "schritte": [{"g": "Die 3 steht viermal als Faktor"}, {"g": "Basis ist die 3, die Hochzahl zählt die Faktoren: 4"}, {"g": "Ergebnis: 3⁴"}], "loesung": "3⁴", "hinweis": "Die Hochzahl sagt, wie oft die Basis als Faktor dasteht.", "quelle": "Grundwissen-Band (Potenz-Schreibweise) – Notation 1:1"}, {"stufe": "mittel", "aufgabe": "Schreibe als Bruch: 4⁻²", "schritte": [{"g": "Eine Minus-Hochzahl bedeutet Kehrwert: a⁻ⁿ = 1/aⁿ"}, {"g": "4⁻² = 1/4²"}, {"g": "4² = 16"}, {"g": "Ergebnis: 1/16"}], "loesung": "1/16", "hinweis": "Die Minus-Hochzahl bedeutet „eins durch“.", "quelle": "Grundwissen-Band (Potenzgesetze, Hochzahl mit Minus) – Notation 1:1"}, {"stufe": "mittel", "aufgabe": "(2x)³", "schritte": [{"g": "Potenz einer Klammer: jeder Faktor wird potenziert"}, {"g": "(2x)³ = 2³ · x³"}, {"g": "= 8x³"}], "loesung": "8x³", "hinweis": "Potenz einer Klammer: JEDER Faktor wird potenziert."}, {"stufe": "mittel", "aufgabe": "a² · a³ · a", "schritte": [{"g": "a allein heißt a¹"}, {"g": "Hochzahlen addieren: 2 + 3 + 1 = 6"}, {"g": "a² · a³ · a = a⁶"}], "loesung": "a⁶", "hinweis": "Gleiche Basis mal: Hochzahlen addieren. a² · a³ · a¹ = a²⁺³⁺¹ = a⁶."}, {"stufe": "mittel", "aufgabe": "0,3y³ · (−1 1/6 · y⁵)", "schritte": [{"g": "Zahlen mal Zahlen, Potenzen mal Potenzen"}, {"g": "0,3 · (−7/6) = −0,35; y³ · y⁵ = y⁸ (Hochzahlen addieren)."}, {"g": "Ergebnis: −0,35y⁸"}], "loesung": "−0,35y⁸", "hinweis": "Zahlen mal Zahlen, Potenzen mal Potenzen."}, {"stufe": "mittel", "aufgabe": "(7/3)s²t⁵ · (3s²t)²", "schritte": [{"g": "Erst die Klammer-Potenz: (3s²t)² = 9s⁴t²"}, {"g": "Zahlen: 7/3 · 9 = 21"}, {"g": "s: s² · s⁴ = s⁶ · t: t⁵ · t² = t⁷"}, {"g": "Ergebnis: 21s⁶t⁷"}], "loesung": "21s⁶t⁷", "hinweis": "Erst (3s²t)² = 9s⁴t²; 7/3 · 9 = 21"}, {"stufe": "mittel", "aufgabe": "(2x)³ − (−11x³ + 5x)", "schritte": [{"g": "Erst (2x)³ = 8x³; das Minus vor der Klammer dreht die Vorzeichen"}, {"g": "8x³ + 11x³ − 5x."}, {"g": "Ergebnis: 19x³ − 5x"}], "loesung": "19x³ − 5x", "hinweis": "Erst (2x)³ = 8x³; das Minus vor der Klammer dreht die Vorzeichen."}, {"stufe": "schwer", "aufgabe": "Vereinfache: (a³)⁴ : a⁵", "schritte": [{"g": "Zuerst die Klammer: eine Potenz wird potenziert → Hochzahlen MULTIPLIZIEREN"}, {"g": "(a³)⁴ = a^(3 · 4) = a¹²"}, {"g": "Jetzt geteilt bei gleicher Basis → Hochzahlen SUBTRAHIEREN"}, {"g": "a¹² : a⁵ = a^(12 − 5)"}, {"g": "Ergebnis: a⁷"}], "loesung": "a⁷", "hinweis": "Zwei Gesetze nacheinander: erst potenzieren (mal), dann teilen (minus).", "quelle": "Grundwissen-Band (Potenzgesetze: Potenz einer Potenz, gleiche Basis geteilt) – Notation 1:1"}, {"stufe": "schwer", "aufgabe": "Vereinfache: (2x²y)³ : (4x³y)", "schritte": [{"g": "In der Klammer wird JEDER Faktor potenziert: (2x²y)³ = 2³ · (x²)³ · y³"}, {"g": "2³ = 8 und (x²)³ = x⁶ → 8x⁶y³"}, {"g": "Jetzt teilen: die Zahlen 8 : 4 = 2"}, {"g": "Gleiche Basis geteilt → Hochzahlen abziehen: x⁶ : x³ = x³ und y³ : y = y²"}, {"g": "Ergebnis: 2x³y²"}], "loesung": "2x³y²", "hinweis": "In der Klammer wird jeder Faktor potenziert – auch die Zahl davor.", "quelle": "Grundwissen-Band (Potenzgesetze: Produkt potenzieren, gleiche Basis geteilt) – Notation 1:1"}]}], "uplus": [{"stufe": "", "aufgabe": "Schreibe 2⁵ · 2³ als eine einzige Zahl.", "schritte": [{"g": "Hochzahlen addieren: 2⁵ · 2³ = 2⁸"}, {"g": "2⁸ = 256"}], "loesung": "256", "hinweis": "Gleiche Basis mal: Hochzahlen addieren. 2⁵ · 2³ = 2⁸ = 256."}, {"stufe": "", "aufgabe": "Was ist größer: 2¹⁰ oder 10³?", "schritte": [{"g": "Beide ausrechnen und vergleichen"}, {"g": "2¹⁰ = 1024 und 10³ = 1000"}, {"g": "2¹⁰ ist größer."}], "loesung": "2¹⁰", "hinweis": "Beide ausrechnen und vergleichen."}, {"stufe": "", "aufgabe": "Schreibe (10²)³ als Zehnerpotenz.", "schritte": [{"g": "Quadrat hoch drei"}, {"g": "10² · 10² · 10² – Exponenten addieren"}, {"g": "Ergebnis: 10⁶"}], "loesung": "10⁶", "hinweis": "Potenz einer Potenz: Die Exponenten werden multipliziert."}, {"stufe": "", "aufgabe": "Berechne: 10⁻²", "schritte": [{"g": "Minus-Hochzahl heißt Kehrwert: 10⁻² = 1/10²"}, {"g": "10² = 100"}, {"g": "1/100 = 0,01"}, {"g": "Ergebnis: 0,01"}], "loesung": "0,01", "hinweis": "Bei 10⁻² wandert das Komma zwei Stellen nach links."}, {"stufe": "", "aufgabe": "Schreibe 3,5 · 10⁴ als gewöhnliche Zahl.", "schritte": [{"g": "10⁴ = 10000"}, {"g": "3,5 · 10000 – das Komma wandert 4 Stellen nach rechts"}, {"g": "Ergebnis: 35000"}], "loesung": "35000", "hinweis": "Die Hochzahl sagt dir, um wie viele Stellen das Komma wandert."}, {"stufe": "", "aufgabe": "Schreibe 0,00042 mit einer Zehnerpotenz (wissenschaftliche Schreibweise).", "schritte": [{"g": "Vorn muss eine Zahl zwischen 1 und 10 stehen"}, {"g": "Setze das Komma hinter die erste Ziffer, die nicht 0 ist: aus 0,00042 wird 4,2"}, {"g": "Das Komma ist dabei um 4 Stellen nach rechts gewandert – deshalb bekommt die Zehnerpotenz die Hochzahl −4"}, {"g": "Probe: 4,2 · 0,0001 = 0,00042 ✓"}, {"g": "Ergebnis: 4,2 · 10⁻⁴"}], "loesung": "4,2 · 10⁻⁴", "hinweis": "Erst die Zahl zwischen 1 und 10 bilden, dann die Stellen zählen."}], "transfer": [{"stufe": "", "aufgabe": "Ein Blatt Papier ist 0,1 mm dick. Du faltest es 10-mal (jedes Falten verdoppelt die Dicke). Wie dick ist der Stapel?", "schritte": [{"g": "Jedes Falten verdoppelt → nach 10-mal: 2¹⁰"}, {"g": "2¹⁰ = 1024"}, {"g": "0,1 mm · 1024 = 102,4 mm"}, {"g": "Antwort: gut 10 cm – Potenzen wachsen schneller, als man denkt"}], "loesung": "102,4 mm (ca. 10 cm)", "hinweis": "Dicke = 0,1 mm · 2¹⁰ = 0,1 · 1024 = 102,4 mm ≈ 10 cm. Antwort: gut 10 cm – Potenzen wachsen schneller, als man denkt."}, {"stufe": "", "aufgabe": "Veranschauliche T(a) = 3a² geometrisch.", "schritte": [{"g": "a² ist die Fläche eines Quadrats mit Seite a"}, {"g": "3a² = drei solcher Quadrate nebeneinander"}, {"g": "Oder: ein Rechteck mit den Seiten a und 3a"}, {"g": "Beide Bilder haben denselben Flächeninhalt: 3a² – der Term beschreibt also eine Fläche"}], "loesung": "Drei Quadrate mit der Seitenlänge a nebeneinander – oder ein Rechteck mit den Seiten a und 3a.", "hinweis": "Drei Quadrate mit Seitenlänge a (je Fläche a²) – oder ein Rechteck mit den Seiten a und 3a.", "format": "SK", "loesungsbild": "k_b2_3a2"}], "wpool": [{"aufgabe": "2⁴", "schritte": [{"g": "2 · 2 · 2 · 2"}, {"g": "= 16"}], "loesung": "16", "stufe": "leicht"}, {"aufgabe": "x² · x³", "schritte": [{"g": "Hochzahlen addieren"}, {"g": "x² · x³ = x⁵"}], "loesung": "x⁵", "stufe": "mittel"}, {"aufgabe": "(−1)⁷", "schritte": [{"g": "Ungerade Hochzahl → Minus bleibt"}, {"g": "(−1)⁷ = −1"}], "loesung": "−1", "stufe": "mittel"}, {"aufgabe": "(5a)²", "schritte": [{"g": "Jeder Faktor wird quadriert"}, {"g": "(5a)² = 5² · a² = 25a²"}], "loesung": "25a²", "stufe": "mittel"}, {"aufgabe": "−2²", "schritte": [{"g": "Ohne Klammer: erst quadrieren, dann das Minus"}, {"g": "−2² = −(2 · 2) = −4"}], "loesung": "−4", "stufe": "mittel"}, {"aufgabe": "Schreibe als Bruch: 5⁻²", "schritte": [{"g": "a⁻ⁿ = 1/aⁿ"}, {"g": "5⁻² = 1/5²"}, {"g": "5² = 25"}, {"g": "Ergebnis: 1/25"}], "loesung": "1/25", "stufe": "mittel"}, {"stufe": "mittel", "aufgabe": "x⁵ : x²", "loesung": "x³", "quelle": "analog Grundwissen S. 148 (Potenzgesetze)", "schritte": [{"g": "Gleiche Basis, Division → Hochzahlen subtrahieren"}, {"g": "5 − 2 = 3, also x³"}]}, {"stufe": "mittel", "aufgabe": "(2b)³", "loesung": "8b³", "quelle": "analog KA 2. Kleiner Leistungsnachweis, Aufg. 1c (Klammer mit Hochzahl)", "schritte": [{"g": "Die Hochzahl gilt für BEIDE Faktoren in der Klammer"}, {"g": "2³ = 8 und b³"}, {"g": "= 8b³"}]}], "test": [{"stufe": "mittel", "aufgabe": "Schreibe als eine einzige Potenz: 5⁶ : 5²", "schritte": [{"g": "Gleiche Basis, Division → Hochzahlen subtrahieren", "op": "Potenzgesetz"}, {"g": "5^(6 − 2)"}, {"g": "= 5⁴"}], "loesung": "5⁴", "hinweis": "Gleiche Basis geteilt: die Hochzahlen werden subtrahiert.", "quelle": "Grundwissen-Band (Potenzgesetze); Aufgabentyp wie in der Klassenarbeit"}, {"stufe": "schwer", "aufgabe": "Setze x = 5 ein: T(x) = 25x⁻³ − 2/x", "schritte": [{"g": "25 · 5⁻³ = 25/125 = 1/5", "op": "negative Hochzahl = Kehrwert"}, {"g": "2/5"}, {"g": "1/5 − 2/5 = −1/5"}], "loesung": "−1/5", "hinweis": "Eine negative Hochzahl bedeutet den Kehrwert: 5⁻³ = 1/5³.", "quelle": "Klassenarbeit 1. Stegreifaufgabe 10/2019, Aufg. 1b · Lösungsweg im Dossier ✓"}]}, "B3": {"id": "B3", "titel": "Winkel-Detektiv", "kerne": [{"name": "", "verstehen": ["An einer Geradenkreuzung gilt: Gegenüberliegende Winkel (Scheitelwinkel) sind gleich groß, nebeneinanderliegende (Nebenwinkel) ergänzen sich zu 180°. Beispiel aus dem Buch: Ist ein Winkel 45°, dann ist sein Scheitelwinkel 45° und jeder Nebenwinkel 180° − 45° = 135°. [BILD:v_b3_kreuzung]", "Schneidet eine Gerade zwei PARALLELE Geraden, sind Stufenwinkel gleich groß und Wechselwinkel gleich groß. Wichtig: Das gilt nur bei Parallelen – prüfe das immer zuerst! [BILD:v_b3_parallelen]", "In jedem Dreieck beträgt die Winkelsumme 180°. Warum? Zeichne durch eine Ecke die Parallele zur Gegenseite: Nach dem Wechselwinkelsatz erscheinen dort alle drei Innenwinkel nebeneinander – zusammen eine halbe Drehung, also 180°. Im Viereck sind es 360° (zwei Dreiecke), im n-Eck (n − 2) · 180°. [BILD:v_b3_winkelsumme]"], "fallen": [{"falle": "Nebenwinkel zu 90° ergänzt", "falsch": "Nebenwinkel von 120° = −30°/„geht nicht“", "richtig": "180° − 120° = 60°", "warum": "Nebenwinkel ergänzen sich zu 180°, nicht zu 90°"}, {"falle": "Stufenwinkel ohne Parallelen benutzt", "falsch": "„Stufenwinkel, also gleich“ bei beliebigen Geraden", "richtig": "Erst Parallelität prüfen/begründen", "warum": "Stufen-/Wechselwinkelsatz gilt nur bei g ∥ h"}], "ueben": [{"stufe": "leicht", "aufgabe": "Zwei Geraden schneiden sich, ein Winkel misst 45°. Wie groß sind sein Scheitelwinkel und sein Nebenwinkel?", "loesungsbild": "b3_kreuzung45", "schritte": [{"g": "Scheitelwinkel liegen sich am Schnittpunkt GEGENÜBER – sie sind immer gleich groß → 45°"}, {"g": "Nebenwinkel liegen direkt NEBENEINANDER – zusammen bilden sie eine Gerade, also 180°"}, {"g": "Nebenwinkel: 180° − 45° = 135°"}, {"g": "Ergebnis: Scheitelwinkel und Nebenwinkel messen 45° und 135°"}], "loesung": "45° und 135°", "hinweis": "Scheitelwinkel liegen sich gegenüber und sind gleich groß (45°). Nebenwinkel ergänzen sich zu 180° → 180° − 45° = 135°."}, {"stufe": "leicht", "aufgabe": "In einem Dreieck sind α = 46° und γ = 67°. Wie groß ist der Winkel β?", "loesungsbild": "b3_dreieck_46_67", "schritte": [{"g": "Winkelsumme im Dreieck: Die drei Innenwinkel ergeben zusammen IMMER 180°"}, {"g": "Also: β = 180° − α − γ"}, {"g": "β = 180° − 46° − 67°"}, {"g": "β = 67°"}], "loesung": "67°", "hinweis": "Winkelsumme im Dreieck: Alle drei Winkel zusammen ergeben 180°. β = 180° − 46° − 67°."}, {"stufe": "leicht", "aufgabe": "Ein rechtwinkliges Dreieck hat einen spitzen Winkel von 35°. Wie groß ist der andere spitze Winkel?", "loesungsbild": "b3_rechtwinklig35", "schritte": [{"g": "Winkelsumme im Dreieck: 180°; der rechte Winkel hat 90°"}, {"g": "90° + 35° + x = 180°"}, {"g": "x = 180° − 90° − 35° = 55°"}], "loesung": "55°", "hinweis": "Winkelsumme 180°, der rechte Winkel hat 90° → 90° + 35° + x = 180° → x = 55°."}, {"stufe": "mittel", "aufgabe": "In einem gleichschenkligen Dreieck ist α = 54°, die beiden anderen Winkel sind gleich groß (β = γ). Wie groß ist β?", "loesungsbild": "b3_gleichschenklig54", "schritte": [{"g": "Winkelsumme im Dreieck: 180°"}, {"g": "Für β und γ bleiben: 180° − 54° = 126°"}, {"g": "Gleichschenklig heißt: die beiden Basiswinkel β und γ sind gleich groß"}, {"g": "126° : 2 = 63°"}, {"g": "Ergebnis: β = γ = 63°"}], "loesung": "63°", "hinweis": "Winkelsumme 180°: Für β und γ bleiben 180° − 54° = 126°. Da beide gleich groß sind → 126° : 2 = 63°."}, {"stufe": "mittel", "aufgabe": "In einem Dreieck ist α doppelt so groß wie β (α = 2β) und γ ist 1,5-mal so groß wie β (γ = 1,5β). Wie groß sind die drei Winkel?", "loesungsbild": "b3_dreieck_80_40_60", "schritte": [{"g": "Alle Winkel durch β ausdrücken und in die Winkelsumme (180°) einsetzen"}, {"g": "2β + β + 1,5β = 4,5β = 180°"}, {"g": "β = 40°. Dann α = 2 · 40° und γ = 1,5 · 40°."}, {"g": "Ergebnis: β = 40°, α = 80°, γ = 60°"}], "loesung": "β = 40°, α = 80°, γ = 60°", "hinweis": "Alle Winkel durch β ausdrücken und in die Winkelsumme (180°) einsetzen."}, {"stufe": "mittel", "aufgabe": "Wie groß ist ein Innenwinkel in einem regelmäßigen 8-Eck (Form des Stoppschilds)?", "loesungsbild": "b3_achteck", "schritte": [{"g": "Innenwinkelsumme im n-Eck: (n − 2) · 180° – denn das n-Eck zerfällt von einer Ecke aus in n − 2 Dreiecke"}, {"g": "Beim 8-Eck: 6 · 180° = 1080°"}, {"g": "Regelmäßig heißt: alle Innenwinkel sind gleich groß"}, {"g": "1080° : 8 = 135°"}], "loesung": "135°", "hinweis": "Innenwinkelsumme im n-Eck → (n − 2) · 180°. Beim 8-Eck → 6 · 180° = 1080°. Regelmäßig heißt alle gleich → 1080° : 8 = 135°."}, {"stufe": "mittel", "aufgabe": "In einem Dreieck ist β doppelt so groß wie α, und α ist um 40° kleiner als γ. Wie groß sind die drei Winkel?", "loesungsbild": "b3_dreieck_35_70_75", "schritte": [{"g": "Alle Winkel durch α ausdrücken und in die Winkelsumme einsetzen: α + 2α + (α + 40°) = 180°"}, {"g": "4α = 140°"}, {"g": "α = 35°."}, {"g": "Ergebnis: α = 35°, β = 70°, γ = 75°"}], "loesung": "α = 35°, β = 70°, γ = 75°", "hinweis": "Alle Winkel durch α ausdrücken und in die Winkelsumme einsetzen: α + 2α + (α + 40°) = 180°."}, {"stufe": "mittel", "aufgabe": "In einem Dreieck sind α = 50° und β = 60°. Wie groß ist der Außenwinkel bei C?", "loesungsbild": "b3_aussenwinkel", "schritte": [{"g": "Der Außenwinkel entsteht, wenn man eine Seite über die Ecke hinaus verlängert – er ist der Nebenwinkel des Innenwinkels"}, {"g": "Außenwinkelsatz: Außenwinkel = Summe der beiden NICHT anliegenden Innenwinkel"}, {"g": "50° + 60° = 110°"}, {"g": "Kontrolle: Innenwinkel bei C = 180° − 50° − 60° = 70°; Nebenwinkel 180° − 70° = 110° ✓"}], "loesung": "110°", "hinweis": "Außenwinkel = Summe der nicht anliegenden Innenwinkel"}, {"stufe": "mittel", "aufgabe": "Ein Viereck hat die Winkel 80°, 70° und 110°. Wie groß ist der vierte Winkel?", "loesungsbild": "b3_viereck_100", "schritte": [{"g": "Winkelsumme im Viereck: 360° (eine Diagonale zerlegt das Viereck in 2 Dreiecke → 2 · 180°)"}, {"g": "Der vierte Winkel: 360° − 80° − 70° − 110° = 100°"}], "loesung": "100°", "hinweis": "Winkelsumme im Viereck → 360°. Der vierte Winkel → 360° − 80° − 70° − 110° = 100°."}, {"stufe": "mittel", "aufgabe": "Die Geraden g und h sind parallel und werden geschnitten. Wie groß ist der Stufenwinkel zum 72°-Winkel?", "loesungsbild": "b3_stufen72", "schritte": [{"g": "Stufenwinkel liegen an den zwei Parallelen in „gleicher Stufe“ – auf derselben Seite der schneidenden Geraden"}, {"g": "Stufenwinkelsatz: An Parallelen sind Stufenwinkel gleich groß"}, {"g": "Stufenwinkel = 72°"}], "loesung": "72°", "hinweis": "Stufenwinkelsatz: An geschnittenen Parallelen sind Stufenwinkel gleich groß – also ebenfalls 72°."}, {"aufgabe": "In einem Dreieck ist β doppelt so groß wie α, und α ist um 40° kleiner als γ. Berechne α.", "loesung": "35°", "hinweis": "Schreibe β und γ mit α auf und nutze die Winkelsumme 180°.", "schritte": [{"g": "β = 2α und γ = α + 40°", "op": "alles mit α ausdrücken"}, {"g": "Winkelsumme: α + 2α + (α + 40°) = 180°", "op": "Gleichung aufstellen"}, {"g": "4α + 40° = 180°  | − 40°"}, {"g": "4α = 140°  | : 4"}, {"g": "Ergebnis: α = 35° (dann β = 70° und γ = 75°; Probe: 35 + 70 + 75 = 180 ✓)"}], "quelle": "KA 4. Schulaufgabe (Klasse 7, 06/2017), Aufg. 3 – 1:1; Lösung aus dem KA-Dossier ✓", "stufe": "schwer", "loesungsbild": "b3_dreieck_2alpha"}, {"aufgabe": "Ein Stoppschild ist ein regelmäßiges Achteck. Wie groß ist einer seiner Innenwinkel?", "loesung": "135°", "hinweis": "Zerlege das Achteck von einer Ecke aus in Dreiecke.", "schritte": [{"g": "Ein n-Eck zerfällt in (n − 2) Dreiecke, hier 8 − 2 = 6", "op": "zerlegen"}, {"g": "Innenwinkelsumme: 6 · 180° = 1080°"}, {"g": "Regelmäßig heißt: alle 8 Winkel gleich groß → 1080° : 8"}, {"g": "Ergebnis: 135°"}], "quelle": "KA 2. Schulaufgabe (Klasse 7, 01/2016), Aufg. 6a – 1:1; Lösung aus dem KA-Dossier ✓", "stufe": "schwer", "loesungsbild": "b3_achteck_135"}]}], "uplus": [{"stufe": "", "aufgabe": "An einer Doppelkreuzung sind 88°, 57° und 45° auf einer Geradenseite markiert. Kann das stimmen?", "loesungsbild": "b3_doppelkreuzung", "schritte": [{"g": "Eine Gerade ist ein gestreckter Winkel: 180°. Deshalb müssen alle Winkel auf EINER Geradenseite zusammen 180° ergeben"}, {"g": "88° + 57° + 45° = 190°"}, {"g": "190° ≠ 180° → Nein, das kann nicht stimmen"}], "loesung": "Nein", "hinweis": "88° + 57° + 45° = 190° ≠ 180° – die drei Winkel auf einer Geradenseite müssen 180° ergeben"}, {"stufe": "", "aufgabe": "Ein Viereck hat die Winkel 80°, 70° und zwei gleich große Winkel α. Wie groß ist α?", "loesungsbild": "b3_viereck_105", "schritte": [{"g": "Winkelsumme im Viereck: 360° (das Viereck zerfällt in 2 Dreiecke → 2 · 180°)"}, {"g": "Für die beiden α bleiben: 360° − 80° − 70° = 210°"}, {"g": "Beide α sind gleich groß → 210° : 2 = 105°"}, {"g": "α = 105°"}], "loesung": "105°", "hinweis": "Winkelsumme im Viereck → 360°. Für die beiden α bleiben 360° − 80° − 70° = 210° → α = 105°."}], "transfer": [{"stufe": "", "aufgabe": "Zwei Parallelen werden von einer Geraden geschnitten. Einer der acht Winkel misst 118°. Gib alle acht Winkel an und begründe mit den Winkelsätzen.", "loesungsbild": "b3_achtwinkel", "schritte": [{"g": "Nebenwinkel ergänzen sich zu 180° → 180° − 118° = 62°"}, {"g": "Scheitelwinkel sind gleich groß → an der ersten Kreuzung: 118°, 62°, 118°, 62°"}, {"g": "Stufenwinkelsatz: An Parallelen sind Stufenwinkel gleich groß → dieselben vier Werte an der zweiten Kreuzung"}, {"g": "Ergebnis: 4 × 118° und 4 × 62°"}], "loesung": "4 × 118° und 4 × 62°", "hinweis": "Nebenwinkel → 180° − 118° = 62°. Scheitelwinkel verdoppeln beide Werte an der ersten Kreuzung; Stufenwinkelsatz überträgt sie auf die zweite. Jeder Schritt mit Satzname."}, {"stufe": "", "aufgabe": "Dreieck: β ist doppelt so groß wie α, γ ist um 30° größer als α. Stelle eine Gleichung auf und berechne alle Winkel.", "loesungsbild": "b3_dreieck_37_75_67", "schritte": [{"g": "Alle Winkel durch α ausdrücken und in die Winkelsumme (180°) einsetzen"}, {"g": "α + 2α + (α + 30°) = 180°"}, {"g": "4α = 150°", "op": "| − 30°"}, {"g": "α = 37,5°", "op": "| : 4"}, {"g": "Probe: 37,5° + 75° + 67,5° = 180° ✓"}, {"g": "Ergebnis: α = 37,5°, β = 75°, γ = 67,5°"}], "loesung": "α = 37,5°, β = 75°, γ = 67,5°", "hinweis": "α + 2α + (α + 30°) = 180° → 4α = 150° → α = 37,5°. Probe → 37,5° + 75° + 67,5° = 180° ✓"}], "wpool": [{"aufgabe": "Wie groß ist der Scheitelwinkel zu 71°?", "loesungsbild": "b3_scheitel71", "schritte": [{"g": "Scheitelwinkel liegen sich am Schnittpunkt zweier Geraden gegenüber"}, {"g": "Regel: Scheitelwinkel sind immer gleich groß"}, {"g": "Scheitelwinkel = 71°"}], "loesung": "71°", "stufe": "leicht"}, {"aufgabe": "Wie groß ist der Nebenwinkel zu 120°?", "loesungsbild": "b3_neben120", "schritte": [{"g": "Nebenwinkel liegen nebeneinander und bilden zusammen eine Gerade – eine Gerade ist ein gestreckter Winkel (180°)"}, {"g": "Regel: Nebenwinkel ergänzen sich zu 180°"}, {"g": "180° − 120° = 60°"}], "loesung": "60°", "stufe": "mittel"}, {"aufgabe": "Ein Dreieck hat die Winkel 90° und 35°. Wie groß ist der dritte Winkel?", "loesungsbild": "b3_dreieck_90_35", "schritte": [{"g": "Winkelsumme im Dreieck: Alle drei Winkel ergeben zusammen 180°"}, {"g": "180° − 90° − 35° = 55°"}], "loesung": "55°", "stufe": "mittel"}, {"aufgabe": "Wie groß ist die Winkelsumme im Viereck?", "loesungsbild": "b3_viereck_summe", "schritte": [{"g": "Eine Diagonale zerlegt jedes Viereck in 2 Dreiecke"}, {"g": "Jedes Dreieck hat die Winkelsumme 180°"}, {"g": "2 · 180° = 360°"}], "loesung": "360°", "stufe": "mittel"}, {"aufgabe": "Wie groß ist die Winkelsumme im Sechseck?", "loesungsbild": "b3_sechseck_summe", "schritte": [{"g": "Ein Sechseck zerfällt von einer Ecke aus in 4 Dreiecke (allgemein: n − 2 Dreiecke)"}, {"g": "Jedes Dreieck hat die Winkelsumme 180°"}, {"g": "4 · 180° = 720°"}], "loesung": "720°", "stufe": "mittel"}, {"stufe": "mittel", "aufgabe": "Wie groß ist der Stufenwinkel zu 64° an geschnittenen Parallelen?", "loesung": "64°", "quelle": "analog Buch S. 105, Aufg. 1 (Stufenwinkel)", "schritte": [{"g": "Stufenwinkel liegen an Parallelen auf gleicher Stufe", "op": "Stufenwinkelsatz"}, {"g": "Sie sind gleich groß → 64°"}], "loesungsbild": "b3_stufen64"}, {"stufe": "mittel", "aufgabe": "Ein Dreieck hat die Winkel 42° und 71°. Wie groß ist der dritte Winkel?", "loesung": "67°", "quelle": "analog Buch S. 110 (Winkelsumme im Dreieck)", "schritte": [{"g": "Winkelsumme im Dreieck: 180°"}, {"g": "42° + 71° = 113°"}, {"g": "180° − 113° = 67°"}], "loesungsbild": "b3_dreieck_42_71"}, {"stufe": "mittel", "aufgabe": "Wie groß ist die Winkelsumme im Achteck?", "loesung": "1080°", "quelle": "analog KA 2. Schulaufgabe, Aufg. 6a (Vieleck-Winkelsumme)", "schritte": [{"g": "Ein n-Eck zerfällt in (n − 2) Dreiecke, hier 6", "op": "zerlegen"}, {"g": "6 · 180° = 1080°"}], "loesungsbild": "b3_achteck_summe"}, {"stufe": "mittel", "aufgabe": "Zwei Winkel sind Nebenwinkel, einer misst 143°. Wie groß ist der andere?", "loesung": "37°", "quelle": "analog Buch S. 105, Aufg. 3 (Nebenwinkel)", "schritte": [{"g": "Nebenwinkel ergänzen sich zu 180°", "op": "gestreckter Winkel"}, {"g": "180° − 143° = 37°"}], "loesungsbild": "b3_neben143"}, {"stufe": "mittel", "aufgabe": "Wie groß ist ein Innenwinkel im regelmäßigen Sechseck?", "loesung": "120°", "quelle": "analog KA 2. Schulaufgabe, Aufg. 6a (regelmäßiges Vieleck)", "schritte": [{"g": "Winkelsumme: (6 − 2) · 180° = 720°"}, {"g": "Regelmäßig → 720° : 6 = 120°"}], "loesungsbild": "b3_sechseck_120"}], "test": [{"stufe": "mittel", "aufgabe": "In einem Dreieck gilt α = 2 · β und γ = 3/2 · β. Wie groß ist β?", "schritte": [{"g": "180° = α + β + γ = 2β + β + 3/2 β"}, {"g": "180° = 9/2 β"}, {"g": "β = 180° · 2/9 = 40°"}], "loesung": "40°", "hinweis": "Alle drei Winkel durch β ausdrücken und in die Winkelsumme einsetzen.", "quelle": "Test Kap. 6, Aufg. 2c · Lösung S. 198 ✓"}, {"stufe": "schwer", "aufgabe": "In einem Dreieck gilt γ = 1/2 · α und α = 2 · β. Wie groß ist α?", "schritte": [{"g": "γ = 1/2 · 2β = β"}, {"g": "180° = 2β + β + β = 4β"}, {"g": "β = 45°"}, {"g": "α = 2 · 45° = 90°"}], "loesung": "90°", "hinweis": "Alles durch β ausdrücken – γ ist hier genauso groß wie β.", "quelle": "Test Kap. 6, Aufg. 2d · Lösung S. 198 ✓"}]}, "B4": {"id": "B4", "titel": "Daten auf einen Blick", "kerne": [{"name": "", "verstehen": ["Der Median ist der mittlere Wert der GEORDNETEN Liste – ordne also immer zuerst! Bei gerader Anzahl nimmst du den Mittelwert der beiden mittleren Werte. Die Spannweite ist der Abstand zwischen kleinstem und größtem Wert → Spannweite = größter Wert − kleinster Wert. Sie zeigt dir, wie weit die Daten auseinanderliegen.", "Quartil kommt von „Viertel“: Die Quartile teilen die geordnete Liste in vier gleich große Teile. Unteres Quartil (Q1) → ein Viertel der Werte liegt darunter oder ist gleich groß. Oberes Quartil (Q3) → drei Viertel der Werte liegen darunter oder sind gleich groß. Zwischen Q1 und Q3 liegt also genau die mittlere Hälfte aller Daten.", "Ein Boxplot zeigt fünf Kennwerte auf einen Blick: Minimum, unteres Quartil, Median, oberes Quartil, Maximum. Die Box umfasst die mittlere Hälfte aller Daten – vom unteren Quartil (ein Viertel der Daten liegt darunter oder ist gleich groß) bis zum oberen Quartil. Die Striche links und rechts („Antennen“ oder Whisker) reichen bis Minimum und Maximum. Der Strich in der Box ist der Median.", "Wichtig (steht so auch im Buch): Der Durchschnitt wird im Boxplot NICHT dargestellt. Eine kurze Box heißt: Die mittlere Hälfte der Daten liegt eng beieinander.", "Neben Median und Mittelwert gibt es eine dritte Kenngröße: den MODALWERT. Er ist einfach der Wert, der am HÄUFIGSTEN vorkommt. Beispiel Noten 3, 5, 4, 5, 2, 5, 4: Die 5 kommt dreimal vor, die 4 zweimal, die 3 und die 2 je einmal – der Modalwert ist also 5. Die drei Kenngrößen im Vergleich: Mittelwert = alles zusammenzählen und durch die Anzahl teilen. Median = der mittlere Wert der geordneten Liste. Modalwert = der häufigste Wert. Sie können völlig verschieden sein – deshalb lohnt sich immer die Frage, welche Zahl jemand eigentlich meint, wenn er von „dem Durchschnitt“ spricht."], "fallen": [{"falle": "Median aus ungeordneter Liste", "falsch": "Median von 12, 3, 15, 8, 7 ist 15", "richtig": "Ordnen: 3, 7, 8, 12, 15 → Median 8", "warum": "Erst ordnen, dann Mitte"}, {"falle": "Boxplot-Strich als Durchschnitt gelesen", "falsch": "„Der Strich in der Box ist der Mittelwert“", "richtig": "Der Strich ist der Median", "warum": "Der Durchschnitt wird im Boxplot nicht veranschaulicht"}], "ueben": [{"stufe": "leicht", "aufgabe": "Bestimme den Median von 12, 3, 15, 8, 7.", "schritte": [{"g": "Der Median ist der MITTLERE Wert der geordneten Liste"}, {"g": "Erst der Größe nach ordnen: 3, 7, 8, 12, 15"}, {"g": "5 Werte → der 3. Wert steht genau in der Mitte"}, {"g": "Median = 8"}], "loesung": "8", "hinweis": "Median: erst der Größe nach ordnen (3, 7, 8, 12, 15) – der Wert genau in der Mitte ist der Median."}, {"stufe": "leicht", "aufgabe": "Bestimme die Spannweite von 3, 9, 4, 12, 7.", "schritte": [{"g": "Spannweite = größter Wert minus kleinster Wert"}, {"g": "12 − 3 = 9."}], "loesung": "9", "hinweis": "Spannweite = größter Wert minus kleinster Wert."}, {"stufe": "leicht", "aufgabe": "Bestimme den Median von 4, 7, 9, 12.", "schritte": [{"g": "Der Median ist der mittlere Wert der geordneten Liste"}, {"g": "Gerade Anzahl (4 Werte) → Mittelwert der beiden mittleren Werte nehmen"}, {"g": "(7 + 9) : 2 = 8"}, {"g": "Median = 8"}], "loesung": "8", "hinweis": "Gerade Anzahl → (7 + 9) : 2"}, {"stufe": "mittel", "aufgabe": "Bestimme den Modalwert von 3, 5, 4, 5, 2, 5, 4.", "schritte": [{"g": "Der Modalwert ist der Wert, der am häufigsten vorkommt"}, {"g": "Zählen: die 5 kommt dreimal vor, die 4 zweimal, die 3 und die 2 je einmal"}, {"g": "Am häufigsten steht die 5 in der Liste"}, {"g": "Ergebnis: Modalwert = 5"}], "loesung": "5", "hinweis": "Zähle, welcher Wert am häufigsten in der Liste steht."}, {"stufe": "mittel", "aufgabe": "Bestimme für die Datenreihe 5, 6, 2, 3, 6, 6, 1, 7, 2, 3, 3, 4, 10, 4: Median, Quartile und Spannweite (für einen Boxplot).", "schritte": [{"g": "Erst der Größe nach ordnen (14 Werte): 1, 2, 2, 3, 3, 3, 4, 4, 5, 6, 6, 6, 7, 10"}, {"g": "Median = mittlerer Wert; gerade Anzahl → (4 + 4) : 2 = 4"}, {"g": "Unteres Quartil Q1 = Mitte der unteren Hälfte → 3; oberes Quartil Q3 = Mitte der oberen Hälfte → 6"}, {"g": "Spannweite = größter − kleinster Wert: 10 − 1 = 9"}, {"g": "Ergebnis: Median 4; Q1 = 3; Q3 = 6; Spannweite 9"}], "loesung": "Median 4; Q1 = 3; Q3 = 6; Spannweite 9", "hinweis": "Ordnen (14 Werte) → 1, 2, 2, 3, 3, 3, 4, 4, 5, 6, 6, 6, 7, 10. Median = (4 + 4) : 2 = 4. Quartile: in beiden Konventionen 3 und 6. Spannweite 10 − 1 = 9."}, {"stufe": "mittel", "aufgabe": "Noten-Beispiel des Buches (26 Werte): Median 3, unteres Quartil 2, oberes Quartil 3,5 – erkläre, was das untere Quartil hier bedeutet.", "schritte": [{"g": "„Quartil“ kommt von „Viertel“: Die Quartile teilen die geordneten Werte in vier gleich große Teile"}, {"g": "Unteres Quartil = 2 heißt: ein Viertel der Werte ist ≤ 2"}, {"g": "Also: Ein Viertel der Arbeiten hat Note 2 oder besser"}], "loesung": "Ein Viertel der Arbeiten hat Note 2 oder besser", "hinweis": ""}, {"stufe": "mittel", "aufgabe": "Der Boxplot zeigt die Noten einer Klassenarbeit. Lies ab: Spannweite, Median und die beiden Quartile.", "bild": "boxplot_noten", "schritte": [{"g": "Spannweite = größter Wert − kleinster Wert → hier: von Note 1 bis 5,5"}, {"g": "Der Strich IN der Box ist immer der Median → 2,5"}, {"g": "Die Box-Ränder sind unteres und oberes Quartil (¼- und ¾-Grenze) → 2 und 3,5"}, {"g": "Antwort: Noten 1 bis 5,5; Median 2,5; Quartile 2 und 3,5"}], "loesung": "Noten 1 bis 5,5; Median 2,5; Quartile 2 und 3,5", "hinweis": "Antennen-Enden = kleinster und größter Wert → Spannweite. Strich in der Box = Median. Box-Ränder = unteres und oberes Quartil."}, {"aufgabe": "Laura hat 14 Tage lang die Dauer ihres Schulwegs in Minuten notiert: 12; 23; 14; 15; 19; 15; 9; 17; 14; 16; 16; 20; 15; 12. Bestimme das untere Quartil.", "loesung": "14", "hinweis": "Zuerst der Größe nach ordnen – dann das untere Viertel bestimmen.", "schritte": [{"g": "Geordnet: 9; 12; 12; 14; 14; 15; 15; 15; 16; 16; 17; 19; 20; 23", "op": "sortieren"}, {"g": "14 Werte, also Position 14 · 1/4 = 3,5 → aufrunden auf Position 4", "op": "Quartilsregel"}, {"g": "An Position 4 steht die 14"}, {"g": "Ergebnis: unteres Quartil = 14"}], "quelle": "Buch S. 54, Aufg. 31a – 1:1; Buchlösung S. 161 ✓", "stufe": "schwer"}, {"aufgabe": "Jonas notiert die Noten aller Vokabeltests: 2,5; 2; 1,5; 2; 4,5; 2,5; 2; 1; 2; 2; 2,5; 1,5. Bestimme das obere Quartil.", "loesung": "2,5", "hinweis": "Ordnen, dann die Position für drei Viertel der Werte bestimmen.", "schritte": [{"g": "Geordnet: 1; 1,5; 1,5; 2; 2; 2; 2; 2; 2,5; 2,5; 2,5; 4,5", "op": "sortieren"}, {"g": "12 Werte, Position 12 · 3/4 = 9 – ganzzahlig, also Mittelwert aus Position 9 und 10", "op": "Quartilsregel"}, {"g": "Position 9 = 2,5 und Position 10 = 2,5 → (2,5 + 2,5) : 2"}, {"g": "Ergebnis: oberes Quartil = 2,5"}], "quelle": "Buch S. 54, Aufg. 31b – 1:1; Buchlösung S. 161 ✓", "stufe": "schwer"}]}], "uplus": [{"stufe": "", "aufgabe": "Zwei Klassen schreiben dieselbe Arbeit. Boxplot A hat eine kurze Box, Boxplot B eine lange (gleicher Median). Welche Klasse ist im Mittelfeld homogener?", "schritte": [{"g": "Die Box umfasst die mittlere Hälfte aller Daten – vom unteren zum oberen Quartil"}, {"g": "Kurze Box = die mittlere Hälfte liegt eng beieinander"}, {"g": "→ Klasse A ist einheitlicher"}], "loesung": "Klasse A", "hinweis": "Kurze Box = mittlere Hälfte eng beieinander"}, {"stufe": "", "aufgabe": "Bestimme den Median von 2, 9, 4, 11, 6, 3, 8.", "schritte": [{"g": "Median = mittlerer Wert der GEORDNETEN Liste – also zuerst ordnen"}, {"g": "Geordnet: 2, 3, 4, 6, 8, 9, 11 (7 Werte)"}, {"g": "Der mittlere ist der 4. Wert (3 davor, 3 danach)"}, {"g": "Ergebnis: Median = 6"}], "loesung": "6", "hinweis": "Erst ordnen, dann den Wert genau in der Mitte nehmen."}, {"stufe": "", "aufgabe": "Bestimme die Spannweite von 14, 3, 8, 21, 5.", "schritte": [{"g": "Spannweite = größter Wert − kleinster Wert"}, {"g": "Größter Wert: 21, kleinster Wert: 3"}, {"g": "21 − 3 = 18"}, {"g": "Ergebnis: Spannweite = 18"}], "loesung": "18", "hinweis": "Größter minus kleinster Wert."}, {"stufe": "", "aufgabe": "In einem Boxplot liegt das untere Quartil bei 3 und das obere Quartil bei 6. Wie lang ist die Box?", "schritte": [{"g": "Die Box reicht vom unteren Quartil (Q1) bis zum oberen Quartil (Q3)"}, {"g": "Länge der Box = Q3 − Q1"}, {"g": "6 − 3 = 3"}, {"g": "Ergebnis: Die Box ist 3 Einheiten lang (dort liegt die mittlere Hälfte der Daten)"}], "loesung": "3", "hinweis": "Die Box geht von Quartil zu Quartil."}, {"stufe": "", "aufgabe": "Bestimme das obere Quartil der geordneten Liste 2, 3, 5, 7, 8, 9, 11, 12.", "schritte": [{"g": "8 Werte – die obere Hälfte sind die letzten 4: 8, 9, 11, 12"}, {"g": "Das obere Quartil Q3 ist der Median dieser oberen Hälfte"}, {"g": "Median von 8, 9, 11, 12 = (9 + 11) : 2 = 10"}, {"g": "Ergebnis: Q3 = 10 hnitt! Der wird im Boxplot gar nicht dargestellt"}], "loesung": "Median", "stufe": "leicht"}, {"aufgabe": "Bestimme den Modalwert von 7, 9, 7, 4, 7, 9.", "schritte": [{"g": "Zählen: die 7 kommt dreimal vor, die 9 zweimal, die 4 einmal"}, {"g": "Am häufigsten steht die 7 in der Liste"}, {"g": "Ergebnis: Modalwert = 7"}], "loesung": "7", "stufe": "mittel"}, {"stufe": "mittel", "aufgabe": "Bestimme den Median von 3, 7, 5, 9, 4, 8.", "loesung": "6", "quelle": "analog Buch S. 50 (Median bei gerader Anzahl)", "schritte": [{"g": "Ordnen: 3; 4; 5; 7; 8; 9", "op": "sortieren"}, {"g": "Gerade Anzahl → Mittelwert der beiden mittleren Werte"}, {"g": "(5 + 7) : 2 = 6"}]}, {"stufe": "mittel", "aufgabe": "Bestimme die Spannweite von 12, 7, 19, 4, 15.", "loesung": "15", "quelle": "analog Buch S. 50 (Spannweite)", "schritte": [{"g": "Größter Wert 19, kleinster Wert 4"}, {"g": "19 − 4 = 15"}]}, {"stufe": "mittel", "aufgabe": "Bestimme den Modalwert von 3, 6, 3, 8, 6, 3.", "loesung": "3", "quelle": "analog Buch S. 50 (Kennwerte einer Datenreihe)", "schritte": [{"g": "Modalwert = der Wert, der am häufigsten vorkommt"}, {"g": "Die 3 kommt dreimal vor, die 6 zweimal"}, {"g": "→ 3"}]}], "test": [{"stufe": "mittel", "aufgabe": "Ein Boxplot der Mathe-Noten zeigt: unteres Quartil 2, Median 2,5, oberes Quartil 3,5. Wie groß ist der Quartilsabstand (die Länge der Box)?", "schritte": [{"g": "Quartilsabstand = oberes Quartil − unteres Quartil"}, {"g": "3,5 − 2"}, {"g": "= 1,5"}], "loesung": "1,5", "hinweis": "Die Box reicht vom unteren bis zum oberen Quartil – ihre Länge ist der Quartilsabstand.", "quelle": "Buch 3.9, S. 52 (Beispiel-Boxplot mit gedruckten Kennwerten) ✓"}, {"stufe": "schwer", "aufgabe": "In einem Boxplot ist das obere Quartil 25 und der größte Wert 35. Wie viel Prozent aller Werte liegen zwischen 25 und 35?", "schritte": [{"g": "Oberhalb des oberen Quartils liegt das oberste Viertel"}, {"g": "ein Viertel = 25 %"}, {"g": "= 25 %"}], "loesung": "25 %", "hinweis": "Die Quartile teilen die Daten in vier gleich große Teile – oberhalb des oberen Quartils liegt genau ein Viertel.", "quelle": "Buch 3.9, S. 53, Aufg. 28d ✓"}]}, "B5": {"id": "B5", "titel": "Zinsen verstehen", "kerne": [{"name": "", "verstehen": ["Zinsrechnung ist Prozentrechnung mit neuen Namen – so steht es im Buch: Zinssatz p % entspricht dem Prozentsatz, das Kapital K dem Grundwert und die (Jahres-)Zinsen Z dem Prozentwert. Das Kapital ist das Geld, das du der Bank überlässt; die Zinsen sind das Geld, das du dafür bekommst.", "Woher kommt die Zinsformel? Die Zinsen sind ein Prozentsatz vom Kapital – also nichts anderes als „p % von K“. Und p % heißt p/100, denn Prozent bedeutet Hundertstel. Deshalb → Zinsen Z = K · p/100. Beispiel → 400 € zu 2 %: Z = 400 · 2/100 = 400 · 0,02 = 8 €.", "Diese eine Formel löst alle drei Grundaufgaben – du stellst sie nur nach der gesuchten Größe um: Zinssatz gesucht → p = Z/K · 100 (Beispiel → 6,25 € Zinsen auf 250 € → 6,25 : 250 · 100 = 2,5 %). Kapital gesucht → K = Z/p · 100 (Beispiel → 240 € Zinsen bei 4 % → 240 : 4 · 100 = 6000 €).", "Liegt das Geld kürzer als ein Jahr an, zählst du den Zeitanteil dazu: Ein halbes Jahr bringt die halben Jahreszinsen, ein Vierteljahr ein Viertel."], "fallen": [{"falle": "Z und K beim Zinssatz vertauscht", "falsch": "p = K/Z · 100", "richtig": "p = Z/K · 100", "warum": "Der Zinssatz misst die Zinsen im Verhältnis zum Kapital"}, {"falle": "Zeitanteil vergessen", "falsch": "500 € zu 4 % für ½ Jahr → 20 €", "richtig": "20 € · ½ = 10 €", "warum": "Jahreszins gilt für ein GANZES Jahr"}], "ueben": [{"stufe": "leicht", "aufgabe": "400 € liegen ein Jahr zu 2 % Zinssatz an. Wie viel Zinsen gibt es?", "schritte": [{"g": "Zinsformel: Z = K · p/100 (Zinsen = Kapital mal Zinssatz, geteilt durch 100)"}, {"g": "Einsetzen:"}, {"g": "400 · 2/100 = 8 €."}], "loesung": "8 €", "hinweis": "Zinsformel → Z = K · p/100. Hier → 400 · 2/100 = 8 €."}, {"stufe": "leicht", "aufgabe": "250 € bringen in einem Jahr 6,25 € Zinsen. Wie hoch ist der Zinssatz?", "schritte": [{"g": "Zinssatz gesucht → Zinsformel nach p umstellen: p = Z : K · 100"}, {"g": "Einsetzen:"}, {"g": "6,25 : 250 · 100 = 2,5 %."}], "loesung": "2,5 %", "hinweis": "Zinssatz gesucht → p = Z : K · 100. Hier → 6,25 : 250 · 100 = 2,5 %."}, {"stufe": "leicht", "aufgabe": "Für ein Darlehen zahlt man bei 4 % Zinssatz 240 € Zinsen im Jahr. Wie hoch ist das Darlehen?", "schritte": [{"g": "Kapital gesucht → Zinsformel nach K umstellen: K = Z : p · 100"}, {"g": "Einsetzen:"}, {"g": "240 : 4 · 100 = 6000 €."}], "loesung": "6000 €", "hinweis": "Kapital gesucht – stelle die Zinsformel nach K um."}, {"stufe": "mittel", "aufgabe": "Kapital K = 1500 €, Zinssatz p = 2 %. Berechne die Jahreszinsen Z.", "schritte": [{"g": "Zinsformel: Z = K · p/100 (Zinsen = Kapital mal Zinssatz, geteilt durch 100)"}, {"g": "Einsetzen:"}, {"g": "1500 · 2/100 = 30 €."}], "loesung": "30 €", "hinweis": "Zinsformel → Z = K · p/100. Hier → 1500 · 2/100 = 30 €."}, {"stufe": "mittel", "aufgabe": "Zinsen Z = 41,25 €, Zinssatz p = 2 3/4 %. Berechne das Kapital K.", "schritte": [{"g": "Kapital gesucht"}, {"g": "K = Z : p · 100. Mit p = 2 3/4 % = 2,75 %"}, {"g": "K = 41,25 : 2,75 · 100 = 1500 €."}], "loesung": "1500 €", "hinweis": "Kapital gesucht – stelle die Zinsformel nach K um."}, {"stufe": "mittel", "aufgabe": "Kapital K = 1100 €, Jahreszinsen Z = 44 €. Berechne den Zinssatz p.", "schritte": [{"g": "Zinssatz gesucht → Zinsformel nach p umstellen: p = Z : K · 100"}, {"g": "Einsetzen:"}, {"g": "44 : 1100 · 100 = 4 %."}], "loesung": "4 %", "hinweis": "Zinssatz gesucht → p = Z : K · 100. Hier → 44 : 1100 · 100 = 4 %."}, {"stufe": "mittel", "aufgabe": "Kapital K = 4000 €, Jahreszinsen Z = 240 €. Berechne den Zinssatz p.", "schritte": [{"g": "Zinssatz gesucht → Zinsformel nach p umstellen: p = Z : K · 100"}, {"g": "Einsetzen:"}, {"g": "240 : 4000 · 100 = 6 %."}], "loesung": "6 %", "hinweis": "Zinssatz gesucht → p = Z : K · 100. Hier → 240 : 4000 · 100 = 6 %."}, {"stufe": "mittel", "aufga hre)", "schritte": [{"g": "Jahreszinsen: 2000 · 4 : 100 = 80 €"}, {"g": "Ein Vierteljahr = 3 von 12 Monaten", "op": "Zeitanteil"}, {"g": "80 € : 4 = 20 €"}]}, {"stufe": "mittel", "aufgabe": "800 € liegen ein Jahr zu 2,5 % an. Wie viel Zinsen gibt es?", "loesung": "20 €", "quelle": "analog Buch S. 32, Aufg. 28 (Jahreszinsen)", "schritte": [{"g": "Z = K · p : 100"}, {"g": "800 · 2,5 : 100 = 20 → 20 €"}]}, {"stufe": "mittel", "aufgabe": "Ein Kapital von 1200 € bringt 48 € Zinsen im Jahr. Wie hoch ist der Zinssatz?", "loesung": "4 %", "quelle": "analog Buch S. 32, Aufg. 29 (Zinssatz gesucht)", "schritte": [{"g": "p = Z · 100 : K", "op": "Umkehrrechnung"}, {"g": "48 · 100 : 1200 = 4 → 4 %"}]}], "test": [{"stufe": "mittel", "aufgabe": "Katharina legt 600 € für zwei Jahre zu 2 % Zinsen pro Jahr an. Wie viel Zinsen bekommt sie im ZWEITEN Jahr?", "schritte": [{"g": "1. Jahr: 600 € · 0,02 = 12 €"}, {"g": "Neues Kapital: 600 € + 12 € = 612 €"}, {"g": "2. Jahr: 612 € · 0,02 = 12,24 €"}], "loesung": "12,24 €", "hinweis": "Im zweiten Jahr werden auch die Zinsen des ersten Jahres mitverzinst.", "quelle": "Test Kap. 2, Aufg. 5 · Lösung S. 155 ✓"}, {"stufe": "schwer", "aufgabe": "Mario legt 600 € an: im ersten Jahr zu 1 %, im zweiten Jahr zu 3 %. Wie viel Zinsen bekommt er in den zwei Jahren zusammen?", "schritte": [{"g": "1. Jahr: 600 € · 0,01 = 6 €"}, {"g": "Kapital danach: 606 €"}, {"g": "2. Jahr: 606 € · 0,03 = 18,18 €"}, {"g": "6 € + 18,18 € = 24,18 €"}], "loesung": "24,18 €", "hinweis": "Jahr für Jahr rechnen – im zweiten Jahr ist das Kapital schon größer.", "quelle": "Test Kap. 2, Aufg. 5 · Lösung S. 155 ✓"}]}, "C1": {"id": "C1", "titel": "Dreiecke konstruieren wie ein Profi", "kerne": [{"name": "", "verstehen": ["Zwei Figuren sind kongruent, wenn sie deckungsgleich sind – gleiche Form UND gleiche Größe. Bei Dreiecken musst du nicht alle sechs Stücke vergleichen. Drei passende reichen, das sagen die Kongruenzsätze: sss (drei Seiten), sws (zwei Seiten und der EINGESCHLOSSENE Winkel), wsw (eine Seite und die beiden anliegenden Winkel) und Ssw (zwei Seiten und der Gegenwinkel der größeren Seite).", "Beispiel aus dem Buch → c = 5 cm, α = 80°, β = 55° und c′ = 5 cm, α′ = 80°, γ′ = 45°. Sieht verschieden aus? Rechne β′ = 180° − 80° − 45° = 55° – schon passt wsw, die Dreiecke sind kongruent.", "Vor jeder Konstruktion prüfst du, ob das Dreieck überhaupt existiert: Die Winkelsumme darf 180° nicht sprengen, und je zwei Seiten müssen zusammen länger sein als die dritte (Dreiecksungleichung). Dann: Planfigur skizzieren, gegebene Stücke farbig markieren, konstruieren, Vorgehen beschreiben."], "fallen": [{"falle": "Winkelsumme nicht geprüft", "falsch": "a = 4 cm, β = 95°, γ = 90° „konstruieren“", "richtig": "Geht nicht – 95° + 90° = 185° > 180°", "warum": "Erst Existenz prüfen"}, {"falle": "sws ohne eingeschlossenen Winkel", "falsch": "Zwei Seiten + irgendein Winkel = eindeutig", "richtig": "Der Winkel muss ZWISCHEN den Seiten liegen", "warum": "Sonst gilt nur Ssw – und nur mit Gegenwinkel der größeren Seite"}], "ueben": [{"stufe": "leicht", "aufgabe": "Ein Dreieck hat die Seiten 6,8 cm, 7,2 cm und 9 cm, ein zweites die Seiten 7,2 cm, 9 cm und 6,8 cm. Sind sie kongruent?", "schritte": [{"g": "Vergleiche, was gegeben ist: bei beiden Dreiecken alle DREI Seiten"}, {"g": "6,8 cm, 7,2 cm und 9 cm kommen in beiden vor – nur in anderer Reihenfolge"}, {"g": "Drei übereinstimmende Seiten legen ein Dreieck eindeutig fest → Kongruenzsatz sss"}, {"g": "Ergebnis: Ja (sss)"}], "loesung": "Ja (sss)", "hinweis": "", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 0, "quelle": "Test Kap. 7, Aufg. 1a · gedruckte Lösung S. 205 („kongruent; sss\") ✓"}, {"stufe": "leicht", "aufgabe": "Zwei Dreiecke haben die Seiten a = 4, b = 6, c = 7 und a′ = 6, b′ = 7, c′ = 4 (je cm). Sind sie kongruent?", "schritte": [{"g": "Kongruenzsatz sss: Stimmen zwei Dreiecke in allen DREI Seiten überein, sind sie kongruent"}, {"g": "Beide haben dieselben drei Seitenlängen 4, 6, 7 – nur anders benannt"}, {"g": "→ Ja, kongruent (sss)"}], "loesung": "Ja (sss – gleiche drei Seiten, nur umbenannt)", "hinweis": "", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 0}, {"stufe": "leicht", "aufgabe": "Kann ein Dreieck die Seiten 2 cm, 3 cm und 6 cm haben?", "schritte": [{"g": "Dreiecksungleichung: Zwei Seiten zusammen müssen LÄNGER sein als die dritte – sonst kommen die Enden nicht zusammen"}, {"g": "2 + 3 = 5 < 6 ✗"}, {"g": "→ Nein, unmöglich"}], "loesung": "Nein (2 + 3 < 6)", "hinweis": "Dreiecksungleichung", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 1}, {"stufe": "mittel", "aufgabe": "Ein Dreieck soll a = 4 cm, β = 95° und γ = 90° haben. Lässt es sich konstruieren?", "schritte": [{"g": "Winkelsumme im Dreieck: Alle drei Winkel zusammen sind 180° – mehr geht nicht"}, {"g": "Schon zwei Winkel zusammen: 95° + 90° = 185° > 180°"}, {"g": "→ Nein, nicht konstruierbar"}], "loesung": "Nein (Winkelsumme > 180°)", "hinweis": "", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 1}, {"stufe": "mittel", "aufgabe": "Konstruiere ein Dreieck aus a = 9 cm, c = 6,5 cm, γ = 40°. Planfigur + Beschreibung.", "schritte": [{"g": "CB = 9 cm zeichnen (das ist die Seite a)"}, {"g": "In C den 40°-Winkel antragen – der freie Schenkel zeigt Richtung A"}, {"g": "Kreis um B mit Radius 6,5 cm (Seite c) – er schneidet den freien Schenkel"}, {"g": "Achtung: Der Kreis schneidet ZWEIMAL (A und A′) – es gibt zwei mögliche Dreiecke! Das ist der Ssw-Fall, wenn der Winkel nicht der größeren Seite gegenüberliegt"}, {"g": "Beide Lösungen sind richtig – benenne im Heft beide"}], "loesungsbild": "k_c1_ssw", "loesung": "Musterlösung: γ liegt bei C zwischen a und b: CB = 9 cm zeichnen, in C den 40°-Winkel antragen, Kreis um B mit r = 6,5 cm schneidet den freien Schenkel (zwei Schnittpunkte möglich → Ssw-Fall diskutieren)", "hinweis": "", "format": "SK"}, {"stufe": "mittel", "aufgabe": "Konstruiere ein Dreieck aus a = 5 cm, b = 4,5 cm, h_c = 2,5 cm. Beschreibe dein Vorgehen.", "schritte": [{"g": "Zeichne eine lange Gerade – auf ihr wird die Seite c liegen"}, {"g": "Zeichne die Parallele im Abstand 2,5 cm (das ist die Höhe h_c) – auf ihr muss C liegen"}, {"g": "Wähle einen Punkt C auf der Parallelen"}, {"g": "Kreis um C mit 4,5 cm (Seite b) schneidet die Gerade → A"}, {"g": "Kreis um C mit 5 cm (Seite a) schneidet die Gerade auf der anderen Seite → B"}, {"g": "Worauf achten: A und B auf VERSCHIEDENEN Seiten unterhalb von C wählen – sonst klappt das Dreieck zusammen"}], "loesungsbild": "k_c1_hc", "loesung": "Musterlösung: Parallele im Abstand 2,5 cm zu c nutzen; C liegt auf ihr; Kreise um C mit b und a schneiden c", "hinweis": "", "format": "SK"}, {"stufe": "mittel", "aufgabe": "Sind die Dreiecke kongruent? c = 4,5 cm, α = 77°, β = 38° und c′ = 4,5 cm, α′ = 77°, γ′ = 55°", "schritte": [{"g": "Fehlenden Winkel mit der Winkelsumme (180°) berechnen: β′ = 180° − 77° − 55° = 48°"}, {"g": "48° ≠ 38° → die Winkel passen nicht"}, {"g": "→ Nein, nicht kongruent"}], "loesung": "Nein (β′ = 180° − 77° − 55° = 48° ≠ 38°)", "hinweis": "", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 1}, {"aufgabe": "Drei Zelte stehen so, dass sie kein gemeinsames Dreieck-Eck teilen. Das Lagerfeuer soll von allen drei Zelten gleich weit entfernt sein. Welcher besondere Punkt des Dreiecks ist das?", "loesung": "Umkreismittelpunkt", "hinweis": "Gleich weit von zwei Punkten entfernt – das leistet die Mittelsenkrechte.", "schritte": [{"g": "Alle Punkte mit gleichem Abstand zu zwei Zelten liegen auf der Mittelsenkrechten", "op": "Ortslinie benennen"}, {"g": "Für drei Zelte: die Mittelsenkrechten von zwei Seiten schneiden"}, {"g": "Dieser Schnittpunkt hat zu allen drei Ecken denselben Abstand"}, {"g": "Ergebnis: der Umkreismittelpunkt"}], "quelle": "KA 2. Schulaufgabe Geometrie (Klasse 7, 01/2020), Aufg. 5 – 1:1; Lösung aus dem KA-Dossier ✓", "stufe": "schwer"}, {"aufgabe": "Von einem Dreieck sind c = 6 cm, α = 50° und β = 60° bekannt. Berechne γ.", "loesung": "70°", "hinweis": "Die drei Innenwinkel eines Dreiecks ergeben zusammen 180°.", "schritte": [{"g": "Winkelsumme im Dreieck: α + β + γ = 180°", "op": "Satz benennen"}, {"g": "50° + 60° = 110°"}, {"g": "γ = 180° − 110°"}, {"g": "Ergebnis: γ = 70° (das Dreieck ist mit c, α und β nach dem Satz WSW eindeutig konstruierbar)"}], "quelle": "analog Buch S. 116 (Kongruenzsatz WSW) und Grundwissen S. 149 (Winkelsumme)", "stufe": "schwer"}]}], "uplus": [{"stufe": "", "aufgabe": "Richtig oder falsch? „Zwei Dreiecke sind kongruent, wenn sie in drei Seiten übereinstimmen.“", "schritte": [{"g": "Das ist genau der Kongruenzsatz sss: drei gleiche Seiten → deckungsgleich"}, {"g": "→ Richtig"}], "loesung": "Richtig (sss)", "hinweis": "", "format": "MC", "mc": ["Richtig", "Falsch"], "mcCorrect": 0}, {"stufe": "", "aufgabe": "Richtig oder falsch? „Zwei Dreiecke sind kongruent, wenn sie in der Länge einer Seite und im Flächeninhalt übereinstimmen.“", "schritte": [{"g": "Gegenbeispiel: gleiche Grundseite und gleiche Höhe → gleiche Fläche"}, {"g": "Aber die Form kann völlig verschieden sein (Spitze verschieben!)"}, {"g": "Kongruent heißt deckungsgleich – gleiche Fläche allein reicht dafür nicht"}, {"g": "→ Falsch"}], "loesung": "Falsch", "hinweis": "Gegenbeispiel: gleiche Grundseite, gleiche Höhe, aber verschiedene Form", "format": "MC", "mc": ["Richtig", "Falsch"], "mcCorrect": 1}, {"stufe": "", "aufgabe": "Zwei Seiten eines Dreiecks sind 4 cm und 9 cm lang. Wie lang darf die dritte Seite höchstens sein, wenn sie eine ganze Zahl in cm ist?", "schritte": [{"g": "Dreiecksungleichung: Zwei Seiten zusammen müssen LÄNGER sein als die dritte"}, {"g": "4 + 9 = 13 – die dritte Seite muss also KÜRZER als 13 cm sein"}, {"g": "Die größte ganze Zahl unter 13 ist 12"}, {"g": "Ergebnis: höchstens 12 cm"}], "loesung": "12 cm", "hinweis": "4 + 9 ausrechnen – und die dritte Seite muss KLEINER bleiben (nicht gleich!)."}, {"stufe": "", "aufgabe": "Ein gleichschenkliges Dreieck hat die Schenkel b = c = 7 cm und den Umfang 24 cm. Wie  116 (Dreiecksungleichung)", "schritte": [{"g": "Dreiecksungleichung: Zwei Seiten zusammen müssen länger sein als die dritte"}, {"g": "3 + 4 = 7 < 8 ✗"}, {"g": "→ Nein, unmöglich"}]}, {"stufe": "mittel", "aufgabe": "Zwei Dreiecke stimmen in den Seiten a und b und dem eingeschlossenen Winkel γ überein. Sind sie kongruent?", "loesung": "Ja (sws)", "quelle": "analog Buch S. 116 (Kongruenzsätze)", "schritte": [{"g": "Kongruenzsatz sws: zwei Seiten und der eingeschlossene Winkel"}, {"g": "Genau das ist gegeben"}, {"g": "→ Ja, kongruent (sws)"}]}, {"stufe": "mittel", "aufgabe": "In einem Dreieck sind α = 90° und β = 55°. Wie groß ist γ?", "loesung": "35°", "quelle": "analog Buch S. 110 (Winkelsumme) und KA 3. Schulaufgabe, Aufg. 4", "schritte": [{"g": "Winkelsumme im Dreieck: 180°"}, {"g": "90° + 55° = 145°"}, {"g": "180° − 145° = 35°"}]}, {"stufe": "mittel", "aufgabe": "Welcher Kongruenzsatz passt, wenn alle drei Seiten gegeben sind?", "loesung": "sss", "quelle": "analog Buch S. 116 (Kongruenzsätze)", "schritte": [{"g": "Drei Seiten legen die Form eindeutig fest"}, {"g": "Das ist der Kongruenzsatz sss"}]}, {"stufe": "mittel", "aufgabe": "Ein Dreieck hat die Winkel α = 40° und γ = 100°. Wie groß ist β?", "loesung": "40°", "quelle": "analog Buch S. 110 (Winkelsumme im Dreieck)", "schritte": [{"g": "Winkelsumme im Dreieck: 180°"}, {"g": "40° + 100° = 140°"}, {"g": "180° − 140° = 40°"}]}, {"stufe": "mittel", "aufgabe": "Zwei Dreiecke stimmen in der Seite c und den Winkeln α und β überein. Sind sie kongruent?", "loesung": "Ja (wsw)", "quelle": "analog Buch S. 116 (Kongruenzsätze)", "schritte": [{"g": "Kongruenzsatz wsw: eine Seite und die beiden anliegenden Winkel"}, {"g": "Genau das ist gegeben"}, {"g": "→ Ja, kongruent (wsw)"}]}], "test": [{"stufe": "mittel", "aufgabe": "Zwei Dreiecke: a = 5,4 cm, c = 6,8 cm, γ = 45° und a′ = 5,4 cm, c′ = 6,8 cm, γ′ = 45°. Sind sie kongruent? Antworte mit „Ja“ oder „Nein“.", "schritte": [{"g": "a = 5,4 cm und c = 6,8 cm stimmen überein, dazu γ = 45° gegenüber der größeren Seite c"}, {"g": "Das ist der Kongruenzsatz Ssw"}, {"g": "Ja – die Dreiecke sind kongruent"}], "loesung": "Ja (Ssw)", "hinweis": "Zwei Seiten und der Winkel gegenüber der GRÖSSEREN Seite: Kongruenzsatz Ssw.", "quelle": "Test Kap. 7, Aufg. 1c · Lösung S. 205 ✓"}, {"stufe": "schwer", "aufgabe": "Zwei Dreiecke: c = 4,5 cm, α = 77°, β = 38° und c′ = 4,5 cm, α′ = 77°, γ′ = 55°. Sind sie kongruent? Antworte mit „Ja“ oder „Nein“.", "schritte": [{"g": "Im ersten Dreieck: γ = 180° − 77° − 38° = 65°"}, {"g": "Im zweiten Dreieck ist γ′ = 55°"}, {"g": "65° ≠ 55° → Nein, die Dreiecke sind nicht kongruent"}], "loesung": "Nein", "hinweis": "Rechne im ersten Dreieck den fehlenden Winkel aus und vergleiche ihn mit dem zweiten.", "quelle": "Test Kap. 7, Aufg. 1d · Lösung S. 205 ✓"}]}, "C2": {"id": "C2", "titel": "Zirkel und Lineal – deine Werkzeuge", "kerne": [{"name": "", "verstehen": ["Konstruieren heißt: nur mit Zirkel und Lineal arbeiten – so steht es auch im Buch. Die wichtigsten Werkzeuge sind Ortslinien: Alle Punkte mit gleichem Abstand zu EINEM Punkt liegen auf einem Kreis. Alle Punkte mit gleichem Abstand zu ZWEI Punkten A und B liegen auf der Mittelsenkrechten von AB – sie steht senkrecht auf der Strecke und halbiert sie. Alle Punkte mit gleichem Abstand zu zwei Schenkeln liegen auf der Winkelhalbierenden. [BILD:v_ortslinien]", "Zwei Begriffe brauchst du dabei immer wieder: Das LOT ist eine Gerade, die senkrecht – also im rechten Winkel – auf einer anderen Geraden steht. Fällst du das Lot von einem Punkt auf eine Gerade, heißt der Auftreffpunkt LOTFUSSPUNKT. Er ist der Punkt der Geraden, der deinem Ausgangspunkt am nächsten liegt – das Lot ist der kürzeste Weg. [BILD:v_lot]", "Mittelsenkrechte konstruieren: Zwei Kreise mit gleichem Radius um A und B, die sich schneiden – die Gerade durch die Schnittpunkte ist die Mittelsenkrechte. Sie ist zugleich die Symmetrieachse der Strecke. [BILD:k_c2_mittelsenkrechte]", "Im Dreieck treffen sich die dre ht, halbiert AB", "hinweis": "", "format": "SK"}, {"stufe": "leicht", "aufgabe": "Welche Linie trifft im Dreieck den Punkt, der von allen drei Seiten gleich weit entfernt ist?", "schritte": [{"g": "Gleicher Abstand zu den SEITEN → Winkelhalbierende"}, {"g": "Ihr Schnittpunkt ist der Inkreismittelpunkt"}], "loesung": "Winkelhalbierende (Inkreismittelpunkt)", "hinweis": "", "format": "E"}, {"stufe": "mittel", "aufgabe": "Zeichne ein Dreieck mit c = 6 cm, α = 35°, β = 112°. a) Konstruiere den Umkreis und bestimme seinen Radius. b) Konstruiere den Inkreis und bestimme seinen Radius.", "schritte": [{"g": "Dreieck zeichnen: c = AB = 6 cm, in A den Winkel 35° und in B den Winkel 112° antragen → Schnittpunkt C"}, {"g": "a) Umkreis: Die Mittelsenkrechten von zwei Seiten konstruieren – ihr Schnittpunkt ist der Umkreismittelpunkt U"}, {"g": "Kreis um U durch eine Ecke ziehen – er läuft durch ALLE drei Ecken. Radius messen: R ≈ 5,5 cm"}, {"g": "Nicht wundern: Wegen des stumpfen Winkels (112°) liegt U AUSSERHALB des Dreiecks – das ist richtig so"}, {"g": "b) Inkreis: Zwei Winkelhalbierende konstruieren – ihr Schnittpunkt ist der Inkreismittelpunkt I"}, {"g": "Kreis um I, der die Seite c gerade berührt (Abstand von I zu c mit dem Lot abgreifen) → r ≈ 1,6 cm"}], "loesungsbild": "k_c2_umin", "loesung": "Checkliste: Umkreis durch alle drei Ecken (Mittelsenkrechten), Inkreis berührt alle drei Seiten (Winkelhalbierende); Radius messen", "hinweis": "", "format": "SK"}, {"stufe": "mittel", "aufgabe": "Konstruiere im Dreieck ABC den Spiegelpunkt von A an der Geraden CB.", "schritte": [{"g": "Zuerst die Begriffe: Das LOT ist die Gerade durch A, die senkrecht (im rechten Winkel) auf CB steht. Der Punkt, in dem das Lot auf CB trifft, heißt LOTFUSSPUNKT F"}, {"g": "Also: Lot von A auf die Gerade CB fällen → Lotfußpunkt F"}, {"g": "Die Strecke AF in den Zirkel nehmen"}, {"g": "AF über F hinaus noch einmal abtragen → A′"}, {"g": "A′ ist der Spiegelpunkt: F ist die Mitte von AA′, und AA′ steht : "Ortslinie"}, {"g": "Diese Linie heißt Winkelhalbierende"}]}, {"stufe": "mittel", "aufgabe": "Wo schneiden sich die Mittelsenkrechten eines Dreiecks?", "loesung": "Im Umkreismittelpunkt", "quelle": "analog Buch S. 114 (besondere Linien im Dreieck)", "schritte": [{"g": "Jede Mittelsenkrechte enthält die Punkte mit gleichem Abstand zu zwei Ecken"}, {"g": "Der gemeinsame Schnittpunkt hat zu allen drei Ecken denselben Abstand"}, {"g": "→ Im Umkreismittelpunkt"}]}, {"stufe": "mittel", "aufgabe": "Wo schneiden sich die Winkelhalbierenden eines Dreiecks?", "loesung": "Im Inkreismittelpunkt", "quelle": "analog Buch S. 114 (besondere Linien im Dreieck)", "schritte": [{"g": "Jede Winkelhalbierende enthält die Punkte mit gleichem Abstand zu zwei Seiten"}, {"g": "Der Schnittpunkt hat zu allen drei Seiten denselben Abstand"}, {"g": "→ Im Inkreismittelpunkt"}]}, {"stufe": "mittel", "aufgabe": "Wie viele Symmetrieachsen hat ein Rechteck, das kein Quadrat ist?", "loesung": "2", "quelle": "analog KA 2. Schulaufgabe Geometrie, Aufg. 2 (Symmetrie von Vierecken)", "schritte": [{"g": "Die Mittelsenkrechte jeder Seitenmitte prüfen"}, {"g": "Es gibt genau zwei: waagerecht und senkrecht durch die Mitte"}, {"g": "→ 2 Achsen"}]}, {"stufe": "mittel", "aufgabe": "Welche Ortslinie besteht aus allen Punkten mit gleichem Abstand zu zwei Punkten A und B?", "loesung": "Mittelsenkrechte", "quelle": "analog Buch S. 112 (Ortslinien)", "schritte": [{"g": "Gleicher Abstand zu A und B"}, {"g": "Diese Linie steht senkrecht auf AB und halbiert sie"}, {"g": "→ Mittelsenkrechte"}]}, {"stufe": "mittel", "aufgabe": "Wie viele Symmetrieachsen hat ein gleichseitiges Dreieck?", "loesung": "3", "quelle": "analog Buch S. 112 (Symmetrie)", "schritte": [{"g": "Durch jede Ecke und die gegenüberliegende Seitenmitte"}, {"g": "Das ergibt 3 Achsen"}, {"g": "Ergebnis: 3"}]}], "test": [{"stufe": "mittel", "aufgabe": "Zeichne das Dreieck ABC mit c = 6 cm, α = 35° und β = 112°. Konstruiere den Umkreis und bestimme seinen Radius (auf Zehntel genau).", "schritte": [{"g": "Dreieck zeichnen: c = 6 cm, in A 35°, in B 112°"}, {"g": "Mittelsenkrechten von zwei Seiten konstruieren"}, {"g": "Ihr Schnittpunkt ist der Umkreismittelpunkt M"}, {"g": "Abstand M–A messen: r ≈ 5,5 cm"}], "loesung": "5,5 cm", "hinweis": "Der Umkreismittelpunkt ist der Schnittpunkt der Mittelsenkrechten.", "quelle": "Test Kap. 6, Aufg. 5a · Lösung S. 199 ✓"}, {"stufe": "schwer", "aufgabe": "Dasselbe Dreieck (c = 6 cm, α = 35°, β = 112°): Konstruiere den Inkreis und bestimme seinen Radius (auf Zehntel genau).", "schritte": [{"g": "Dreieck aus c = 6 cm, α = 35° und β = 112° zeichnen, dann die Winkelhalbierenden von zwei Winkeln konstruieren"}, {"g": "Ihr Schnittpunkt ist der Inkreismittelpunkt"}, {"g": "Lot auf eine Seite fällen – der Abstand ist der Radius"}, {"g": "r ≈ 1,6 cm"}], "loesung": "1,6 cm", "hinweis": "Der Inkreismittelpunkt ist der Schnittpunkt der Winkelhalbierenden; der Radius ist der Abstand zu einer Seite (Lot!).", "quelle": "Test Kap. 6, Aufg. 5b · Lösung S. 199 ✓"}]}, "C3": {"id": "C3", "titel": "Der Trick mit dem Halbkreis (Satz des Thales)", "kerne": [{"name": "", "verstehen": ["Der Satz des Thales: Liegt der Punkt C eines Dreiecks auf einem Halbkreis über der Strecke AB (dem Thaleskreis), dann hat das Dreieck bei C einen rechten Winkel – γ = 90°. Egal, wo auf dem Halbkreis C liegt!", "Der Satz gilt auch rückwärts (Umkehrung): Ist das Dreieck ABC bei C rechtwinklig, dann liegt C auf dem Thaleskreis über AB. Die Mitte der Hypotenuse (so heißt die längste Seite – sie liegt dem rechten Winkel gegenüber) ist also immer der Umkreismittelpunkt eines rechtwinkligen Dreiecks.", "Wozu? Damit konstruierst du rechte Winkel ohne Geodreieck (Punkt auf dem Thaleskreis wählen) – und sogar Tangenten an einen Kreis: Thaleskreis über der Strecke PM zeichnen, seine Schnittpunkte mit dem Kreis sind die Berührpunkte. Das steht genau so im Buch."], "fallen": [{"falle": "Rechten Winkel falsch verortet", "falsch": "Der rechte Winkel liegt bei A oder B", "richtig": "Bei C – dem Punkt AUF dem Halbkreis", "warum": "AB ist der Durchmesser, C der „Wanderpunkt“"}, {"falle": "Umkehrung vergessen", "falsch": "„Thales gilt nur in eine Richtung“", "richtig": "Rechtwinklig bei C ⇒ C liegt auf dem Thaleskreis", "warum": "Satz UND Umkehrung"}], "ueben": [{"stufe": "leicht", "aufgabe": "C liegt auf einem Halbkreis über AB (AB = Durchmesser). Welcher Winkel des Dreiecks ABC ist ein rechter?", "schritte": [{"g": "Satz des Thales: Liegt C auf einem Halbkreis über AB (AB = Durchmesser), dann hat das Dreieck ABC bei C einen rechten Winkel"}, {"g": "→ der rechte Winkel ist der bei C"}], "loesung": "der bei C", "hinweis": "", "format": "E"}, {"stufe": "leicht", "aufgabe": "Dreieck im Thaleskreis: α = 35°. Wie groß ist β?", "schritte": [{"g": "Satz des Thales: Im Halbkreis über dem Durchmesser ist der Winkel bei C immer 90° → γ = 90°"}, {"g": "Winkelsumme im Dreieck: 180°"}, {"g": "β = 180° − 90° − 35°"}, {"g": "β = 55°"}], "loesung": "55°", "hinweis": "γ = 90°, also β = 180° − 90° − 35°", "format": "E"}, {"stufe": "leicht", "aufgabe": "Ein Dreieck liegt im Thaleskreis und hat den Winkel α = 25°. Wie groß ist β?", "schritte": [{"g": "Satz des Thales: Der Winkel bei C ist 90°. Winkelsumme"}, {"g": "β = 180° − 90° − 25° = 65°."}], "loesung": "65°", "hinweis": "Satz des Thales: Der Winkel bei C ist 90°. Dann die Winkelsumme.", "format": "E"}, {"stufe": "mittel", "aufgabe": "Thaleskreis über AB mit Mittelpunkt D, α = 25°. Bestimme die Innenwinkel des Dreiecks ADC.", "loesungsbild": "k_c3_adc", "schritte": [{"g": "DA und DC sind beide Radien des Kreises → DA = DC = r"}, {"g": "Zwei gleiche Seiten heißt: Dreieck ADC ist gleichschenklig"}, {"g": "Im gleichschenkligen Dreieck sind die Basiswinkel gleich groß → bei A und bei C je 25°"}, {"g": "Winkelsumme: 180° − 25° − 25° = 130°"}, {"g": "Ergebnis: 25°, 25°, 130°"}], "loesung": "25°, 25°, 130°", "hinweis": "DA = DC = r → gleichschenklig; Basiswinkel 25°; 180° − 50° = 130°", "format": "E (3 FELDER)"}, {"stufe": "mittel", "aufgabe": "Gleiche Figur wie in der vorigen Aufgabe (Thaleskreis über AB mit Mittelpunkt D, α = 25°): Bestimme β im Dreieck BDC.", "loesungsbild": "k_c3_bdc", "schritte": [{"g": "Nebenwinkel ergänzen sich zu 180° → Winkel BDC = 180° − 130° = 50°"}, {"g": "DB und DC sind beide Radien → Dreieck BDC ist gleichschenklig"}, {"g": "Basiswinkel gleich groß: (180° − 50°) : 2 = 65°"}, {"g": "Probe mit Thales: α + β = 25° + 65° = 90° ✓ (rechter Winkel bei C)"}], "loesung": "65°", "hinweis": "Winkel BDC = 180° − 130° = 50° (Nebenwinkel); DB = DC → gleichschenklig → (180° − 50°) : 2 = 65°. Probe: α + β = 25° + 65° = 90° ✓", "format": "E"}, {"stufe": "mittel", "aufgabe": "Beschreibe, wie du NUR mit Zirkel und Lineal die Tangenten von einem Punkt P an einen Kreis (Mittelpunkt M) konstruierst.", "schritte": [{"g": "Strecke PM zeichnen und ihre Mitte konstruieren (Mittelsenkrechte von PM)"}, {"g": "Thaleskreis über PM schlagen: Kreis um die Mitte von PM durch P und M"}, {"g": "Er schneidet den Kreis um M in T₁ und T₂ – das sind die Berührpunkte"}, {"g": "P mit T₁ und mit T₂ verbinden – fertig sind beide Tangenten"}, {"g": "Warum das funktioniert: Nach dem Satz des Thales ist der Winkel bei T₁ und T₂ ein rechter – die Verbindungen stehen senkrecht auf dem Radius, und genau das zeichnet eine Tangente aus"}], "loesungsbild": "k_c3_tangenten", "loesung": "Checkliste: Strecke PM; Thaleskreis über PM; Schnittpunkte mit dem Kreis sind die Berührpunkte; P mit ihnen verbinden", "hinweis": "", "format": "SK"}, {"aufgabe": "Der Punkt C liegt auf dem Thaleskreis über der Strecke AB. Im Dreieck ABC ist α = 34°. Berechne β.", "loesung": "56°", "hinweis": "Was weißt du über den Winkel bei C, wenn C auf dem Thaleskreis liegt?", "schritte": [{"g": "Satz des Thales: Liegt C auf dem Kreis über AB, ist der Winkel bei C ein rechter", "op": "Satz benennen"}, {"g": "γ = 90°"}, {"g": "Winkelsumme: α + β + γ = 180° → 34° + β + 90° = 180°"}, {"g": "
