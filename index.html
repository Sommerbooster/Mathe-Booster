ren, Sonderfälle nennen.", "format": "SK"}, {"stufe": "", "aufgabe": "In der Planfigur ist M die Mitte der Strecke AB; BD und AE sind die Lote von B und A auf die Gerade durch C und M. Zeige: BD = AE.", "loesung": "Musterlösung: Dreiecke MBD und MAE sind kongruent (wsw: MB = MA, Scheitelwinkel bei M, rechte Winkel)", "hinweis": "", "format": "SK"}], "wpool": [{"aufgabe": "Welche Ortslinie besteht aus allen Punkten mit gleichem Abstand zu EINEM Punkt?", "loesung": "Kreis"}, {"aufgabe": "Die Mittelsenkrechte steht … und …", "loesung": "senkrecht auf AB, halbiert AB"}, {"aufgabe": "Inkreis berührt …", "loesung": "alle drei Seiten"}, {"aufgabe": "Umkreis läuft durch …", "loesung": "alle drei Ecken"}, {"aufgabe": "Welche Linie ist die Symmetrieachse einer Strecke?", "loesung": "ihre Mittelsenkrechte"}, {"aufgabe": "Welche Symmetrie hat ein Parallelogramm, das kein Rechteck ist?", "loesung": "Punktsymmetrie (keine Achsensymmetrie)"}]}, "C3": {"id": "C3", "titel": "Der Trick mit dem Halbkreis (Satz des Thales)", "kerne": [{"name": "", "verstehen": ["Der Satz des Thales: Liegt der Punkt C eines Dreiecks auf einem Halbkreis über der Strecke AB (dem Thaleskreis), dann hat das Dreieck bei C einen rechten Winkel – γ = 90°. Egal, wo auf dem Halbkreis C liegt!", "Der Satz gilt auch rückwärts (Umkehrung): Ist das Dreieck ABC bei C rechtwinklig, dann liegt C auf dem Thaleskreis über AB. Die Hypotenusenmitte ist also immer der Umkreismittelpunkt eines rechtwinkligen Dreiecks.", "Wozu? Damit konstruierst du rechte Winkel ohne Geodreieck (Punkt auf dem Thaleskreis wählen) – und sogar Tangenten an einen Kreis: Thaleskreis über der Strecke PM zeichnen, seine Schnittpunkte mit dem Kreis sind die Berührpunkte. Das steht genau so im Buch."], "fallen": [{"falle": "Rechten Winkel falsch verortet", "falsch": "Der rechte Winkel liegt bei A oder B", "richtig": "Bei C – dem Punkt AUF dem Halbkreis", "warum": "AB ist der Durchmesser, C der „Wanderpunkt“"}, {"falle": "Umkehrung vergessen", "falsch": "„Thales gilt nur in eine Richtung“", "richtig": "Rechtwinklig bei C ⇒ C liegt auf dem Thaleskreis", "warum": "Satz UND Umkehrung"}], "ueben": [{"stufe": "leicht", "aufgabe": "C liegt auf einem Halbkreis über AB (AB = Durchmesser). Welcher Winkel des Dreiecks ABC ist ein rechter?", "loesung": "der bei C", "hinweis": "", "format": "MC"}, {"stufe": "leicht", "aufgabe": "Dreieck im Thaleskreis: α = 35°. Wie groß ist β?", "loesung": "55°", "hinweis": "γ = 90°, also β = 180° − 90° − 35°", "format": "E"}, {"stufe": "leicht", "aufgabe": "Ein Dreieck liegt im Thaleskreis und hat den Winkel α = 25°. Wie groß ist β?", "loesung": "65°", "hinweis": "Satz des Thales: Der Winkel bei C ist 90°. Winkelsumme → β = 180° − 90° − 25° = 65°.", "format": "E"}, {"stufe": "leicht", "aufgabe": "Wo liegt der Umkreismittelpunkt eines rechtwinkligen Dreiecks?", "loesung": "In der Mitte der Hypotenuse", "hinweis": "Umkehrung des Satzes", "format": "MC"}, {"stufe": "mittel", "aufgabe": "Thaleskreis über AB mit Mittelpunkt D, α = 25°. Bestimme die Innenwinkel des Dreiecks ADC.", "loesung": "25°, 25°, 130°", "hinweis": "DA = DC = r → gleichschenklig; Basiswinkel 25°; 180° − 50° = 130°", "format": "E (3 FELDER)"}, {"stufe": "mittel", "aufgabe": "Gleiche Figur: Bestimme β im Dreieck BDC.", "loesung": "65°", "hinweis": "Winkel BDC = 180° − 130° = 50° (Nebenwinkel); DB = DC → gleichschenklig → (180° − 50°) : 2 = 65°. Probe: α + β = 25° + 65° = 90° ✓", "format": "E"}, {"stufe": "mittel", "aufgabe": "Beschreibe, wie du NUR mit Zirkel und Lineal die Tangenten von einem Punkt P an einen Kreis (Mittelpunkt M) konstruierst.", "loesung": "Checkliste: Strecke PM; Thaleskreis über PM; Schnittpunkte mit dem Kreis sind die Berührpunkte; P mit ihnen verbinden", "hinweis": "", "format": "SK"}]}], "uplus": [{"stufe": "", "aufgabe": "Richtig oder falsch? „Jedes Dreieck, dessen Ecke C auf dem VOLLkreis über AB liegt, ist rechtwinklig.“", "loesung": "Richtig (oberer und unterer Halbkreis)", "hinweis": "Beide Halbkreise sind Thaleskreise über AB", "format": "MC", "mc": ["Richtig", "Falsch"], "mcCorrect": 0}, {"stufe": "", "aufgabe": "Ein Dreieck hat die Winkel 90°, 30°, 60°, Hypotenuse AB = 8 cm. Wie groß ist der Umkreisradius?", "loesung": "4 cm", "hinweis": "Umkreismittelpunkt = Hypotenusenmitte → r = 8 : 2", "format": "E"}], "transfer": [{"stufe": "", "aufgabe": "Begründe mit dem Satz des Thales und seiner Umkehrung: Der Umkreisradius eines rechtwinkligen Dreiecks ist halb so lang wie die Hypotenuse.", "loesung": "Musterlösung", "hinweis": "Umkehrung: C liegt auf dem Thaleskreis über AB → der Kreis über AB durch C ist der Umkreis; sein Mittelpunkt ist die Hypotenusenmitte, sein Radius AB/2.", "format": "SK"}, {"stufe": "", "aufgabe": "Über einer Strecke AB = 6 cm sollen alle Punkte C markiert werden, für die das Dreieck ABC rechtwinklig bei C ist. Konstruiere die Ortslinie und begründe.", "loesung": "Thaleskreis (beide Halbkreise) über AB, ohne A und B selbst", "hinweis": "Satz (Halbkreis → 90°) und Umkehrung (90° → Halbkreis) zusammen ergeben: genau die Kreislinie.", "format": "SK"}], "wpool": [{"aufgabe": "Ein Dreieck liegt im Thaleskreis (AB ist Durchmesser). Wie groß ist der Winkel γ bei C?", "loesung": "90°"}, {"aufgabe": "Ein Dreieck liegt im Thaleskreis, α = 40°. Wie groß ist β?", "loesung": "50°"}, {"aufgabe": "Wo liegt der Umkreismittelpunkt eines rechtwinkligen Dreiecks?", "loesung": "Hypotenusenmitte"}, {"aufgabe": "Thaleskreis über PM schneidet Kreis um M – was sind die Schnittpunkte?", "loesung": "Berührpunkte der Tangenten"}, {"aufgabe": "AB = 10 cm ist der Durchmesser, C liegt auf dem Thaleskreis. Wie groß ist der Umkreisradius?", "loesung": "5 cm"}]}, "C4": {"id": "C4", "titel": "Terme rückwärts – Faktorisieren", "kerne": [{"name": "", "verstehen": ["Faktorisieren heißt: eine Summe als Produkt schreiben – also rückwärts denken. Weg 1: Ausklammern. Steckt in jedem Summanden derselbe Faktor, ziehst du ihn heraus → 6x² + 9x = 3x · (2x + 3). Prüfe durch Ausmultiplizieren!", "Weg 2: Binomische Formeln rückwärts. x² + 6x + 9 hat die Bauart a² + 2ab + b² → (x + 3)². Und x² − 9 ist eine Differenz zweier Quadrate → 3. Formel → (x + 3)(x − 3).", "So erkennst du die Bauart: Sind erster und letzter Summand Quadrate? Passt das mittlere Glied zu 2ab? Bei nur zwei Gliedern mit Minus: Differenz von Quadraten. Warum das Ganze? Produkte kann man kürzen und Gleichungen damit lösen – dein Vorsprung für Klasse 8."], "fallen": [{"falle": "Differenz von Quadraten als Quadrat gelesen", "falsch": "x² − 9 = (x − 3)²", "richtig": "x² − 9 = (x + 3)(x − 3)", "warum": "(x − 3)² = x² − 6x + 9 – das mittlere Glied fehlt hier aber"}, {"falle": "Nur teilweise ausgeklammert", "falsch": "6x² + 9x = 3(2x² + 3x)", "richtig": "6x² + 9x = 3x(2x + 3)", "warum": "Auch x steckt in beiden Summanden – immer den GRÖSSTEN gemeinsamen Faktor nehmen"}], "ueben": [{"stufe": "leicht", "aufgabe": "5x + 10", "loesung": "5(x + 2)", "hinweis": "Ausklammern", "format": "E"}, {"stufe": "leicht", "aufgabe": "7a − 21", "loesung": "7(a − 3)", "hinweis": "Ausklammern", "format": "E"}, {"stufe": "leicht", "aufgabe": "x² + 6x + 9", "loesung": "(x + 3)²", "hinweis": "1. Formel rückwärts: a² + 2ab + b² = (a + b)². Probe → 9 = 3², Mittelglied 2 · x · 3 = 6x passt.", "format": "E"}, {"stufe": "leicht", "aufgabe": "x² − 25", "loesung": "(x + 5)(x − 5)", "hinweis": "3. Formel rückwärts: a² − b² = (a + b)(a − b). Hier → 25 = 5².", "format": "E"}, {"stufe": "leicht", "aufgabe": "3x² + 6x", "loesung": "3x(x + 2)", "hinweis": "Größter gemeinsamer Faktor", "format": "E"}, {"stufe": "mittel", "aufgabe": "x² − 10x + 25", "loesung": "(x − 5)²", "hinweis": "2. Formel rückwärts: a² − 2ab + b² = (a − b)². Probe → 25 = 5², Mittelglied 2 · x · 5 = 10x passt.", "format": "E"}, {"stufe": "mittel", "aufgabe": "4x² − 9", "loesung": "(2x + 3)(2x − 3)", "hinweis": "Quadrate erkennen → (2x)² und 3²", "format": "E"}, {"stufe": "mittel", "aufgabe": "18a² − 8", "loesung": "2(3a + 2)(3a − 2)", "hinweis": "Erst 2 ausklammern → 2(9a² − 4), dann 3. Formel", "format": "E"}, {"stufe": "mittel", "aufgabe": "x² + 14x + 49", "loesung": "(x + 7)²", "hinweis": "1. Formel rückwärts → 49 = 7², und das Mittelglied 2 · x · 7 = 14x passt.", "format": "E"}, {"stufe": "mittel", "aufgabe": "Ergänze das Kästchen: −2ab · (□) = −2ab + a²b", "loesung": "1 − a/2", "hinweis": "Rückwärts dividieren; Probe → −2ab · 1 = −2ab; −2ab · (−a/2) = a²b", "format": "E"}]}], "uplus": [{"stufe": "", "aufgabe": "16x² − 24x + 9", "loesung": "(4x − 3)²", "hinweis": "2. Formel rückwärts → (4x)² = 16x², 3² = 9, und das Mittelglied 2 · 4x · 3 = 24x passt ✓.", "format": "E"}, {"stufe": "", "aufgabe": "50 − 2x²", "loesung": "2(5 + x)(5 − x)", "hinweis": "Erst den gemeinsamen Faktor 2 ausklammern → 2(25 − x²). Dann 3. Formel rückwärts → 25 − x² = (5 + x)(5 − x).", "format": "E"}], "transfer": [{"stufe": "", "aufgabe": "Rechne geschickt im Kopf mit einer binomischen Formel: a) 99² b) 102 · 98", "loesung": "9801 und 9996", "hinweis": "a) (100 − 1)² = 10000 − 200 + 1 = 9801. b) (100 + 2)(100 − 2) = 10000 − 4 = 9996.", "format": "E"}, {"stufe": "", "aufgabe": "Der Term x² + 12x + 36 beschreibt einen quadratischen Garten. Wie lang ist seine Seite? Deute das Ergebnis geometrisch.", "loesung": "x + 6", "hinweis": "x² + 12x + 36 = (x + 6)². Geometrisch: Quadrat x², zwei Rechtecke 6x, Quadrat 36 – zusammen ein Quadrat der Seite x + 6 (Flächenmodell wie B1).", "format": "E + SK"}], "wpool": [{"aufgabe": "x² − 1", "loesung": "(x + 1)(x − 1)"}, {"aufgabe": "4x + 8", "loesung": "4(x + 2)"}, {"aufgabe": "x² − 4x + 4", "loesung": "(x − 2)²"}, {"aufgabe": "9x² − 16", "loesung": "(3x + 4)(3x − 4)"}, {"aufgabe": "100 − y²", "loesung": "(10 + y)(10 − y)"}]}, "C5": {"id": "C5", "titel": "Term-Profi: mehrere Variablen", "kerne": [{"name": "", "verstehen": ["Terme mit mehreren Variablen sehen wild aus – bis du ihre Struktur erkennst. Frage 1: Was ist die ÄUSSERSTE Rechenart? 3 · (x + 2) ist ein Produkt (aus Zahl und Summe), (a + b)² eine Potenz, a/b ein Quotient. Mit diesen Fachbegriffen beschreibst du jeden Term.", "Frage 2: Was ist gleichartig? Nur Glieder mit GENAU denselben Variablen und Exponenten darfst du zusammenfassen → 2xy + 3xy = 5xy, aber a²b und ab² bleiben getrennt – schau genau auf die Hochzahlen.", "Frage 3 bei „äquivalent oder nicht?“: Forme um oder setze eine Testzahl ein. Achtung: EINE Übereinstimmung beweist nichts – ein einziges Gegenbeispiel widerlegt aber sicher (das kennst du aus den Klassenarbeiten)."], "fallen": [{"falle": "Verschiedene Variablen zusammengezogen", "falsch": "2a + 3b = 5ab", "richtig": "2a + 3b lässt sich nicht zusammenfassen", "warum": "Nur gleichartige Glieder addieren"}, {"falle": "Exponenten ignoriert", "falsch": "a²b + ab² = 2a²b²", "richtig": "a²b + ab² bleibt stehen", "warum": "a²b und ab² sind NICHT gleichartig"}], "ueben": [{"stufe": "leicht", "aufgabe": "Welche Termart hat 3 · (x + 2)?", "loesung": "Produkt", "hinweis": "", "format": "MC"}, {"stufe": "leicht", "aufgabe": "4a + 2b − a + 3b", "loesung": "3a + 5b", "hinweis": "Gleichartige sortieren", "format": "E"}, {"stufe": "leicht", "aufgabe": "2xy + 3xy", "loesung": "5xy", "hinweis": "", "format": "E"}, {"stufe": "leicht", "aufgabe": "a²b + 2a²b + ab²", "loesung": "3a²b + ab²", "hinweis": "ab² bleibt getrennt!", "format": "E"}, {"stufe": "leicht", "aufgabe": "Welche Termart hat (a + b)²?", "loesung": "Potenz (Quadrat einer Summe)", "hinweis": "", "format": "MC"}, {"stufe": "mittel", "aufgabe": "T(a; b) = 2a + 3b² für a = 6, b = −1", "loesung": "15", "hinweis": "Klammer um −1: 3 · (−1)² = 3", "format": "E"}, {"stufe": "mittel", "aufgabe": "Vereinfache: 0,5 · (0,3a − 4b²) + 3b · (0,25b − (−2a))", "loesung": "0,15a − 1,25b² + 6ab", "hinweis": "Beide Klammern ausmultiplizieren (Minus mal Minus wird Plus!) → 0,15a − 2b² + 0,75b² + 6ab, dann die b²-Glieder zusammenfassen.", "format": "E"}, {"stufe": "mittel", "aufgabe": "Vereinfache: −a(6b − 12a) · 1/3 − 6ab", "loesung": "4a² − 8ab", "hinweis": "Erst die Klammer ausmultiplizieren → −6ab + 12a². Dann mal 1/3: −2ab + 4a². Zum Schluss − 6ab und zusammenfassen.", "format": "E"}, {"stufe": "mittel", "aufgabe": "Welche Terme sind äquivalent zu −0,5y + 1? (i) (y − 2) · (−0,5) (ii) (−y − 2) · 0,5 (iii) y + 0,5² − 1,5y (iv) −(0,5y + 1)", "loesung": "nur (i)", "hinweis": "(ii) −0,5y − 1; (iii) −0,5y + 0,25; (iv) −0,5y − 1", "format": "MC"}, {"stufe": "mittel", "aufgabe": "Welche Terme sind äquivalent zu a² − b³? (i) (a + a) − (b + b + b) (ii) 2a² − b · b² − a² (iii) −(a² − b³) (iv) a² + (−b³)", "loesung": "(ii) und (iv)", "hinweis": "(i) 2a − 3b; (iii) −a² + b³", "format": "MC"}]}], "uplus": [{"stufe": "", "aufgabe": "England-Flagge: Rechteck (Breite b, Höhe a) mit Kreuz aus zwei Balken der Breite x. Stelle einen Term für die Kreuzfläche auf.", "loesung": "bx + ax − x²", "hinweis": "Querbalken b · x plus Längsbalken a · x, das doppelt gezählte Mittelquadrat x² einmal abziehen", "format": "E"}], "transfer": [{"stufe": "", "aufgabe": "Aus einem Karton (20 cm × 30 cm) werden an den Ecken Quadrate der Seitenlänge x ausgeschnitten, dann wird eine offene Schachtel gefaltet. Stelle einen Term für das Volumen V(x) auf und multipliziere aus.", "loesung": "V(x) = 4x³ − 100x² + 600x", "hinweis": "V(x) = (20 − 2x)(30 − 2x) · x = (600 − 100x + 4x²) · x", "format": "E"}, {"stufe": "", "aufgabe": "Beschreibe den Term (a + b) · (a − b) mit Fachbegriffen und vereinfache ihn.", "loesung": "Produkt aus Summe und Differenz; a² − b²", "hinweis": "Äußerste Rechenart: Produkt; Faktoren: Summe bzw. Differenz von a und b; 3. binomische Formel", "format": "SK + E"}], "wpool": [{"aufgabe": "3x + 2y + x", "loesung": "4x + 2y"}, {"aufgabe": "xy · x", "loesung": "x²y"}, {"aufgabe": "Welche Termart hat a/b?", "loesung": "Quotient"}, {"aufgabe": "5ab − 2ba", "loesung": "3ab"}, {"aufgabe": "Berechne a²b für a = 2 und b = 3.", "loesung": "12"}]}};


/* ---------- Zustand ---------- */
/* ---------- Profile (Muster: Vokabel-App) ---------- */
const STORE_BASE="mathebooster_check_v1";
function profiles(){ try{ return JSON.parse(localStorage.getItem("mathebooster_profiles")||"[]"); }catch(e){ return []; } }
function setProfiles(p){ try{ localStorage.setItem("mathebooster_profiles", JSON.stringify(p)); }catch(e){} }
let PID=localStorage.getItem("mathebooster_active")||null;
if(PID && !profiles().find(p=>p.id===PID)) PID=null;
function storeKey(){ return STORE_BASE+"_"+PID; }
let PROF_VIEW=false; // Profil-Screen über den Nav-Button geöffnet

function defaultState(){ return {screen:"start", idx:0, motivation:null, answers:{}, hwnn:{}, probe:{}, strokes:{}, startedAt:null, teil2StartedAt:null, hwnnHintSeen:false, done:false, pausedAfterTeil1:false, config:{wochen:2,tage:5,minuten:20}, planCreated:false, daysDone:{}, netz:{}, netzPlan:[], curDay:null, unit:null, mixDone:{}}; }
let S=null;
function initS(){
  S = load() || defaultState();
  if(!S.probe) S.probe={};
  if(!S.config) S.config={wochen:2,tage:5,minuten:20};
  if(!S.daysDone) S.daysDone={};
  if(!S.netz) S.netz={};
  if(!S.netzPlan) S.netzPlan=[];
  if(!S.mixDone) S.mixDone={}; // im Mix bereits richtig gelöste Aufgaben (kommen nicht erneut dran)
  save();
}
function selectProfile(id){
  PID=id; localStorage.setItem("mathebooster_active",id); PROF_VIEW=false;
  initS(); render(); window.scrollTo(0,0);
  try{ history.replaceState({mb:histSnap()},""); }catch(e){} // Basis-Eintrag für die Browser-Pfeile
}

/* Sicherheitsnetz: Fertigkeiten, die im Mix 2× danebenlagen, kommen zurück in den Plan */
function effectiveDiag(){
  const d=diagnose(S.answers,S.hwnn);
  for(const id of S.netzPlan){ if(d[id]==="sitzt"||d[id]==="optional"||d[id]==="optional_ab_mittel") d[id]="plan"; }
  return d;
}
function skillTitle(id){ const sk=SKILLS.find(s=>s.id===id); return sk?sk.titel:id; }
function load(){ try{ return JSON.parse(localStorage.getItem(storeKey())); }catch(e){ return null; } }
function save(){ try{ if(PID&&S) localStorage.setItem(storeKey(), JSON.stringify(S)); }catch(e){} }

/* ---------- Helpers ---------- */
const $=id=>document.getElementById(id);
const main=$("main"), statusbar=$("statusbar");
function esc(t){ return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function renderTextT(t){
  let h=esc(t);
  h=h.replace(/FRAC23/g,'<span class="frac"><span class="num">2</span><span class="den">3</span></span>');
  h=h.replace(/FRAC49/g,'<span class="frac"><span class="num">4</span><span class="den">9</span></span>');
  return h;
}
function notiert(msg){ const n=$("notiert"); n.textContent=msg||"Danke, notiert!"; n.classList.add("show"); setTimeout(()=>n.classList.remove("show"),1300); }
function answered(){ return TASKS.filter(t=>S.answers[t.nr]!==undefined||S.hwnn[t.nr]).length; }
function setStatus(){
  if(S.screen==="day"){ statusbar.innerHTML='<div style="text-align:center"><button class="btn ghost small" id="statusBackPlan">Zurück zum Plan</button></div>';
    statusbar.querySelector("#statusBackPlan").addEventListener("click",()=>{ S.unit=null; show("plan"); }); }
  else if(S.done&&S.planCreated){ statusbar.innerHTML='<strong>Dein Plan steht.</strong> <span class="muted">Tippe im Lernplan auf einen Tag und leg los.</span>'; }
  else if(S.done){ statusbar.innerHTML='<strong>Dein Mathe-Check ist geschafft.</strong> <span class="muted">Erstelle jetzt deinen Lernplan.</span>'; }
  else if(S.screen==="task"){ statusbar.innerHTML='<strong>Dein Mathe-Check:</strong> <span class="muted">'+answered()+' von '+TASKS.length+' Aufgaben notiert · kein Test, keine Note</span>'; }
  else { statusbar.innerHTML='<span class="muted">Dein Mathe-Check wartet auf dich – kein Test, keine Note.</span>'; }
}

function confetti(){
  const c=document.createElement("canvas"); c.id="cf";
  c.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:50";
  document.body.appendChild(c);
  const x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#0E6E45","#FF5E3A","#D8431E","#DEF3E6","#FBE3DA"];
  const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height/2,v:2+Math.random()*3,r:3+Math.random()*4,col:cols[Math.floor(Math.random()*cols.length)],w:Math.random()*2-1}));
  let t=0; (function fall(){ t++; x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{ p.y+=p.v; p.x+=p.w; x.fillStyle=p.col; x.fillRect(p.x,p.y,p.r,p.r*1.6); });
    if(t<160) requestAnimationFrame(fall); else c.remove(); })();
}

/* ---------- Rechenfläche v1 ---------- */
function mountScratch(container, nr){
  const wrap=document.createElement("div"); wrap.className="scratch";
  const head=document.createElement("div"); head.className="row"; head.style.justifyContent="space-between";
  head.innerHTML='<span class="muted" style="font-size:.9rem">Rechenfläche – Stift, Finger oder Maus</span>';
  const clear=document.createElement("button"); clear.className="btn ghost small"; clear.textContent="Leeren";
  head.appendChild(clear); wrap.appendChild(head);
  const cv=document.createElement("canvas"); wrap.appendChild(cv); container.appendChild(wrap);
  const ctx=cv.getContext("2d");
  function strokes(){ return S.strokes[nr]||(S.strokes[nr]=[]); }
  function redraw(){
    ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);
    strokes().forEach(st=>{ if(st.length<2)return; ctx.beginPath(); ctx.moveTo(st[0],st[1]);
      for(let i=2;i<st.length;i+=2) ctx.lineTo(st[i],st[i+1]); ctx.stroke(); });
  }
  function resize(){
    const w=cv.clientWidth, h=cv.clientHeight;
    cv.width=w*devicePixelRatio; cv.height=h*devicePixelRatio;
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    ctx.lineWidth=2; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#173B2E";
    redraw();
  }
  let cur=null;
  cv.addEventListener("pointerdown",e=>{ cv.setPointerCapture(e.pointerId); const r=cv.getBoundingClientRect();
    cur=[Math.round(e.clientX-r.left),Math.round(e.clientY-r.top)]; strokes().push(cur); });
  cv.addEventListener("pointermove",e=>{ if(!cur)return; const r=cv.getBoundingClientRect();
    cur.push(Math.round(e.clientX-r.left),Math.round(e.clientY-r.top)); redraw(); });
  const up=()=>{ if(cur){ cur=null; save(); } };
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
  clear.addEventListener("click",()=>{ S.strokes[nr]=[]; save(); redraw(); });
  requestAnimationFrame(resize);
}

function histSnap(){ return {screen:S?S.screen:null, idx:S?S.idx:0, curDay:S?S.curDay:null,
  ustep:(S&&S.unit)?S.unit.step:null, midx:(S&&S.unit)?(S.unit.mixIdx||0):null, tag:(S&&S.unit)?S.unit.tag:null}; }
function pushHist(){ if(HIST_APPLY||!PID||!S) return; try{ history.pushState({mb:histSnap()},""); }catch(e){} }
window.addEventListener("popstate",e=>{
  const st=e.state&&e.state.mb; if(!st||!st.screen||!PID) return;

const GREEK={alpha:"α",alfa:"α",beta:"β",gamma:"γ",delta:"δ",epsilon:"ε",lambda:"λ",my:"μ",mu:"μ",phi:"φ"};
function normTxt(t){ return String(t).toLowerCase().replace(/−/g,"-").replace(/\s+/g," ").replace(/[.!?]\s*$/,"").trim(); }

  return String(t).toLowerCase().replace(/−/g,"-").replace(/\s+/g,"")
    .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>"^"+[...m].map(c=>"⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c)).join(""))

function unitSteps(skill, abMittel, minuten, blockIdx){
  const c=CONTENT[skill]; if(!c||!c.kerne||!c.kerne.length) return null;
  const kern=c.kerne[Math.min(blockIdx||0, c.kerne.length-1)];
  const hatStufen=kern.ueben.some(u=>u.stufe);
  const leicht=kern.ueben.filter(u=>u.stufe==="leicht"), mittel=kern.ueben.filter(u=>u.stufe!=="leicht");
  let kernTasks;
  if(!hatStufen) kernTasks=kern.ueben.slice(0,5);
  else kernTasks = abMittel ? mittel.slice(0,5) : leicht.slice(0,2).concat(mittel.slice(0,3));
  const steps=[{typ:"verstehen",kern},{typ:"fallen",kern}];
  kernTasks.forEach(u=>steps.push({typ:"aufgabe",u}));
  if(minuten>=20) steps.push({typ:"mix"});
  else steps.push({typ:"mix", limit:2}); // Mini-Mix bei 15 Min. (Entscheidung Annette 09.08.2026): täglich wiederholen gilt in JEDER Konstellation
  if(minuten>=30){
    const extra = c.uplus.length ? c.uplus.slice(0,4) : (abMittel?mittel.slice(5,8):mittel.slice(3,6));
    extra.forEach(u=>steps.push({typ:"aufgabe",u,extra:true}));
  }
  if(minuten>=45 && (blockIdx||0)===c.kerne.length-1)
    c.transfer.slice(0,2).forEach(t=>steps.push({typ:"aufgabe",u:{stufe:"Transfer",aufgabe:t.aufgabe,loesung:t.loesung,hinweis:t.hinweis},extra:true}));

function mixAnweisung(a, l){

function mixPool(exceptSkill){
  const diag=effectiveDiag(); const pool=[];
  for(const sk of SKILLS){
    if(sk.id===exceptSkill||!CONTENT[sk.id]) continue;
    const learned=Object.keys(S.daysDone).length>0; // vereinfachte v1: gelernte + sitzende F-Themen
    if(diag[sk.id]==="sitzt"||learned) CONTENT[sk.id].wpool.forEach(w=>pool.push({skill:sk.id,...w}));
  }
  // stabil mischen (Seed: Tag + Anzahl bereits gemeisterter Mix-Aufgaben), dann:
  // Aufgaben, die schon einmal richtig gelöst wurden, kommen NICHT erneut dran,
  // solange es noch ungespielte Alternativen gibt (Beta-Feedback 29.07.).
  const dayN=typeof S.curDay==="number"?S.curDay:97;
  const seed=dayN*7919+Object.keys(S.mixDone||{}).length*104651+7;
  const idx=pool.map((_,i)=>i).sort((a,b)=>(((a+1)*seed)%104729)-(((b+1)*seed)%104729));
  const fresh=[], done=[];
  for(const i of idx) ((S.mixDone||{})[mixKey(pool[i])]?done:fresh).push(pool[i]);

  return (fresh.length?fresh:done).slice(0,4);
}

  const items=S.unit.mixItems;
  const i=S.unit.mixIdx||0;
  if(!items.length){ main.innerHTML='<div class="card">'+kopf+'<div class="info">Noch nichts zum Mischen – lerne erst ein paar Themen, dann füllt sich dein Mix.</div><button class="btn block" id="backPlan">Zurück zum Lernplan</button></div>'; return $("backPlan").addEventListener("click",()=>show("plan")); }
  if(i>=items.length){ return renderDayDone(day); }
  renderMixBlock(kopf, {id:null});
}
function renderDayDone(day){
  if(typeof day.tag==="number") S.daysDone[day.tag]=true;
  S.unit=null; save(); confetti();
  const q=S.unit&&S.unit.gesamt?(" "+S.unit.richtig+" von "+S.unit.gesamt+" Aufgaben direkt richtig."):"";
  main.innerHTML='<div class="card"><div class="banner"><strong>Für heute geschafft!</strong>'+esc(q)+' Du hast bewiesen: Du bleibst dran. Mega.</div>'+
    '<button class="btn block" id="nxDay">Weitermachen – nächster Baustein</button>'+
    '<button class="btn ghost block" id="backPlan">Zurück zum Lernplan</button></div>';
  $("nxDay").addEventListener("click",()=>{ const p=buildPlan(effectiveDiag(),S.config); const nx=nextOpenDay(p); if(nx>0){ S.curDay=nx; S.unit=null; show("day"); } else show("planDone"); });
  $("backPlan").addEventListener("click",()=>show("plan"));
}

function renderPlanDone(){
  const diag=effectiveDiag();
  const plan=buildPlan(diag,S.config);
  const gelernt=plan.days.filter(d=>typeof d.tag==="number"&&d.id!=="MIX"&&d.id!=="CHECK"&&S.daysDone[d.tag]).length;
  const sitzt=SKILLS.filter(s=>diag[s.id]==="sitzt").length;
  // schneller als geplant? Kalendertage seit Start vs. geplante Laufzeit
  let schnell=false;
  if(S.startedAt){ const tage=Math.ceil((Date.now()-new Date(S.startedAt).getTime())/86400000);
    schnell = tage < S.config.wochen*7; }
  main.innerHTML='<div class="card">'+
    '<div class="banner"><strong><em>'+esc(schnell?TXT.planFertigSchnell:TXT.planFertig)+'</em></strong></div>'+
    '<p><strong>'+gelernt+' Themen neu dazugeholt</strong> – zusätzlich zu den '+sitzt+' Themen, die bei deinem Check schon saßen. Dein Abschlusscheck kommt mit einem der nächsten Updates – dann siehst du deinen Vorher-nachher-Sprung schwarz auf grün.</p>'+
    '<p>'+esc(TXT.planFertigWeiter)+'</p>'+
    (plan.rest.length?'<div class="info"><strong>Du hast noch Luft?</strong> Diese Themen warten darauf, in deinen Plan zu rücken: '+esc(plan.rest.map(r=>r.titel).join(" · "))+'</div>'+
      ((S.config.wochen<3||S.config.tage<7)?'<button class="btn block" id="mehrBtn">Nächste Themen in den Plan holen</button>':'<p class="muted" style="font-size:.9rem">Dein Plan ist schon auf Maximum – die Themen erreichst du direkt über den Lernplan, sobald du Tage frei machst, oder einfach über „Plan anpassen“.</p>'):"")+
    '<button class="btn'+(plan.rest.length?' ghost':'')+' block" id="mixBtn">Wiederholmix starten</button>'+
    '<button class="btn ghost block" id="planBtn2">Zum Lernplan</button>'+
  '</div>';
  confetti();
  if($("mehrBtn")) $("mehrBtn").addEventListener("click",()=>{
    if(S.config.wochen<3) S.config.wochen++;
    else if(S.config.tage<7) S.config.tage++;
    save(); notiert("Dein Plan ist gewachsen!"); show("plan");
  });
  $("mixBtn").addEventListener("click",()=>{ S.curDay="extramix"; S.unit=null; show("day"); });
  $("planBtn2").addEventListener("click",()=>show("plan"));
}

function renderFortschritt(){
  const n=answered();
  const diag=S.done?diagnose(S.answers,S.hwnn):null;
  const sitzt=diag?Object.values(diag).filter(s=>s==="sitzt").length:0;
  main.innerHTML='<div class="card">'+
    '<strong>Dein Fortschritt</strong>'+
    '<div class="bar koralle"><div style="width:'+Math.round(100*n/TASKS.length)+'%"></div></div>'+
    '<p>'+(S.done?'Mathe-Check geschafft – '+sitzt+' von '+SKILLS.length+' Themen sitzen schon. '+(S.planCreated?'Dein Plan steht.':'Als Nächstes: Lernplan erstellen.'):'Mathe-Check: '+n+' von '+TASKS.length+' Aufgaben notiert.')+'</p>'+
    '<button class="btn block" id="goBtn">'+(S.done?(S.planCreated?'Zum Lernplan':'Lernplan erstellen'):'Weitermachen')+'</button>'+
  '</div>'+
  '<div class="card">'+
    '<strong>Sicherung</strong>'+
    '<p class="muted" style="font-size:.9rem;margin-top:8px">💾 <strong>Wozu Sicherung?</strong> Dein Lernstand ist nur auf diesem Gerät gespeichert. „Sicherung exportieren“ legt davon eine kleine Datei an – sinnvoll z. B. vor einem Handy-Wechsel oder bevor jemand den Browser „aufräumt“. Mit „Sicherung laden“ holst du deinen Stand aus dieser Datei zurück.</p>'+
    '<div class="row" style="margin-top:12px"><button class="btn ghost" id="expBtn">Sicherung exportieren</button>'+
    '<button class="btn ghost" id="impBtn">Sicherung laden</button></div>'+
    '<input type="file" id="impFile" accept="application/json,.json" style="display:none">'+
  '</div>';
  $("goBtn").addEventListener("click",()=>{ if(!S.done){ show("start"); } else show(S.planCreated?"plan":"anpassen"); });
  $("expBtn").addEventListener("click",exportBackup);
  $("impBtn").addEventListener("click",()=>$("impFile").click());
  $("impFile").addEventListener("change",importBackup);
}
function exportBackup(){
  const nm=(profiles().find(p=>p.id===PID)||{}).name||"profil";
  const d=new Date().toISOString().slice(0,10);
  const blob=new Blob([JSON.stringify({app:"mathe-booster",pid:PID,name:nm,date:d,version:APP_VERSION,state:S})],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="mathe-booster-sicherung-"+nm.toLowerCase().replace(/[^a-z0-9äöüß]+/gi,"-")+"-"+d+".json"; a.click();
  setTimeout(()=>alert("Deine Sicherung wurde als Datei\n„"+a.download+"“\nin deinen Downloads gespeichert. Bewahre sie gut auf – mit „Sicherung laden“ kannst du deinen Lernstand jederzeit wiederherstellen."),150);
}
function importBackup(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const o=JSON.parse(r.result);
    if(!o||typeof o!=="object"||o.app!=="mathe-booster"||!o.state) throw 0;
    const cur=(profiles().find(p=>p.id===PID)||{}).name||"dieses Profil";
    const when=o.date?(" vom "+new Date(o.date).toLocaleDateString("de-DE")):"";
    let msg="⚠️ Achtung: Damit wird der komplette aktuelle Lernstand von „"+cur+"“ ersetzt – durch die Sicherung"+(o.name?(" von „"+o.name+"“"):"")+when+".\n\nAlles, was du seit dieser Sicherung gelernt hast, geht verloren.\n\nSicherung wirklich laden?";
    if(o.name&&o.name!==cur) msg="Diese Sicherung stammt von einem anderen Profil („"+o.name+"“). Du bist gerade als „"+cur+"“ angemeldet.\n\n"+msg;
    e.target.value="";
    if(!confirm(msg)) return;
    S=o.state; save(); initS(); // initS lädt aus dem Speicher nach und ergänzt fehlende Felder
    alert("Sicherung geladen – dein Lernstand ist wiederhergestellt.");
    render();
  }catch(err){ e.target.value=""; alert("Das ist leider keine gültige Sicherungs-Datei des Mathe-Boosters."); } };
  r.readAsText(f);
}

function renderInfo(){
  const li=t=>'<p style="margin:6px 0 0;padding-left:1.1em;text-indent:-1.1em">• '+t+'</p>';
  main.innerHTML=
  '<div class="card">'+
    '<strong style="font-size:1.1rem">So funktioniert dein Booster</strong>'+
    '<p style="margin-top:10px"><strong>1. Check:</strong> Zuerst kommt dein Mathe-Check – kein Test, keine Note. Er zeigt, was du schon kannst und wo du noch Übungsbedarf hast.</p>'+
    '<p><strong>2. Plan:</strong> Was du kannst, überspringst du. Für den Rest bekommst du deinen eigenen Lernplan.</p>'+
    '<p><strong>3. Üben:</strong> Jeder Lerntag hat ein Thema, das kurz erklärt wird, dann übst du. Am Ende eines Lerntags wiederholst du.</p>'+
  '</div>'+
  '<div class="card">'+
    '<strong>Dein Plan, deine Regeln</strong>'+
    '<p style="margin-top:10px"><strong>1.</strong> <strong>Wochen und Tage</strong> bestimmen, wie viele Themen du machst. Passen nicht alle Themen in deinen Lernplan? Kein Problem. Die übrigen Themen kommen automatisch später dran, sobald wieder Platz ist.</p>'+
    '<p><strong>2.</strong> <strong>Du entscheidest, wie lange du übst:</strong> Die von dir gewählte Zeit pro Tag bestimmt, wie ausführlich du ein Thema übst. Sie bestimmt nicht, wie viele Themen du bekommst.</p>'+
    '<p><strong>3.</strong> Ändern kannst du alles jederzeit unter <strong>„Anpassen“</strong> – dein Fortschritt bleibt.</p>'+
    '<p><strong>4.</strong> Lust auf mehr? Einfach mit dem nächsten Baustein im Lernplan weitermachen. Pause gemacht? Kein Problem – du machst genau da weiter, wo du aufgehört hast.</p>'+
  '</div>'+
  '<div class="card">'+
    '<strong>Damit nichts verloren geht</strong>'+
    '<p style="margin-top:10px"><strong>Wichtig: Immer die neueste Version nutzen.</strong> Öffne die App dafür immer neu über deinen Link oder dein Lesezeichen. Dein Fortschritt bleibt dabei erhalten.</p>'+
    '<p><strong>Wichtig ist nur:</strong> Lösche nicht die Browserdaten bzw. die Websitedaten. Dort wird dein Fortschritt gespeichert. Ansonsten musst du von vorne beginnen.</p>'+
    '<p><strong>Übt ihr auf mehreren Geräten?</strong><br>Dein Lernstand liegt nur auf dem Gerät, auf dem du gerade übst – er wandert nicht automatisch mit.</p>'+
    '<p>Dann gilt eine einfache Regel: immer auf dem zuletzt genutzten Gerät unter <strong>„Fortschritt“</strong> eine Sicherung exportieren und sie auf dem nächsten Gerät wieder laden.</p>'+
    '<p>So machst du genau dort weiter, wo du aufgehört hast.</p>'+
    '<p><strong>Und bitte denk daran:</strong><br>Wenn jemand die Browserdaten löscht, ist der Lernstand weg – leg dir deshalb ab und zu eine Sicherung an.</p>'+
    '<p class="muted" style="font-size:.9rem;margin-top:12px">Beta-Version für Testfamilien · Fehler gefunden oder etwas unklar? Sag uns einfach Bescheid – genau dafür ist die Testphase da.</p>'+
    '<p class="muted" style="font-size:.85rem">Version: '+esc(APP_VERSION)+'</p>'+
    '<button class="btn block" id="homeBtn">Zur Startseite</button>'+
  '</div>';
  $("homeBtn").addEventListener("click",()=>show("start"));
}

/* iPhone-Fix (Beta-Feedback Sophie): Solange ein Eingabefeld den Fokus hat, scrollt iOS die Seite
   beim Runterscrollen immer wieder zum Feld zurück ("hochgesprungen"). Deshalb: Beim ersten Tippen
   außerhalb des Feldes den Fokus lösen – die Tastatur klappt zu, Scrollen und Buttons funktionieren normal. */
document.addEventListener("touchstart",e=>{
  const a=document.activeElement;
  if(a&&a.tagName==="INPUT"&&e.target!==a) a.blur();
},{passive:true});

/* ---------- Navigation ---------- */
$("navStart").addEventListener("click",()=>show("start"));
$("navInfo").addEventListener("click",()=>show("info"));
$("brand").addEventListener("click",()=>show("info"));
$("navProgress").addEventListener("click",()=>show("fortschritt"));
$("navAdjust").addEventListener("click",()=>{ if(S.done) show("anpassen"); else notiert("Erst dein Mathe-Check – dann dein Plan!"); });
$("navProfile").addEventListener("click",()=>{ PROF_VIEW=true; render(); window.scrollTo(0,0); });

render();
try{ history.replaceState({mb:S?histSnap():null},""); }catch(e){}
</script>
