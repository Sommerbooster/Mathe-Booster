Nimmst du beide mal (−1), wird daraus −3 und −5 – und jetzt ist −3 GRÖSSER als −5. Das Ergebnis einer Ungleichung ist übrigens keine einzelne Zahl, sondern ein ganzer Bereich: x < 5 heißt „jede Zahl kleiner als 5 passt“."], "fallen": [{"falle": "Nur eine Seite verändert", "falsch": "4x − 7 = 13 → 4x = 13", "richtig": "4x = 20", "warum": "+7 muss auf BEIDEN Seiten passieren"}, {"falle": "Vorzeichen beim Seitenwechsel", "falsch": "5x = 2x + 9 → 3x = 9 ✓, aber 5x − 3 = 9 → 5x = 6", "richtig": "5x = 12", "warum": "−3 wandert als +3 auf die andere Seite"}, {"falle": "Beim Teilen durch eine negative Zahl das Zeichen stehen lassen", "falsch": "−2x > 8 → x > −4", "richtig": "−2x > 8 → x < −4", "warum": "Mal oder geteilt durch eine negative Zahl dreht das Ungleichheitszeichen immer um"}], "ueben": [{"stufe": "leicht", "loesung": "x = 7", "hinweis": "Auf beiden Seiten − 5 rechnen – die Gleichung bleibt im Gleichgewicht.", "aufgabe": "x + 5 = 12", "schritte": [{"g": "x + 5 = 12", "op": "| − 5"}, {"g": "x = 12 − 5"}, {"g": "x = 7"}, {"g": "Probe: 7 + 5 = 12 ✓"}]}, {"stufe": "leicht", "loesung": "x = 7", "hinweis": "Auf beiden Seiten durch 3 teilen.", "aufgabe": "3x = 21", "schritte": [{"g": "3x = 21", "op": "| : 3"}, {"g": "x = 21 : 3"}, {"g": "x = 7"}, {"g": "Probe: 3 · 7 = 21 ✓"}]}, {"stufe": "leicht", "loesung": "x = 3", "hinweis": "Auf beiden Seiten + 4 rechnen.", "aufgabe": "x − 4 = −1", "schritte": [{"g": "x − 4 = −1", "op": "| + 4"}, {"g": "x = −1 + 4"}, {"g": "x = 3"}, {"g": "Probe: 3 − 4 = −1 ✓"}]}, {"stufe": "mittel", "aufgabe": "Löse die Ungleichung: 3x + 4 < 19", "schritte": [{"g": "Eine Ungleichung löst du wie eine Gleichung – auf beiden Seiten dasselbe tun"}, {"g": "3x + 4 < 19", "op": "| − 4"}, {"g": "3x < 15", "op": "| : 3"}, {"g": "Geteilt wird durch +3 – eine positive Zahl, das Zeichen bleibt also stehen"}, {"g": "Ergebnis: x < 5 (jede Zahl kleiner als 5 ist eine Lösung)"}], "loesung": "x < 5", "hinweis": "Rechne wie bei einer Gleichung – hier bleibt das Zeichen stehen."}, {"stufe": "mittel", "loesung": "x = 7", "hinweis": "erst Klammer auflösen, dann x auf eine Seite", "aufgabe": "3 · (x − 2) = x + 8", "schritte": [{"g": "3 · (x − 2) = x + 8", "op": "Klammer auflösen"}, {"g": "3x − 6 = x + 8", "op": "| − x"}, {"g": "2x − 6 = 8", "op": "| + 6"}, {"g": "2x = 14", "op": "| : 2"}, {"g": "x = 7"}, {"g": "Probe: 3 · 5 = 15 und 7 + 8 = 15 ✓"}]}, {"stufe": "mittel", "loesung": "x = 4", "hinweis": "Bring die x auf eine Seite → − 2x auf beiden Seiten, dann + 3.", "aufgabe": "5x − 3 = 2x + 9", "schritte": [{"g": "5x − 3 = 2x + 9", "op": "| − 2x"}, {"g": "3x − 3 = 9", "op": "| + 3"}, {"g": "3x = 12", "op": "| : 3"}, {"g": "x = 4"}, {"g": "Probe: 20 − 3 = 17 und 8 + 9 = 17 ✓"}]}, {"stufe": "mittel", "loesung": "x = 3", "hinweis": "Negativer Koeffizient – die Zahl vor dem x ist hier −2. Am Ende durch −2 teilen (Minus nicht vergessen!).", "aufgabe": "7 − 2x = 1", "schritte": [{"g": "7 − 2x = 1", "op": "| − 7"}, {"g": "−2x = −6", "op": "| : (−2)"}, {"g": "x = 3"}, {"g": "Probe: 7 − 6 = 1 ✓"}]}, {"stufe": "mittel", "loesung": "x = 3", "hinweis": "Klammer + Seitenwechsel", "aufgabe": "4 · (x + 1) = 2x + 10", "schritte": [{"g": "4 · (x + 1) = 2x + 10", "op": "Klammer auflösen"}, {"g": "4x + 4 = 2x + 10", "op": "| − 2x"}, {"g": "2x + 4 = 10", "op": "| − 4"}, {"g": "2x = 6", "op": "| : 2"}, {"g": "x = 3"}, {"g": "Probe: 16 = 16 ✓"}]}, {"aufgabe": "Löse die Gleichung: 3(5x − 3) − 6(4 − 4x) = 9(x − 2)", "loesung": "x = 0,5", "hinweis": "Erst alle Klammern auflösen, dann beide Seiten zusammenfassen.", "schritte": [{"g": "3(5x − 3) = 15x − 9 und 6(4 − 4x) = 24 − 24x", "op": "ausmultiplizieren"}, {"g": "15x − 9 − 24 + 24x = 9x − 18", "op": "Minus vor der Klammer beachten"}, {"g": "39x − 33 = 9x − 18", "op": "zusammenfassen"}, {"g": "30x = 15  | : 30", "op": "−9x und +33 auf beiden Seiten"}, {"g": "Ergebnis: x = 0,5 · Probe: 3(2,5−3) − 6(4−2) = −1,5 − 12 = −13,5 = 9(0,5−2) ✓"}], "quelle": "KA 3. Schulaufgabe (Klasse 7, 04/2017), Aufg. 1 – 1:1; Lösung aus dem KA-Dossier ✓", "stufe": "schwer"}, {"aufgabe": "Löse die Gleichung: 6(2x − 14) − 4(2 − 3x) = 5(x − 7)", "loesung": "x = 3", "hinweis": "Klammern auflösen – achte auf das Minus vor der zweiten Klammer.", "schritte": [{"g": "6(2x − 14) = 12x − 84 und 4(2 − 3x) = 8 − 12x", "op": "ausmultiplizieren"}, {"g": "12x − 84 − 8 + 12x = 5x − 35", "op": "Minus vor der Klammer beachten"}, {"g": "24x − 92 = 5x − 35", "op": "zusammenfassen"}, {"g": "19x = 57  | : 19"}, {"g": "Ergebnis: x = 3 · Probe: 6·(−8) − 4·(−7) = −48 + 28 = −20 = 5·(−4) ✓"}], "quelle": "KA 4. Schulaufgabe (Klasse 7, 06/2017), Aufg. 1a – 1:1; Lösung aus dem KA-Dossier ✓", "stufe": "schwer"}]}], "uplus": [{"aufgabe": "Fünf Personen bestellen je einen Eisbecher, zwei davon mit Sahne (Aufpreis 0,70 € je Becher). Zusammen zahlen sie 27,90 €. Was kostet ein Becher ohne Sahne?", "schritte": [{"g": "x ist der Preis eines Bechers ohne Sahne"}, {"g": "Fünf Becher kosten 5x, dazu zweimal 0,70 € Aufpreis"}, {"g": "Gleichung: 5x + 2 · 0,70 = 27,90"}, {"g": "5x + 1,40 = 27,90  | − 1,40"}, {"g": "5x = 26,50  | : 5"}, {"g": "Ergebnis: 5,30 €"}], "loesung": "5,30 €", "hinweis": "Setze x für den gesuchten Preis und schreibe zuerst die Gleichung auf.", "quelle": "Klassenarbeit 04/2017 (3. Schulaufgabe), Aufg. 2 · Lösung der Arbeit ✓"}, {"aufgabe": "Bei einem Rechteck ist eine Seite 3 cm länger als die andere. Verlängert man beide Seiten um 1 cm, wächst die Fläche um 22 cm². Wie lang sind die ursprünglichen Seiten?", "schritte": [{"g": "x ist die kürzere Seite, die längere ist x + 3"}, {"g": "Neue Seiten: x + 1 und x + 4"}, {"g": "Gleichung: (x + 1)(x + 4) = x(x + 3) + 22"}, {"g": "Links ausmultiplizieren: x² + 5x + 4"}, {"g": "Rechts: x² + 3x + 22  | − x², − 3x, − 4"}, {"g": "2x = 18  | : 2  →  x = 9"}, {"g": "Ergebnis: 9 cm und 12 cm"}], "loesung": "9 cm und 12 cm", "hinweis": "Beide Flächen als Term aufschreiben und gleichsetzen – x² fällt weg.", "quelle": "Klassenarbeit 04/2017 (3. Schulaufgabe), Aufg. 3 · Lösung der Arbeit ✓"}, {"stufe": "", "loesung": "−21", "hinweis": "links → 2 · 8 − 12 = 4; rechts → 25 + c = 4 → c = −21", "aufgabe": "Ergänze rechts, sodass x = 5 Lösung ist: 2(x + 3) − 12 = 5x ▢", "schritte": [{"g": "x = 5 links einsetzen: 2 · (5 + 3) − 12", "op": "= 16 − 12 = 4"}, {"g": "rechte Seite: 5 · 5 + c = 25 + c"}, {"g": "25 + c = 4", "op": "| − 25"}, {"g": "c = −21"}]}, {"stufe": "", "loesung": "x = 6", "hinweis": "Klammer auflösen (6x − 2 = 5x + 4), dann 5x abziehen und 2 addieren → x = 6.", "aufgabe": "2 · (3x − 1) = 5x + 4", "schritte": [{"g": "2 · (3x − 1) = 5x + 4", "op": "Klammer auflösen"}, {"g": "6x − 2 = 5x + 4", "op": "| − 5x"}, {"g": "x − 2 = 4", "op": "| + 2"}, {"g": "x = 6"}, {"g": "Probe: 34 = 34 ✓"}]}, {"stufe": "", "loesung": "x = −1", "hinweis": "Beide Klammern auflösen → 4x + 4 = −9x − 9. Dann alle x nach links → 13x = −13.", "aufgabe": "2(2x + 2) = 3(−3x − 3)", "schritte": [{"g": "2(2x + 2) = 3(−3x − 3)", "op": "Klammern auflösen"}, {"g": "4x + 4 = −9x − 9", "op": "| + 9x"}, {"g": "13x + 4 = −9", "op": "| − 4"}, {"g": "13x = −13", "op": "| : 13"}, {"g": "x = −1"}, {"g": "Probe: 0 = 0 ✓"}]}, {"stufe": "", "loesung": "x = 1", "hinweis": "Links und rechts erst vereinfachen → 7x − 4 = −x + 4. Dann x sammeln → 8x = 8.", "aufgabe": "−4(−2x + 1) − x = −(x − 2) − (x − 1) + x + 1", "schritte": [{"g": "linke Seite: 8x − 4 − x", "op": "= 7x − 4"}, {"g": "rechte Seite: −x + 2 − x + 1 + x + 1", "op": "= −x + 4"}, {"g": "7x − 4 = −x + 4", "op": "| + x"}, {"g": "8x − 4 = 4", "op": "| + 4"}, {"g": "8x = 8", "op": "| : 8"}, {"g": "x = 1"}]}, {"stufe": "", "loesung": "wahr für alle x (allgemeingültig)", "hinweis": "Nach dem Auflösen sind beide Seiten identisch → 12x − 16 = 12x − 16 → 0 = 0. Eine wahre Aussage ohne x heißt: JEDE Zahl ist Lösung.", "aufgabe": "Beschreibe den Sonderfall: 2(6x − 8) = −4(−3x + 4)", "schritte": [{"g": "linke Seite: 2(6x − 8) = 12x − 16"}, {"g": "rechte Seite: −4(−3x + 4) = 12x − 16"}, {"g": "12x − 16 = 12x − 16", "op": "| − 12x"}, {"g": "−16 = −16 → 0 = 0"}, {"g": "Wahre Aussage ohne x → JEDE Zahl ist Lösung (allgemeingültig)"}, {"g": "Antwort: wahr für alle x (allgemeingültig)"}]}, {"stufe": "", "aufgabe": "Löse die Ungleichung: −2x > 8", "schritte": [{"g": "Du musst durch −2 teilen – hier greift die Sonderregel", "op": "| : (−2)"}, {"g": "Geteilt durch eine NEGATIVE Zahl: das Zeichen dreht sich um, aus > wird <"}, {"g": "x < −4"}, {"g": "Probe mit x = −5: −2 · (−5) = 10 – und 10 ist größer als 8 ✓"}, {"g": "Ergebnis: x < −4"}], "loesung": "x < −4", "hinweis": "Achtung: Du teilst durch eine negative Zahl."}, {"stufe": "", "aufgabe": "Löse die Ungleichung: 5x − 7 > 2x + 5", "schritte": [{"g": "Erst alle x-Glieder auf eine Seite bringen", "op": "| − 2x"}, {"g": "3x − 7 > 5", "op": "| + 7"}, {"g": "3x > 12", "op": "| : 3"}, {"g": "Geteilt durch +3 – das Zeichen bleibt"}, {"g": "Ergebnis: x > 4"}], "loesung": "x > 4", "hinweis": "Sammle zuerst die x-Glieder auf einer Seite."}], "transfer": [{"aufgabe": "Fünf Freunde kaufen Eisbecher. Zwei nehmen Sahne (je 0,70 € Aufpreis), zusammen zahlen sie 27,90 €. Berechne mit x-Ansatz den Preis eines Bechers ohne Sahne.", "schritte": [{"g": "Ansatz: 5x + 2 · 0,70 = 27,90"}, {"g": "5x + 1,40 = 27,90", "op": "| − 1,40"}, {"g": "5x = 26,50", "op": "| : 5"}, {"g": "x = 5,30 → ein Becher kostet 5,30 €"}], "loesung": "5,30 €", "hinweis": "Gleichung aufstellen → 5 Becher plus 2 Sahne-Aufpreise = Gesamtpreis. 5x + 2 · 0,70 = 27,90 → 5x = 26,50 → x = 5,30."}, {"aufgabe": "Eine Rechteckseite ist 3 cm länger als die andere. Verlängert man beide um 1 cm, wächst die Fläche um 22 cm². Berechne die ursprünglichen Seiten mit x-Ansatz.", "schritte": [{"g": "Ansatz: (x + 1)(x + 4) = x(x + 3) + 22"}, {"g": "x² + 5x + 4 = x² + 3x + 22", "op": "| − x²"}, {"g": "5x + 4 = 3x + 22", "op": "| − 3x"}, {"g": "2x + 4 = 22", "op": "| − 4"}, {"g": "2x = 18", "op": "| : 2"}, {"g": "x = 9 → Seiten 9 cm und 12 cm"}], "loesung": "9 cm und 12 cm", "hinweis": "Seiten x und x + 3 ansetzen; neue Fläche = alte Fläche + 22: (x + 1)(x + 4) = x(x + 3) + 22 → 2x = 18 → x = 9."}, {"aufgabe": "Im Dreieck ist β doppelt so groß wie α, und α ist 40° kleiner als γ. Stelle eine Gleichung auf und berechne alle Winkel.", "schritte": [{"g": "Ansatz: α + β + γ = 180° mit β = 2α und γ = α + 40°"}, {"g": "α + 2α + α + 40° = 180°", "op": "zusammenfassen"}, {"g": "4α + 40° = 180°", "op": "| − 40°"}, {"g": "4α = 140°", "op": "| : 4"}, {"g": "α = 35° → β = 2 · 35° = 70°, γ = 35° + 40° = 75°"}, {"g": "Probe: 35° + 70° + 75° = 180° ✓"}, {"g": "Ergebnis: 35°, 70°, 75°"}], "loesung": "35°, 70°, 75°", "hinweis": "α + 2α + (α + 40°) = 180° → 4α = 140° → α = 35°"}], "wpool": [{"aufgabe": "x + 9 = 4", "schritte": [{"g": "x + 9 = 4", "op": "| − 9"}, {"g": "x = 4 − 9"}, {"g": "x = −5"}, {"g": "Probe: −5 + 9 = 4 ✓"}], "loesung": "x = −5", "stufe": "mittel"}, {"aufgabe": "5x = −20", "schritte": [{"g": "5x = −20", "op": "| : 5"}, {"g": "x = −4"}, {"g": "Probe: 5 · (−4) = −20 ✓"}], "loesung": "x = −4", "stufe": "mittel"}, {"aufgabe": "2x − 3 = 7", "schritte": [{"g": "2x − 3 = 7", "op": "| + 3"}, {"g": "2x = 10", "op": "| : 2"}, {"g": "x = 5"}, {"g": "Probe: 10 − 3 = 7 ✓"}], "loesung": "x = 5", "stufe": "mittel"}, {"aufgabe": "x : 2 = −3", "schritte": [{"g": "x : 2 = −3", "op": "| · 2"}, {"g": "x = −3 · 2"}, {"g": "x = −6"}, {"g": "Probe: −6 : 2 = −3 ✓"}], "loesung": "x = −6", "stufe": "mittel"}, {"aufgabe": "Löse die Ungleichung: x + 6 < 10", "schritte": [{"g": "Wie bei einer Gleichung die 6 wegschaffen", "op": "| − 6"}, {"g": "Es wird nur subtrahiert – das Zeichen bleibt stehen"}, {"g": "Ergebnis: x < 4"}], "loesung": "x < 4", "stufe": "mittel"}, {"stufe": "mittel", "aufgabe": "Löse die Gleichung: 4(x − 2) = 2x + 6", "loesung": "x = 7", "quelle": "analog Buch S. 95, Aufg. 20 (Gleichung mit Klammer)", "schritte": [{"g": "Klammer auflösen: 4x − 8 = 2x + 6"}, {"g": "| − 2x und + 8 → 2x = 14"}, {"g": "| : 2 → x = 7 · Probe: 4 · 5 = 20 = 2 · 7 + 6 ✓"}]}, {"stufe": "mittel", "aufgabe": "Löse die Ungleichung: 2x − 5 > 7", "loesung": "x > 6", "quelle": "analog Buch S. 101, Aufg. 39 (Ungleichung lösen)", "schritte": [{"g": "Beide Seiten + 5", "op": "| + 5"}, {"g": "2x > 12"}, {"g": "Beide Seiten : 2 – positive Zahl, das Zeichen bleibt", "op": "| : 2"}, {"g": "Ergebnis: x > 6"}]}], "titel": "Gleichungen lösen – Schritt für Schritt", "test": [{"stufe": "mittel", "aufgabe": "Löse die Gleichung: −4 · (−2x + 1) − x = −(x − 2) − (x − 1) + x + 1", "schritte": [{"g": "8x − 4 − x = −x + 2 − x + 1 + x + 1", "op": "Klammern auflösen"}, {"g": "7x − 4 = −x + 4"}, {"g": "8x = 8", "op": "+x, +4"}, {"g": "x = 1"}], "loesung": "x = 1", "hinweis": "Erst alle Klammern auflösen, dann beide Seiten zusammenfassen.", "quelle": "Test Kap. 5, Aufg. 2c · Lösung S. 185 ✓"}, {"stufe": "schwer", "aufgabe": "Löse die Ungleichung: 5 ≤ −(2x − 3)", "schritte": [{"g": "5 ≤ −2x + 3", "op": "Klammer auflösen"}, {"g": "2 ≤ −2x", "op": "−3"}, {"g": "−1 ≥ x", "op": ": (−2) – Zeichen dreht sich!"}, {"g": "x ≤ −1"}], "loesung": "x ≤ −1", "hinweis": "Beim Teilen durch eine negative Zahl dreht sich das Ungleichheitszeichen um.", "quelle": "Test Kap. 5, Aufg. 6b · Lösung S. 186 ✓"}]}, "A5": {"id": "A5", "kerne": [{"name": "", "verstehen": ["Prozent heißt „von Hundert“ → 25 % sind 25 von 100, also ein Viertel. 25 % von 84 € rechnest du als 84 · 0,25 = 21 € – oder über 1 % → 84 : 100 = 0,84 mal 25. Drei Größen spielen mit: der Grundwert G (das Ganze, 84 €), der Prozentsatz p (25 %) und der Prozentwert W (der Anteil, 21 €). Merksatz → W = G · p.", "Bevor es um Preis-Änderungen geht, noch einmal die wichtigste Regel der ganzen Prozentrechnung: Das Ganze ist immer 100 %, und 100 % = 1. Deshalb kannst du jede Prozentzahl als Dezimalzahl schreiben → 20 % = 0,2, 80 % = 0,8, 15 % = 0,15.", "Preissenkung – Schritt für Schritt: Ein Preis wird um 20 % gesenkt. Frage zuerst → Wie viel Prozent BLEIBEN übrig? 100 % − 20 % = 80 %. Schreibe die 80 % als Dezimalzahl → 80 % = 0,8. Multipliziere → 0,8 · alter Preis = neuer Preis. Beispiel mit 60 € → 0,8 · 60 = 48 €. Fertig – der gesenkte Preis ist 48 €.", "Preiserhöhung geht genauso, nur mit Plus: +15 % heißt → 100 % + 15 % = 115 %. Und 115 % = 1,15. Also → 1,15 · alter Preis = neuer Preis. Beispiel mit 40 € → 1,15 · 40 = 46 €. Auch die 19 % Mehrwertsteuer sind so eine Erhöhung → 100 % + 19 % = 119 % → 119 % = 1,19 → Preis ohne Steuer · 1,19 = Preis mit Steuer.", "Und rückwärts? Wenn 32 € schon der Preis NACH 20 % Rabatt sind, dann sind die 32 € genau 80 % vom alten Preis (100 % − 20 % = 80 %). Also gilt → 0,8 · G = 32 → G = 32 : 0,8 = 40 €. Der alte Preis war 40 €."], "fallen": [{"falle": "Prozentzahl addiert", "falsch": "40 € + 15 % = 55 €", "richtig": "40 · 1,15 = 46 €", "warum": "15 % VON 40 sind 6 € – Prozent ist ein Anteil, keine Euro-Zahl"}, {"falle": "Rabatt rückwärts falsch", "falsch": "32 € + 20 % = 38,40 €", "richtig": "32 : 0,8 = 40 €", "warum": "Die 20 % beziehen sich auf den ALTEN Preis (Grundwert), nicht auf 32 €"}], "ueben": [{"stufe": "leicht", "loesung": "25 €", "hinweis": "10 % ist ein Zehntel – einfach durch 10 teilen.", "aufgabe": "10 % von 250 €", "schritte": [{"g": "10 % ist ein Zehntel", "op": "| : 10"}, {"g": "250 € : 10 = 25 €"}]}, {"stufe": "leicht", "loesung": "43 kg", "hinweis": "50 % ist die Hälfte.", "aufgabe": "50 % von 86 kg", "schritte": [{"g": "50 % ist die Hälfte", "op": "| : 2"}, {"g": "86 kg : 2 = 43 kg"}]}, {"stufe": "leicht", "loesung": "23 €", "hinweis": "25 % ist ein Viertel – durch 4 teilen.", "aufgabe": "25 % von 92 €", "schritte": [{"g": "25 % ist ein Viertel", "op": "| : 4"}, {"g": "92 € : 4 = 23 €"}]}, {"stufe": "mittel", "loesung": "46 €", "hinweis": "Plus 15 % heißt mal 1,15 – ein Schritt statt zwei.", "aufgabe": "Ein Preis von 40 € steigt um 15 %. Wie hoch ist der neue Preis?", "schritte": [{"g": "Erhöhung um 15 % → neuer Preis = 100 % + 15 % = 115 % vom alten Preis"}, {"g": "115 % = 1,15 (denn 100 % = 1)"}, {"g": "40 · 1,15 = 46", "op": "| · 1,15"}, {"g": "Neuer Preis: 46 €"}]}, {"stufe": "mittel", "loesung": "45 €", "hinweis": "Minus 25 % heißt mal 0,75 – es bleiben 75 %.", "aufgabe": "60 € werden um 25 % gesenkt. Wie hoch ist der neue Preis?", "schritte": [{"g": "Senkung um 25 % → es BLEIBEN: 100 % − 25 % = 75 %"}, {"g": "75 % = 0,75 (denn 100 % = 1)"}, {"g": "60 · 0,75 = 45", "op": "| · 0,75"}, {"g": "Neuer Preis: 45 €"}]}, {"stufe": "mittel", "loesung": "40 €", "hinweis": "Nach 20 % Rabatt sind 32 € genau 80 %.", "aufgabe": "Nach 20 % Rabatt kostet eine Jeans 32 €. Was hat sie vorher gekostet?", "schritte": [{"g": "Nach 20 % Rabatt sind 32 € genau 80 %"}, {"g": "32 : 0,8 ergibt den alten Preis."}, {"g": "Ergebnis: 40 €"}]}, {"stufe": "mittel", "loesung": "20 %", "hinweis": "Anteil bilden.", "aufgabe": "12 von 60 Schülern fahren Rad. Wie viel Prozent?", "schritte": [{"g": "Anteil bilden"}, {"g": "12 von 60 = 12/60 = 1/5 – das sind 20 %."}]}, {"aufgabe": "Ein Gast hatte ein Mittagessen für 9,40 € und ein Getränk für 2,40 €. Wie viel muss er bezahlen, wenn er 10 % Trinkgeld gibt?", "loesung": "12,98 €", "hinweis": "Erst den Rechnungsbetrag, dann 10 % davon dazu.", "schritte": [{"g": "Rechnung: 9,40 € + 2,40 € = 11,80 €", "op": "Grundwert bestimmen"}, {"g": "10 % von 11,80 € = 1,18 €", "op": "Prozentwert"}, {"g": "11,80 € + 1,18 €"}, {"g": "Ergebnis: 12,98 €"}], "quelle": "Buch S. 27, Aufg. 17 – 1:1; Buchlösung S. 152 ✓", "stufe": "schwer"}, {"aufgabe": "Eine Jeans kostet mit 20 % Rabatt 40 €. Wie teuer war sie vorher?", "loesung": "50 €", "hinweis": "Die 40 € sind nicht 100 %, sondern 80 % des alten Preises.", "schritte": [{"g": "Mit 20 % Rabatt zahlt man 80 % des alten Preises", "op": "Grundwert gesucht"}, {"g": "80 % ≙ 40 €, also 1 % ≙ 40 € : 80 = 0,50 €"}, {"g": "100 % ≙ 0,50 € · 100"}, {"g": "Ergebnis: 50 € · Probe: 50 € − 20 % von 50 € = 50 € − 10 € = 40 € ✓"}], "quelle": "KA 3. Schulaufgabe (Klasse 7, 04/2017), Aufg. 6b – 1:1; Lösung aus dem KA-Dossier ✓", "stufe": "schwer"}]}], "uplus": [{"stufe": "", "loesung": "400 €", "hinweis": "20 % mehr heißt: Der neue Preis ist 120 % vom alten.", "aufgabe": "Ein Fernseher kostet 480 € – das sind 20 % mehr als im Vorjahr. Wie hoch war der Vorjahrespreis?", "schritte": [{"g": "20 % mehr heißt"}, {"g": "480 € sind 120 % vom Vorjahrespreis. 1,2 · G = 480"}, {"g": "G = 480 : 1,2 = 400."}, {"g": "Antwort: Der Vorjahrespreis war 400 €"}]}, {"stufe": "", "loesung": "150 €", "hinweis": "30 % Rabatt heißt: Der neue Preis ist 70 % vom alten.", "aufgabe": "Eine Jacke wurde um 30 % reduziert und kostet jetzt 105 €. Wie hoch war der ursprüngliche Preis?", "schritte": [{"g": "30 % Rabatt heißt"}, {"g": "105 € sind 70 % vom alten Preis. 0,7 · G = 105"}, {"g": "G = 105 : 0,7 = 150."}, {"g": "Antwort: Der ursprüngliche Preis war 150 €"}]}, {"stufe": "", "loesung": "96 %", "hinweis": "0,8 · 1,2 = 0,96 – die 20 % beziehen sich auf verschiedene Grundwerte", "aufgabe": "Ein Preis wird erst um 20 % gesenkt, dann um 20 % erhöht. Wie viel Prozent des Ausgangspreises sind das?", "schritte": [{"g": "Senken um 20 % → es bleiben 100 % − 20 % = 80 % → mal 0,8"}, {"g": "Erhöhen um 20 % → 100 % + 20 % = 120 % → mal 1,2"}, {"g": "0,8 · 1,2 = 0,96"}, {"g": "0,96 = 96 % des Ausgangspreises"}, {"g": "Nicht 100 %! Die zweiten 20 % beziehen sich auf den KLEINEREN Preis"}]}, {"stufe": "", "loesung": "3000 €", "hinweis": "25 % Abzug heißt → 75 % bleiben – 4000 · 0,75.", "aufgabe": "Brutto 4000 € im Monat, 25 % Abzüge. Wie viel bleibt netto?", "schritte": [{"g": "25 % Abzug heißt"}, {"g": "75 % bleiben – 4000 · 0,75."}, {"g": "Ergebnis: 3000 €"}]}, {"stufe": "", "loesung": "2 %", "hinweis": "Anteil bilden.", "aufgabe": "Wie viel Prozent sind 130 m von 6500 m?", "schritte": [{"g": "Anteil bilden"}, {"g": "130 : 6500 = 0,02 – das sind 2 %."}]}, {"stufe": "", "loesung": "120 l", "hinweis": "Grundwert gesucht: Prozentwert geteilt durch Prozentsatz. 2,5 % = 0,025.", "aufgabe": "2,5 % sind 3 l. Wie viel ist das Ganze?", "schritte": [{"g": "Grundwert gesucht: Prozentwert geteilt durch Prozentsatz. 2,5 % = 0,025"}, {"g": "3 : 0,025 = 120."}, {"g": "Antwort: Das Ganze sind 120 l"}]}, {"stufe": "", "loesung": "25 %", "hinweis": "Vergleiche mit dem alten Wert.", "aufgabe": "Die Wohnfläche eines Hauses wurde durch einen Anbau von 132 m² auf 165 m² vergrößert. Um wie viel Prozent?", "schritte": [{"g": "Vergleiche mit dem alten Wert"}, {"g": "165 : 132 = 1,25 – also 25 % mehr."}]}, {"stufe": "", "loesung": "1,09 €", "hinweis": "2,75 € ≙ 84 % des regulären Dreierpreises.", "aufgabe": "Ein Händler wirbt: „3 Packungen nur 2,75 €. Damit sparen Sie 16 %.“ Berechne den Preis einer Einzelpackung.", "schritte": [{"g": "2,75 € ≙ 84 % des regulären Dreierpreises"}, {"g": "2,75 : 0,84 = 3,27…; : 3 ≈ 1,09"}, {"g": "Antwort: Eine Einzelpackung kostet 1,09 €"}]}], "transfer": [{"aufgabe": "Ein Fahrrad kostet netto 250 €. Wie viel kostet es mit 19 % Mehrwertsteuer?", "schritte": [{"g": "Die 19 % Mehrwertsteuer kommen DAZU → 100 % + 19 % = 119 %"}, {"g": "119 % = 1,19"}, {"g": "250 · 1,19 = 297,50", "op": "| · 1,19"}, {"g": "Preis mit Mehrwertsteuer: 297,50 €"}], "loesung": "297,50 €", "hinweis": "Plus 19 % heißt mal 1,19: 250 · 1,19 = 297,50."}, {"aufgabe": "Die Zustimmung steigt von 40 % auf 45 %. Ergänze: Das sind ▢ Prozentpunkte mehr und ▢ % Zuwachs.", "schritte": [{"g": "Prozentpunkte = einfacher Unterschied der Prozentangaben: 45 − 40 = 5 Prozentpunkte"}, {"g": "Zuwachs in % fragt: 5 mehr – gemessen am Start (40) → 5/40"}, {"g": "5 : 40 = 0,125 = 12,5 %"}, {"g": "Antwort: 5 Prozentpunkte mehr und 12,5 % Zuwachs → eingetragen wird 5; 12,5"}], "loesung": "5; 12,5", "hinweis": "Differenz 5 Punkte; relativer Zuwachs 5/40 = 12,5 % (Lehrplan: „Prozent vs. Prozentpunkte“)"}, {"aufgabe": "Paul: „Erst 10 % Rabatt, dann wieder 10 % drauf – dann kostet es wieder gleich viel!“ Prüfe die Aussage.", "schritte": [{"g": "Die Prozente beziehen sich auf verschiedene Grundwerte"}, {"g": "0,9 · 1,1 = 0,99"}, {"g": "der Preis liegt 1 % unter dem Start."}, {"g": "Ergebnis: falsch: 99 %"}], "loesung": "falsch: 99 %", "hinweis": "Die Prozente beziehen sich auf verschiedene Grundwerte."}], "wpool": [{"aufgabe": "10 % von 90 €", "schritte": [{"g": "10 % ist ein Zehntel", "op": "| : 10"}, {"g": "90 € : 10 = 9 €"}], "loesung": "9 €", "stufe": "leicht"}, {"aufgabe": "75 % von 40 kg", "schritte": [{"g": "75 % von 40 kg", "op": "Prozentwert = G · p : 100"}, {"g": "40 · 75 : 100 = 30 kg"}], "loesung": "30 kg", "stufe": "mittel"}, {"aufgabe": "100 € werden um 30 % gesenkt. Wie viel sind es danach?", "schritte": [{"g": "Senkung um 30 % → es bleiben: 100 % − 30 % = 70 %"}, {"g": "70 % = 0,70"}, {"g": "100 · 0,70 = 70 → 70 €"}], "loesung": "70 €", "stufe": "mittel"}, {"aufgabe": "5 % von 200 m", "schritte": [{"g": "5 % von 200 m", "op": "Prozentwert = G · p : 100"}, {"g": "200 · 5 : 100 = 10 m"}], "loesung": "10 m", "stufe": "leicht"}, {"stufe": "mittel", "aufgabe": "18 % von 250 €", "loesung": "45 €", "quelle": "analog Buch S. 27, Aufg. 16 (Prozentwert berechnen)", "schritte": [{"g": "1 % von 250 € = 2,50 €"}, {"g": "18 · 2,50 € = 45 €"}]}, {"stufe": "mittel", "aufgabe": "Ein Preis steigt von 80 € auf 92 €. Um wie viel Prozent ist er gestiegen?", "loesung": "15 %", "quelle": "analog Buch S. 30, Aufg. 26 (prozentuale Änderung)", "schritte": [{"g": "Zunahme: 92 € − 80 € = 12 €"}, {"g": "Anteil am alten Preis: 12 : 80 = 0,15"}, {"g": "0,15 = 15 %"}]}, {"stufe": "mittel", "aufgabe": "Ein Pullover kostet 60 € und wird um 15 % billiger. Wie viel kostet er jetzt?", "loesung": "51 €", "quelle": "analog Buch S. 30 (Preissenkung)", "schritte": [{"g": "15 % von 60 € = 9 €"}, {"g": "60 € − 9 € = 51 €"}]}, {"stufe": "mittel", "aufgabe": "Wie viel Prozent sind 45 € von 300 €?", "loesung": "15 %", "quelle": "analog Buch S. 29, Aufg. 24 (Prozentsatz berechnen)", "schritte": [{"g": "Anteil bilden: 45 : 300 = 0,15"}, {"g": "0,15 = 15 %"}]}], "titel": "Prozente durchschauen", "test": [{"stufe": "mittel", "aufgabe": "Für Bücher gilt ein ermäßigter Steuersatz von 7 %. Wie viel hast du insgesamt bezahlt, wenn die ermäßigte Mehrwertsteuer 1,75 € beträgt?", "schritte": [{"g": "1,75 € sind 7 % → Grundwert: 1,75 : 0,07 = 25 €"}, {"g": "Gesamtpreis = Nettopreis + Steuer"}, {"g": "25 € + 1,75 € = 26,75 €"}], "loesung": "26,75 €", "hinweis": "Erst den Nettopreis als Grundwert bestimmen, dann die Steuer dazuzählen.", "quelle": "Test Kap. 2, Aufg. 2b · Lösung S. 155 ✓"}, {"stufe": "schwer", "aufgabe": "Ein Gebrauchtwagen kostet 8800 € zuzüglich 19 % Mehrwertsteuer. Beim Ratenkauf zahlt man 7200 € an und danach 12 Raten zu je 299 €. Um wie viel Prozent ist der Ratenkauf teurer?", "schritte": [{"g": "Barpreis: 8800 · 1,19 = 10 472 €"}, {"g": "Ratenkauf: 7200 + 12 · 299 = 10 788 €"}, {"g": "10 788 : 10 472 ≈ 1,03"}, {"g": "= 3 % teurer"}], "loesung": "3 %", "hinweis": "Beide Preise ausrechnen, dann den Ratenpreis durch den Barpreis teilen.", "quelle": "Test Kap. 2, Aufg. 4 · Lösung S. 155 ✓"}]}, "A6": {"id": "A6", "kerne": [{"name": "", "verstehen": ["Bevor du rechnest, entscheide: Je mehr, desto MEHR (proportional – doppelte Menge, doppelter Preis) oder je mehr, desto WENIGER (antiproportional – doppelt so viele Helfer, halbe Zeit)? Beispiel proportional → 3 kg Äpfel kosten 5,40 €. Über die Einheit → 1 kg kostet 5,40 : 3 = 1,80 €, also 5 kg → 1,80 · 5 = 9 €. Das Dreisatz-Schema schreibt das in drei Zeilen mit Pfeilen (: 3 und · 5).", "Beispiel antiproportional → 6 Bauarbeiter brauchen 10 Tage. Die GESAMTARBEIT bleibt gleich → 6 · 10 = 60 Arbeitstage. 4 Arbeiter brauchen 60 : 4 = 15 Tage. Hier bleibt das Produkt gleich, nicht der Quotient."], "fallen": [{"falle": "Antiproportional proportional gerechnet", "falsch": "6 Arbeiter → 10 Tage, also 4 Arbeiter → 6,7 Tage", "richtig": "15 Tage", "warum": "Weniger Arbeiter brauchen MEHR Zeit – erst die Je-mehr-desto-Frage stellen!"}, {"falle": "Ohne Einheit gesprungen", "falsch": "3 kg → 5,40 €, dann wild multipliziert", "richtig": "über 1 kg gehen", "warum": "Der Zwischenschritt „1 Einheit“ macht jeden Dreisatz sicher"}], "ueben": [{"stufe": "leicht", "loesung": "9 €", "hinweis": "3-mal so viel kaufen heißt 3-mal so viel zahlen.", "aufgabe": "2 kg kosten 3 €. Was kosten 6 kg?", "schritte": [{"g": "3-mal so viel kaufen heißt 3-mal so viel zahlen"}, {"g": "3 € · 3."}, {"g": "Ergebnis: 9 €"}]}, {"stufe": "leicht", "loesung": "8 €", "hinweis": "Doppelte Menge, doppelter Preis.", "aufgabe": "5 Hefte kosten 4 €. Was kosten 10 Hefte?", "schritte": [{"g": "Doppelte Menge, doppelter Preis"}, {"g": "4 € · 2."}, {"g": "Ergebnis: 8 €"}]}, {"stufe": "leicht", "loesung": "3,60 €", "hinweis": "3-mal so viel → 1,20 € · 3.", "aufgabe": "100 g kosten 1,20 €. Was kosten 300 g?", "schritte": [{"g": "3-mal so viel"}, {"g": "1,20 € · 3."}, {"g": "Ergebnis: 3,60 €"}]}, {"stufe": "mittel", "loesung": "9 €", "hinweis": "Dreisatz über 1 kg.", "aufgabe": "3 kg Äpfel kosten 5,40 €. Was kosten 5 kg?", "schritte": [{"g": "Dreisatz über 1 kg"}, {"g": "5,40 : 3 = 1,80 €, dann mal 5."}, {"g": "Ergebnis: 9 €"}]}, {"stufe": "mittel", "loesung": "15 Tage", "hinweis": "antiproportional → 60 : 4", "aufgabe": "6 Bauarbeiter brauchen 10 Tage. Wie lange brauchen 4?", "schritte": [{"g": "antiproportional"}, {"g": "60 : 4"}, {"g": "Ergebnis: 15 Tage"}]}, {"stufe": "mittel", "loesung": "16 h", "hinweis": "Rechne zuerst die Gesamtarbeit aus: Maschinen mal Stunden.", "aufgabe": "8 Maschinen schaffen einen Auftrag in 6 Stunden. Wie lange brauchen 3 Maschinen?", "schritte": [{"g": "Gesamtarbeit"}, {"g": "8 · 6 = 48 Maschinenstunden. 3 Maschinen"}, {"g": "48 : 3 = 16 h."}]}, {"stufe": "mittel", "loesung": "2,40 €", "hinweis": "Dreisatz über 1 Heft.", "aufgabe": "7 Hefte kosten 5,60 €. Was kosten 3 Hefte?", "schritte": [{"g": "Dreisatz über 1 Heft"}, {"g": "5,60 : 7 = 0,80 €, dann mal 3."}, {"g": "Ergebnis: 2,40 €"}]}, {"stufe": "mittel", "loesung": "c) und d)", "hinweis": "Quotient f(x)/x konstant? c) 3,5 ✓ d) 1,4 ✓; a) fällt (8; 2; 0,67), b) steigt (1; 2; 3)", "aufgabe": "Welche Zuordnung ist proportional? Begründe. a) x: 1, 2, 3 → f(x): 8, 4, 2 b) x: 1, 2, 3 → f(x): 1, 4, 9 c) x: 2, 3, 5 → f(x): 7, 10,5, 17,5 d) x: 2, 3, 4 → f(x): 2,8, 4,2, 5,6", "schritte": [{"g": "Proportional-Test: f(x) : x muss überall GLEICH sein"}, {"g": "a) 8; 2; 0,67 → fällt ✗"}, {"g": "b) 1; 2; 3 → steigt ✗"}, {"g": "c) überall 3,5 ✓"}, {"g": "d) überall 1,4 ✓"}, {"g": "Antwort: c) und d)"}]}, {"stufe": "mittel", "loesung": "f(x) = 0,4x", "hinweis": "Steigung = y-Wert : x-Wert = 1,6 : 4 = 0,4 – also f(x) = 0,4x.", "aufgabe": "Eine proportionale Zuordnung enthält den Wert f(4) = 1,6. Gib den Funktionsterm an.", "schritte": [{"g": "Proportional heißt: f(x) = m · x"}, {"g": "m = f(4) : 4 = 1,6 : 4 = 0,4"}, {"g": "Funktionsterm: f(x) = 0,4x"}]}, {"aufgabe": "Familie Fit ist nach 6 Tagen am Ziel, wenn sie täglich 25 km wandert. Wie viele km muss sie täglich wandern, um schon nach 4 Tagen am Ziel zu sein?", "loesung": "37,5 km", "hinweis": "Weniger Tage bedeutet mehr Kilometer pro Tag – das ist antiproportional.", "schritte": [{"g": "Gesamtstrecke: 6 · 25 km = 150 km", "op": "Produkt bleibt gleich"}, {"g": "In 4 Tagen: 150 km : 4"}, {"g": "Ergebnis: 37,5 km pro Tag"}], "quelle": "Buch S. 71, Aufg. 19c – 1:1 (antiproportionale Zuordnung)", "stufe": "schwer"}, {"aufgabe": "Ski kaufen kostet 249 €. Leihen kostet 22 € Grundgebühr und 34 € pro Tag. Was ist bei 7 Tagen günstiger – kaufen oder leihen?", "loesung": "kaufen", "hinweis": "Rechne zuerst aus, was das Leihen für 7 Tage kostet.", "schritte": [{"g": "Leihen: 22 € + 7 · 34 €", "op": "Grundgebühr plus Tagespreis"}, {"g": "7 · 34 € = 238 €; 22 € + 238 € = 260 €"}, {"g": "Vergleich: 260 € (leihen) gegen 249 € (kaufen)"}, {"g": "Ergebnis: kaufen ist günstiger (um 11 €)"}], "quelle": "KA 2. Schulaufgabe (Klasse 7, 01/2016), Aufg. 5 – 1:1; Lösung aus dem KA-Dossier ✓", "stufe": "schwer"}]}], "uplus": [{"stufe": "", "loesung": "6,40 €", "hinweis": "Einheiten! 800 g = 250 g · 3,2.", "aufgabe": "250 g Käse kosten 2 €. Was kosten 0,8 kg?", "schritte": [{"g": "Einheiten! 800 g = 250 g · 3,2"}, {"g": "2 € · 3,2 (kombiniert Fertigkeit F4)"}, {"g": "Ergebnis: 6,40 €"}]}, {"stufe": "", "loesung": "6 h", "hinweis": "Rechne zuerst die Gesamtarbeit aus: Rohre mal Stunden.", "aufgabe": "4 Rohre füllen ein Becken in 9 Stunden. Wie lange brauchen 6 Rohre?", "schritte": [{"g": "Gesamtarbeit"}, {"g": "4 · 9 = 36 Rohrstunden. 6 Rohre"}, {"g": "36 : 6 = 6 h."}]}, {"stufe": "", "loesung": "antiproportional", "hinweis": "mehr Personen, weniger Zeit", "aufgabe": "Anzahl der Personen ↔ Zeit, bis eine Pizza aufgegessen ist. Proportional oder antiproportional?", "schritte": [{"g": "Mehr Personen → die Pizza ist SCHNELLER weg"}, {"g": "Mehr von A, weniger von B → antiproportional"}], "mc": ["antiproportional", "proportional", "weder noch"], "mcCorrect": 0}, {"stufe": "", "loesung": "525 g", "hinweis": "Dreisatz über 1 Person.", "aufgabe": "Ein Rezept für 4 Personen braucht 300 g Mehl. Wie viel für 7 Personen?", "schritte": [{"g": "Dreisatz über 1 Person"}, {"g": "300 : 4 = 75 g, dann mal 7."}, {"g": "Ergebnis: 525 g"}]}], "transfer": [{"aufgabe": "Prüfe mit Begründung, ob die Tabelle proportional sein kann: x: 1 | 2 | 4 und y: 2 | 4 | 7", "schritte": [{"g": "Proportional heißt: y : x überall gleich. 2:1 = 2, 4:2 = 2, aber 7:4 = 1,75"}, {"g": "beim letzten Paar müsste y = 8 sein (Begründungsaufgabe)"}, {"g": "Ergebnis: nein"}], "loesung": "nein", "hinweis": "Proportional heißt: y : x muss überall gleich sein – prüfe jedes Zahlenpaar."}, {"aufgabe": "„Doppelt so viele Maler, halbe Zeit – das gilt immer!“ Nimm Stellung: Wo stimmt das Modell, wo nicht?", "schritte": [{"g": "Das Modell ist antiproportional: doppelte Leute, halbe Zeit"}, {"g": "Es gilt, solange die Arbeit teilbar ist und sich niemand behindert"}, {"g": "Grenze: 100 Maler in einem kleinen Zimmer stehen sich im Weg – dann kippt das Modell"}, {"g": "Antwort: Das Modell stimmt bei teilbarer Arbeit – es kippt, sobald sich die Leute gegenseitig behindern"}], "loesung": "Das Modell stimmt, solange die Arbeit teilbar ist und sich niemand behindert – bei 100 Malern in einem kleinen Zimmer kippt es.", "hinweis": "Modell gilt, solange sich die Maler nicht behindern und die Arbeit teilbar ist; bei 100 Malern in einem kleinen Zimmer bricht es zusammen (Modellkritik, Selbstkontrolle per Musterlösung)", "format": "SK"}, {"aufgabe": "3 Pumpen leeren einen Teich in 8 Stunden. Wie viele Pumpen braucht man, um ihn in 6 Stunden zu leeren?", "schritte": [{"g": "Gesamtarbeit: 3 Pumpen · 8 h = 24 Pumpenstunden"}, {"g": "24 Pumpenstunden : 6 h = 4", "op": "| : 6"}, {"g": "Antwort: 4 Pumpen"}], "loesung": "4 Pumpen", "hinweis": "24 Pumpenstunden : 6 h = 4 – hier ist die gesuchte Größe die Anzahl"}], "wpool": [{"aufgabe": "2 Kugeln Eis kosten 5 €. Was kosten 4?", "schritte": [{"g": "Proportional: doppelte Menge, doppelter Preis"}, {"g": "2 Kugeln → 5 €, also 4 Kugeln → 10 €", "op": "| · 2"}], "loesung": "10 €", "stufe": "leicht"}, {"aufgabe": "10 Arbeiter brauchen 3 Tage. Wie lange brauchen 5?", "schritte": [{"g": "Antiproportional: halbe Leute, doppelte Zeit"}, {"g": "Gesamtarbeit: 10 · 3 = 30 Arbeitertage"}, {"g": "30 : 5 = 6 → 6 Tage", "op": "| : 5"}], "loesung": "6 Tage", "stufe": "mittel"}, {"aufgabe": "150 g kosten 1,80 €. Was kosten 50 g?", "schritte": [{"g": "Erst auf 50 g herunterrechnen"}, {"g": "150 g : 3 = 50 g → 1,80 € : 3 = 0,60 €", "op": "| : 3"}, {"g": "50 g kosten 0,60 €"}], "loesung": "0,60 €", "stufe": "mittel"}, {"aufgabe": "2 Personen putzen 6 h. Wie lange brauchen 3 Personen?", "schritte": [{"g": "Antiproportional: Gesamtarbeit bleibt gleich"}, {"g": "2 · 6 = 12 Personenstunden"}, {"g": "12 : 3 = 4 → 4 h", "op": "| : 3"}], "loesung": "4 h", "stufe": "mittel"}, {"stufe": "mittel", "aufgabe": "8 Hefte kosten 12 €. Was kosten 14 Hefte?", "loesung": "21 €", "quelle": "analog Buch S. 71, Aufg. 19 (proportionale Zuordnung)", "schritte": [{"g": "Ein Heft: 12 € : 8 = 1,50 €", "op": "Dreisatz, Schritt auf 1"}, {"g": "14 · 1,50 € = 21 €"}]}, {"stufe": "mittel", "aufgabe": "6 Maler brauchen 10 Tage. Wie lange brauchen 4 Maler?", "loesung": "15 Tage", "quelle": "analog Buch S. 71, Aufg. 19 (antiproportionale Zuordnung)", "schritte": [{"g": "Gesamtarbeit: 6 · 10 = 60 Malertage", "op": "antiproportional: Produkt bleibt gleich"}, {"g": "60 : 4 = 15 → 15 Tage"}]}, {"stufe": "mittel", "aufgabe": "5 kg Äpfel kosten 12,50 €. Was kosten 3 kg?", "loesung": "7,50 €", "quelle": "analog Buch S. 71, Aufg. 19 (proportionale Zuordnung)", "schritte": [{"g": "1 kg: 12,50 € : 5 = 2,50 €", "op": "Dreisatz, Schritt auf 1"}, {"g": "3 · 2,50 € = 7,50 €"}]}, {"stufe": "mittel", "aufgabe": "12 Kühe fressen einen Vorrat in 8 Tagen. Wie lange reicht er für 16 Kühe?", "loesung": "6 Tage", "quelle": "analog Buch S. 71, Aufg. 20 (antiproportionale Zuordnung)", "schritte": [{"g": "Gesamtvorrat: 12 · 8 = 96 Kuhtage", "op": "antiproportional"}, {"g": "96 : 16 = 6 → 6 Tage"}]}], "titel": "Der Dreisatz – dein Alltagswerkzeug", "test": [{"stufe": "mittel", "aufgabe": "In einer Sanduhr sind 150 mm³ Sand. Pro Sekunde rieseln 0,25 mm³ hindurch. Nach welcher Zeit ist der ganze Sand unten?", "schritte": [{"g": "Zeit = Menge : Menge pro Sekunde"}, {"g": "150 : 0,25"}, {"g": "= 600 s"}], "loesung": "600 s", "hinweis": "Gesamtmenge durch die Menge pro Sekunde teilen.", "quelle": "Test Kap. 4, Aufg. 6b · Lösung S. 173 ✓"}, {"stufe": "schwer", "aufgabe": "Dieselbe Sanduhr (150 mm³, 0,25 mm³ pro Sekunde): Nach welcher Zeit befinden sich oben noch 40 mm³ Sand?", "schritte": [{"g": "Durchgerieselt sind 150 − 40 = 110 mm³"}, {"g": "110 : 0,25"}, {"g": "= 440 s"}], "loesung": "440 s", "hinweis": "Nicht die Restmenge teilen, sondern die Menge, die schon durchgerieselt ist.", "quelle": "Test Kap. 4, Aufg. 6c · Lösung S. 173 ✓"}]}, "A1": {"id": "A1", "kerne": [{"name": "Plus und Minus", "verstehen": ["Schau auf die Zahlengerade: Bei Plus gehst du nach rechts, bei Minus nach links. Beispiel → −7 + 12. Du startest bei −7 und gehst 12 Schritte nach rechts – du landest bei 5. Also → −7 + 12 = 5.", "Der Betrag einer Zahl ist ihr Abstand zur Null: |−3| = 3 und |3| = 3. Beim Rechnen mit Vorzeichen vergleichst du oft die Beträge – z. B. bei −7 + 12 gewinnt die 12, weil ihr Betrag größer ist.", "Die Regel: Haben beide Zahlen das gleiche Vorzeichen, addierst du und behältst das Vorzeichen (−2 + (−7) = −9). Haben sie verschiedene Vorzeichen, rechnest du den Unterschied aus – das Vorzeichen bestimmt die Zahl, die weiter von der Null entfernt ist (−7 + 12 = 5, aber −12 + 7 = −5).", "Und wenn ein Minus vor der Klammer steht? Dann dreht es das Vorzeichen in der Klammer um → 5 − (−3) = 5 + 3 = 8. Merk dir: Minus vor Minus wird Plus."], "fallen": [{"falle": "Vorzeichen der „größeren“ Zahl ignoriert", "falsch": "−7 + 12 = −19", "richtig": "−7 + 12 = 5", "warum": "Verschiedene Vorzeichen: Unterschied 12 − 7 = 5; die 12 ist weiter von Null weg und ist positiv"}, {"falle": "Minusklammer nicht umgedreht", "falsch": "5 − (−3) = 2", "richtig": "5 − (−3) = 8", "warum": "Minus vor der Klammer dreht um → 5 + 3"}], "ueben": [{"aufgabe": "Setze x = −4 ein: 3x − 5", "schritte": [{"g": "Für x die −4 einsetzen: 3 · (−4) − 5"}, {"g": "Punkt vor Strich: 3 · (−4) = −12"}, {"g": "Plus mal minus gibt minus"}, {"g": "−12 − 5"}, {"g": "Ergebnis: −17"}], "loesung": "−17", "hinweis": "Setze die negative Zahl in Klammern ein, dann verrutscht kein Vorzeichen.", "quelle": "Buch 5.2, Aufg. 5a – Zahlen abgewandelt", "stufe": "leicht"}, {"stufe": "leicht", "loesung": "−5", "hinweis": "Unterschied 8 − 3, Vorzeichen der −8-Richtung", "aufgabe": "3 − 8", "schritte": [{"g": "3 − 8 = −5"}]}, {"aufgabe": "Setze x = −2 ein: 5x + 7", "schritte": [{"g": "Für x die −2 einsetzen: 5 · (−2) + 7"}, {"g": "Punkt vor Strich: 5 · (−2) = −10"}, {"g": "−10 + 7"}, {"g": "Ergebnis: −3"}], "loesung": "−3", "hinweis": "Erst mal, dann plus.", "quelle": "Buch 5.2, Aufg. 5a – Zahlen abgewandelt", "stufe": "leicht"}, {"stufe": "mittel", "loesung": "0", "hinweis": "Erst Klammer → −12 + 7 + 5", "aufgabe": "−12 + 7 − (−5)", "schritte": [{"g": "Klammer zuerst → −5 = −5"}, {"g": "−12 + 7 − −5"}, {"g": "−12 + 7 − −5 = 0"}]}, {"stufe": "mittel", "loesung": "5", "hinweis": "Minus vor einer negativen Zahl wird Plus → 3,5 − (−1,5) = 3,5 + 1,5 – auch mit Kommazahlen.", "aufgabe": "3,5 − (−1,5)", "schritte": [{"g": "Klammer zuerst → −1,5 = −1,5"}, {"g": "3,5 − −1,5"}, {"g": "3,5 − −1,5 = 5"}]}, {"stufe": "mittel", "loesung": "−1/2", "hinweis": "Unterschied 3/4 − 1/4 = 2/4, kürzen; Vorzeichen −", "aufgabe": "−3/4 + 1/4", "schritte": [{"g": "Gleicher Nenner → Zähler verrechnen"}, {"g": "−3 + 1 = −2 → −2/4"}, {"g": "kürzen mit 2 → −1/2"}]}, {"aufgabe": "Setze x = −5 ein: x/5 − 4", "schritte": [{"g": "Für x die −5 einsetzen: (−5)/5 − 4"}, {"g": "Minus geteilt durch plus gibt minus: (−5)/5 = −1"}, {"g": "−1 − 4"}, {"g": "Ergebnis: −5"}], "loesung": "−5", "hinweis": "Eine negative Zahl geteilt durch eine positive bleibt negativ.", "quelle": "Buch 5.2, Aufg. 5c – Zahlen abgewandelt", "stufe": "mittel"}, {"stufe": "schwer", "aufgabe": "(−0,5 − 2/3) · 0,5", "schritte": [{"g": "Zuerst die Klammer: −0,5 = −1/2"}, {"g": "−1/2 − 2/3 → Hauptnenner 6 → −3/6 − 4/6 = −7/6"}, {"g": "Jetzt multiplizieren: −7/6 · 0,5 = −7/6 · 1/2"}, {"g": "Zähler mal Zähler, Nenner mal Nenner: (7 · 1)/(6 · 2) = 7/12"}, {"g": "Ein Minus bleibt übrig → Ergebnis: −7/12"}], "loesung": "−7/12", "hinweis": "Erst die Klammer mit Hauptnenner, dann multiplizieren.", "quelle": "Buch 5.1, Aufg. 4★ a · gedruckte Lösung S. 174 ✓"}, {"aufgabe": "−1/8 · 0,4 · 1,5 · (−5/8)", "loesung": "3/64", "hinweis": "Zähle zuerst die Minuszeichen – zwei Minus ergeben Plus.", "schritte": [{"g": "Zwei Minuszeichen → das Ergebnis ist positiv", "op": "Vorzeichen klären"}, {"g": "Alles als Bruch: 1/8 · 2/5 · 3/2 · 5/8"}, {"g": "1/8 · 2/5 = 1/20; 1/20 · 3/2 = 3/40; 3/40 · 5/8 = 15/320"}, {"g": "Ergebnis: 15/320 = 3/64"}], "quelle": "Buch S. 86, Aufg. 2f – 1:1; Buchlösung S. 174 ✓", "stufe": "schwer"}]}, {"name": "Mal und Geteilt", "verstehen": ["(−3) · 4 heißt: viermal d
