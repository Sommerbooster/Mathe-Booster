<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FBF8F2">
<title>Mathe-Booster</title>
<style>
:root{
  --bg-page:#FBF8F2; --bg-surface:#FFFFFF; --color-heading:#173B2E; --color-text:#173B2E;
  --color-muted:#766F60; --color-border:#EDE8DE;
  --accent:#0E6E45; --accent-hover:#0B5838; --on-accent:#FFFFFF; --accent-tint:#DEF3E6;
  --secondary:#D8431E; --secondary-hover:#B8380F; --on-secondary:#FFFFFF; --secondary-tint:#FBE3DA;
  --koralle:#FF5E3A;
  --font-base:-apple-system,"Helvetica Neue",Arial,system-ui,sans-serif; --lh-body:1.55; --lh-tight:1.15;
  --radius-sm:10px; --radius-md:14px; --space-1:8px; --space-2:16px; --space-3:24px; --space-4:40px; --maxw:560px;
}
@media (min-width:900px){
  html{font-size:18px;}
  :root{--maxw:780px;--space-1:10px;--space-2:22px;--space-3:36px;--space-4:56px;--radius-md:16px;}
  header.app h1{font-size:1.2rem;}
  .nav button{padding:10px 16px;font-size:.9rem;}
}
@media (max-width:560px){
  header.app .brand{flex-wrap:wrap;}
  .nav{justify-content:flex-start;width:100%;}
  .nav button{padding:7px 10px;font-size:.8rem;}
}
@media print{header.app,.nav,.noprint,.status,footer.legal{display:none!important}body{background:#fff;padding-bottom:0}.card{border:1px solid #ccc}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-page);color:var(--color-text);font-family:var(--font-base);line-height:var(--lh-body);padding-bottom:var(--space-3);}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--space-2);}
header.app{padding:var(--space-2);}

.nav{display:flex;gap:8px;flex-wrap:wrap;}
.nav button{padding:8px 12px;font-size:.85rem;background:transparent;color:var(--secondary);border:1px solid var(--secondary);border-radius:var(--radius-sm);cursor:pointer;font-family:inherit;}
.nav button:hover{background:var(--secondary-tint);}
.card{background:var(--bg-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-3);margin-bottom:var(--space-2);}
button{font-family:inherit;font-size:1rem;cursor:pointer;border-radius:var(--radius-sm);border:1px solid transparent;padding:12px 18px;}
.btn{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.btn:hover{background:var(--accent-hover);}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--accent);}
.btn.ghost:hover{background:var(--accent-tint);}
.btn.block{display:block;width:100%;margin-top:var(--space-2);}
.btn.small{padding:8px 12px;font-size:.9rem;}
.opt{border:1px solid var(--color-border);background:#fff;border-radius:var(--radius-sm);padding:10px 14px;cursor:pointer;display:block;width:100%;text-align:left;font-size:1rem;margin-top:8px;font-family:inherit;color:var(--color-text);}
.opt.active{background:var(--accent-tint);border-color:var(--accent);color:var(--accent);font-weight:600;}
label.fld{display:block;font-weight:600;margin-top:var(--space-3);color:var(--color-heading);}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-size:.8rem;background:#FAF5E9;border:1px solid var(--secondary);color:var(--color-heading);}
.bar{height:9px;background:var(--color-border);border-radius:999px;overflow:hidden;margin:10px 0 var(--space-2);}
.bar>div{height:100%;background:var(--accent);width:0;transition:width .3s;}
.bar.koralle>div{background:var(--koralle);}
.prompt{font-size:1.35rem;font-weight:700;color:var(--color-heading);margin:var(--space-2) 0;line-height:1.35;}
.ex{font-style:italic;color:var(--secondary);margin-bottom:var(--space-2);}
input[type=text]{width:100%;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-sm);font-size:1.1rem;font-family:inherit;}
.unitrow{display:flex;align-items:center;gap:10px;}
.unitrow input{flex:1;}
.unit{font-weight:600;color:var(--color-heading);white-space:nowrap;}
.banner{background:var(--accent-tint);border:1px solid var(--color-border);border-left:4px solid var(--koralle);border-radius:0;padding:var(--space-2);margin:var(--space-3) 0;}
.info{background:#fff;border:1px solid var(--color-border);border-left:4px solid var(--koralle);border-radius:0;padding:12px 14px;font-size:1rem;color:var(--color-text);margin:var(--space-2) 0;}
.warn{background:#F7ECD8;border:1px solid #E4C98A;color:#6B4E1E;border-radius:var(--radius-sm);padding:10px 12px;margin:10px 0;}
table.plan{width:100%;border-collapse:collapse;font-size:.9rem;}
table.plan th,table.plan td{border:1px solid var(--color-border);padding:6px 8px;text-align:left;}
table.plan th{background:var(--accent);color:#FFFFFF;}
table.plan tr.today td{background:var(--accent-tint);font-weight:600;}
.status{width:calc(100% - 2*var(--space-2));max-width:calc(var(--maxw) - 2*var(--space-2));margin:0 auto var(--space-3);background:var(--bg-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px var(--space-2);font-size:.95rem;}
footer.legal{max-width:var(--maxw);margin:var(--space-3) auto 0;padding:0 var(--space-2) var(--space-2);text-align:center;font-size:.8rem;color:var(--color-muted);}
footer.legal a{color:var(--color-muted);}
.muted{color:var(--color-muted);}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.hidden{display:none!important;}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.1;}
.frac .num{border-bottom:1.5px solid currentColor;padding:0 4px;}
.frac .den{padding:0 4px;}
.pf{display:inline-block;vertical-align:0.18em;line-height:1;margin:0 3px;font-weight:700;}
.scratch{margin-top:var(--space-2);}
.scratch canvas{width:100%;height:220px;background:#fff;border:1px dashed var(--color-border);border-radius:var(--radius-sm);touch-action:none;display:block;}
@media (max-width:480px){ .scratch canvas{height:170px;} } /* Handy: weniger scrollen bis zu den Buttons (Beta-Feedback Sophie) */

/* ---------- Antwortprüfung (Leitfaden Abschn. 6: Komma/Punkt, Brüche, gemischte Zahlen) ---------- */
function parseNum(s){
  if(typeof s!=="string") return NaN;
  s=s.trim().replace(/−/g,"-").replace(/\s+/g,"");
  if(/^-?\d+\/\d+$/.test(s)){ const [a,b]=s.split("/").map(Number); return b?a/b:NaN; }
  s=s.replace(/\./g, s.includes(",")?"":".").replace(",",".");
  const v=parseFloat(s);
  return isFinite(v)?v:NaN;
}
function parseFracValue(s){
  if(typeof s!=="string") return NaN;
  s=s.trim().replace(/−/g,"-").replace(/\s*\/\s*/g,"/"); // Leerzeichen um den Bruchstrich sind ok (auch bei "1 1 / 9")
  let m=s.match(/^(-?\d+)\s+(\d+)\/(\d+)$/); // gemischte Zahl "1 1/9"
  if(m){ const g=+m[1], z=+m[2], n=+m[3]; if(!n) return NaN; return (g<0?-1:1)*(Math.abs(g)+z/n); }
  m=s.match(/^(-?\d+)\/(\d+)$/);
  if(m){ const z=+m[1], n=+m[2]; if(!n) return NaN; return z/n; }
  return parseNum(s);
}
function isCorrect(nr, ans){
  const k=KEY[nr]; if(k===undefined||ans===undefined||ans===null) return false;
  if(k.t==="mc") return ans===k.v;
  if(k.t==="num"){ const v=parseNum(String(ans)); return isFinite(v)&&Math.abs(v-k.v)<0.005; }
  if(k.t==="frac"){ const v=parseFracValue(String(ans)); return isFinite(v)&&Math.abs(v-k.v[0]/k.v[1])<0.005; }
  if(k.t==="pair"){
    if(!Array.isArray(ans)||ans.length<2) return false;
    const a=parseNum(String(ans[0])), b=parseNum(String(ans[1]));
    return isFinite(a)&&isFinite(b)&&Math.abs(a-k.v[0])<0.005&&Math.abs(b-k.v[1])<0.005;
  }
  if(k.t==="term"){
    if(Array.isArray(ans)){ // Alt-Antworten aus der Kästchen-Version (vor 30.07.): weiter fair werten
      if(!k.legacy||ans.length<2) return false;
      const a=parseNum(String(ans[0])), b=parseNum(String(ans[1]));
      return isFinite(a)&&isFinite(b)&&Math.abs(a-k.legacy[0])<0.005&&Math.abs(b-k.legacy[1])<0.005;
    }
    return termEq(String(ans), k.v)===true; // ganzer Term inkl. Vorzeichen (Reihenfolge/Schreibweise egal)
  }
  return false;
}

/* ---------- Diagnose (Auswertungs-Landkarte, Eingangscheck v4.1 Abschn. 3/6) ----------
   Ergebnis je Aufgabe: "r" richtig · "f" falsch · "h" HWNN · "x" leer/übersprungen
   Status je Fertigkeit: sitzt | plan | plan_ab_mittel | optional | optional_ab_mittel   */
function taskResult(nr, answers, hwnn){
  if(hwnn && hwnn[nr]) return "h";
  if(answers[nr]===undefined) return "x";
  return isCorrect(nr, answers[nr]) ? "r" : "f";
}
function diagnose(answers, hwnn){
  const out={};
  for(const sk of SKILLS){
    if(sk.rang==="F"){
      /* Auch bei "h" (HWNN) -> "plan": Der Knopf ist seit 1.20 auf ALLEN Aufgaben verfuegbar
         (Anweisung Annette 11.08.2026). Bei Grundwissen aus Kl. 5/6 heisst "Hatten wir noch
         nicht" praktisch "weiss ich nicht mehr" - das Thema kommt als Auffrischung in den
         Plan und wird NIE zum Vorsprung, weil alles Weitere darauf aufbaut. */
      out[sk.id] = taskResult(sk.tasks[0], answers, hwnn)==="r" ? "sitzt" : "plan";
    } else if(sk.rang==="A"){
      const l=taskResult(sk.leicht, answers, hwnn), m=taskResult(sk.mittel, answers, hwnn);
      if(m==="r" && (l==="r"||l==="h")) out[sk.id]="sitzt";           // mittel beherrscht
      else if(l==="r" && (m==="f"||m==="x")) out[sk.id]="plan_ab_mittel";
      else if(l==="r" && m==="h") out[sk.id]="optional_ab_mittel";     // HWNN zählt nie als Lücke
      else if(l==="h") out[sk.id]="optional";
      else out[sk.id]="plan";                                          // leicht falsch/leer → von Beginn an
    } else {
      const r=taskResult(sk.tasks[0], answers, hwnn);
      out[sk.id] = r==="r" ? "sitzt" : (r==="h" ? "optional" : "plan");
    }
  }
  return out;
}

/* ---------- Plan-Builder (Priorität F → A → B → C, optional ans Ende) ---------- */
function bausteinLabel(min){ return min>=45?"Thema + Mix + Extra + Knobeln":min>=30?"Thema + Mix + Extra":min>=20?"Thema + Mix":"Thema"; }
function buildPlan(diag, cfg){
  cfg = Object.assign({wochen:2, tage:5, minuten:20}, cfg||{});
  const order = ["F","A","B","C"];
  const queue=[], bonus=[];
  for(const rang of order){
    for(const sk of SKILLS){
      if(sk.rang!==rang) continue;
      const st=diag[sk.id];
      if(st==="plan"||st==="plan_ab_mittel"){
        const n=sk.blocks||1;
        for(let i=0;i<n;i++) queue.push({id:sk.id, abMittel:st==="plan_ab_mittel", block:i, titel:sk.titel+(n>1?" ("+(i+1)+"/"+n+")":"")});
      } else if(st==="optional"||st==="optional_ab_mittel"){
        bonus.push({id:sk.id, abMittel:st==="optional_ab_mittel", titel:sk.titel});
      }
    }
  }
  const totalDays=cfg.wochen*cfg.tage, days=[], label=bausteinLabel(cfg.minuten);
  let qi=0;
  for(let d=1; d<=totalDays; d++){
    const checkpoint = d%cfg.tage===0;
    if(d===1) days.push({tag:1, baustein:"Check", thema:"Dein Mathe-Check", id:"CHECK", done:true});
    else if(checkpoint) days.push({tag:d, baustein:"Mix-Tag", thema:"Wiederholung quer durch die Woche", id:"MIX"});
    else if(qi<queue.length){ const q=queue[qi++]; days.push({tag:d, baustein:label, thema:q.titel, id:q.id, abMittel:q.abMittel, block:q.block||0}); }
    else days.push({tag:d, baustein:"Mix", thema:"Wiederholmix – dranbleiben und festigen", id:"MIX"});
  }
  return {days, rest:queue.slice(qi), bonus, cfg};
}

function fmtVal(t, v){
  let s=String(v).replace(/\./g,",").replace(/^-/,"−");
  if(t.label&&/=$/.test(t.label.trim())) s=t.label+" "+s;
  if(t.unit) s+=(t.unit==="°"?"":" ")+t.unit;
  return s;
}
function loesungText(t){
  const k=KEY[t.nr];
  if(t.nr===20) return "2⁷ (Hochzahl 7)";
  if(k.t==="mc") return t.opts[k.v];
  if(k.t==="frac") return k.v[0]+"/"+k.v[1]+" (= 1 1/9)";
  if(k.t==="term") return (t.label&&/=$/.test(t.label.trim())?t.label+" ":"")+k.v;
  return fmtVal(t,k.v);
}
function eigeneText(t){
  if(S.hwnn[t.nr]) return "„Hatten wir noch nicht“";
  const a=S.answers[t.nr];
  if(a===undefined||a===null||a==="") return "keine Angabe";
  if(t.type==="MC") return typeof a==="number"&&t.opts[a]!==undefined?t.opts[a]:"keine Angabe";
  if(Array.isArray(a)) return a.filter(x=>x!=="").join(" / ")||"keine Angabe";
  return fmtVal(t,a);
}

"aufgabe": "Für einen Pfannkuchenteig brauchst du 3/4 l Milch. Im Kühlschrank steht noch 1/2 l. Wie viel Milch fehlt?", "schritte": [{"g": "Ansatz"}, {"g": "3/4 − 1/2. Hauptnenner 4: 3/4 − 2/4 = 1/4. Antwort: Es fehlt 1/4 l Milch."}], "loesung": "1/4 l", "hinweis": "Ansatz → 3/4 − 1/2. Hauptnenner 4: 3/4 − 2/4 = 1/4. Antwort: Es fehlt 1/4 l Milch."}, {"aufgabe": "Ben isst 3/8 einer Pizza, Mia isst 1/4 derselben Pizza. Welcher Anteil der Pizza ist noch übrig?", "schritte": [{"g": "Zusammen"}, {"g": "3/8 + 2/8 = 5/8. Rest"}, {"g": "8/8 − 5/8 = 3/8. Antwort"}, {"g": "3/8 der Pizza sind übrig."}], "loesung": "3/8", "hinweis": "Zusammen → 3/8 + 2/8 = 5/8. Rest → 8/8 − 5/8 = 3/8. Antwort → 3/8 der Pizza sind übrig."}], "wpool": [{"aufgabe": "1/2 + 1/4", "schritte": [{"g": "Hauptnenner 4", "op": "erweitern: · 2 bzw. · 1"}, {"g": "2/4 + 1/4 = 3/4"}, {"g": "Ergebnis: 3/4"}], "loesung": "3/4"}, {"aufgabe": "5/6 − 1/3", "schritte": [{"g": "Hauptnenner 6", "op": "erweitern: · 1 bzw. · 2"}, {"g": "5/6 − 2/6 = 3/6"}, {"g": "kürzen → 1/2"}, {"g": "Ergebnis: 1/2"}], "loesung": "1/2"}, {"aufgabe": "2/5 · 5/8", "schritte": [{"g": "Zähler mal Zähler, Nenner mal Nenner → 10/40"}, {"g": "kürzen → 1/4"}, {"g": "Ergebnis: 1/4"}], "loesung": "1/4"}, {"aufgabe": "3/5 : 3", "schritte": [{"g": "Durch eine ganze Zahl teilen = Nenner malnehmen"}, {"g": "3/5 : 3 = 3/15"}, {"g": "kürzen mit 3 → 1/5"}], "loesung": "1/5"}, {"aufgabe": "Kürze vollständig: 18/24", "schritte": [{"g": "Größter gemeinsamer Teiler von 18 und 24 → 6"}, {"g": "18 : 6 = 3 und 24 : 6 = 4", "op": "| : 6"}, {"g": "18/24 = 3/4"}], "loesung": "3/4"}]}, "F3": {"id": "F3", "titel": "Kommazahlen können", "kerne": [{"name": "", "verstehen": ["Berechne 6,4 + 24,75. Schreibe die Zahlen so untereinander, dass Komma unter Komma steht – Lücken füllst du mit Nullen auf (6,40). Dann rechnest du stellenweise von rechts nach links wie mit ganzen Zahlen → 31,15. Beim Subtrahieren geht es genauso.", "Multiplizieren: Rechne zuerst ohne Komma, zähle dann die Nachkommastellen beider Zahlen zusammen und setze das Komma so, dass das Ergebnis genauso viele Nachkommastellen hat. Beispiel → 0,3 · 5 → 3 · 5 = 15, eine Nachkommastelle → 1,5.", "Dividieren: Verschiebe das Komma bei beiden Zahlen gleich weit nach rechts, bis der Divisor eine ganze Zahl ist → 12,34 : 0,8 = 123,4 : 8. Kontrolliere dein Ergebnis immer mit einer Überschlagsrechnung – runde dafür auf Ganze."], "fallen": [{"falle": "Stellenwerte ignoriert („15 + 3 = 18“)", "falsch": "0,15 + 0,3 = 0,18", "richtig": "0,15 + 0,3 = 0,45", "warum": "Komma unter Komma → 0,15 + 0,30 – Zehntel zu Zehntel"}, {"falle": "Komma beim Multiplizieren einfach übernommen", "falsch": "0,3 · 0,2 = 0,6", "richtig": "0,3 · 0,2 = 0,06", "warum": "Nachkommastellen zählen → 1 + 1 = 2 Stellen im Ergebnis"}], "ueben": [{"stufe": "leicht", "aufgabe": "0,6 + 0,7", "schritte": [{"g": "0,6 + 0,7 = 1,3"}], "loesung": "1,3", "hinweis": "Im Kopf → 6 + 7 Zehntel"}, {"stufe": "leicht", "aufgabe": "2,2 + 4,5", "schritte": [{"g": "2,2 + 4,5 = 6,7"}], "loesung": "6,7", "hinweis": "Stelle für Stelle: Ganze plus Ganze, Zehntel plus Zehntel."}, {"stufe": "leicht", "aufgabe": "3,4 − 1,3", "schritte": [{"g": "3,4 − 1,3 = 2,1"}], "loesung": "2,1", "hinweis": "Stelle für Stelle → 3 − 1 und 0,4 − 0,3."}, {"stufe": "leicht", "aufgabe": "0,4 · 6", "schritte": [{"g": "0,4 · 6 = 2,4"}, {"g": "= 2,4"}], "loesung": "2,4", "hinweis": "Rechne ohne Komma (4 · 6 = 24) und setze danach eine Nachkommastelle → 2,4."}, {"stufe": "leicht", "aufgabe": "1,5 : 0,3", "schritte": [{"g": "1,5 : 0,3 = 5"}, {"g": "= 5"}], "loesung": "5", "hinweis": "Komma verschieben → 15 : 3"}, {"stufe": "mittel", "aufgabe": "0,4 + 0,69", "schritte": [{"g": "0,4 + 0,69 = 1,09"}], "loesung": "1,09", "hinweis": "Fülle Nullen auf (0,40 + 0,69) – dann stellengerecht addieren."}, {"stufe": "mittel", "aufgabe": "9,75 − 2,68", "schritte": [{"g": "9,75 − 2,68 = 7,07"}], "loesung": "7,07", "hinweis": "Stellengerecht mit Übertrag"}, {"stufe": "mittel", "aufgabe": "Berechne schriftlich und prüfe mit Überschlag: 18,765 − 4,38", "schritte": [{"g": "Überschlag"}, {"g": "19 − 4 = 15"}, {"g": "Ergebnis: 14,385"}], "loesung": "14,385", "hinweis": "Überschlag → 19 − 4 = 15"}, {"stufe": "mittel", "aufgabe": "0,015 · 4", "schritte": [{"g": "0,015 · 4 = 0,06"}, {"g": "= 0,06"}], "loesung": "0,06", "hinweis": "Rechne ohne Komma (15 · 4 = 60) und setze drei Nachkommastellen → 0,060 = 0,06."}, {"stufe": "mittel", "aufgabe": "0,6 : 0,05", "schritte": [{"g": "0,6 : 0,05 = 12"}, {"g": "= 12"}], "loesung": "12", "hinweis": "Komma zwei Stellen verschieben → 60 : 5"}, {"stufe": "mittel", "aufgabe": "4,344 : 0,8", "schritte": [{"g": "4,344 : 0,8 = 5,43"}, {"g": "= 5,43"}], "loesung": "5,43", "hinweis": "Verschiebe das Komma bei beiden, bis der Teiler ganz ist → 43,44 : 8."}, {"stufe": "mittel", "aufgabe": "Schreibe als Dezimalzahl: 3/4 – und als Bruch: 0,375", "schritte": [{"g": "3/4 heißt 3 : 4"}, {"g": "3 : 4 = 0,75"}, {"g": "0,375 = 375/1000", "op": "| kürzen mit 125"}, {"g": "375 : 125 = 3 und 1000 : 125 = 8 → 3/8"}, {"g": "Ergebnis: 0,75 und 3/8"}], "loesung": "0,75 und 3/8", "hinweis": "3 : 4 = 0,75; 0,375 = 375/1000, gekürzt mit 125"}]}], "uplus": [], "transfer": [{"aufgabe": "Lea kauft ein Heft für 2,49 €, einen Stift für 1,79 € und einen Radiergummi für 0,95 €. Sie bezahlt mit einem 10-€-Schein. Wie viel Geld bekommt sie zurück?", "schritte": [{"g": "Summe"}, {"g": "2,49 + 1,79 + 0,95 = 5,23. Rückgeld"}, {"g": "10 − 5,23 = 4,77. Überschlag"}, {"g": "10 − 5 = 5 ✓. Antwort: Lea bekommt 4,77 € zurück."}], "loesung": "4,77 €", "hinweis": "Summe → 2,49 + 1,79 + 0,95 = 5,23. Rückgeld → 10 − 5,23 = 4,77. Überschlag → 10 − 5 = 5 ✓. Antwort: Lea bekommt 4,77 € zurück."}, {"aufgabe": "Eine Flasche enthält 1,5 l Saft. Wie viele Gläser zu je 0,25 l kannst du damit füllen?", "schritte": [{"g": "Ansatz"}, {"g": "1,5 : 0,25 = 150 : 25 = 6. Antwort: Du kannst 6 Gläser füllen."}], "loesung": "6 Gläser", "hinweis": "Ansatz → 1,5 : 0,25 = 150 : 25 = 6. Antwort: Du kannst 6 Gläser füllen."}], "wpool": [{"aufgabe": "0,7 + 0,8", "schritte": [{"g": "0,7 + 0,8 = 1,5"}], "loesung": "1,5"}, {"aufgabe": "5 − 1,2", "schritte": [{"g": "5 − 1,2 = 3,8"}], "loesung": "3,8"}, {"aufgabe": "0,5 · 0,4", "schritte": [{"g": "0,5 · 0,4 = 0,2"}, {"g": "= 0,2"}], "loesung": "0,2"}, {"aufgabe": "3,6 : 0,6", "schritte": [{"g": "3,6 : 0,6 = 6"}, {"g": "= 6"}], "loesung": "6"}, {"aufgabe": "Schreibe 1/2 als Dezimalzahl", "schritte": [{"g": "1/2 heißt 1 : 2"}, {"g": "1 : 2 = 0,5"}], "loesung": "0,5"}]}, "F4": {"id": "F4", "titel": "Einheiten umrechnen – kein Problem", "kerne": [{"name": "", "verstehen": ["3,5 km – wie viele Meter sind das? Jede Einheit hat eine Umrechnungszahl zur nächsten. Bei Längen → 1 km = 1000 m, 1 m = 100 cm, 1 cm = 10 mm. Also 3,5 km = 3500 m. In die größere Einheit geht es zurück durch Teilen → 250 cm = 2,5 m.", "Die wichtigsten Umrechnungszahlen: Masse → 1 t = 1000 kg, 1 kg = 1000 g. Zeit → 1 h = 60 min, 1 min = 60 s – Vorsicht, hier ist die Umrechnungszahl 60, nicht 100! Geld → 1 € = 100 ct.", "Merkregel: Umrechnen heißt multiplizieren oder dividieren mit der Umrechnungszahl. Bei 10, 100, 1000 verschiebst du einfach das Komma. Schreibe die Einheit immer mit ans Ergebnis."], "fallen": [{"falle": "Bei der Zeit mit 100 gerechnet", "falsch": "1,5 h = 150 min", "richtig": "1,5 h = 90 min", "warum": "Umrechnungszahl bei Stunden/Minuten ist 60: 1,5 · 60"}, {"falle": "Falsche Umrechnungszahl bei km", "falsch": "3,5 km = 350 m", "richtig": "3,5 km = 3500 m", "warum": "1 km = 1000 m, also Komma drei Stellen"}], "ueben": [{"stufe": "leicht", "aufgabe": "3 km = ____ m", "schritte": [{"g": "1 km = 1000 m"}, {"g": "3 · 1000 = 3000", "op": "| · 1000"}, {"g": "3 km = 3000 m"}], "loesung": "3000", "hinweis": "Umrechnungszahl 1000: km → m heißt mal 1000."}, {"stufe": "leicht", "aufgabe": "250 cm = ____ m", "schritte": [{"g": "1 cm = 1/100 m  (bzw. 100 cm = 1 m)"}, {"g": "250 : 100 = 2,5", "op": "| : 100"}, {"g": "250 cm = 2,5 m"}], "loesung": "2,5", "hinweis": "Umrechnungszahl 100: cm → m heißt durch 100."}, {"stufe": "leicht", "aufgabe": "4,2 kg = ____ g", "schritte": [{"g": "1 kg = 1000 g"}, {"g": "4,2 · 1000 = 4200", "op": "| · 1000"}, {"g": "4,2 kg = 4200 g"}], "loesung": "4200", "hinweis": "Umrechnungszahl 1000: kg → g heißt mal 1000."}, {"stufe": "leicht", "aufgabe": "2 min = ____ s", "schritte": [{"g": "1 min = 60 s"}, {"g": "2 · 60 = 120", "op": "| · 60"}, {"g": "2 min = 120 s"}], "loesung": "120", "hinweis": "Umrechnungszahl 60 (nicht 100!): min → s heißt mal 60."}, {"stufe": "leicht", "aufgabe": "5,60 € = ____ ct", "schritte": [{"g": "1 € = 100 ct"}, {"g": "5,6 · 100 = 560", "op": "| · 100"}, {"g": "5,60 € = 560 ct"}], "loesung": "560", "hinweis": "Umrechnungszahl 100: € → ct heißt mal 100."}, {"stufe": "mittel", "aufgabe": "1250 g = ____ kg", "schritte": [{"g": "1 g = 1/1000 kg  (bzw. 1000 g = 1 kg)"}, {"g": "1250 : 1000 = 1,25", "op": "| : 1000"}, {"g": "1250 g = 1,25 kg"}], "loesung": "1,25", "hinweis": "Umrechnungszahl 1000: g → kg heißt durch 1000."}, {"stufe": "mittel", "aufgabe": "2 h 15 min = ____ min", "schritte": [{"g": "Stunden zuerst"}, {"g": "2 · 60 = 120 min, dann + 15."}, {"g": "Ergebnis: 135"}], "loesung": "135", "hinweis": "Stunden zuerst → 2 · 60 = 120 min, dann + 15."}, {"stufe": "mittel", "aufgabe": "3,05 m = ____ cm", "schritte": [{"g": "1 m = 100 cm"}, {"g": "3,05 · 100 = 305", "op": "| · 100"}, {"g": "3,05 m = 305 cm"}], "loesung": "305", "hinweis": "m → cm heißt mal 100 – das Komma wandert zwei Stellen → 3,05 → 305."}, {"stufe": "mittel", "aufgabe": "0,4 t = ____ kg", "schritte": [{"g": "1 t = 1000 kg"}, {"g": "0,4 · 1000 = 400", "op": "| · 1000"}, {"g": "0,4 t = 400 kg"}], "loesung": "400", "hinweis": "Umrechnungszahl 1000: t → kg heißt mal 1000."}, {"stufe": "mittel", "aufgabe": "90 s = ____ min", "schritte": [{"g": "1 s = 1/60 min  (bzw. 60 s = 1 min)"}, {"g": "90 : 60 = 1,5", "op": "| : 60"}, {"g": "90 s = 1,5 min"}], "loesung": "1,5", "hinweis": "s → min heißt durch 60: 90 : 60 = 1,5."}, {"stufe": "mittel", "aufgabe": "12500 m = ____ km", "schritte": [{"g": "1 m = 1/1000 km  (bzw. 1000 m = 1 km)"}, {"g": "12500 : 1000 = 12,5", "op": "| : 1000"}, {"g": "12500 m = 12,5 km"}], "loesung": "12,5", "hinweis": "m → km heißt durch 1000 – das Komma wandert drei Stellen."}, {"stufe": "mittel", "aufgabe": "Karte im Maßstab 1 : 50000. Wie viele km sind 4 cm auf der Karte in Wirklichkeit?", "schritte": [{"g": "Maßstab 1 : 50000 → 1 cm auf der Karte = 50000 cm in echt"}, {"g": "4 · 50000 = 200000 cm", "op": "| · 50000"}, {"g": "200000 cm = 2000 m = 2 km"}, {"g": "Antwort: 2 km"}], "loesung": "2 km", "hinweis": "4 · 50000 = 200000 cm = 2 km"}]}], "uplus": [], "transfer": [{"aufgabe": "Aus einer 3 m langen Holzlatte werden 3 Bretter zu je 0,85 m gesägt. Wie lang ist das Reststück?", "schritte": [{"g": "Verbraucht"}, {"g": "3 · 0,85 m = 2,55 m. Rest"}, {"g": "3 − 2,55 = 0,45. Antwort: Das Reststück ist 0,45 m (= 45 cm) lang."}], "loesung": "0,45 m", "hinweis": "Verbraucht → 3 · 0,85 m = 2,55 m. Rest → 3 − 2,55 = 0,45. Antwort: Das Reststück ist 0,45 m (= 45 cm) lang."}, {"aufgabe": "Ein Film beginnt um 19:45 Uhr und dauert 1 h 50 min. Wann endet er?", "schritte": [{"g": "In zwei Etappen rechnen: erst die Stunde, dann die Minuten"}, {"g": "19:45 Uhr + 1 h = 20:45 Uhr"}, {"g": "20:45 Uhr + 50 min = 21:35 Uhr"}, {"g": "Antwort: Der Film endet um 21:35 Uhr"}], "loesung": "21:35 Uhr", "hinweis": "19:45 + 1 h = 20:45. 20:45 + 50 min = 21:35. Antwort: Der Film endet um 21:35 Uhr."}], "wpool": [{"aufgabe": "1 kg = ____ g", "schritte": [{"g": "1 kg = 1000 g"}, {"g": "1 · 1000 = 1000", "op": "| · 1000"}, {"g": "1 kg = 1000 g"}], "loesung": "1000"}, {"aufgabe": "2,5 m = ____ cm", "schritte": [{"g": "1 m = 100 cm"}, {"g": "2,5 · 100 = 250", "op": "| · 100"}, {"g": "2,5 m = 250 cm"}], "loesung": "250"}, {"aufgabe": "1 h 20 min = ____ min", "schritte": [{"g": "1 h = 60 min"}, {"g": "60 + 20 = 80", "op": "| + 20"}, {"g": "1 h 20 min = 80 min"}], "loesung": "80"}, {"aufgabe": "0,5 km = ____ m", "schritte": [{"g": "1 km = 1000 m"}, {"g": "0,5 · 1000 = 500", "op": "| · 1000"}, {"g": "0,5 km = 500 m"}], "loesung": "500"}, {"aufgabe": "3 € 5 ct = ____ ct", "schritte": [{"g": "1 € = 100 ct → 3 € = 300 ct"}, {"g": "300 + 5 = 305", "op": "| + 5"}, {"g": "3 € 5 ct = 305 ct"}], "loesung": "305"}]}, "F5": {"id": "F5", "titel": "Prozent? Kenn ich!", "kerne": [{"name": "", "verstehen": ["25 % Rabatt – was heißt das eigentlich? Ein Prozent bedeutet „eins von hundert“, also ein Hundertstel → 1 % = 1/100 = 0,01. Deshalb ist 25 % = 25/100 = 1/4 = 0,25. Prozent, Bruch und Dezimalzahl sind drei Schreibweisen für denselben Anteil.", "Die wichtigste Umrechnung von allen – merke sie dir gut: Das Ganze ist immer 100 %, und 100 % = 100/100 = 1. Also → 1 = 100 %. Daraus folgt alles Weitere → 20 % = 0,2, 80 % = 0,8, 50 % = 0,5. Diese Regel brauchst du in der ganzen Prozentrechnung immer wieder.", "Prozent → Dezimalzahl: Zahl ohne %-Symbol schreiben und Komma um 2 Stellen nach links → 5 % = 0,05. Dezimalzahl → Prozent: Komma um 2 Stellen nach rechts und %-Symbol anhängen → 0,375 = 37,5 %.", "Bruch → Prozent: Erweitere oder kürze auf den Nenner 100 (1/5 = 20/100 = 20 %). Geht das nicht glatt, teile Zähler durch Nenner und verschiebe das Komma → 5/8 = 5 : 8 = 0,625 = 62,5 %. Wichtig: Eine Prozentangabe ist nur sinnvoll, wenn klar ist, was das Ganze (die 100 %) ist."], "fallen": [{"falle": "Komma nur eine Stelle verschoben", "falsch": "5 % = 0,5", "richtig": "5 % = 0,05", "warum": "Prozent heißt Hundertstel → 5/100 – zwei Stellen"}, {"falle": "Zähler als Prozentzahl gelesen", "falsch": "1/5 = 5 %", "richtig": "1/5 = 20 %", "warum": "Auf Nenner 100 erweitern → 1/5 = 20/100"}], "ueben": [{"stufe": "leicht", "aufgabe": "Schreibe als Dezimalzahl und als Bruch (vollständig gekürzt): 40 %", "schritte": [{"g": "Prozent heißt Hundertstel"}, {"g": "40 % = 40/100 – mit 20 kürzen."}, {"g": "Ergebnis: 0,4 = 2/5"}], "loesung": "0,4 = 2/5", "hinweis": "Prozent heißt Hundertstel → 40 % = 40/100 – mit 20 kürzen."}, {"stufe": "leicht", "aufgabe": "Schreibe als Dezimalzahl und als Bruch: 75 %", "schritte": [{"g": "75 % = 75/100 – mit 25 kürzen"}, {"g": "3/4."}, {"g": "Ergebnis: 0,75 = 3/4"}], "loesung": "0,75 = 3/4", "hinweis": "75 % = 75/100 – mit 25 kürzen → 3/4."}, {"stufe": "leicht", "aufgabe": "Schreibe als Dezimalzahl und als Bruch: 5 %", "schritte": [{"g": "5 % = 5/100 – mit 5 kürzen"}, {"g": "1/20."}, {"g": "Ergebnis: 0,05 = 1/20"}], "loesung": "0,05 = 1/20", "hinweis": "5 % = 5/100 – mit 5 kürzen → 1/20."}, {"stufe": "leicht", "aufgabe": "Schreibe als Prozentangabe: 1/4", "schritte": [{"g": "Prozent heißt: Nenner 100"}, {"g": "1/4 = 25/100", "op": "| erweitern mit 25"}, {"g": "25/100 = 25 %"}], "loesung": "25 %", "hinweis": "Auf Nenner 100 erweitern"}, {"stufe": "leicht", "aufgabe": "Schreibe als Prozentangabe: 0,3", "schritte": [{"g": "Komma zwei Stellen nach rechts = mal 100"}, {"g": "0,3 = 0,30 → 30 %"}], "loesung": "30 %", "hinweis": "Komma zwei Stellen nach rechts"}, {"stufe": "mittel", "aufgabe": "Schreibe als Dezimalzahl und als Bruch: 12,5 %", "schritte": [{"g": "12,5 % = 125/1000 – mit 125 kürzen"}, {"g": "1/8."}, {"g": "Ergebnis: 0,125 = 1/8"}], "loesung": "0,125 = 1/8", "hinweis": "12,5 % = 125/1000 – mit 125 kürzen → 1/8."}, {"stufe": "mittel", "aufgabe": "Schreibe als Dezimalzahl und als Bruch: 87,5 %", "schritte": [{"g": "87,5 % = 875/1000 – mit 125 kürzen"}, {"g": "7/8."}, {"g": "Ergebnis: 0,875 = 7/8"}], "loesung": "0,875 = 7/8", "hinweis": "87,5 % = 875/1000 – mit 125 kürzen → 7/8."}, {"stufe": "mittel", "aufgabe": "Schreibe als Prozentangabe: 7/8", "schritte": [{"g": "Bruch in Prozent"}, {"g": "7 : 8 = 0,875 = 87,5 %."}], "loesung": "87,5 %", "hinweis": "Bruch in Prozent → 7 : 8 = 0,875 = 87,5 %."}, {"stufe": "mittel", "aufgabe": "Schreibe als Prozentangabe: 32/400", "schritte": [{"g": "Auf Nenner 100 bringen"}, {"g": "32/400 = 8/100", "op": "| kürzen mit 4"}, {"g": "8/100 = 8 %"}], "loesung": "8 %", "hinweis": "Kürzen auf Nenner 100: 8/100"}, {"stufe": "mittel", "aufgabe": "Schreibe als Prozentangabe: 1,05", "schritte": [{"g": "Komma zwei Stellen nach rechts"}, {"g": "1,05 → 105 %"}, {"g": "Mehr als 100 % ist möglich – es ist mehr als das Ganze"}], "loesung": "105 %", "hinweis": "Mehr als das Ganze ist möglich"}, {"stufe": "mittel", "aufgabe": "Schreibe als Prozentangabe: 0,003", "schritte": [{"g": "Komma zwei Stellen nach rechts"}, {"g": "0,003 → 0,3 %"}], "loesung": "0,3 %", "hinweis": "Komma zwei Stellen nach rechts"}, {"stufe": "mittel", "aufgabe": "Schreibe als Prozentangabe (auf 2 Stellen gerundet): 2/9", "schritte": [{"g": "Teile aus"}, {"g": "2 : 9 = 0,2222… – gerundet 22,22 %."}, {"g": "Ergebnis: ≈ 22,22 %"}], "loesung": "≈ 22,22 %", "hinweis": "Teile aus → 2 : 9 = 0,2222… – gerundet 22,22 %."}]}], "uplus": [], "transfer": [{"aufgabe": "In einer Klasse mit 40 Kindern fahren 12 mit dem Rad zur Schule. Wie viel Prozent sind das?", "schritte": [{"g": "Anteil"}, {"g": "12/40 = 3/10 = 30/100 = 30 %. Antwort"}, {"g": "30 % der Kinder fahren mit dem Rad."}], "loesung": "30 %", "hinweis": "Anteil → 12/40 = 3/10 = 30/100 = 30 %. Antwort → 30 % der Kinder fahren mit dem Rad."}, {"aufgabe": "Von den Haushalten in Deutschland sind 42 % Einpersonenhaushalte, 34 % 2-Personen-, 12 % 3-Personen- und 9 % 4-Personen-Haushalte. Wie viel Prozent der Haushalte haben 5 und mehr Personen?", "schritte": [{"g": "Das Ganze sind 100 %"}, {"g": "100 − 42 − 34 − 12 − 9 = 3. Antwort"}, {"g": "3 % der Haushalte haben 5 und mehr Personen."}], "loesung": "3 %", "hinweis": "Das Ganze sind 100 % → 100 − 42 − 34 − 12 − 9 = 3. Antwort → 3 % der Haushalte haben 5 und mehr Personen."}], "wpool": [{"aufgabe": "Schreibe 50 % als Bruch.", "schritte": [{"g": "50 % = 50/100"}, {"g": "kürzen mit 50 → 1/2"}], "loesung": "1/2"}, {"aufgabe": "Schreibe 0,2 als Prozentangabe.", "schritte": [{"g": "Komma zwei Stellen nach rechts"}, {"g": "0,2 = 0,20 → 20 %"}], "loesung": "20 %"}, {"aufgabe": "Schreibe 10 % als Dezimalzahl.", "schritte": [{"g": "10 % = 10/100"}, {"g": "10 : 100 = 0,1"}], "loesung": "0,1"}, {"aufgabe": "Schreibe 3/10 als Prozentangabe.", "schritte": [{"g": "Auf Nenner 100 erweitern"}, {"g": "3/10 = 30/100", "op": "| erweitern mit 10"}, {"g": "30/100 = 30 %"}], "loesung": "30 %"}, {"aufgabe": "Schreibe 1 % als Dezimalzahl.", "schritte": [{"g": "1 % = 1/100"}, {"g": "1 : 100 = 0,01"}], "loesung": "0,01"}]}, "F6": {"id": "F6", "titel": "Fläche, Umfang, Volumen – so geht’s", "kerne": [{"name": "", "verstehen": ["Der Umfang ist der Weg einmal außen herum: Beim Rechteck U = 2 · (a + b), beim Quadrat U = 4 · a. Der Flächeninhalt sagt, wie viel hineinpasst: Rechteck A = a · b, Quadrat A = a². Miss beides nie in derselben Einheit – Umfang in cm, Fläche in cm²!", "Die Formeln aus dem Grundwissen: Dreieck A = 1/2 · g · h (halbes Rechteck!), Parallelogramm A = g · h, Trapez A = 1/2 · (a + c) · h. Komplizierte Flächen zerlegst du in Rechtecke oder ergänzt sie zu Rechtecken – das ist der wichtigste Trick.", "Beim Quader gilt V = a · b · c, gemessen in cm³ oder m³. Merke die Brücke zu den Litern → 1 dm³ = 1 l. Ein Würfel ist ein Quader mit drei gleichen Kanten → V = a³."], "fallen": [{"falle": "Umfang und Fläche verwechselt", "falsch": "Rechteck 7 cm × 4 cm: A = 22 cm²", "richtig": "A = 7 · 4 = 28 cm²; 22 cm ist der UMFANG", "warum": "U zählt den Rand (2 · (7 + 4)), A das Innere"}, {"falle": "Dreieck ohne die Hälfte", "falsch": "A = g · h", "richtig": "A = 1/2 · g · h", "warum": "Ein Dreieck ist ein halbes Rechteck/Parallelogramm"}], "ueben": [{"stufe": "leicht", "aufgabe": "Ein Rechteck hat die Seiten a = 7 cm und b = 4 cm. Berechne Umfang und Flächeninhalt.", "schritte": [{"g": "Umfang: U = 2 · (a + b)"}, {"g": "U = 2 · (7 + 4) = 2 · 11 = 22 cm"}, {"g": "Fläche: A = a · b"}, {"g": "A = 7 · 4 = 28 cm²"}], "loesung": "U = 22 cm; A = 28 cm²", "hinweis": "U = 2 · (7 + 4); A = 7 · 4"}, {"stufe": "leicht", "aufgabe": "Ein Quadrat hat die Seite a = 6 cm. Berechne Umfang und Flächeninhalt.", "schritte": [{"g": "Umfang: U = 4 · a"}, {"g": "U = 4 · 6 = 24 cm"}, {"g": "Fläche: A = a · a"}, {"g": "A = 6 · 6 = 36 cm²"}], "loesung": "U = 24 cm; A = 36 cm²", "hinweis": "Quadrat: Umfang U = 4 · a = 4 · 6, Fläche A = a · a = 6²."}, {"stufe": "leicht", "aufgabe": "Ein Dreieck hat die Grundseite g = 8 cm und die Höhe h = 5 cm. Berechne den Flächeninhalt.", "schritte": [{"g": "Dreiecksformel"}, {"g": "A = ½ · g · h = ½ · 8 · 5."}, {"g": "Ergebnis: 20 cm²"}], "loesung": "20 cm²", "hinweis": "Dreiecksformel → A = ½ · g · h = ½ · 8 · 5."}, {"stufe": "leicht", "aufgabe": "Ein Quader hat die Kanten a = 4 cm, b = 3 cm und c = 2 cm. Berechne das Volumen.", "schritte": [{"g": "Quader"}, {"g": "V = a · b · c = 4 · 3 · 2."}, {"g": "Ergebnis: 24 cm³"}], "loesung": "24 cm³", "hinweis": "Quader → V = a · b · c = 4 · 3 · 2."}, {"stufe": "leicht", "aufgabe": "1 dm³ = ____ l", "schritte": [{"g": "1 dm³ = 1 l"}, {"g": "1 · 1 = 1", "op": "| · 1"}, {"g": "1 dm³ = 1 l"}], "loesung": "1", "hinweis": "Merk dir: 1 dm³ = 1 l (und 1.000 cm³ = 1 l)."}, {"stufe": "mittel", "aufgabe": "Ein Parallelogramm hat die Grundseite g = 9 cm und die Höhe h = 4 cm. Berechne den Flächeninhalt.", "schritte": [{"g": "Parallelogramm"}, {"g": "A = g · h = 9 · 4."}, {"g": "Ergebnis: 36 cm²"}], "loesung": "36 cm²", "hinweis": "Parallelogramm → A = g · h = 9 · 4."}, {"stufe": "mittel", "aufgabe": "Ein Trapez hat die parallelen Seiten a = 8 cm und c = 4 cm und die Höhe h = 5 cm. Berechne den Flächeninhalt.", "schritte": [{"g": "Trapez"}, {"g": "A = ½ · (a + c) · h = ½ · 12 · 5."}, {"g": "Ergebnis: 30 cm²"}], "loesung": "30 cm²", "hinweis": "Trapez → A = ½ · (a + c) · h = ½ · 12 · 5."}, {"stufe": "mittel", "aufgabe": "Ein Rechteck hat A = 54 cm² und a = 9 cm. Berechne b und den Umfang.", "schritte": [{"g": "Formel rückwärts: A = a · b → b = A : a"}, {"g": "b = 54 : 9 = 6 cm"}, {"g": "U = 2 · (9 + 6) = 2 · 15 = 30 cm"}], "loesung": "b = 6 cm; U = 30 cm", "hinweis": "b = 54 : 9; U = 2 · (9 + 6) – Formel rückwärts"}, {"stufe": "mittel", "aufgabe": "Aus einem Rechteck (10 cm × 6 cm) ist an einer Ecke ein Quadrat (2 cm × 2 cm) herausgeschnitten. Berechne den Flächeninhalt der L-Form.", "schritte": [{"g": "Erst das ganze Rechteck, dann das fehlende Stück abziehen"}, {"g": "Rechteck: 10 · 6 = 60 cm²"}, {"g": "Quadrat: 2 · 2 = 4 cm²"}, {"g": "60 − 4 = 56 cm²", "op": "| − 4"}], "loesung": "56 cm²", "hinweis": "Ergänzen statt mühsam zerlegen: großes Rechteck 10 · 6 = 60 cm², davon das fehlende Quadrat 2 · 2 = 4 cm² abziehen."}, {"stufe": "mittel", "aufgabe": "Ein Quader hat V = 120 cm³, a = 6 cm, b = 5 cm. Berechne c.", "schritte": [{"g": "Formel rückwärts"}, {"g": "c = V : (a · b) = 120 : 30."}, {"g": "Ergebnis: c = 4 cm"}], "loesung": "c = 4 cm", "hinweis": "Formel rückwärts → c = V : (a · b) = 120 : 30."}, {"stufe": "mittel", "aufgabe": "Ein Würfel hat die Kante a = 3 cm. Berechne das Volumen.", "schritte": [{"g": "Würfel"}, {"g": "V = a³ = 3 · 3 · 3."}, {"g": "Ergebnis: 27 cm³"}], "loesung": "27 cm³", "hinweis": "Würfel → V = a³ = 3 · 3 · 3."}]}], "uplus": [], "transfer": [{"aufgabe": "Ein Zimmer ist 4,5 m lang und 3,2 m breit. a) Wie viel m² Teppich brauchst du? b) Wie viele Meter Fußleiste, wenn die Tür 0,9 m breit ist?", "schritte": [{"g": "a) A = 4,5 · 3,2 = 14,4. b) U = 2 · (4,5 + 3,2) = 15,4; minus Tür"}, {"g": "15,4 − 0,9 = 14,5. Antwortsatz mit Einheiten."}, {"g": "Ergebnis: a) 14,4 m² b) 14,5 m"}], "loesung": "a) 14,4 m² b) 14,5 m", "hinweis": "a) A = 4,5 · 3,2 = 14,4. b) U = 2 · (4,5 + 3,2) = 15,4; minus Tür → 15,4 − 0,9 = 14,5. Antwortsatz mit Einheiten."}, {"aufgabe": "Ein Aquarium ist innen 60 cm lang, 30 cm breit und 40 cm hoch. Wie viele Liter passen hinein?", "schritte": [{"g": "Volumen: V = Länge · Breite · Höhe"}, {"g": "V = 60 · 30 · 40 = 72000 cm³"}, {"g": "1000 cm³ = 1 l", "op": "| : 1000"}, {"g": "72000 : 1000 = 72 → 72 l"}], "loesung": "72 l", "hinweis": "V = 60 · 30 · 40 = 72000 cm³ = 72 dm³ = 72 l."}], "wpool": [{"aufgabe": "Berechne den Umfang eines Quadrats mit a = 5 cm.", "schritte": [{"g": "U = 4 · a"}, {"g": "U = 4 · 5 = 20 cm"}], "loesung": "20 cm"}, {"aufgabe": "Berechne die Fläche eines Rechtecks mit 6 cm × 3 cm.", "schritte": [{"g": "A = a · b"}, {"g": "A = 6 · 3 = 18 cm²"}], "loesung": "18 cm²"}, {"aufgabe": "Berechne die Fläche eines Dreiecks mit g = 6 cm und h = 4 cm.", "schritte": [{"g": "A = g · h : 2"}, {"g": "A = 6 · 4 : 2 = 24 : 2 = 12 cm²"}], "loesung": "12 cm²"}, {"aufgabe": "Berechne das Volumen eines Würfels mit a = 2 cm.", "schritte": [{"g": "V = a · a · a"}, {"g": "V = 2 · 2 · 2 = 8 cm³"}], "loesung": "8 cm³"}, {"aufgabe": "3 dm³ = ____ l", "schritte": [{"g": "1 dm³ = 1 l"}, {"g": "3 · 1 = 3", "op": "| · 1"}, {"g": "3 dm³ = 3 l"}], "loesung": "3"}]}, "A2": {"id": "A2", "kerne": [{"name": "", "verstehen": ["Eine Variable ist ein Platzhalter für eine Zahl. Beispiel: Ein Stift kostet x Euro. 5 Stifte und 3 € Versand kosten dann 5x + 3 Euro. Der Term merkt sich die Rechnung – egal, was der Stift kostet. Kostet er 2 €, rechnest du 5 · 2 + 3 = 13. Das nennt man den Termwert: Einsetzen und ausrechnen.", "Wichtig beim Einsetzen negativer Zahlen: Klammern! T(x) = 2x² − 5 mit x = −3 heißt 2 · (−3)² − 5 = 2 · 9 − 5 = 13."], "fallen": [{"falle": "Reihenfolge beim Übersetzen", "falsch": "„5 Stifte à x € plus 3 €“ → 5 + 3x", "richtig": "5x + 3", "warum": "5-mal der Stiftpreis, dazu einmal 3 € – die Struktur des Textes zählt, nicht die Wortreihenfolge"}, {"falle": "Einsetzen ohne Klammer", "falsch": "T(−3) = 2 · −3² − 5 = −23", "richtig": "2 · (−3)² − 5 = 13", "warum": "Ohne Klammer wird erst 3² gerechnet und das Minus bleibt stehen"}], "ueben": [{"stufe": "leicht", "loesung": "3x", "hinweis": "„Das Dreifache“ heißt mal 3 – aus „mal“ wird ein Produkt → 3x.", "aufgabe": "„Das Dreifache von x“", "schritte": [{"g": "„Das Dreifache“ heißt mal 3 – aus „mal“ wird ein Produkt"}, {"g": "3x."}], "mc": ["3x", "x + 3", "x³", "3 − x"], "mcCorrect": 0}, {"stufe": "leicht", "loesung": "2·(x + 4)", "hinweis": "Klammer sichert die Summe", "aufgabe": "„Die Summe aus x und 4, dann mal 2“", "schritte": [{"g": "Erst die Summe bilden: x + 4"}, {"g": "„dann mal 2“ → die GANZE Summe wird verdoppelt"}, {"g": "Die Klammer sichert das: 2·(x + 4)"}], "mc": ["2", "(x + 4)", "2x + 4", "x + 8", "2x", "4"], "mcCorrect": 1}, {"stufe": "leicht", "loesung": "21", "hinweis": "Setze 5 für x ein → 4 · 5 + 1 = 21.", "aufgabe": "T(x) = 4x + 1: berechne T(5)", "schritte": [{"g": "Setze 5 für x ein"}, {"g": "4 · 5 + 1 = 21."}]}, {"stufe": "leicht", "loesung": "8", "hinweis": "Setze 4 für x ein → 20 − 3 · 4 = 20 − 12.", "aufgabe": "T(x) = 20 − 3x: berechne T(4)", "schritte": [{"g": "Setze 4 für x ein"}, {"g": "20 − 3 · 4 = 20 − 12."}, {"g": "Ergebnis: 8"}]}, {"stufe": "leicht", "loesung": "50 − 3k", "hinweis": "Struktur: Startbetrag minus Kosten", "aufgabe": "Eine Kinokarte kostet k €. Du kaufst 3 Karten und zahlst mit 50 €. Welcher Term beschreibt dein Restgeld?", "schritte": [{"g": "Startbetrag: 50 €"}, {"g": "Kosten: 3 Karten zu je k € → 3k"}, {"g": "Restgeld = Start minus Kosten → 50 − 3k"}], "mc": ["50 − 3k", "3k − 50", "50 + 3k", "47k"], "mcCorrect": 0}, {"stufe": "mittel", "loesung": "13", "hinweis": "Klammer ums Minus → 2 · 9 − 5", "aufgabe": "T(x) = 2x² − 5: berechne T(−3)", "schritte": [{"g": "Klammer ums Minus"}, {"g": "2 · 9 − 5"}, {"g": "Ergebnis: 13"}]}, {"stufe": "mittel", "loesung": "6", "hinweis": "Setze −2 mit Klammern ein → (−2)² − (−2) = 4 + 2.", "aufgabe": "T(x) = x² − x: berechne T(−2)", "schritte": [{"g": "Setze −2 mit Klammern ein"}, {"g": "(−2)² − (−2) = 4 + 2."}, {"g": "Ergebnis: 6"}]}, {"stufe": "mittel", "loesung": "9 + 2x", "hinweis": "Grundgebühr einmal, Filmpreis x-mal", "aufgabe": "Streaming: 9 € Grundgebühr + 2 € je Film (x Filme)", "schritte": [{"g": "Grundgebühr fällt EINMAL an: 9"}, {"g": "Filme: 2 € mal Anzahl x → 2x"}, {"g": "Gesamt: 9 + 2x"}], "mc": ["9 + 2x", "11x", "9x + 2", "2", "(9 + x)"], "mcCorrect": 0}, {"stufe": " 0 = 27,90", "op": "| − 1,40"}, {"g": "5x = 26,50", "op": "| : 5"}, {"g": "x = 5,30 → ein Becher kostet 5,30 €"}], "loesung": "5,30 €", "hinweis": "Gleichung aufstellen → 5 Becher plus 2 Sahne-Aufpreise = Gesamtpreis. 5x + 2 · 0,70 = 27,90 → 5x = 26,50 → x = 5,30."}, {"aufgabe": "Eine Rechteckseite ist 3 cm länger als die andere. Verlängert man beide um 1 cm, wächst die Fläche um 22 cm². Berechne die ursprünglichen Seiten mit x-Ansatz.", "schritte": [{"g": "Ansatz: (x + 1)(x + 4) = x(x + 3) + 22"}, {"g": "x² + 5x + 4 = x² + 3x + 22", "op": "| − x²"}, {"g": "5x + 4 = 3x + 22", "op": "| − 3x"}, {"g": "2x + 4 = 22", "op": "| − 4"}, {"g": "2x = 18", "op": "| : 2"}, {"g": "x = 9 → Seiten 9 cm und 12 cm"}], "loesung": "9 cm und 12 cm", "hinweis": "Seiten x und x + 3 ansetzen; neue Fläche = alte Fläche + 22: (x + 1)(x + 4) = x(x + 3) + 22 → 2x = 18 → x = 9."}, {"aufgabe": "Im Dreieck ist β doppelt so groß wie α, und α ist 40° kleiner als γ. Stelle eine Gleichung auf und berechne alle Winkel.", "schritte": [{"g": "Ansatz: α + β + γ = 180° mit β = 2α und γ = α + 40°"}, {"g": "α + 2α + α + 40° = 180°", "op": "zusammenfassen"}, {"g": "4α + 40° = 180°", "op": "| − 40°"}, {"g": "4α = 140°", "op": "| : 4"}, {"g": "α = 35° → β = 70°, γ = 75°"}, {"g": "Probe: 35° + 70° + 75° = 180° ✓"}], "loesung": "35°, 70°, 75°", "hinweis": "α + 2α + (α + 40°) = 180° → 4α = 140° → α = 35°"}], "wpool": [{"aufgabe": "x + 9 = 4", "schritte": [{"g": "x + 9 = 4", "op": "| − 9"}, {"g": "x = 4 − 9"}, {"g": "x = −5"}, {"g": "Probe: −5 + 9 = 4 ✓"}], "loesung": "x = −5"}, {"aufgabe": "5x = −20", "schritte": [{"g": "5x = −20", "op": "| : 5"}, {"g": "x = −4"}, {"g": "Probe: 5 · (−4) = −20 ✓"}], "loesung": "x = −4"}, {"aufgabe": "2x − 3 = 7", "schritte": [{"g": "2x − 3 = 7", "op": "| + 3"}, {"g": "2x = 10", "op": "| : 2"}, {"g": "x = 5"}, {"g": "Probe: 10 − 3 = 7 ✓"}], "loesung": "x = 5"}, {"aufgabe": "x : 2 = −3", "schritte": [{"g": "x : 2 = −3", "op": "| · 2"}, {"g": "x = −3 · 2"}, {"g": "x = −6"}, {"g": "Probe: −6 : 2 = −3 ✓"}], "loesung": "x = −6"}], "titel": "Gleichungen lösen – Schritt für Schritt"}, "A5": {"id": "A5", "kerne": [{"name": "", "verstehen": ["Prozent heißt „von Hundert“ → 25 % sind 25 von 100, also ein Viertel. 25 % von 84 € rechnest du als 84 · 0,25 = 21 € – oder über 1 % → 84 : 100 = 0,84 mal 25. Drei Größen spielen mit: der Grundwert G (das Ganze, 84 €), der Prozentsatz p (25 %) und der Prozentwert W (der Anteil, 21 €). Merksatz → W = G · p.", "Bevor es um Preis-Änderungen geht, noch einmal die wichtigste Regel der ganzen Prozentrechnung: Das Ganze ist immer 100 %, und 100 % = 1. Deshalb kannst du jede Prozentzahl als Dezimalzahl schreiben → 20 % = 0,2, 80 % = 0,8, 15 % = 0,15.", "Preissenkung – Schritt für Schritt: Ein Preis wird um 20 % gesenkt. Frage zuerst → Wie viel Prozent BLEIBEN übrig? 100 % − 20 % = 80 %. Schreibe die 80 % als Dezimalzahl → 80 % = 0,8. Multipliziere → 0,8 · alter Preis = neuer Preis. Beispiel mit 60 € → 0,8 · 60 = 48 €. Fertig – der gesenkte Preis ist 48 €.", "Preiserhöhung geht genauso, nur mit Plus: +15 % heißt → 100 % + 15 % = 115 %. Und 115 % = 1,15. Also → 1,15 · alter Preis = neuer Preis. Beispiel mit 40 € → 1,15 · 40 = 46 €. Auch die 19 % Mehrwertsteuer sind so eine Erhöhung → 100 % + 19 % = 119 % → 119 % = 1,19 → Preis ohne Steuer · 1,19 = Preis mit Steuer.", "Und rückwärts? Wenn 32 € schon der Preis NACH 20 % Rabatt sind, dann sind die 32 € genau 80 % vom alten Preis (100 % − 20 % = 80 %). Also gilt → 0,8 · G = 32 → G = 32 : 0,8 = 40 €. Der alte Preis war 40 €."], "fallen": [{"falle": "Prozentzahl addiert", "falsch": "40 € + 15 % = 55 €", "richtig": "40 · 1,15 = 46 €", "warum": "15 % VON 40 sind 6 € – Prozent ist ein Anteil, keine Euro-Zahl"}, {"falle": "Rabatt rückwärts falsch", "falsch": "32 € + 20 % = 38,40 €", "richtig": "32 : 0,8 = 40 €", "warum": "Die 20 % beziehen sich auf den ALTEN Preis (Grundwert), nicht auf 32 €"}], "ueben": [{"stufe": "leicht", "loesung": "25 €", "hinweis": "10 % ist ein Zehntel – einf
