weis": "Thales gibt dir γ = 90° geschenkt – dann Winkelsumme."}, {"stufe": "", "aufgabe": "Dreieck im Thaleskreis: Der eine spitze Winkel ist doppelt so groß wie der andere. Wie groß ist der kleinere?", "schritte": [{"g": "Satz des Thales: Der Winkel bei C ist 90°"}, {"g": "Die beiden spitzen Winkel ergänzen sich zu 180° − 90° = 90°"}, {"g": "Kleinerer Winkel x, größerer 2x: x + 2x = 90° → 3x = 90°"}, {"g": "x = 30° – Ergebnis: Der kleinere Winkel ist 30° (der größere 60°)"}], "loesung": "30°", "hinweis": "Im Thaleskreis bleiben für die beiden spitzen Winkel zusammen genau 90°."}, {"stufe": "", "aufgabe": "Ein rechtwinkliges Dreieck hat den Umkreisradius r = 3,5 cm. Wie lang ist seine Hypotenuse?", "schritte": [{"g": "Umkehrung des Thales-Satzes: Der Umkreismittelpunkt liegt in der Mitte der Hypotenuse"}, {"g": "Die Hypotenuse ist also der DURCHMESSER des Umkreises"}, {"g": "Durchmesser = 2 · r = 2 · 3,5 = 7"}, {"g": "Ergebnis: Die Hypotenuse ist 7 cm lang"}], "loesung": "7 cm", "hinweis": "Hypotenuse = Durchmesser des Umkreises – also doppelter Radius."}], "transfer": [{"stufe": "", "aufgabe": "Begründe mit dem Satz des Thales und seiner Umkehrung: Der Umkreisradius eines rechtwinkligen Dreiecks ist halb so lang wie die Hypotenuse.", "schritte": [{"g": "Umkehrung des Thales-Satzes: Ist das Dreieck bei C rechtwinklig, dann liegt C auf dem Halbkreis über AB"}, {"g": "Der Kreis über AB durch C geht also durch ALLE drei Ecken → er ist der Umkreis des Dreiecks"}, {"g": "Sein Mittelpunkt M ist die Mitte der Hypotenuse AB"}, {"g": "Sein Radius ist MA = MB = MC = AB : 2 → halb so lang wie die Hypotenuse ✓"}], "loesungsbild": "k_c3_umkreisradius", "loesung": "Begründung über den Satz des Thales und seine Umkehrung – siehe Vorgehen", "hinweis": "Umkehrung: C liegt auf dem Thaleskreis über AB → der Kreis über AB durch C ist der Umkreis; sein Mittelpunkt ist die Hypotenusenmitte, sein Radius AB/2.", "format": "SK"}, {"stufe": "", "aufgabe": "Über einer Strecke AB = 6 cm sollen alle Punkte C markiert werden, für die das Dreieck ABC rechtwinklig bei C ist. Konstruiere die Ortslinie und begründe.", "schritte": [{"g": "Satz des Thales: Liegt C auf dem Halbkreis über AB, ist der Winkel bei C ein rechter → JEDER Kreispunkt passt"}, {"g": "Umkehrung: Ist der Winkel bei C ein rechter, liegt C auf dem Kreis → KEIN anderer Punkt passt"}, {"g": "Beides zusammen: Die Ortslinie ist genau die Kreislinie über AB – beide Halbkreise"}, {"g": "A und B selbst ausnehmen: Dort entsteht kein Dreieck mehr (offene Punkte in der Zeichnung)"}, {"g": "So zeichnest du sie: Mitte M von AB konstruieren (Mittelsenkrechte), dann Kreis um M durch A und B"}], "loesungsbild": "k_c3_ortslinie", "loesung": "Thaleskreis (beide Halbkreise) über AB, ohne A und B selbst", "hinweis": "Satz (Halbkreis → 90°) und Umkehrung (90° → Halbkreis) zusammen ergeben: genau die Kreislinie.", "format": "SK"}], "wpool": [{"aufgabe": "Ein Dreieck liegt im Thaleskreis (AB ist Durchmesser). Wie groß ist der Winkel γ bei C?", "schritte": [{"g": "Satz des Thales: Dreieck im Halbkreis, AB = Durchmesser → rechter Winkel bei C"}, {"g": "γ = 90°"}], "loesung": "90°", "stufe": "leicht"}, {"aufgabe": "Ein Dreieck liegt im Thaleskreis, α = 40°. Wie groß ist β?", "schritte": [{"g": "Satz des Thales: rechter Winkel bei C → γ = 90°"}, {"g": "Winkelsumme im Dreieck: 180°"}, {"g": "β = 180° − 90° − 40° = 50°"}], "loesung": "50°", "stufe": "mittel"}, {"aufgabe": "Über welcher Seite liegt der Thaleskreis eines rechtwinkligen Dreiecks?", "schritte": [{"g": "Satz des Thales: Der rechte Winkel liegt dem Durchmesser GEGENÜBER"}, {"g": "Dem rechten Winkel gegenüber liegt die längste Seite – die Hypotenuse"}, {"g": "→ über der Hypotenuse"}], "loesung": "Über der Hypotenuse", "stufe": "mittel"}, {"aufgabe": "Thaleskreis über PM schneidet Kreis um M – was sind die Schnittpunkte?", "loesungsbild": "k_c3_tangenten", "schritte": [{"g": "Satz des Thales: Im Schnittpunkt steht der Radius senkrecht auf der Verbindung zu P (rechter Winkel im Halbkreis)"}, {"g": "Eine Gerade, die den Kreis berührt und senkrecht auf dem Radius steht, ist eine Tangente"}, {"g": "→ die Schnittpunkte sind die Berührpunkte der Tangenten"}], "loesung": "Berührpunkte der Tangenten", "stufe": "mittel"}, {"aufgabe": "AB = 10 cm ist der Durchmesser, C liegt auf dem Thaleskreis. Wie groß ist der Umkreisradius?", "schritte": [{"g": "Nach dem Satz des Thales ist AB zugleich Durchmesser des Umkreises"}, {"g": "Umkreisradius = halber Durchmesser"}, {"g": "10 : 2 = 5 → 5 cm"}], "loesung": "5 cm", "stufe": "mittel"}, {"stufe": "mittel", "aufgabe": "Ein Dreieck liegt im Thaleskreis über AB, β = 63°. Wie groß ist α?", "loesung": "27°", "quelle": "analog Buch S. 122 (Satz des Thales)", "schritte": [{"g": "Satz des Thales: der Winkel bei C ist 90°"}, {"g": "α + β = 90°"}, {"g": "90° − 63° = 27°"}]}, {"stufe": "mittel", "aufgabe": "AB = 12 cm ist der Durchmesser des Thaleskreises. Wie groß ist der Radius?", "loesung": "6 cm", "quelle": "analog Buch S. 122 (Thaleskreis)", "schritte": [{"g": "Der Radius ist der halbe Durchmesser"}, {"g": "12 cm : 2 = 6 cm"}]}, {"stufe": "mittel", "aufgabe": "Wo liegt der Mittelpunkt des Thaleskreises über der Strecke AB?", "loesung": "In der Mitte von AB", "quelle": "analog Buch S. 122 (Thaleskreis)", "schritte": [{"g": "Der Thaleskreis hat AB als Durchmesser"}, {"g": "Sein Mittelpunkt liegt genau in der Mitte von AB"}]}, {"stufe": "mittel", "aufgabe": "Ein rechtwinkliges Dreieck hat die Hypotenuse AB = 10 cm. Wie weit ist C vom Mittelpunkt von AB entfernt?", "loesung": "5 cm", "quelle": "analog Buch S. 122 (Satz des Thales) und KA 3. Schulaufgabe, Aufg. 5", "schritte": [{"g": "C liegt auf dem Thaleskreis über AB", "op": "Satz des Thales rückwärts"}, {"g": "Der Abstand ist der Radius: 10 cm : 2"}, {"g": "= 5 cm"}]}, {"stufe": "mittel", "aufgabe": "Ein Dreieck liegt im Thaleskreis über AB, α = 55°. Wie groß ist β?", "loesung": "35°", "quelle": "analog Buch S. 122 (Satz des Thales)", "schritte": [{"g": "Satz des Thales: γ = 90°"}, {"g": "α + β = 90°"}, {"g": "90° − 55° = 35°"}]}, {"stufe": "mittel", "aufgabe": "Der Thaleskreis über AB hat den Radius 7 cm. Wie lang ist die Strecke AB?", "loesung": "14 cm", "quelle": "analog Buch S. 122 (Thaleskreis)", "schritte": [{"g": "AB ist der Durchmesser"}, {"g": "Durchmesser = 2 · Radius = 2 · 7 cm"}, {"g": "= 14 cm"}]}], "test": [{"stufe": "mittel", "aufgabe": "Ein rechtwinkliges Dreieck ABC hat b = 6 cm und α = γ = 45°. Wie groß ist β?", "schritte": [{"g": "Winkelsumme: α + β + γ = 180°"}, {"g": "45° + β + 45° = 180°"}, {"g": "β = 90°"}], "loesung": "90°", "hinweis": "Der rechte Winkel liegt dort, wo die beiden 45°-Winkel NICHT sind.", "quelle": "Buch 6.9, Aufg. 39c"}, {"stufe": "schwer", "aufgabe": "Konstruiere ein rechtwinkliges Dreieck, ohne die Winkel zu messen, bei dem ein weiterer Winkel 60° misst. Wie groß ist der dritte Winkel?", "schritte": [{"g": "Der rechte Winkel entsteht über dem Thaleskreis"}, {"g": "180° − 90° − 60°"}, {"g": "= 30°"}], "loesung": "30°", "hinweis": "Über dem Thaleskreis ist der Winkel bei C immer 90° – der Rest folgt aus der Winkelsumme.", "quelle": "Buch 6.9, Aufg. 41★ b"}]}, "C4": {"id": "C4", "titel": "Terme rückwärts – Faktorisieren", "kerne": [{"name": "", "verstehen": ["Faktorisieren heißt: eine Summe als Produkt schreiben – also rückwärts denken. Weg 1: Ausklammern. Steckt in jedem Summanden derselbe Faktor, ziehst du ihn heraus → 6x² + 9x = 3x · (2x + 3). Prüfe durch Ausmultiplizieren!", "Weg 2: Binomische Formeln rückwärts. x² + 6x + 9 hat die Bauart a² + 2ab + b² → (x + 3)². Und x² − 9 ist eine Differenz zweier Quadrate → 3. binomische Formel → (x + 3)(x − 3).", "So erkennst du die Bauart: Sind erster und letzter Summand Quadrate? Passt das mittlere Glied zu 2ab? Bei nur zwei Gliedern mit Minus: Differenz von Quadraten. Warum das Ganze? Produkte kann man kürzen und Gleichungen damit lösen – dein Vorsprung für Klasse 8."], "fallen": [{"falle": "Differenz von Quadraten als Quadrat gelesen", "falsch": "x² − 9 = (x − 3)²", "richtig": "x² − 9 = (x + 3)(x − 3)", "warum": "(x − 3)² = x² − 6x + 9 – das mittlere Glied fehlt hier aber"}, {"falle": "Nur teilweise ausgeklammert", "falsch": "6x² + 9x = 3(2x² + 3x)", "richtig": "6x² + 9x = 3x(2x + 3)", "warum": "Auch x steckt in beiden Summanden – immer den GRÖSSTEN gemeinsamen Faktor nehmen"}], "ueben": [{"stufe": "leicht", "aufgabe": "5x + 10", "schritte": [{"g": "Gemeinsamer Faktor 5"}, {"g": "5x + 10 = 5 · x + 5 · 2"}, {"g": "= 5(x + 2)"}], "loesung": "5(x + 2)", "hinweis": "Ausklammern", "format": "E"}, {"stufe": "leicht", "aufgabe": "7a − 21", "schritte": [{"g": "Gemeinsamer Faktor 7"}, {"g": "7a − 21 = 7 · a − 7 · 3"}, {"g": "= 7(a − 3)"}], "loesung": "7(a − 3)", "hinweis": "Ausklammern", "format": "E"}, {"stufe": "leicht", "aufgabe": "x² + 10x + 25", "schritte": [{"g": "1. binomische Formel rückwärts: a² + 2ab + b² = (a + b)². Probe"}, {"g": "25 = 5², Mittelglied 2 · x · 5 = 10x passt."}, {"g": "Ergebnis: (x + 5)²"}], "loesung": "(x + 5)²", "hinweis": "1. binomische Formel rückwärts: a² + 2ab + b² = (a + b)². Probe.", "format": "E"}, {"stufe": "mittel", "aufgabe": "x² − 10x + 25", "schritte": [{"g": "2. binomische Formel rückwärts: a² − 2ab + b² = (a − b)². Probe"}, {"g": "25 = 5², Mittelglied 2 · x · 5 = 10x passt."}, {"g": "Ergebnis: (x − 5)²"}], "loesung": "(x − 5)²", "hinweis": "2. binomische Formel rückwärts: a² − 2ab + b² = (a − b)². Probe.", "format": "E"}, {"stufe": "mittel", "aufgabe": "4x² − 9", "schritte": [{"g": "Quadrate erkennen"}, {"g": "(2x)² und 3²"}, {"g": "Ergebnis: (2x + 3)(2x − 3)"}], "loesung": "(2x + 3)(2x − 3)", "hinweis": "Quadrate erkennen → (2x)² und 3²", "format": "E"}, {"stufe": "mittel", "aufgabe": "18a² − 8", "schritte": [{"g": "Erst 2 ausklammern"}, {"g": "2(9a² − 4), dann 3. binomische Formel"}, {"g": "Ergebnis: 2(3a + 2)(3a − 2)"}], "loesung": "2(3a + 2)(3a − 2)", "hinweis": "Erst 2 ausklammern → 2(9a² − 4), dann 3. binomische Formel", "format": "E"}, {"stufe": "mittel", "aufgabe": "x² + 14x + 49", "schritte": [{"g": "1. binomische Formel rückwärts"}, {"g": "49 = 7², und das Mittelglied 2 · x · 7 = 14x passt."}, {"g": "Ergebnis: (x + 7)²"}], "loesung": "(x + 7)²", "hinweis": "1. binomische Formel rückwärts.", "format": "E"}, {"stufe": "mittel", "aufgabe": "Ergänze das Kästchen: −2ab · (□) = −2ab + a²b", "schritte": [{"g": "Rückwärts dividieren; Probe"}, {"g": "−2ab · 1 = −2ab; −2ab · (−a/2) = a²b"}, {"g": "Ergebnis: 1 − a/2"}], "loesung": "1 − a/2", "hinweis": "Teile jedes Glied der rechten Seite durch −2ab – und mach die Probe.", "format": "E"}, {"aufgabe": "Klammere so weit wie möglich aus: 12a²b − 18ab² + 6ab", "loesung": "6ab(2a − 3b + 1)", "hinweis": "Suche den größten gemeinsamen Faktor – bei den Zahlen UND bei den Variablen.", "schritte": [{"g": "Zahlen: größter gemeinsamer Teiler von 12, 18 und 6 ist 6", "op": "ggT bilden"}, {"g": "Variablen: a und b stecken in jedem Glied → ab"}, {"g": "Also 6ab ausklammern: 12a²b : 6ab = 2a; 18ab² : 6ab = 3b; 6ab : 6ab = 1"}, {"g": "Ergebnis: 6ab(2a − 3b + 1) · Probe: ausmultiplizieren ergibt wieder 12a²b − 18ab² + 6ab ✓"}], "quelle": "analog Buch S. 93, Aufg. 16h (Ausklammern mit gemeinsamem Variablenfaktor)", "stufe": "schwer"}, {"aufgabe": "Schreibe als Produkt: 9x² − 25", "loesung": "(3x + 5)(3x − 5)", "hinweis": "Beide Glieder sind Quadratzahlen – welche binomische Formel passt rückwärts?", "schritte": [{"g": "9x² = (3x)² und 25 = 5²", "op": "als Quadrate schreiben"}, {"g": "Die Form a² − b² gehört zur 3. binomischen Formel", "op": "Formel erkennen"}, {"g": "a² − b² = (a + b)(a − b) mit a = 3x und b = 5"}, {"g": "Ergebnis: (3x + 5)(3x − 5)"}], "quelle": "analog KA 2. Test binomische Formeln (Klasse 7, 11/2019), Aufg. 1a (3. binomische Formel rückwärts)", "stufe": "schwer"}]}], "uplus": [{"stufe": "", "aufgabe": "16x² − 24x + 9", "schritte": [{"g": "2. binomische Formel rückwärts"}, {"g": "(4x)² = 16x², 3² = 9, und das Mittelglied 2 · 4x · 3 = 24x passt ✓."}, {"g": "Ergebnis: (4x − 3)²"}], "loesung": "(4x − 3)²", "hinweis": "2. binomische Formel rückwärts.", "format": "E"}, {"stufe": "", "aufgabe": "50 − 2x²", "schritte": [{"g": "Erst den gemeinsamen Faktor 2 ausklammern"}, {"g": "2(25 − x²). Dann 3. binomische Formel rückwärts"}, {"g": "25 − x² = (5 + x)(5 − x)."}, {"g": "Ergebnis: 2(5 + x)(5 − x)"}], "loesung": "2(5 + x)(5 − x)", "hinweis": "Erst den gemeinsamen Faktor 2 ausklammern.", "format": "E"}], "transfer": [{"stufe": "", "aufgabe": "Rechne geschickt im Kopf mit einer binomischen Formel: a) 99² b) 102 · 98", "schritte": [{"g": "a) 99 = 100 − 1 → 2. binomische Formel"}, {"g": "(100 − 1)² = 10000 − 200 + 1 = 9801"}, {"g": "b) 102 · 98 = (100 + 2)(100 − 2) → 3. binomische Formel"}, {"g": "10000 − 4 = 9996"}, {"g": "Ergebnis: 9801 und 9996"}], "loesung": "9801 und 9996", "hinweis": "a) (100 − 1)² = 10000 − 200 + 1 = 9801. b) (100 + 2)(100 − 2) = 10000 − 4 = 9996.", "format": "E"}, {"stufe": "", "aufgabe": "Der Term x² + 12x + 36 beschreibt einen quadratischen Garten. Wie lang ist seine Seite? Deute das Ergebnis geometrisch.", "schritte": [{"g": "Bauart prüfen: x² und 36 = 6² sind Quadrate · 2 · x · 6 = 12x passt"}, {"g": "x² + 12x + 36 = (x + 6)²"}, {"g": "Seite des Gartens: x + 6"}, {"g": "Geometrisch: Quadrat x² + zwei Rechtecke 6x + Quadrat 36 = ein großes Quadrat"}], "loesung": "x + 6", "hinweis": "x² + 12x + 36 = (x + 6)². Geometrisch: Quadrat x², zwei Rechtecke 6x, Quadrat 36 – zusammen ein Quadrat der Seite x + 6 (Flächenmodell wie B1).", "format": "E + SK"}], "wpool": [{"aufgabe": "x² − 1", "schritte": [{"g": "Differenz zweier Quadrate: 1 = 1²"}, {"g": "3. binomische Formel → (x + 1)(x − 1)"}], "loesung": "(x + 1)(x − 1)", "stufe": "mittel"}, {"aufgabe": "4x + 8", "schritte": [{"g": "Gemeinsamer Faktor 4"}, {"g": "= 4(x + 2)"}], "loesung": "4(x + 2)", "stufe": "mittel"}, {"aufgabe": "x² − 4x + 4", "schritte": [{"g": "Bauart: x² und 4 = 2², Mittelglied 2 · x · 2 = 4x mit Minus"}, {"g": "2. binomische Formel → (x − 2)²"}], "loesung": "(x − 2)²", "stufe": "mittel"}, {"aufgabe": "9x² − 16", "schritte": [{"g": "9x² = (3x)² und 16 = 4²"}, {"g": "3. binomische Formel → (3x + 4)(3x − 4)"}], "loesung": "(3x + 4)(3x − 4)", "stufe": "mittel"}, {"aufgabe": "100 − y²", "schritte": [{"g": "100 = 10²"}, {"g": "3. binomische Formel → (10 + y)(10 − y)"}], "loesung": "(10 + y)(10 − y)", "stufe": "mittel"}, {"stufe": "mittel", "aufgabe": "Schreibe als Produkt: 6x + 9", "loesung": "3(2x + 3)", "quelle": "analog Buch S. 93, Aufg. 16 (Ausklammern)", "schritte": [{"g": "Größter gemeinsamer Teiler von 6 und 9 → 3"}, {"g": "6x : 3 = 2x und 9 : 3 = 3"}, {"g": "= 3(2x + 3)"}]}, {"stufe": "mittel", "aufgabe": "Schreibe als Produkt: x² − 36", "loesung": "(x + 6)(x − 6)", "quelle": "analog Buch S. 93 (binomische Formel rückwärts)", "schritte": [{"g": "36 = 6², also x² − 6²"}, {"g": "3. binomische Formel rückwärts"}, {"g": "= (x + 6)(x − 6)"}]}, {"stufe": "mittel", "aufgabe": "Schreibe als Produkt: 4x² − 9", "loesung": "(2x + 3)(2x − 3)", "quelle": "analog KA 2. Test binomische Formeln, Aufg. 1a", "schritte": [{"g": "4x² = (2x)² und 9 = 3²"}, {"g": "3. binomische Formel rückwärts"}, {"g": "= (2x + 3)(2x − 3)"}]}, {"stufe": "mittel", "aufgabe": "Schreibe als Produkt: x² + 6x + 9", "loesung": "(x + 3)²", "quelle": "analog Buch S. 93 (binomische Formel rückwärts)", "schritte": [{"g": "x² und 9 = 3² sind Quadrate"}, {"g": "Mittleres Glied 6x = 2 · x · 3 → 1. binomische Formel"}, {"g": "= (x + 3)²"}]}, {"stufe": "mittel", "aufgabe": "Klammere aus: 5a² − 10a", "loesung": "5a(a − 2)", "quelle": "analog Buch S. 93, Aufg. 16h (Ausklammern mit Variablenfaktor)", "schritte": [{"g": "Zahlen: ggT von 5 und 10 → 5"}, {"g": "Variable: a steckt in beiden Gliedern"}, {"g": "5a² : 5a = a und 10a : 5a = 2 → 5a(a − 2)"}]}, {"stufe": "mittel", "aufgabe": "Schreibe als Produkt: 3x² − 12x", "loesung": "3x(x − 4)", "quelle": "analog Buch S. 93, Aufg. 16 (Ausklammern)", "schritte": [{"g": "Zahlen: ggT von 3 und 12 → 3"}, {"g": "Variable: x steckt in beiden Gliedern"}, {"g": "3x² : 3x = x und 12x : 3x = 4 → 3x(x − 4)"}]}, {"stufe": "mittel", "aufgabe": "Schreibe als Produkt: 25 − y²", "loesung": "(5 + y)(5 − y)", "quelle": "analog Buch S. 93 (binomische Formel rückwärts)", "schritte": [{"g": "25 = 5², also 5² − y²"}, {"g": "3. binomische Formel rückwärts"}, {"g": "= (5 + y)(5 − y)"}]}], "test": [{"stufe": "mittel", "aufgabe": "Klammere so weit wie möglich aus: −2 − 2x", "schritte": [{"g": "Beide Summanden haben den Faktor −2"}, {"g": "−2 = −2 · 1 und −2x = −2 · x"}, {"g": "= −2(1 + x)"}], "loesung": "−2(1 + x)", "hinweis": "Wird ein Teil komplett ausgeklammert, bleibt in der Klammer eine 1 stehen.", "quelle": "Buch 5.3, Aufg. 16d · Lösung S. 177 ✓"}, {"stufe": "schwer", "aufgabe": "Klammere so weit wie möglich aus: 6p − 2q + 2p + 4q", "schritte": [{"g": "Zuerst zusammenfassen: 6p + 2p = 8p; −2q + 4q = 2q"}, {"g": "8p + 2q"}, {"g": "gemeinsamer Faktor 2"}, {"g": "= 2(4p + q)"}], "loesung": "2(4p + q)", "hinweis": "Erst zusammenfassen, dann ausklammern – sonst übersieht man den gemeinsamen Faktor.", "quelle": "Buch 5.3, Aufg. 16g · Lösung S. 177 ✓"}]}, "C5": {"id": "C5", "titel": "Term-Profi: mehrere Variablen", "kerne": [{"name": "", "verstehen": ["Terme mit mehreren Variablen sehen wild aus – bis du ihre Struktur erkennst. Frage 1: Was ist die ÄUSSERSTE Rechenart? 3 · (x + 2) ist ein Produkt (aus Zahl und Summe), (a + b)² eine Potenz, a/b ein Quotient. Mit diesen Fachbegriffen beschreibst du jeden Term.", "Frage 2: Was ist gleichartig? Nur Glieder mit GENAU denselben Variablen und Exponenten darfst du zusammenfassen → 2xy + 3xy = 5xy, aber a²b und ab² bleiben getrennt – schau genau auf die Hochzahlen.", "Frage 3 bei „äquivalent oder nicht?“: Forme um oder setze eine Testzahl ein. Achtung: EINE Übereinstimmung beweist nichts – ein einziges Gegenbeispiel widerlegt aber sicher (das kennst du aus den Klassenarbeiten)."], "fallen": [{"falle": "Verschiedene Variablen zusammengezogen", "falsch": "2a + 3b   if(!g){ const a=new Uint8Array(16); crypto.getRandomValues(a);
    g=[...a].map(b=>b.toString(16).padStart(2,"0")).join("");
    try{ localStorage.setItem("mb_geraet",g); }catch(e){} }
  return g; }

async function serverFragen(pfad,code){
  const ctl=("AbortController" in window)? new AbortController() : null;
  const uhr=ctl? setTimeout(()=>{ try{ ctl.abort(); }catch(e){} }, 8000) : null;
  try{
    const r=await fetch(LIZENZ_SERVER+pfad,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({code:canonCode(code),geraet:geraetId()}), signal: ctl? ctl.signal : undefined});
    return await r.json();
  } finally { if(uhr) clearTimeout(uhr); } }
function erneuernImHintergrund(code){
  serverFragen("/pruefen",code).then(a=>{
    if(a&&a.ok){ ticketSchreiben(ticketAus(a)); }
    else if(a&&(a.grund==="gesperrt"||a.grund==="abgelaufen"||a.grund==="unbekannt")){

  }).catch(()=>{}); }

async function verifyUnlock(){ const c=localStorage.getItem("mb_unlock"); if(!c) return false;
  let lokal=false; try{ lokal=UNLOCK_HASHES.includes(await codeHash(canonCode(c))); }catch(e){ lokal=false; }
  if(!lokal) return false;
  const h=heuteSicher(); const t=ticketLesen();
  if(t&&t.bis&&h<=t.bis){ if(t.geprueft!==h) erneuernImHintergrund(c); return true; }
  try{
    const a=await serverFragen("/pruefen",c);
    if(a&&a.ok){ ticketSchreiben(ticketAus(a)); return true; }
    LIZENZ_ANTWORT=a||null; return false;
  }catch(e){
    if(t&&t.bis&&h<=isoPlus(t.bis,KULANZ_TAGE)) return true;
    if(!t){ ticketSchreiben({bis:isoPlus(h,VORLAEUFIG_TAGE),vorlaeufig:true}); return true; }

  /* 1.62: Einmalig erkennen, ob dieser Lernstand aus dem 28er-Check stammt. Danach steht es
     fest im Lernstand - die Erkennung darf nicht bei jedem Laden neu raten, sonst kippt sie,

  if(S.check28===undefined){ S.check28 = istAlterCheck(S); if(S.check28) S.hinweis162=true; }

     bereits erledigten Tage EINMALIG auf ihr Thema umgeschrieben. Das ist genau hier korrekt,

  if(!S.themenUmzug && Object.keys(S.daysDone).length && !Object.keys(S.themenDone).length){

const $=id=>document.getElementById(id);
const main=$("main"), statusbar=$("statusbar");
function escAttr(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
/* esc: zusaetzlich werden alle Pfeile optisch auf Zeichenmitte gehoben (Rueckmeldung Annette 13.08.2026) -
   gilt automatisch in der GESAMTEN App, weil jeder sichtbare Text durch esc laeuft. Fuer Attribute escAttr nutzen! */
function escBase(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/→/g,'<span class="pf">→</span>'); }
// Brüche app-weit mit echtem Bruchstrich (gestapelt) statt Schrägstrich – Anweisung Annette 13.08.2026.
// Nur echte Brüche: Zahl-oder-EINZELbuchstabe / Zahl-oder-EINZELbuchstabe mit Wortgrenzen –
// „und/oder“, „Stufen-/Wechselwinkelsatz“, „AB/2“, URLs usw. bleiben unangetastet (kein Lookbehind: alte Safari-Versionen).
/* Teilaufgaben-Gliederung (14.08.2026, Auftrag Annette): Aufgaben und Loesungen mit
   Teilen a), b), c) ... oder (i), (ii) ... werden untereinander angezeigt - schnell erfassbar.
   Schutz: Formeln wie (a + b)(a - b) bleiben unangetastet (Operator vor dem Buchstaben),
   kurze Antworten wie "c) und d)" bleiben in einer Zeile. */
function gliedere(t){
  if(typeof t!=="string"||t.length<40) return t;
  const marker=/(^|\s)(\(?(?:[a-f]|i{1,3}|iv)\))(?=\s)/g;
  let count=0, m;
  const ops="+-−·×(";
  const erlaubt=(str,idx)=>{ let k=idx-1; while(k>=0&&str[k]===" ")k--; return k<0||ops.indexOf(str[k])<0; };
  while((m=marker.exec(t))!==null){ if(erlaubt(t,m.index)) count++; }
  if(count<2) return t;
  marker.lastIndex=0;
  return t.replace(marker,(mm,pre,mk,idx)=>erlaubt(t,idx)?"<br>"+mk:mm);
}
function esc(t){ return gliedere(escBase(t).replace(/(^|[^A-Za-z0-9\u00C0-\u024F])(\d+|[A-Za-z])\/(\d+|[A-Za-z])(?![A-Za-z0-9\u00C0-\u024F])/g,function(m,pre,z,n,off,str){
  if(/Teil\s*$/.test(str.slice(Math.max(0,off-8),off+pre.length))) return m; // "(Teil 1/2)" im Lernplan ist ein Zähler, kein Bruch (Korrektur Annette 14.08.2026)
  return pre+'<span class="frac"><span class="num">'+z+'</span><span class="den">'+n+'</span></span>';
})); }
function renderTextT(t){
  // escBase statt esc: Im Check bleiben Tipp-Beispiele fürs TIPPEN („z. B. 3/4“) im Schrägstrich-Format –
  // angezeigte Brüche stehen dort als FRAC-Platzhalter und werden hier gestapelt.
  let h=gliedere(escBase(t));
  // 1.54: allgemeiner Platzhalter FRAC<Zaehler><Nenner> – der Zaehler darf auch eine Variable sein (FRACx2)
  h=h.replace(/FRAC([0-9a-zA-Z])([0-9]+)/g, (m,z,n)=>'<span class="frac"><span class="num">'+z+'</span><span class="den">'+n+'</span></span>');
  return h;
}

function confetti(){
  const c=document.createElement("canvas"); c.id="cf";
  c.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:50";
  document.body.appendChild(c);
  const x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#0E6E45","#FF5E3A","#D8431E","#DEF3E6","#FBE3DA"];
  const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height/2,v:2+Math.random()*3,r:3+Math.random()*4,col:cols[Math.floor(Math.random()*cols.length)],w:Math.random()*2-1}));
  let t=0; (function fall(){ t++; x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{ p.y+=p.v; p.x+=p.w; x.fillStyle=p.col; x.fillRect(p.x,p.y,p.r,p.r*1.6); });
    if(t<160) requestAnimationFrame(fall); else c.remove(); })();
}

/* ---------- Rechenfläche v1 ---------- */
function mountScratch(container, nr){
  const wrap=document.createElement("div"); wrap.className="scratch";
  const head=document.createElement("div"); head.className="row"; head.style.justifyContent="space-between";
  head.innerHTML='<span class="muted" style="font-size:.9rem">Rechenfläche – Stift, Finger oder Maus. <em>Dein Schmierblatt: Schreib wie im Heft, Brüche gern übereinander – gewertet wird nur das Ergebnis, das du oben einträgst.</em></span>';
  const clear=document.createElement("button"); clear.className="btn ghost small"; clear.textContent="Leeren";
  head.appendChild(clear); wrap.appendChild(head);
  const cv=document.createElement("canvas"); wrap.appendChild(cv); container.appendChild(wrap);
  const ctx=cv.getContext("2d");
  function strokes(){ return S.strokes[nr]||(S.strokes[nr]=[]); }
  function redraw(){
    ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);
    strokes().forEach(st=>{ if(st.length<2)return; ctx.beginPath(); ctx.moveTo(st[0],st[1]);
      for(let i=2;i<st.length;i+=2) ctx.lineTo(st[i],st[i+1]); ctx.stroke(); });
  }
  function resize(){
    const w=cv.clientWidth, h=cv.clientHeight;
    cv.width=w*devicePixelRatio; cv.height=h*devicePixelRatio;
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    ctx.lineWidth=2; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#173B2E";
    redraw();
  }
  let cur=null;
  cv.addEventListener("pointerdown",e=>{ cv.setPointerCapture(e.pointerId); const r=cv.getBoundingClientRect();
    cur=[Math.round(e.clientX-r.left),Math.round(e.clientY-r.top)]; strokes().push(cur); });
  cv.addEventListener("pointermove",e=>{ if(!cur)return; const r=cv.getBoundingClientRect();
    cur.push(Math.round(e.clientX-r.left),Math.round(e.clientY-r.top)); redraw(); });
  const up=()=>{ if(cur){ cur=null; save(); } };
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
  clear.addEventListener("click",()=>{ S.strokes[nr]=[]; save(); redraw(); });
  requestAnimationFrame(resize);
}

  if(d.id==="CHECK") return true;

   Aufzählungen (reihenfolgeunabhängig), Name=Wert-Antworten (Winkel, auch ausgeschrieben) */

const GREEK={alpha:"α",alfa:"α",beta:"β",gamma:"γ",delta:"δ",epsilon:"ε",lambda:"λ",my:"μ",mu:"μ",phi:"φ"};
function normTxt(t){ return String(t).toLowerCase().replace(/−/g,"-").replace(/\s+/g," ").replace(/[.!?]\s*$/,"").trim(); }
function termNorm(t){
  return String(t).toLowerCase().replace(/−/g,"-").replace(/\s+/g,"")
    .replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>"^"+[...m].map(c=>c==="⁻"?"-":"⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c)).join("")) // 1.49: Minus-Hochzahl (10⁻³) wird zu 10^-3 – so zählt die getippte Schreibweise ^- als richtig

function isTermLike(t){

     dabei weg - dadurch galt "441 und 499" als richtig. Bindewoerter schliessen den Termweg aus. */
  if(/(^|[^a-zäöüß])(und|oder|bzw|sowie|bis)([^a-zäöüß]|$)/i.test(String(t))) return false;

     w·a·h·r und die richtige Antwort „Ja" wurde falsch gewertet. Variablenprodukte im Bestand
     haben hoechstens zwei Buchstaben am Stueck (3ab, 6xy). */
  return /^[+\-]?[0-9a-zα-ω^+\-]+$/.test(n) && /[a-zα-ω]/.test(n) && !/[a-zα-ω]{3,}/.test(n);

function monoKey(m){ // "16x^2" -> "16|x^2" · "-8xy" -> "-8|x^1,y^1" · "y^2" -> "1|y^2"
  let sign=1, t=m;
  if(t[0]==="+") t=t.slice(1); else if(t[0]==="-"){ sign=-1; t=t.slice(1); }
  const cm=t.match(/^\d+(?:,\d+)?/); const coef=cm?parseFloat(cm[0].replace(",",".")):1;
  t=cm?t.slice(cm[0].length):t;
  const vars=[]; const re=/([a-zα-ω])(?:\^(\d+))?/g; let mm;
  while((mm=re.exec(t))) vars.push(mm[1]+"^"+(mm[2]||"1"));
  vars.sort();
  return (sign*coef)+"|"+vars.join(",");
}
function termEq(a,b){
  const split=t=>{ const n=termNorm(t); if(/[()=\/]/.test(n)) return null;
    const parts=n.replace(/([+\-])/g,"§$1").split("§").filter(Boolean);
    return parts.length?parts.map(monoKey).sort():null; };

  if(!pa||!pb) return null;
  return pa.length===pb.length && pa.every((x,i)=>x===pb[i]);

/* ---------------------------------------------------------------------------
   1.53 – Termrechner (Entscheidung Annette 18.08.2026)
   Befund davor: Wo die Mathematik IN der Klammer stand, verglich die Wertung nur den Rest.
   "(x + 5)²" gegen "(x + 6)²" hiess "richtig", weil nach dem Streichen der Klammer beidesmal
   nur "²" uebrig blieb. Betroffen waren 22 Aufgaben (Faktorisieren, binomische Formeln).
   Neu: Loesung und Eingabe werden als Term GELESEN und an sieben festen Stuetzstellen
   ausgerechnet. Gleiche Werte -> richtig. Ein abweichender Wert -> falsch.
   Nicht lesbar -> Selbstabgleich wie bisher (lieber nachfragen als falsch urteilen).

let FORM_HINWEIS="";                 // Zusatzhinweis fuer den Selbstabgleich (Formfrage)
function formHinweis(){ return FORM_HINWEIS; }
function exprParse(t){
  let n=String(t).replace(/−/g,"-").trim();
  n=n.replace(/^[a-zA-Zα-ω]\s*\(\s*[a-zA-Zα-ω]\s*\)\s*=\s*/,"");   // "f(x) = 0,4x" -> "0,4x"
  if(/[=;]/.test(n)) return null;
  /* 1.53: Malpunkt bleibt ein Rechenzeichen. termNorm loescht ihn (fuer "y·x²" richtig), aus
     "4,2 · 10⁻⁴" wurde dadurch die Zahl "4,210^-4". Hier wird er zu "*" und bleibt erhalten. */
  n=n.toLowerCase().replace(/\s+/g,"")
     .replace(/[⁻⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>"^"+[...m].map(c=>c==="⁻"?"-":"⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c)).join(""))
     .replace(/[·×]/g,"*");

  if(!/[0-9]/.test(n)&&!/[+\-^\/]/.test(n)) return null;   // ohne Zahl und ohne Rechenzeichen ist es Text
  let i=0;
  const ende=()=>i>=n.length;
  function pExpr(){
    let k=pTerm(); if(k===null) return null;
    while(!ende()&&(n[i]==="+"||n[i]==="-")){ const op=n[i++]; const r=pTerm(); if(r===null) return null; k={op:op,l:k,r:r}; }
    return k;
  }
  function pTerm(){
    let k=pUnary(); if(k===null) return null;
    for(;;){
      if(ende()) break;
      const c=n[i];
      if(c==="/"){ i++; const r=pUnary(); if(r===null) return null; k={op:"/",l:k,r:r}; continue; }
      if(c==="*"){ i++; const r=pUnary(); if(r===null) return null; k={op:"*",l:k,r:r}; continue; }
      if(/[0-9a-zα-ω(]/.test(c)){ const r=pUnary(); if(r===null) return null; k={op:"*",l:k,r:r}; continue; }  // 5(x+2)

  function pUnary(){
    if(!ende()&&n[i]==="-"){ i++; const r=pUnary(); return r===null?null:{op:"neg",l:r}; }
    if(!ende()&&n[i]==="+"){ i++; return pUnary(); }
    const b=pBase(); if(b===null) return null;
    if(!ende()&&n[i]==="^"){ i++; const e=pUnary(); return e===null?null:{op:"^",l:b,r:e}; }
    return b;

    if(ende()) return null;
    if(n[i]==="("){ i++; const e=pExpr(); if(e===null||ende()||n[i]!==")") return null; i++; return e; }
    const num=/^\d+(?:,\d+)?/.exec(n.slice(i));
    if(num){ i+=num[0].length; return {op:"num",v:parseFloat(num[0].replace(",","."))}; }
    if(/[a-zα-ω]/.test(n[i])) return {op:"var",v:n[i++]};
    return null;
  }
  const ast=pExpr();
  return (ast===null||!ende())?null:ast;
}
function exprEval(a,env){
  switch(a.op){
    case "num": return a.v;
    case "var": return (a.v in env)?env[a.v]:NaN;
    case "neg": return -exprEval(a.l,env);
    case "+": return exprEval(a.l,env)+exprEval(a.r,env);
    case "-": return exprEval(a.l,env)-exprEval(a.r,env);
    case "*": return exprEval(a.l,env)*exprEval(a.r,env);
    case "/": { const d=exprEval(a.r,env); return d===0?NaN:exprEval(a.l,env)/d; }
    case "^": return Math.pow(exprEval(a.l,env),exprEval(a.r,env));

function exprVars(a,out){ out=out||[];

/* Faktorform = Klammer, die mit etwas multipliziert oder potenziert wird: 5(x+2), (a+b)(a-b), (x+3)^2 */
function istFaktorform(t){

  return /[0-9a-zα-ω)]\(/.test(n) || /\)\^/.test(n) || /\)[0-9a-zα-ω]/.test(n);

const STUETZ=[2,3,5,7,11,13,-2,-3,-5,4,6,9,1.5,2.5,0.5];

     "3¹⁰", "4,2 · 10⁻⁴", "1024"). Zwei blanke Zahlen bleiben dem Zahlweg mit seiner Toleranz. */

  if(!vs.length && !rz(sol) && !rz(inp)) return null;

    const a=exprEval(A,env), b=exprEval(B,env);

    FORM_HINWEIS = fS

      : "Rechnerisch ist dein Term gleichwertig – er ist nur nicht ausmultipliziert. Wenn die Aufgabe das Ausmultiplizieren verlangt, zählt nur die ausmultiplizierte Form.";
    return "form";

}

  if(!m) return "";

function bruchTeile(t){
  const m=String(t).replace(/−/g,"-").trim().match(/^(-?\d+)\s*\/\s*(\d+)\s*(?:°|€|%|[a-zA-Zµ]{1,3}[²³]?)?$/);

function zahlWert(t){ return parseFracValue(String(t).replace(/−/g,"-").replace(/\s*(?:°|€|%|[a-zA-Zµ]{1,3}[²³]?)$/,"").replace(/\s/g,"")); }

  const bS=bruchTeile(sT), bI=bruchTeile(iT);

  return idx;

/* Erklaer-Bilder (14.08.2026, Auftrag Annette): Verstehen-Absaetze koennen mit [BILD:key]
   eine Beispielzeichnung direkt unter dem Absatz zeigen - nimmt Textwaenden den Schrecken. */
function verstehenHtml(p, kursiv){
  let bilder="";
  const t=String(p).replace(/\s*\[BILD:([a-z0-9_]+)\]/g,function(m,k){ if(BILDER[k]) bilder+='<div style="margin:10px 0 4px">'+BILDER[k]+'</div>'; return ""; });
  return (kursiv?'<p><em>'+esc(t)+'</em></p>':'<p style="margin:8px 0 0">'+esc(t)+'</p>')+bilder;
}
function erklaerHtml(skillId){

    s+=(k.fallen||[]).map(f=>'<div class="warn" style="margin-top:10px"><strong>'+esc(f.falle)+'</strong><br>\u2717 '+esc(f.falsch)+'<br>\u2713 '+esc(f.richtig)+'<br><span class="muted">'+esc(f.warum)+'</span></div>').join("");

}

function unitSteps(skill, abMittel, minuten, blockIdx, excl){
  /* 1.51 (Anweisung Annette 17.08.2026) – verbindlicher Tagesaufbau, in JEDER Minutenwahl:
       Verstehen · Stolperfallen · 3 leichte · mittlere · schwere · Transfer · Wiederholmix (Variante B)
     Regeln, die hier hart verdrahtet sind:
       * genau DREI leichte Aufgaben am Anfang – danach kommt nichts Leichtes mehr
       * der Schwierigkeitsgrad steigt bis zum Ende des Tagesthemas
       * 15/20 Min: 2 schwere zum Schluss · 30 Min: 1 schwere + 1 Transfer · 45 Min: 2 schwere + 2 Transfer
       * nicht ausgewählte schwere Kernaufgaben laufen als MITTLERE mit (Entscheidung Annette) –
         sie fallen nicht weg
       * der Wiederholmix steht am ENDE des Tages (Variante B, Entscheidung Annette)
       * leichte Aufgaben sind damit in keiner Konstellation in der Überzahl (3 von 9/17/23)
     Schrittzahlen bleiben exakt: 15/20 → 10, 30 → 16, 45 → 22. Dauerprüfungen: E2E 32, 37, 38. */
  const c=CONTENT[skill]; if(!c||!c.kerne||!c.kerne.length) return null;
  const bi=blockIdx||0, nB=c.kerne.length;
  const kern=c.kerne[Math.min(bi, nB-1)];
  const hatStufen=kern.ueben.some(u=>u.stufe);
  const teile=arr=>nB>1?(arr||[]).filter((_,j)=>j%nB===bi):(arr||[]);
  /* 1.47: geteilte Töpfe werden deterministisch auf die Lerntage eines Themas aufgeteilt
     (Tag 1 nimmt Index 0,2,4,…, Tag 2 Index 1,3,5,…) – KEINE Aufgabe erscheint an beiden Tagen.
     1.51: das gilt jetzt auch für die Transferaufgaben, weil sie ab 30 Min täglich vorkommen. */

  // ---- Zielzahlen je Minutenwahl -------------------------------------------------
  const zielAufgaben = minuten>=45 ? 19 : (minuten>=30 ? 13 : 7);
  const zielSchwer   = minuten>=45 ? 2  : (minuten>=30 ? 1  : 2);
  const zielTransfer = minuten>=45 ? 2  : (minuten>=30 ? 1  : 0);
  const zielLeicht   = abMittel ? 0 : 3;   // "ab Mitte" überspringt den leichten Einstieg

  // ---- Töpfe des Tages -----------------------------------------------------------
  const alleKern=kern.ueben||[];
  const leichtP = hatStufen ? alleKern.filter(u=>u.stufe==="leicht") : [];
  const schwerP = hatStufen ? alleKern.filter(u=>u.stufe==="schwer") : [];
  const mittelP = hatStufen ? alleKern.filter(u=>u.stufe!=="leicht"&&u.stufe!=="schwer") : alleKern.slice();
  const transP  = teile(c.transfer);

  const L = leichtP.slice(0, zielLeicht);
  const S = schwerP.slice(0, zielSchwer);
  const T = transP.slice(0, zielTransfer);
  const benutzt=new Set([].concat(L,S,T).map(u=>u.aufgabe));

  // ---- Mittelblock: Kern-mittel, NICHT gezogene schwere Kernaufgaben, Übungs-Plus, Wiederholpool ----
  /* 1.50: Aufgaben, die schon einmal gezeigt wurden (excl = Momentaufnahme beim Tagesstart),
     kommen ganz zuletzt – nur wenn der Vorrat sonst nicht für die VOLLE Schrittzahl reicht.
     Wie oft dieser Notfall zieht, zählt die Dauerprüfung (E2E Sektion 37). */
  const frisch=[], schonMal=[];
  /* Überzählige LEICHTE Kernaufgaben laufen bewusst NICHT im Mittelblock mit (Anweisung Annette:
     nach den drei Einstiegsaufgaben kommt nichts Leichtes mehr). Nach dem Kern-Umbau gibt es
     ohnehin nur noch drei je Block. */
  mittelP.concat(schwerP.slice(zielSchwer), teile(c.uplus), teile(c.wpool)).forEach(u=>{
    /* 1.58 (Befund des Regel-Waechters, Entscheidung Annette 18.08.2026): LEICHTE Aufgaben sind
       hier gesperrt. Bis 1.57 filterte nur der Wiederholmix die Stufe "leicht" heraus, der
       Lerntag aber nicht - dadurch rutschten 18 leichte Wiederholpool-Aufgaben in elf Themen
       in den Mittelblock des 45-Minuten-Tages, an die Positionen 11 bis 14. Das verletzte die
       Regel "nach den drei Einstiegsaufgaben kommt nichts Leichtes mehr". Nachgemessen: der
       Mittelvorrat reicht in allen 192 Konstellationen auch ohne sie. Dauerpruefung: QS_Regeln.js */
    if(!u||u.aufgabe===undefined||u.stufe==="leicht"||benutzt.has(u.aufgabe)) return;
    benutzt.add(u.aufgabe);
    ((excl&&excl[skill+"|"+u.aufgabe])?schonMal:frisch).push(u);
  });
  const zielMittel = Math.max(0, zielAufgaben - L.length - S.length - T.length);
  let M = frisch.concat(schonMal).slice(0, zielMittel);
  /* Reicht der Mittelvorrat nicht (kommt nur in der Variante „ab Mitte“ vor, weil dort die drei
     leichten Einstiegsaufgaben wegfallen), wird der Tag NICHT verkürzt – die Schrittzahl-Regel
     hat Vorrang. Aufgefüllt wird dann mit den leichten Aufgaben, und zwar am ANFANG des Tages,
     damit die Steigerung erhalten bleibt. Sobald die Töpfe in 1.52 aufgefüllt sind, greift das
     nicht mehr; die Dauerprüfung zählt die Fälle mit. */
  if(M.length < zielMittel){
    const rest = leichtP.filter(u=>!benutzt.has(u.aufgabe));
    rest.slice(0, zielMittel - M.length).forEach(u=>{ benutzt.add(u.aufgabe); L.push(u); });
  }

  // ---- Tag zusammensetzen --------------------------------------------------------
  const steps=[{typ:"verstehen",kern},{typ:"fallen",kern}];
  L.forEach(u=>steps.push({typ:"aufgabe",u}));
  M.forEach(u=>steps.push({typ:"aufgabe",u,extra:true}));
  S.forEach(u=>steps.push({typ:"aufgabe",u}));
  T.forEach(t=>steps.push({typ:"aufgabe",u:Object.assign({},t,{stufe:"Transfer"}),extra:true})); // 1.41: Aufgabe VOLLSTÄNDIG übernehmen
  if(minuten>=20) steps.push({typ:"mix"});
  else steps.push({typ:"mix", limit:2}); // Mini-Mix bei 15 Min. (Entscheidung Annette 09.08.2026)
  return steps;
}
function mixKey(it){ return it.skill+"|"+it.aufgabe; }
function mixAnweisung(a, l){
  // Kurze Arbeitsanweisung für Wiederholmix-Aufgaben ohne eigene Anweisung (Beta-Feedback 30.07.)
  a=String(a); l=String(l);
  if(/\?|berechne|bestimme|schreibe|wie |löse|ergänze|rechne|vereinfache|multipliziere|welche|nenne|gib |konstruiere|zeichne|begründe|beschreibe|markiere|zeige|finde|erkläre|prüfe|kürze|erweitere|ordne|setze|stelle|fasse|klammere|faktorisiere|wandle|entscheide|vergleiche|lies |übertrage|untersuche/i.test(a)) return "";
  if(/^["„»]/.test(a.trim())) return "Schreibe als Term:";
  if(/^[\d\s\/.,]+von[\d\s\/.,]+$/.test(a)) return "Rechne aus:";
  if(/____/.test(a)) return "Rechne um:";
  if(/…/.test(a)) return "Ergänze den Satz:";
  if(/%\s*von/i.test(a)) return "Rechne aus:";
  if(/=/.test(a)&&/[a-z]/i.test(a)) return "Löse die Gleichung:";
  if(!/[a-zα-ω]/.test(termNorm(a))) return "Rechne aus:";
  if(/[A-Za-zÄÖÜäöü]{3,}/.test(a)) return ""; // enthält Wörter – Aufgabe erklärt sich selbst
  if(/\(/.test(l)&&!/\(/.test(a)) return "Schreibe als Produkt (faktorisiere):";
  if(/\(/.test(a)) return "Multipliziere aus:";
  return "Vereinfache den Term:";

/* Plan-Umbau-Schutz (11.08.2026, Regel-2-Befund zur Mail-Aussage "Fortschritt bleibt"):
   Aendert sich der Planaufbau (Anpassen, "Naechste Themen holen", Sicherheitsnetz), verschieben
   sich die Tag-Nummern - ohne Schutz wanderte z. B. der Haken eines erledigten Mix-Tags auf ein
   nie gelerntes Thema. Deshalb: Erledigte Tage werden anhand ihres INHALTS (Thema|Block bzw.
   n-ter Mix-Tag) auf die neuen Tag-Nummern uebertragen; erledigte Themen, die im neuen Plan
   keinen Tag mehr haben, bleiben als gelernt erhalten (bonusDone -> Themen-Reiter + Wiederholmix). */
function planKeyMap(){
  const zaehler={};
  return buildPlan(effectiveDiag(),S.config).days.filter(d=>d.id!=="CHECK").map(d=>{
    const basis=d.id==="MIX"?"MIX":d.id+"|"+(d.block||0);
    const n=zaehler[basis]=(zaehler[basis]||0)+1;
    return {tag:d.tag, id:d.id, key:basis+"#"+n};
  });
}
function withPlanRemap(fn){
  const alt=planKeyMap();
  const doneKeys=alt.filter(e=>S.daysDone[e.tag]).map(e=>e.key);
  const curAlt=(typeof S.curDay==="number")?alt.find(e=>e.tag===S.curDay):null;
  fn();
  const neu=planKeyMap(); const nd={};
  for(const e of neu){ if(doneKeys.indexOf(e.key)>=0) nd[e.tag]=true; }
  for(const k of doneKeys){ // erledigte Themen ohne Platz im neuen Plan: bleiben gelernt
    if(!neu.some(e=>e.key===k)&&k.indexOf("MIX")!==0){ (S.bonusDone||(S.bonusDone={}))[k.split("|")[0]]=true; }
  }
  S.daysDone=nd;
  if(curAlt){ const e2=neu.find(e=>e.key===curAlt.key); if(e2){ S.curDay=e2.tag; if(S.unit&&S.unit.skill===curAlt.id) S.unit.tag=e2.tag; } }
  save();
}
function gelernteSkills(){
  // Themen, deren Lerntag im Plan bereits abgeschlossen ist (die "Vortage")
  const plan=buildPlan(effectiveDiag(),S.config); const g=new Set();
  /* 1.52: Ein Thema gilt erst als gelernt, wenn ALLE seine Lerntage erledigt sind. Sonst zöge der
     Wiederholmix schon nach Tag 1 aus dem Vorrat, den Tag 2 desselben Themas noch braucht. */
  const offen=new Set();
  for(const d of plan.days){ if(d.id==="CHECK"||d.id==="MIX") continue; if(!tagFertig(d)) offen.add(d.id); }
  for(const d of plan.days){ if(d.id!=="CHECK"&&d.id!=="MIX"&&tagFertig(d)&&!offen.has(d.id)) g.add(d.id); }
  for(const id of Object.keys(S.bonusDone||{})) g.add(id); // im Bonus abgeschlossene Themen zaehlen ebenfalls als gelernt
  return g;
}
function mixPool(exceptSkill){
  // Fix 11.08.2026 (Entscheidung Annette): Der Wiederholmix zieht NUR aus Themen, die schon
  // gelernt wurden (erledigte Lerntage) oder beim Check sassen – vorher zog die "vereinfachte v1"
  // aus ALLEN Themen, sobald irgendein Tag erledigt war (auch aus noch ungelernten). Damit stimmen
  // Lernplan-Text ("Wiederholmix aus den Vortagen"), Salespage und Kaeufer-Mails mit dem Verhalten ueberein.
  const diag=effectiveDiag(); const gel=gelernteSkills(); const pool=[];
  /* 1.52 (Anweisung Annette): Der Wiederholmix enthält NUR mittlere bis schwere Aufgaben – nach den
     drei leichten Einstiegsaufgaben des Tages kommt nichts Leichtes mehr, und der Mix steht am Ende.
     Deshalb zieht er aus ALLEN Töpfen eines bereits gelernten Themas (Wiederholpool, Übungs-Plus,
     Kern, Transfer) und lässt dabei jede Aufgabe der Stufe „leicht“ aus. Das hält den Vorrat groß
     genug, damit nichts doppelt gezeigt werden muss. */
  for(const sk of SKILLS){
    if(sk.id===exceptSkill||!CONTENT[sk.id]) continue;
    if(!(diag[sk.id]==="sitzt"||gel.has(sk.id))) continue;
    const c=CONTENT[sk.id]; const nimm=w=>{ if(w&&w.aufgabe!==undefined&&w.stufe!=="leicht"&&w.format!=="SK") pool.push({skill:sk.id,...w}); };
    (c.wpool||[]).forEach(nimm);
    (c.uplus||[]).forEach(nimm);
    (c.kerne||[]).forEach(ke=>(ke.ueben||[]).forEach(nimm));
    (c.transfer||[]).forEach(nimm);
  }
  // stabil mischen (Seed: Tag + Anzahl bereits gemeisterter Mix-Aufgaben), dann:
  // Aufgaben, die schon einmal richtig gelöst wurden, kommen NICHT erneut dran,
  // solange es noch ungespielte Alternativen gibt (Beta-Feedback 29.07.).
  const dayN=typeof S.curDay==="number"?S.curDay:97;
  const seed=dayN*7919+Object.keys(S.mixDone||{}).length*104651+7;
  const idx=pool.map((_,i)=>i).sort((a,b)=>(((a+1)*seed)%104729)-(((b+1)*seed)%104729));
  /* 1.50 (Anweisung Annette): Der Mix darf nichts zeigen, was schon einmal dran war – weder im Mix
     noch als Extra-Aufgabe eines Lerntags. Drei Ränge: (1) noch nie gezeigt, (2) schon gezeigt, aber
     im Mix noch nicht gemeistert, (3) im Mix bereits richtig gelöst. Erst wenn Rang 1 leer ist, wird
     überhaupt auf Rang 2/3 zurückgegriffen – das ist der protokollierte Notfall, kein Normalbetrieb. */
  /* 1.52 (Anweisung Annette): KEINE Aufgabe wird ein zweites Mal gezogen – auch dann nicht, wenn
     dadurch der Mix kürzer ausfällt. Lieber zwei frische Aufgaben als vier mit Wiederholung.
     Gezeigt wurde bereits = im Lerntag ODER in einem früheren Mix (Register S.gezeigt). */
  const nie=[];
  for(const i of idx){ const it=pool[i]; if(!(S.gezeigt||{})[mixKey(it)]) nie.push(it); }
  return nie.slice(0,4);
}

/* ---------- Abschlusscheck (1.43, Empfehlung a aus dem Pruefbericht Schuelersicht):
   Der Eingangscheck zeigt, wo du startest - der Abschlusscheck zeigt schwarz auf gruen,
   was du NEU kannst. Er fragt nur die Themen ab, die beim Start NICHT sassen (bei
   A-Themen leichte + mittlere Aufgabe, sonst die Themen-Aufgabe), wertet mit denselben
   Regeln wie der Eingangscheck (isCorrect/KEY) und ruehrt den Lernplan-Stand NIE an:
   Ergebnis lebt in S.ab, S.answers bleibt unveraendert (Plan/Themen bleiben stabil). */
function abWertbar(u){
  if(!u||u.format==="SK"||u.loesung===undefined||u.loesung===null) return false;
  const sol=String(u.loesung);
  if(sol.includes(";")||/^(Checkliste|Musterl\u00f6sung|z\. ?B\.)/i.test(sol)) return false;
  return numericInput(sol)||isTermLike(sol)||sol.length<=24;
}
function abItems(){
  /* 1.45 (Auftrag Annette): Im Abschlusscheck NIE leichte Aufgaben und NIE gekonnte Themen -
     nur mittlere Aufgaben ("ab Mitte"), und jedes abgefragte Thema bekommt MINDESTENS ZWEI.
     Aufbau je nicht-gekonntem Thema: bei A-Themen zuerst die MITTLERE Check-Aufgabe (nur wenn
     sie damals nicht gekonnt war), dann automatisch wertbare mittlere Aufgaben aus dem
     Aufgabenbestand (Kern-mittel -> Uebungs-Plus -> Transfer, ohne SK/Checklisten). Gespeichert
     werden nur Referenzen (skill + Aufgabentext) - beim Anzeigen wird mit dem AKTUELLEN
     Aufgabenbestand zusammengefuehrt (mixAktualisiert-Muster, Lehre aus 1.40). */
  const d0=diagnose(S.answers,S.hwnn), items=[];
  for(const sk of SKILLS){
    if(d0[sk.id]==="sitzt") continue;
    const c=CONTENT[sk.id]||{};
    /* 1.55: EIGENER TEST-TOPF. Je Thema genau eine MITTLERE und eine SCHWERE Aufgabe aus
       `c.test` – gebaut nach den Buch-Testaufgaben (bzw. Stern-Aufgabe desselben Kapitels,
       sonst Grundwissen-Band + Klassenarbeit). Diese Aufgaben tauchen im Lernplan NIE auf,
       deshalb misst der Abschlusscheck Können statt Erinnerung. */
    const topf=(c.test||[]);
    const mittel=topf.filter(u=>u.stufe==="mittel"), schwer=topf.filter(u=>u.stufe==="schwer");
    const mine=[];
    if(mittel[0]) mine.push({skill:sk.id, aufgabe:mittel[0].aufgabe, loesung:mittel[0].loesung});
    if(schwer[0]) mine.push({skill:sk.id, aufgabe:schwer[0].aufgabe, loesung:schwer[0].loesung});
    if(mine.length<2){   // Notfallpfad: nur falls ein Thema (noch) keinen vollen Test-Topf hat
      const kand=[];
      (c.kerne||[]).forEach(ke=>(ke.ueben||[]).forEach(u=>{ if(u.stufe&&u.stufe!=="leicht"&&abWertbar(u)) kand.push(u); }));
      (c.uplus||[]).forEach(u=>{ if(abWertbar(u)) kand.push(u); });
      for(const u of kand){ if(mine.length>=2) break;
        if(mine.some(m=>m.aufgabe===u.aufgabe)) continue;
        mine.push({skill:sk.id, aufgabe:u.aufgabe, loesung:u.loesung}); }
    }
    mine.forEach(it=>items.push(it));
  }
  return items;
}
function abDiag(){
  const d0=diagnose(S.answers,S.hwnn), out={}, themaOk={};
  ((S.ab&&S.ab.list)||[]).forEach((it,i)=>{
    const ans=S.ab.answers[i];
    let ok=false;
    if(it.nr!==undefined) ok=isCorrect(it.nr,ans);
    else { const u=mixAktualisiert(it); ok = ans!==undefined&&ans!==null&&solMatches(String(u.loesung),String(ans))===true; }
    themaOk[it.skill]=(themaOk[it.skill]===undefined?true:themaOk[it.skill])&&ok;
  });
  for(const sk of SKILLS){
    if(d0[sk.id]==="sitzt"){ out[sk.id]="war_sitzt"; continue; }
    out[sk.id]= themaOk[sk.id]===true ? "neu_sitzt" : "offen";
  }
  return out;
}

  inner+='<div id="abscratchhost"></div>';

function importBackup(e){

  r.onload=()=>{ try{
    const o=JSON.parse(r.result);
    if(!o||typeof o!=="object"||o.app!=="mathe-booster"||!o.state) throw 0;
    const cur=(profiles().find(p=>p.id===PID)||{}).name||"dieses Profil";
    const when=o.date?(" vom "+new Date(o.date).toLocaleDateString("de-DE")):"";
    let msg="⚠️ Achtung: Damit wird der komplette aktuelle Lernstand von „"+cur+"“ ersetzt – durch die Sicherung"+(o.name?(" von „"+o.name+"“"):"")+when+".\n\nAlles, was du seit dieser Sicherung gelernt hast, geht verloren.\n\nSicherung wirklich laden?";
    if(o.name&&o.name!==cur) msg="Diese Sicherung stammt von einem anderen Profil („"+o.name+"“). Du bist gerade als „"+cur+"“ angemeldet.\n\n"+msg;
    e.target.value="";
    if(!confirm(msg)) return;
    S=o.state; save(); initS(); // initS lädt aus dem Speicher nach und ergänzt fehlende Felder
    if(o.unlock){ localStorage.setItem("mb_unlock",o.unlock); }
    verifyUnlock().then(v=>{ UNLOCKED=v||UNLOCKED; alert("Sicherung geladen – dein Lernstand ist wiederhergestellt."); render(); });
    return;
  }catch(err){ e.target.value=""; alert("Das ist leider keine gültige Sicherungs-Datei des Mathe-Boosters."); } };
  r.readAsText(f);
}

/* Themen-Reiter (Auftrag Annette 11.08.2026, Beta-Rueckmeldung "welche Themen kann ich schon?"):
   alle Themen des Boosters im Ueberblick, eingeordnet nach dem Mathe-Check (gute Kenntnisse /
   Auffrischung / Vorsprung) plus Live-Stand (geschafft, wartet im Bonus). Vor dem Check: reine
   Themenliste als Ausblick. */
function renderThemen(){
  if(!S.done){
    main.innerHTML='<div class="card">'+
      '<strong style="font-size:1.1rem">Diese Themen stecken in deinem Booster</strong>'+
      '<p class="muted" style="margin-top:8px">Nach deinem Mathe-Check siehst du hier, welche Themen du schon gut kannst und welche in deinen Plan kommen.</p>'+
      '<div style="margin-top:10px">'+SKILLS.map(s=>'<p style="margin:6px 0 0;padding-left:1.1em;text-indent:-1.1em">• '+esc(s.titel)+'</p>').join("")+'</div>'+
      '<button class="btn block" id="goCheck">Zum Mathe-Check</button>'+
    '</div>';
    return $("goCheck").addEventListener("click",()=>show("start"));
  }
  const diag=effectiveDiag(), plan=buildPlan(diag,S.config), gel=gelernteSkills();
  const restIds=[]; plan.rest.forEach(r=>{ if(restIds.indexOf(r.id)<0) restIds.push(r.id); });
  const sitzt=[], auffrischen=[], vorsprung=[];
  for(const s of SKILLS){
    const st=diag[s.id];
    if(st==="sitzt") sitzt.push(s);
    else if(st==="optional"||st==="optional_ab_mittel") vorsprung.push(s);
    else auffrischen.push(s);
  }
  const zeile=(s,extra)=>'<p style="margin:6px 0 0;padding-left:1.1em;text-indent:-1.1em">• '+esc(s.titel)+(extra||"")+'</p>';
  const haken=s=>gel.has(s.id)?' <strong style="color:var(--accent)">✓ geschafft</strong>':'';
  main.innerHTML='<div class="card">'+
    '<strong style="font-size:1.1rem">Deine Themen im Überblick</strong>'+
    '<p class="muted" style="margin-top:6px">So hat dein Mathe-Check die '+SKILLS.length+' Themen deines Boosters eingeordnet – und du siehst, was du schon geschafft hast.</p>'+
  '</div>'+
  (sitzt.length?'<div class="card"><strong>Kannst du schon</strong>'+
    '<p class="muted" style="margin:4px 0 0;font-size:.9rem">In diesen Themen hast du schon gute Kenntnisse – die sparst du dir komplett.</p>'+
    '<div style="margin-top:6px">'+sitzt.map(s=>zeile(s)).join("")+'</div></div>':"")+
  (auffrischen.length?'<div class="card"><strong>Frischst du gerade auf</strong>'+
    '<p class="muted" style="margin:4px 0 0;font-size:.9rem">Hier braucht es noch etwas Auffrischung – diese Themen stehen in deinem Lernplan'+(restIds.length?' oder warten in deinem Bonus':'')+'.</p>'+
    '<div style="margin-top:6px">'+auffrischen.map(s=>zeile(s, gel.has(s.id)?haken(s):(restIds.indexOf(s.id)>=0?' <span class="muted">– wartet in deinem Bonus</span>':''))).join("")+'</div></div>':"")+
  (vorsprung.length?'<div class="card"><strong>Dein Vorsprung</strong>'+
    '<p class="muted" style="margin:4px 0 0;font-size:.9rem">„Hatten wir noch nicht" – kein Muss. Wenn du magst, findest du diese Themen in deinem Bonus.</p>'+
    '<div style="margin-top:6px">'+vorsprung.map(s=>zeile(s,haken(s))).join("")+'</div></div>':"")+
  '<div class="card"><button class="btn block" id="goPlan">'+(S.planCreated?'Zum Lernplan':'Lernplan erstellen')+'</button></div>';
  $("goPlan").addEventListener("click",()=>show(S.planCreated?"plan":"anpassen"));
}

    R("Plus und Minus bei ganzen Zahlen","Gleiche Vorzeichen: addieren, Vorzeichen behalten. Verschiedene: Unterschied bilden","−2 + (−7) = −9. Bei −7 + 12 gewinnt die 12, weil ihr Abstand zur Null (ihr Betrag) größer ist → 5.")+
    R("Potenzen","a³ = a · a · a – die Hochzahl zählt die Faktoren","2⁵ = 2 · 2 · 2 · 2 · 2 = 32. Bei gleicher Basis: 2³ · 2⁴ = 2⁷ (Hochzahlen addieren). Produkt in der Klammer: (2x)³ = 8x³ – jeder Faktor wird potenziert.")+

    R("Vorsicht beim Minus vor Potenzen","(−3)² = 9, aber −3² = −9","Ohne Klammer gehört das Minus nicht zur Basis – Hoch kommt vor dem Vorzeichen dran. Gerade Anzahl Minusfaktoren gibt Plus, ungerade Minus: (−2)³ = −8, (−2)⁴ = 16."))+
  K("Brüche",

    R("Zeit","1 h = 60 min  |  1 min = 60 s","Vorsicht: Hier ist die Umrechnungszahl 60, nicht 100! 1,5 h sind 90 min, nicht 150."))+
  K("Prozent",

    R("Zusammenfassen","Nur gleichartige Glieder verrechnen","7x − 2x = 5x und 3 + 5 = 8 – aber x-Glieder und Zahlen kannst du nicht mischen. Auch bei mehreren Variablen: 2xy + 3xy = 5xy, doch a²b und ab² bleiben getrennt.")+

    R("3. binomische Formel","(a + b) · (a − b) = a² − b²","Die gemischten Produkte heben sich auf: −ab + ab = 0. Beispiel: (x + 4)(x − 4) = x² − 16.")+
    R("Warum die 1. binomische Formel stimmt – das Flächenmodell","Ein Quadrat mit Seite a + b zerfällt in a², b² und ZWEI Rechtecke a · b","Alle vier Teilflächen zusammen: a² + 2ab + b² – dieselbe Fläche wie (a + b)². Darum das doppelte Mittelglied.")+

  K("Winkel",

    R("Lot und Lotfußpunkt","Das Lot steht senkrecht (90°) auf einer Geraden","Fällst du von einem Punkt das Lot auf eine Gerade, heißt der Auftreffpunkt Lotfußpunkt – er markiert den kürzesten Weg vom Punkt zur Geraden.")+
    R("Die vier Kongruenzsätze","sss  |  sws  |  wsw  |  Ssw","Kongruent heißt deckungsgleich. sss: drei Seiten. sws: zwei Seiten + eingeschlossener Winkel. wsw: eine Seite + beide anliegenden Winkel. Ssw: zwei Seiten + Gegenwinkel der GRÖSSEREN Seite. Jede dieser Angaben legt ein Dreieck eindeutig fest.")+
    R("Ortslinien","Kreis  |  Mittelsenkrechte  |  Winkelhalbierende","Alle Punkte mit gleichem Abstand zu EINEM Punkt: Kreis. Zu ZWEI Punkten: Mittelsenkrechte. Zu zwei Schenkeln: Winkelhalbierende.")+
    R("Umkreis und Inkreis","Mittelsenkrechte → Ecken  |  Winkelhalbierende → Seiten","Die drei Mittelsenkrechten treffen sich im Umkreismittelpunkt (gleich weit von allen Ecken), die drei Winkelhalbierenden im Inkreismittelpunkt (gleich weit von allen Seiten).")+

    R("Satz des Thales","Liegt C auf dem Halbkreis über AB (AB = Durchmesser), ist der Winkel bei C ein rechter","Gilt auch rückwärts (Umkehrung): Ist das Dreieck bei C rechtwinklig, liegt C auf dem Thaleskreis über AB. Deshalb: Umkreismittelpunkt eines rechtwinkligen Dreiecks = Mitte der Hypotenuse, Umkreisradius = halbe Hypotenuse."))+

    R("Quadrat","A = a²  |  U = 4 · a","Ein Rechteck mit vier gleichen Seiten.")+
    R("Dreieck","A = 1/2 · g · h","Ein halbes Rechteck aus Grundseite g und Höhe h.")+
    R("Parallelogramm","A = g · h","Grundseite mal Höhe – die Höhe steht senkrecht auf der Grundseite.")+
    R("Trapez","A = 1/2 · (a + c) · h","Mittelwert der beiden parallelen Seiten mal Höhe.")+

    R("Komplizierte Flächen","Zerlegen oder ergänzen","In Rechtecke zerlegen oder zu einem Rechteck ergänzen – der wichtigste Trick."))+
  K("Daten und Boxplot",
    R("Median","Der mittlere Wert der GEORDNETEN Liste","Erst ordnen! Bei gerader Anzahl: Mittelwert der beiden mittleren Werte. Der Median teilt die Daten in zwei Hälften – 50 % liegen darunter.")+
    R("Spannweite","größter Wert − kleinster Wert","Sie zeigt, wie weit die Daten auseinanderliegen.")+
    R("Modalwert","Der Wert, der am HÄUFIGSTEN vorkommt","Bei 3, 5, 4, 5, 2, 5, 4 ist der Modalwert 5 (dreimal). Die drei Kenngrößen: Mittelwert = Durchschnitt · Median = mittlerer Wert der geordneten Liste · Modalwert = häufigster Wert.")+
    R("Quartile","Q1 = Viertelgrenze unten  |  Q3 = Viertelgrenze oben","„Quartil“ kommt von „Viertel“: Ein Viertel der Werte liegt unter Q1, drei Viertel unter Q3. Zwischen Q1 und Q3 liegt die mittlere Hälfte.")+
    R("Boxplot","Fünf Kennwerte: Minimum  |  Q1  |  Median  |  Q3  |  Maximum","Die Box reicht von Q1 bis Q3 (mittlere Hälfte), der Strich darin ist der Median, die Antennen reichen bis Minimum und Maximum. Der Durchschnitt wird NICHT dargestellt!"))+
  '<div class="card"><button class="btn block" id="fsBack">Zur Startseite</button></div>';
  $("fsBack").addEventListener("click",()=>show("start"));
}

    '<strong style="font-size:1.1rem">Willkommen beim Mathe-Booster!</strong>'+
    '<p style="margin-top:10px"><strong>Das Ziel:</strong> Du schließt in zwei bis drei Wochen deine Mathe-Lücken aus der 7. Klasse und/oder festigst die Grundlagen, auf denen die 8. Klasse aufbaut – mit deinem persönlichen Lernplan, in kleinen Portionen und ohne Druck.</p>'+
    '<p>Du machst zuerst einen kurzen Mathe-Check – damit nur geübt wird, was noch nicht sitzt oder aufgefrischt werden sollte. Dahinter stecken 22 Themen mit über 440 Aufgaben, abgeglichen mit echten Klassenarbeiten der 7. Klasse.</p>'+
  '</div>'+
  '<div class="card">'+
    '<strong style="font-size:1.1rem">So funktioniert dein Booster</strong>'+
    '<p style="margin-top:10px"><strong>1. Check:</strong> Zuerst kommt dein Mathe-Check – kein Test, keine Note. Er zeigt, was du schon kannst und wo du noch Übungsbedarf hast.</p>'+
    '<p><strong>2. Plan:</strong> Was du kannst, überspringst du. Für den Rest bekommst du deinen eigenen Lernplan.</p>'+
    '<p><strong>3. Üben:</strong> Jeder Lerntag hat ein Thema, das kurz erklärt wird, dann übst du. Am Ende eines Lerntags wiederholst du.</p>'+
  '</div>'+
  '<div class="card">'+
    '<strong>Dein Plan, deine Regeln</strong>'+
    '<p style="margin-top:10px"><strong>1.</strong> <strong>Wochen und Tage</strong> bestimmen, wie viele Themen du machst. Passen nicht alle Themen in deinen Lernplan? Kein Problem. Die Grundlagen-Themen kommen zuerst in den Plan, denn auf ihnen baut alles Weitere auf. Die übrigen findest du unten im Lernplan in deinem <strong>Bonus</strong> und kannst sie dort zuerst bearbeiten – so verpasst du kein Thema. Und sobald in deinem Plan wieder Platz ist, rücken sie automatisch nach.</p>'+
    '<p><strong>2.</strong> <strong>Du entscheidest, wie lange du übst:</strong> Die von dir gewählte Zeit pro Tag bestimmt, wie ausführlich du ein Thema übst. Sie bestimmt nicht, wie viele Themen du bekommst.</p>'+
    '<p><strong>3.</strong> Ändern kannst du alles jederzeit unter <strong>„Anpassen“</strong> – dein Fortschritt bleibt.</p>'+
    '<p><strong>4.</strong> Lust auf mehr? Einfach mit dem nächsten Baustein im Lernplan weitermachen. Pause gemacht? Kein Problem – du machst genau da weiter, wo du aufgehört hast.</p>'+
    '<p><strong>5.</strong> <strong>Dein Bonus</strong> steht unten im Lernplan – für alles, was freiwillig ist: Themen, die nicht mehr in deinen Zeitplan gepasst haben (die zeigen wir dir zuerst), deine „Hatten wir noch nicht“-Themen und jedes Thema, das du vertiefen willst. Du entscheidest, was du übst – und was du im Bonus schaffst, kommt in deine Wiederholung.</p>'+
  '</div>'+
  '<div class="card">'+
    '<strong>Damit nichts verloren geht</strong>'+
    '<p style="margin-top:10px"><strong>Wichtig: Immer die neueste Version nutzen.</strong> Öffne die App dafür immer neu über deinen Link oder dein Lesezeichen. Dein Fortschritt bleibt dabei erhalten.</p>'+
    '<p><strong>Wichtig ist nur:</strong> Lösche nicht die Browserdaten bzw. die Websitedaten. Dort wird dein Fortschritt gespeichert. Ansonsten musst du von vorne beginnen.</p>'+
    '<p><strong>Übt ihr auf mehreren Geräten?</strong><br>Dein Lernstand liegt nur auf dem Gerät, auf dem du gerade übst – er wandert nicht automatisch mit.</p>'+
    '<p>Dann gilt eine einfache Regel: immer auf dem zuletzt genutzten Gerät unter <strong>„Fortschritt“</strong> eine Sicherung exportieren und sie auf dem nächsten Gerät wieder laden.</p>'+
    '<p>So machst du genau dort weiter, wo du aufgehört hast.</p>'+
    '<p><strong>Und bitte denk daran:</strong><br>Wenn jemand die Browserdaten löscht, ist der Lernstand weg – leg dir deshalb ab und zu eine Sicherung an.</p>'+
    '<p style="margin-top:12px">Viel Freude beim Lernen wünscht dir<br><span style="color:var(--secondary);font-size:1.1rem">Annette C. Breuer</span></p>'+
    '<p class="muted" style="font-size:.9rem">Fragen, Wünsche oder einen Fehler entdeckt? Schreib mir gern: <a href="mailto:annette.c.breuer@gmail.com" style="color:var(--secondary)">annette.c.breuer@gmail.com</a></p>'+
    '<p class="muted" style="font-size:.85rem">Version: '+esc(APP_VERSION)+'</p>'+
    '<button class="btn block" id="homeBtn">Zur Startseite</button>'+
  '</div>'+
  lizenzKasten();
  $("homeBtn").addEventListener("click",()=>show("start"));
  geraetAbmelden();
}

/* iPhone-Fix (Beta-Feedback Sophie): Solange ein Eingabefeld den Fokus hat, scrollt iOS die Seite
   beim Runterscrollen immer wieder zum Feld zurück ("hochgesprungen"). Deshalb: Beim ersten Tippen
   außerhalb des Feldes den Fokus lösen – die Tastatur klappt zu, Scrollen und Buttons funktionieren normal. */
document.addEventListener("touchstart",e=>{
  const a=document.activeElement;
  if(a&&a.tagName==="INPUT"&&e.target!==a) a.blur();
},{passive:true});

/* ---------- Navigation ---------- */
$("navStart").addEventListener("click",()=>show("start"));
$("navThemen").addEventListener("click",()=>show("themen"));
$("navFormeln").addEventListener("click",()=>show("formeln"));
$("navInfo").addEventListener("click",()=>show("info"));
$("brand").addEventListener("click",()=>show("info"));
$("navProgress").addEventListener("click",()=>show("fortschritt"));
$("navAdjust").addEventListener("click",()=>{ if(S.done) show("anpassen"); else notiert("Erst dein Mathe-Check – dann dein Plan!"); });
$("navProfile").addEventListener("click",()=>{ PROF_VIEW=true; render(); window.scrollTo(0,0); });

verifyUnlock().then(v=>{ UNLOCKED=v; render(); try{ history.replaceState({mb:S?histSnap():null},""); }catch(e){} });
</script>
