ange brauchen 4?", "schritte": [{"g": "antiproportional"}, {"g": "60 : 4"}, {"g": "Ergebnis: 15 Tage"}]}, {"stufe": "mittel", "loesung": "16 h", "hinweis": "Gesamtarbeit → 8 · 6 = 48 Maschinenstunden. 3 Maschinen → 48 : 3 = 16 h.", "aufgabe": "8 Maschinen schaffen einen Auftrag in 6 Stunden. Wie lange brauchen 3 Maschinen?", "schritte": [{"g": "Gesamtarbeit"}, {"g": "8 · 6 = 48 Maschinenstunden. 3 Maschinen"}, {"g": "48 : 3 = 16 h."}]}, {"stufe": "mittel", "loesung": "2,40 €", "hinweis": "Dreisatz über 1 Heft → 5,60 : 7 = 0,80 €, dann mal 3.", "aufgabe": "7 Hefte kosten 5,60 €. Was kosten 3 Hefte?", "schritte": [{"g": "Dreisatz über 1 Heft"}, {"g": "5,60 : 7 = 0,80 €, dann mal 3."}, {"g": "Ergebnis: 2,40 €"}]}, {"stufe": "mittel", "loesung": "c) und d)", "hinweis": "Quotient f(x)/x konstant? c) 3,5 ✓ d) 1,4 ✓; a) fällt (8; 2; 0,67), b) steigt (1; 2; 3)", "aufgabe": "Welche Zuordnung ist proportional? Begründe. a) x: 1, 2, 3 → f(x): 8, 4, 2 b) x: 1, 2, 3 → f(x): 1, 4, 9 c) x: 2, 3, 5 → f(x): 7, 10,5, 17,5 d) x: 2, 3, 4 → f(x): 2,8, 4,2, 5,6", "schritte": [{"g": "Proportional-Test: f(x) : x muss überall GLEICH sein"}, {"g": "a) 8; 2; 0,67 → fällt ✗"}, {"g": "b) 1; 2; 3 → steigt ✗"}, {"g": "c) überall 3,5 ✓"}, {"g": "d) überall 1,4 ✓"}, {"g": "Antwort: c) und d)"}]}, {"stufe": "mittel", "loesung": "f(x) = 0,4x", "hinweis": "Steigung = y-Wert : x-Wert = 1,6 : 4 = 0,4 – also f(x) = 0,4x.", "aufgabe": "Eine proportionale Zuordnung enthält den Wert f(4) = 1,6. Gib den Funktionsterm an.", "schritte": [{"g": "Proportional heißt: f(x) = m · x"}, {"g": "m = f(4) : 4 = 1,6 : 4 = 0,4"}, {"g": "Funktionsterm: f(x) = 0,4x"}]}]}], "uplus": [{"stufe": "", "loesung": "6,40 €", "hinweis": "Einheiten! 800 g = 250 g · 3,2 → 2 € · 3,2 (kombiniert Fertigkeit F4)", "aufgabe": "250 g Käse kosten 2 €. Was kosten 0,8 kg?", "schritte": [{"g": "Einheiten! 800 g = 250 g · 3,2"}, {"g": "2 € · 3,2 (kombiniert Fertigkeit F4)"}, {"g": "Ergebnis: 6,40 €"}]}, {"stufe": "", "loesung": "6 h", "hinweis": "Gesamtarbeit → 4 · 9 = 36 Rohrstunden. 6 Rohre → 36 : 6 = 6 h.", "aufgabe": "4 Rohre füllen ein Becken in 9 Stunden. Wie lange brauchen 6 Rohre?", "schritte": [{"g": "Gesamtarbeit"}, {"g": "4 · 9 = 36 Rohrstunden. 6 Rohre"}, {"g": "36 : 6 = 6 h."}]}, {"stufe": "", "loesung": "antiproportional", "hinweis": "mehr Personen, weniger Zeit", "aufgabe": "Anzahl der Personen ↔ Zeit, bis eine Pizza aufgegessen ist. Proportional oder antiproportional?", "schritte": [{"g": "Mehr Personen → die Pizza ist SCHNELLER weg"}, {"g": "Mehr von A, weniger von B → antiproportional"}], "mc": ["antiproportional", "proportional", "weder noch"], "mcCorrect": 0}, {"stufe": "", "loesung": "525 g", "hinweis": "Dreisatz über 1 Person → 300 : 4 = 75 g, dann mal 7.", "aufgabe": "Ein Rezept für 4 Personen braucht 300 g Mehl. Wie viel für 7 Personen?", "schritte": [{"g": "Dreisatz über 1 Person"}, {"g": "300 : 4 = 75 g, dann mal 7."}, {"g": "Ergebnis: 525 g"}]}], "transfer": [{"aufgabe": "Prüfe mit Begründung, ob die Tabelle proportional sein kann: x: 1 | 2 | 4 und y: 2 | 4 | 7", "schritte": [{"g": "Proportional heißt: y : x überall gleich. 2:1 = 2, 4:2 = 2, aber 7:4 = 1,75"}, {"g": "beim letzten Paar müsste y = 8 sein (Begründungsaufgabe)"}, {"g": "Ergebnis: nein"}], "loesung": "nein", "hinweis": "Proportional heißt: y : x überall gleich. 2:1 = 2, 4:2 = 2, aber 7:4 = 1,75 → beim letzten Paar müsste y = 8 sein (Begründungsaufgabe)"}, {"aufgabe": "„Doppelt so viele Maler, halbe Zeit – das gilt immer!“ Nimm Stellung: Wo stimmt das Modell, wo nicht?", "schritte": [{"g": "Das Modell ist antiproportional: doppelte Leute, halbe Zeit"}, {"g": "Es gilt, solange die Arbeit teilbar ist und sich niemand behindert"}, {"g": "Grenze: 100 Maler in einem kleinen Zimmer stehen sich im Weg – dann kippt das Modell"}], "loesung": "SK", "hinweis": "Modell gilt, solange sich die Maler nicht behindern und die Arbeit teilbar ist; bei 100 Malern in einem kleinen Zimmer bricht es zusammen (Modellkritik, Selbstkontrolle per Musterlösung)"}, {"aufgabe": "3 Pumpen leeren einen Teich in 8 Stunden. Wie viele Pumpen braucht man, um ihn in 6 Stunden zu leeren?", "schritte": [{"g": "Gesamtarbeit: 3 Pumpen · 8 h = 24 Pumpenstunden"}, {"g": "24 Pumpenstunden : 6 h = 4", "op": "| : 6"}, {"g": "Antwort: 4 Pumpen"}], "loesung": "4 Pumpen", "hinweis": "24 Pumpenstunden : 6 h = 4 – hier ist die gesuchte Größe die Anzahl"}], "wpool": [{"aufgabe": "2 Kugeln Eis kosten 5 €. Was kosten 4?", "schritte": [{"g": "Proportional: doppelte Menge, doppelter Preis"}, {"g": "2 Kugeln → 5 €, also 4 Kugeln → 10 €", "op": "| · 2"}], "loesung": "10 €"}, {"aufgabe": "10 Arbeiter brauchen 3 Tage. Wie lange brauchen 5?", "schritte": [{"g": "Antiproportional: halbe Leute, doppelte Zeit"}, {"g": "Gesamtarbeit: 10 · 3 = 30 Arbeitertage"}, {"g": "30 : 5 = 6 → 6 Tage", "op": "| : 5"}], "loesung": "6 Tage"}, {"aufgabe": "150 g kosten 1,80 €. Was kosten 50 g?", "schritte": [{"g": "Erst auf 50 g herunterrechnen"}, {"g": "150 g : 3 = 50 g → 1,80 € : 3 = 0,60 €", "op": "| : 3"}, {"g": "50 g kosten 0,60 €"}], "loesung": "0,60 €"}, {"aufgabe": "2 Personen putzen 6 h. Wie lange brauchen 3 Personen?", "schritte": [{"g": "Antiproportional: Gesamtarbeit bleibt gleich"}, {"g": "2 · 6 = 12 Personenstunden"}, {"g": "12 : 3 = 4 → 4 h", "op": "| : 3"}], "loesung": "4 h"}], "titel": "Der Dreisatz – dein Alltagswerkzeug"}, "A1": {"id": "A1", "kerne": [{"name": "Plus und Minus", "verstehen": ["Schau auf die Zahlengerade: Bei Plus gehst du nach rechts, bei Minus nach links. Beispiel → −7 + 12. Du startest bei −7 und gehst 12 Schritte nach rechts – du landest bei 5. Also → −7 + 12 = 5.", "Der Betrag einer Zahl ist ihr Abstand zur Null: |−3| = 3 und |3| = 3. Beim Rechnen mit Vorzeichen vergleichst du oft die Beträge – z. B. bei −7 + 12 gewinnt die 12, weil ihr Betrag größer ist.", "Die Regel: Haben beide Zahlen das gleiche Vorzeichen, addierst du und behältst das Vorzeichen (−2 + (−7) = −9). Haben sie verschiedene Vorzeichen, rechnest du den Unterschied aus – das Vorzeichen bestimmt die Zahl, die weiter von der Null entfernt ist (−7 + 12 = 5, aber −12 + 7 = −5).", "Und wenn ein Minus vor der Klammer steht? Dann dreht es das Vorzeichen in der Klammer um → 5 − (−3) = 5 + 3 = 8. Merk dir: Minus vor Minus wird Plus."], "fallen": [{"falle": "Vorzeichen der „größeren“ Zahl ignoriert", "falsch": "−7 + 12 = −19", "richtig": "−7 + 12 = 5", "warum": "Verschiedene Vorzeichen: Unterschied 12 − 7 = 5; die 12 ist weiter von Null weg und ist positiv"}, {"falle": "Minusklammer nicht umgedreht", "falsch": "5 − (−3) = 2", "richtig": "5 − (−3) = 8", "warum": "Minus vor der Klammer dreht um → 5 + 3"}], "ueben": [{"stufe": "leicht", "loesung": "5", "hinweis": "Unterschied 9 − 4, Vorzeichen der 9", "aufgabe": "−4 + 9", "schritte": [{"g": "−4 + 9 = 5"}]}, {"stufe": "leicht", "loesung": "−5", "hinweis": "Unterschied 8 − 3, Vorzeichen der −8-Richtung", "aufgabe": "3 − 8", "schritte": [{"g": "3 − 8 = −5"}]}, {"stufe": "leicht", "loesung": "−11", "hinweis": "Gleiche Richtung (beide minus) → 6 + 5, Vorzeichen −", "aufgabe": "−6 − 5", "schritte": [{"g": "−6 − 5 = −11"}]}, {"stufe": "leicht", "loesung": "−10", "hinweis": "Plusklammer weglassen → −4 − 6", "aufgabe": "−4 + (−6)", "schritte": [{"g": "Klammer zuerst → −6 = −6"}, {"g": "−4 + −6"}, {"g": "−4 + −6 = −10"}]}, {"stufe": "leicht", "loesung": "10", "hinweis": "Minus vor Minus wird Plus → 6 + 4", "aufgabe": "6 − (−4)", "schritte": [{"g": "Klammer zuerst → −4 = −4"}, {"g": "6 − −4"}, {"g": "6 − −4 = 10"}]}, {"stufe": "mittel", "loesung": "0", "hinweis": "Erst Klammer → −12 + 7 + 5", "aufgabe": "−12 + 7 − (−5)", "schritte": [{"g": "Klammer zuerst → −5 = −5"}, {"g": "−12 + 7 − −5"}, {"g": "−12 + 7 − −5 = 0"}]}, {"stufe": "mittel", "loesung": "5", "hinweis": "Minus vor einer negativen Zahl wird Plus → 3,5 − (−1,5) = 3,5 + 1,5 – auch mit Kommazahlen.", "aufgabe": "3,5 − (−1,5)", "schritte": [{"g": "Klammer zuerst → −1,5 = −1,5"}, {"g": "3,5 − −1,5"}, {"g": "3,5 − −1,5 = 5"}]}, {"stufe": "mittel", "loesung": "−1/2", "hinweis": "Unterschied 3/4 − 1/4 = 2/4, kürzen; Vorzeichen −", "aufgabe": "−3/4 + 1/4", "schritte": [{"g": "Gleicher Nenner → Zähler verrechnen"}, {"g": "−3 + 1 = −2 → −2/4"}, {"g": "kürzen mit 2 → −1/2"}]}, {"stufe": "mittel", "loesung": "0", "hinweis": "Von links → −15 + 8 = −7, dann −7 + 7 = 0", "aufgabe": "−15 + 8 + 7", "schritte": [{"g": "−15 + 8 + 7 = 0"}]}]}, {"name": "Mal und Geteilt", "verstehen": ["(−3) · 4 heißt: viermal die −3, also −3 − 3 − 3 − 3 = −12. Minus mal Plus gibt Minus – so weit, so logisch. Aber warum gibt Minus mal Minus Plus? Schau dir dieses Muster an → 3 · (−4) = −12, dann 2 · (−4) = −8, dann 1 · (−4) = −4, dann 0 · (−4) = 0. Bei jedem Schritt wird das Ergebnis um 4 größer. Geht das Muster weiter, kommt (−1) · (−4) = +4. Das Muster zwingt das Plus!", "Die Regel: Gleiche Vorzeichen → Ergebnis positiv. Verschiedene Vorzeichen → Ergebnis negativ. Sie gilt genauso fürs Teilen → 18 : (−9) = −2, aber (−36) : (−4) = 9."], "fallen": [{"falle": "Minus mal Minus bleibt Minus", "falsch": "(−3) · (−4) = −12", "richtig": "(−3) · (−4) = 12", "warum": "Gleiche Vorzeichen → positiv (siehe Muster-Reihe)"}, {"falle": "Vorzeichen beim Teilen vergessen", "falsch": "12 : (−3) = 4", "richtig": "12 : (−3) = −4", "warum": "Verschiedene Vorzeichen → negativ"}], "ueben": [{"stufe": "leicht", "loesung": "−15", "hinweis": "Verschiedene Vorzeichen → negativ", "aufgabe": "(−5) · 3", "schritte": [{"g": "Klammer zuerst → −5 = −5"}, {"g": "−5 · 3"}, {"g": "−5 · 3 = −15"}, {"g": "= −15"}]}, {"stufe": "leicht", "loesung": "24", "hinweis": "Gleiche Vorzeichen → positiv", "aufgabe": "(−6) · (−4)", "schritte": [{"g": "Klammer zuerst → −6 = −6"}, {"g": "−6 · (−4)"}, {"g": "Klammer zuerst → −4 = −4"}, {"g": "−6 · −4"}, {"g": "−6 · −4 = 24"}, {"g": "= 24"}]}, {"stufe": "leicht", "loesung": "−3", "hinweis": "Verschiedene Vorzeichen → negativ", "aufgabe": "24 : (−8)", "schritte": [{"g": "Klammer zuerst → −8 = −8"}, {"g": "24 : −8"}, {"g": "24 : −8 = −3"}, {"g": "= −3"}]}, {"stufe": "leicht", "loesung": "7", "hinweis": "Gleiche Vorzeichen → positiv", "aufgabe": "(−42) : (−6)", "schritte": [{"g": "Klammer zuerst → −42 = −42"}, {"g": "−42 : (−6)"}, {"g": "Klammer zuerst → −6 = −6"}, {"g": "−42 : −6"}, {"g": "−42 : −6 = 7"}, {"g": "= 7"}]}, {"stufe": "leicht", "loesung": "1", "hinweis": "Gleiche Vorzeichen → positiv", "aufgabe": "(−1) · (−1)", "schritte": [{"g": "Klammer zuerst → −1 = −1"}, {"g": "−1 · (−1)"}, {"g": "Klammer zuerst → −1 = −1"}, {"g": "−1 · −1"}, {"g": "−1 · −1 = 1"}, {"g": "= 1"}]}, {"stufe": "mittel", "loesung": "−6", "hinweis": "Schrittweise → (−2)·(−3) = 6, dann 6·(−1) = −6 (ungerade Anzahl Minus → minus)", "aufgabe": "(−2) · (−3) · (−1)", "schritte": [{"g": "Klammer zuerst → −2 = −2"}, {"g": "−2 · (−3) · (−1)"}, {"g": "Klammer zuerst → −3 = −3"}, {"g": "−2 · −3 · (−1)"}, {"g": "Klammer zuerst → −1 = −1"}, {"g": "−2 · −3 · −1"}, {"g": "−2 · −3 = 6", "op": "Punkt vor Strich"}, {"g": "6 · −1"}, {"g": "6 · −1 = −6"}, {"g": "= −6"}]}, {"stufe": "mittel", "loesung": "8", "hinweis": "Von links → (−24):6 = −4, dann (−4)·(−2) = 8", "aufgabe": "(−24) : 6 · (−2)", "schritte": [{"g": "Klammer zuerst → −24 = −24"}, {"g": "−24 : 6 · (−2)"}, {"g": "Klammer zuerst → −2 = −2"}, {"g": "−24 : 6 · −2"}, {"g": "−24 : 6 = −4", "op": "Punkt vor Strich"}, {"g": "−4 · −2"}, {"g": "−4 · −2 = 8"}, {"g": "= 8"}]}, {"stufe": "mittel", "loesung": "−4", "hinweis": "Auch mit Kommazahlen: verschiedene Vorzeichen → negativ", "aufgabe": "(−0,5) · 8", "schritte": [{"g": "Klammer zuerst → −0,5 = −0,5"}, {"g": "−0,5 · 8"}, {"g": "−0,5 · 8 = −4"}, {"g": "= −4"}]}, {"stufe": "mittel", "loesung": "9 und −9", "hinweis": "(−3)² = (−3)·(−3) = 9; bei −3² gilt: erst Potenz (3² = 9), dann das Minus davor → −9", "aufgabe": "(−3)² und −3²", "schritte": [{"g": "(−3)² = (−3)·(−3) = 9; bei −3² gilt: erst Potenz (3² = 9), dann das Minus davor"}, {"g": "−9"}, {"g": "Ergebnis: 9 und −9"}]}]}], "uplus": [{"stufe": "", "loesung": "0", "hinweis": "Erst Punkt → (−3)·4 = −12; dann −12 + 12 = 0", "aufgabe": "(−3) · 4 − (−12)", "schritte": [{"g": "Klammer zuerst → −3 = −3"}, {"g": "−3 · 4 − (−12)"}, {"g": "Klammer zuerst → −12 = −12"}, {"g": "−3 · 4 − −12"}, {"g": "−3 · 4 = −12", "op": "Punkt vor Strich"}, {"g": "−12 − −12"}, {"g": "−12 − −12 = 0"}]}, {"stufe": "", "loesung": "25", "hinweis": "Erst Klammer → 2 − 7 = −5; dann −5 · (−5) = 25", "aufgabe": "−5 · (2 − 7)", "schritte": [{"g": "Klammer zuerst → 2 − 7 = −5"}, {"g": "−5 · −5"}, {"g": "−5 · −5 = 25"}, {"g": "= 25"}]}, {"stufe": "", "loesung": "2", "hinweis": "Punkt vor Strich → −4 + 6 = 2", "aufgabe": "24 : (−6) + (−3) · (−2)", "schritte": [{"g": "Klammer zuerst → −6 = −6"}, {"g": "24 : −6 + (−3) · (−2)"}, {"g": "Klammer zuerst → −3 = −3"}, {"g": "24 : −6 + −3 · (−2)"}, {"g": "Klammer zuerst → −2 = −2"}, {"g": "24 : −6 + −3 · −2"}, {"g": "24 : −6 = −4", "op": "Punkt vor Strich"}, {"g": "−4 + −3 · −2"}, {"g": "−3 · −2 = 6"}, {"g": "−4 + 6"}, {"g": "−4 + 6 = 2"}]}, {"stufe": "", "loesung": "−10", "hinweis": "Klammer → −5; Minus davor → +5; dann 5 · (−2) = −10", "aufgabe": "−(4 − 9) · (−2)", "schritte": [{"g": "Klammer zuerst → 4 − 9 = −5"}, {"g": "−−5 · (−2)"}, {"g": "Klammer zuerst → −2 = −2"}, {"g": "−−5 · −2"}, {"g": "−5 · −2 = 10"}, {"g": "−10"}, {"g": "= −10"}]}, {"stufe": "", "loesung": "−8", "hinweis": "Ungerade Anzahl Minuszeichen → Ergebnis negativ → (−2)·(−2)·(−2) = 4·(−2) = −8.", "aufgabe": "(−2)³", "schritte": [{"g": "Ungerade Anzahl Minuszeichen"}, {"g": "Ergebnis negativ"}, {"g": "(−2)·(−2)·(−2) = 4·(−2) = −8."}]}, {"stufe": "", "loesung": "−3/4", "hinweis": "Punkt vor Strich → 2/3 · (−3/8) = −1/4; −1/2 − 1/4", "aufgabe": "−0,5 + 2/3 · (−3/8)", "schritte": [{"g": "Punkt vor Strich"}, {"g": "2/3 · (−3/8) = −1/4; −1/2 − 1/4"}, {"g": "Ergebnis: −3/4"}]}, {"stufe": "", "loesung": "0,2 (= 1/5)", "hinweis": "Einheitliche Darstellung → −3/10 + 6/10 − 1/10 = 2/10", "aufgabe": "−0,3 + 3/5 − 0,1", "schritte": [{"g": "Einheitliche Darstellung"}, {"g": "−3/10 + 6/10 − 1/10 = 2/10"}, {"g": "Ergebnis: 0,2 (= 1/5)"}]}, {"stufe": "", "loesung": "−0,1", "hinweis": "Erst Division → 0,5 · 4/5 = 0,4; dann 0,3 − 0,4", "aufgabe": "0,3 − 0,5 : 5/4", "schritte": [{"g": "Erst Division"}, {"g": "0,5 · 4/5 = 0,4; dann 0,3 − 0,4"}, {"g": "Ergebnis: −0,1"}]}, {"stufe": "", "loesung": "−47", "hinweis": "Ausmultiplizieren → −40 − 7", "aufgabe": "8 · (−5 − 7/8)", "schritte": [{"g": "Ausmultiplizieren"}, {"g": "−40 − 7"}, {"g": "Ergebnis: −47"}]}], "transfer": [{"aufgabe": "Morgens zeigt das Thermometer −8 °C. Bis mittags steigt die Temperatur um 15 °C. Wie warm ist es mittags?", "schritte": [{"g": "Ansatz"}, {"g": "−8 + 15. Unterschied 15 − 8 = 7, die 15 ist positiv und weiter von Null. Mittags sind es 7 °C."}], "loesung": "7 °C", "hinweis": "Ansatz → −8 + 15. Unterschied 15 − 8 = 7, die 15 ist positiv und weiter von Null. Mittags sind es 7 °C."}, {"aufgabe": "Auf Linas Konto sind −23,50 € (das Konto ist überzogen). Ihre Oma überweist 40 €. Wie viel ist danach auf dem Konto?", "schritte": [{"g": "Ansatz"}, {"g": "−23,50 + 40. Unterschied 40 − 23,50 = 16,50, positiv. Danach sind 16,50 € auf dem Konto."}], "loesung": "16,50 €", "hinweis": "Ansatz → −23,50 + 40. Unterschied 40 − 23,50 = 16,50, positiv. Danach sind 16,50 € auf dem Konto."}, {"aufgabe": "Eine Drohne fliegt 35 m über dem Meeresspiegel, ein U-Boot fährt 48 m darunter (−48 m). Wie groß ist der Höhenunterschied?", "schritte": [{"g": "Ansatz"}, {"g": "35 − (−48) = 35 + 48 = 83. Der Höhenunterschied beträgt 83 m. (Falle"}, {"g": "35 − 48 = −13 wäre falsch – Abstand heißt Differenz der Höhen, das Minus der Tiefe muss umgedreht werden.)"}, {"g": "Ergebnis: 83 m"}], "loesung": "83 m", "hinweis": "Ansatz → 35 − (−48) = 35 + 48 = 83. Der Höhenunterschied beträgt 83 m. (Falle → 35 − 48 = −13 wäre falsch – Abstand heißt Differenz der Höhen, das Minus der Tiefe muss umgedreht werden.)"}], "wpool": [{"aufgabe": "−9 + 4", "schritte": [{"g": "−9 + 4 = −5"}], "loesung": "−5"}, {"aufgabe": "(−7) · (−2)", "schritte": [{"g": "Klammer zuerst → −7 = −7"}, {"g": "−7 · (−2)"}, {"g": "Klammer zuerst → −2 = −2"}, {"g": "−7 · −2"}, {"g": "−7 · −2 = 14"}, {"g": "= 14"}], "loesung": "14"}, {"aufgabe": "6 − 10", "schritte": [{"g": "6 − 10 = −4"}], "loesung": "−4"}, {"aufgabe": "−20 : 5", "schritte": [{"g": "−20 : 5 = −4"}, {"g": "= −4"}], "loesung": "−4"}, {"aufgabe": "−3 + (−3)", "schritte": [{"g": "Klammer zuerst → −3 = −3"}, {"g": "−3 + −3"}, {"g": "−3 + −3 = −6"}], "loesung": "−6"}], "titel": "Plus, Minus und die Vorzeichen im Griff"}, "B1": {"id": "B1", "titel": "Die binomischen Formeln knacken", "kerne": [{"name": "", "verstehen": ["Rechne (x + 3)². Das heißt (x + 3) · (x + 3). Multipliziere jeden mit jedem: x² + 3x + 3x + 9 = x² + 6x + 9. Genau das sagt die 1. binomische Formel → (a + b)² = a² + 2ab + b². Das mittlere Glied 2ab entsteht, weil das gemischte Produkt zweimal vorkommt.", "Warum das stimmt, siehst du an einem Bild – dem Flächenmodell. Zeichne ein Quadrat, dessen Seite a + b lang ist (erst ein Stück a, dann ein Stück b). Teile beide Seiten an dieser Stelle und ziehe die Linien quer durch – das große Quadrat zerfällt in vier Teile: oben links ein Quadrat mit Seite a (Fläche a · a = a²), unten rechts ein Quadrat mit Seite b (Fläche b · b = b²) und zwei gleich große Rechtecke mit den Seiten a und b (jedes hat die Fläche a · b). Das große Quadrat hat die Fläche (a + b)² – und alle vier Teile zusammen haben die Fläche a² + ab + ab + b² = a² + 2ab + b². Beides ist dieselbe Fläche, also → (a + b)² = a² + 2ab + b². So SIEHST du, warum das mittlere Glied doppelt vorkommt: Es gibt zwei Rechtecke.", "Die 2. binomische Formel rechnest du genauso nach: (a − b)² heißt (a − b) · (a − b). Multipliziere jeden mit jedem → a · a = a², dann a · (−b) = −ab, dann (−b) · a = −ab, zuletzt (−b) · (−b) = +b² (Minus mal Minus gibt Plus!). Zusammen: a² − ab − ab + b² = a² − 2ab + b². Also → (a − b)² = a² − 2ab + b². Das Minus steht nur beim mittleren Glied – das b² am Ende bleibt Plus.", "Die 3. binomische Formel: (a + b)(a − b). Multipliziere jeden mit jedem → a · a = a², a · (−b) = −ab, b · a = +ab, b · (−b) = −b². Zusammen: a² − ab + ab − b². Die beiden mittleren Teile heben sich auf (−ab + ab = 0) – übrig bleibt a² − b². Also → (a + b)(a − b) = a² − b². Mit den drei Formeln rechnest du schneller und sicherer als mit Ausmultiplizieren – und du erkennst sie später beim Faktorisieren wieder."], "fallen": [{"falle": "Mittleres Glied vergessen", "falsch": "(x + 3)² = x² + 9", "richtig": "(x + 3)² = x² + 6x + 9", "warum": "Das gemischte Produkt kommt zweimal vor → 2 · x · 3 = 6x"}, {"falle": "2. und 3. Formel verwechselt", "falsch": "(a − b)² = a² − b²", "richtig": "(a − b)² = a² − 2ab + b²", "warum": "a² − b² gehört zu (a + b)(a − b); beim Quadrat bleibt +b²"}], "ueben": [{"stufe": "leicht", "aufgabe": "(x + 2)²", "schritte": [{"g": "1. binomische Formel: (a + b)² = a² + 2ab + b²"}, {"g": "a = x, b = 2"}, {"g": "x² + 2 · x · 2 + 2² = x² + 4x + 4"}], "loesung": "x² + 4x + 4", "hinweis": "1. Formel (a + b)² = a² + 2ab + b². Mittelglied → 2 · x · 2 = 4x."}, {"stufe": "leicht", "aufgabe": "(x − 5)²", "schritte": [{"g": "2. binomische Formel: (a − b)² = a² − 2ab + b²"}, {"g": "a = x, b = 5"}, {"g": "x² − 2 · x · 5 + 5² = x² − 10x + 25"}], "loesung": "x² − 10x + 25", "hinweis": "2. Formel (a − b)² = a² − 2ab + b². Mittelglied → 2 · x · 5 = 10x, mit Minus."}, {"stufe": "leicht", "aufgabe": "(x + 4)(x − 4)", "schritte": [{"g": "3. binomische Formel: (a + b)(a − b) = a² − b²"}, {"g": "x² − 4² = x² − 16"}], "loesung": "x² − 16", "hinweis": "3. Formel (a + b)(a − b) = a² − b². Hier: x² − 4² = x² − 16."}, {"stufe": "leicht", "aufgabe": "(a + 7)²", "schritte": [{"g": "1. binomische Formel: (a + b)² = a² + 2ab + b²"}, {"g": "a = a, b = 7"}, {"g": "a² + 2 · a · 7 + 7² = a² + 14a + 49"}], "loesung": "a² + 14a + 49", "hinweis": "1. Formel (a + b)² = a² + 2ab + b². Mittelglied → 2 · a · 7 = 14a."}, {"stufe": "leicht", "aufgabe": "(3 + x)²", "schritte": [{"g": "1. binomische Formel – auch wenn die Zahl vorn steht"}, {"g": "(a + b)² mit a = 3, b = x"}, {"g": "3² + 2 · 3 · x + x²"}, {"g": "= 9 + 6x + x²"}], "loesung": "9 + 6x + x²", "hinweis": "Auch wenn die Zahl vorn steht: gleiche Formel"}, {"stufe": "mittel", "aufgabe": "(3a + b)²", "schritte": [{"g": "1. Formel mit a"}, {"g": "3a"}, {"g": "(3a)² = 9a², Mittelglied 2 · 3a · b = 6ab, dazu b²."}, {"g": "Ergebnis: 9a² + 6ab + b²"}], "loesung": "9a² + 6ab + b²", "hinweis": "1. Formel mit a → 3a → (3a)² = 9a², Mittelglied 2 · 3a · b = 6ab, dazu b²."}, {"stufe": "mittel", "aufgabe": "(4x − y)²", "schritte": [{"g": "2. Formel (a − b)² = a² − 2ab + b² mit a"}, {"g": "4x"}, {"g": "(4x)² = 16x², Mittelglied 2 · 4x · y = 8xy mit Minus, dazu y²."}, {"g": "Ergebnis: 16x² − 8xy + y²"}], "loesung": "16x² − 8xy + y²", "hinweis": "2. Formel (a − b)² = a² − 2ab + b² mit a → 4x → (4x)² = 16x², Mittelglied 2 · 4x · y = 8xy mit Minus, dazu y²."}, {"stufe": "mittel", "aufgabe": "(2x + 5)(2x − 5)", "schritte": [{"g": "3. Formel (a + b)(a − b) = a² − b² mit a"}, {"g": "2x"}, {"g": "(2x)² = 4x², minus 5² = 25."}, {"g": "Ergebnis: 4x² − 25"}], "loesung": "4x² − 25", "hinweis": "3. Formel (a + b)(a − b) = a² − b² mit a → 2x → (2x)² = 4x², minus 5² = 25."}, {"stufe": "mittel", "aufgabe": "(5a − 2b)²", "schritte": [{"g": "2. Formel"}, {"g": "(5a)² = 25a², Mittelglied 2 · 5a · 2b = 20ab mit Minus, dazu (2b)² = 4b²."}, {"g": "Ergebnis: 25a² − 20ab + 4b²"}], "loesung": "25a² − 20ab + 4b²", "hinweis": "2. Formel → (5a)² = 25a², Mittelglied 2 · 5a · 2b = 20ab mit Minus, dazu (2b)² = 4b²."}, {"stufe": "mittel", "aufgabe": "Ergänze: x² − ▢x + 16 = (x − 4)²", "schritte": [{"g": "Rückwärts lesen"}, {"g": "2 · x · 4"}, {"g": "Ergebnis: 8"}], "loesung": "8", "hinweis": "Rückwärts lesen → 2 · x · 4"}]}], "uplus": [{"stufe": "", "aufgabe": "(2x + y)(2x − y) − 2 · (2x)²", "schritte": [{"g": "Erst 3. Formel"}, {"g": "(2x + y)(2x − y) = 4x² − y². Dann 2 · (2x)² = 8x² abziehen"}, {"g": "4x² − y² − 8x² = −4x² − y²."}], "loesung": "−4x² − y²", "hinweis": "Erst 3. Formel → (2x + y)(2x − y) = 4x² − y². Dann 2 · (2x)² = 8x² abziehen → 4x² − y² − 8x² = −4x² − y²."}, {"stufe": "", "aufgabe": "(2x − 3)² − (x + 2) · (1/2 + x)", "schritte": [{"g": "Links 2. Formel"}, {"g": "4x² − 12x + 9. Rechts ausmultiplizieren: x² + 2,5x + 1. Beim Abziehen dreht das Minus alle Vorzeichen der Klammer."}, {"g": "Ergebnis: 3x² − 14,5x + 8"}], "loesung": "3x² − 14,5x + 8", "hinweis": "Links 2. Formel → 4x² − 12x + 9. Rechts ausmultiplizieren: x² + 2,5x + 1. Beim Abziehen dreht das Minus alle Vorzeichen der Klammer."}], "transfer": [{"stufe": "", "aufgabe": "Begründe mit einer Skizze, warum (a + b)² = a² + 2ab + b² gilt.", "schritte": [{"g": "Zeichne ein Quadrat mit der Seitenlänge a + b (erst ein Stück a, dann ein Stück b)"}, {"g": "Teile beide Seiten an dieser Stelle und ziehe die Linien quer durch → 4 Teilflächen"}, {"g": "Oben links: Quadrat mit Seite a → Fläche a · a = a²"}, {"g": "Unten rechts: Quadrat mit Seite b → Fläche b · b = b²"}, {"g": "Dazu ZWEI gleich große Rechtecke mit den Seiten a und b → je a · b, zusammen 2ab"}, {"g": "Das große Quadrat hat die Fläche (a + b)² – die vier Teile zusammen: a² + 2ab + b²"}, {"g": "Beides ist dieselbe Fläche → (a + b)² = a² + 2ab + b² ✓"}], "loesung": "Flächenmodell", "hinweis": "Quadrat mit Seite a + b zerlegen: ein Quadrat a², ein Quadrat b², zwei Rechtecke a · b. Gesamtfläche a² + 2ab + b²."}, {"stufe": "", "aufgabe": "Rechne geschickt im Kopf: a) 21² b) 19 · 21", "schritte": [{"g": "a) 21 = 20 + 1 → 1. binomische Formel: (a + b)² = a² + 2ab + b²"}, {"g": "(20 + 1)² = 20² + 2 · 20 · 1 + 1² = 400 + 40 + 1 = 441"}, {"g": "b) 19 · 21 = (20 − 1)(20 + 1) → 3. Formel: (a + b)(a − b) = a² − b²"}, {"g": "20² − 1² = 400 − 1 = 399"}], "loesung": "441 und 399", "hinweis": "a) (20 + 1)² = 400 + 40 + 1 = 441. b) (20 − 1)(20 + 1) = 400 − 1 = 399."}, {"stufe": "", "aufgabe": "Von einem Rechteck ist eine Seite 3 cm länger als die andere. Verlängert man beide Seiten um 1 cm, wächst der Flächeninhalt um 22 cm². Wie lang sind die ursprünglichen Seiten?", "schritte": [{"g": "Seiten x und x + 3 ansetzen; neue Fläche = alte Fläche + 22: (x + 1)(x + 4) = x(x + 3) + 22"}, {"g": "2x = 18"}, {"g": "x = 9. Seiten"}, {"g": "9 cm und 12 cm. Probe"}, {"g": "10 · 13 = 130 = 9 · 12 + 22 ✓"}, {"g": "Ergebnis: 9 cm und 12 cm"}], "loesung": "9 cm und 12 cm", "hinweis": "Seiten x und x + 3 ansetzen; neue Fläche = alte Fläche + 22: (x + 1)(x + 4) = x(x + 3) + 22 → 2x = 18 → x = 9. Seiten → 9 cm und 12 cm. Probe → 10 · 13 = 130 = 9 · 12 + 22 ✓"}], "wpool": [{"aufgabe": "(x + 1)²", "schritte": [{"g": "1. binomische Formel: (a + b)² = a² + 2ab + b²"}, {"g": "a = x, b = 1"}, {"g": "x² + 2 · x · 1 + 1² = x² + 2x + 1"}], "loesung": "x² + 2x + 1"}, {"aufgabe": "(x − 2)²", "schritte": [{"g": "2. binomische Formel: (a − b)² = a² − 2ab + b²"}, {"g": "a = x, b = 2"}, {"g": "x² − 2 · x · 2 + 2² = x² − 4x + 4"}], "loesung": "x² − 4x + 4"}, {"aufgabe": "(x + 5)(x − 5)", "schritte": [{"g": "3. binomische Formel: (a + b)(a − b) = a² − b²"}, {"g": "x² − 5² = x² − 25"}], "loesung": "x² − 25"}, {"aufgabe": "Rechne 31² im Kopf – Trick: 1. binomische Formel mit (30 + 1)².", "schritte": [{"g": "31 = 30 + 1 → 1. Formel: (a + b)² = a² + 2ab + b²"}, {"g": "(30 + 1)² = 30² + 2 · 30 · 1 + 1² = 900 + 60 + 1 = 961"}], "loesung": "961"}, {"aufgabe": "Welche Formel steckt in a² − 49?", "schritte": [{"g": "a² − 49 ist eine Differenz zweier Quadrate: a² und 49 = 7²"}, {"g": "Das ist das Muster der 3. binomischen Formel: a² − b² = (a + b)(a − b)"}, {"g": "→ a² − 49 = (a + 7)(a − 7)"}], "loesung": "3. (a + 7)(a − 7)"}]}, "B2": {"id": "B2", "titel": "Potenzen – kurz geschrieben, viel drin", "kerne": [{"name": "", "verstehen": ["2⁵ heißt: fünfmal die 2 multiplizieren → 2 · 2 · 2 · 2 · 2 = 32. Die kleine Zahl (Exponent) zählt die Faktoren. Deshalb gilt → 2³ · 2⁴ = (2 · 2 · 2) · (2 · 2 · 2 · 2) = 2⁷ – bei gleicher Basis addierst du die Exponenten.", "Steht ein Produkt in der Klammer, wird jeder Faktor potenziert → (2x)³ = 2³ · x³ = 8x³. Und Vorsicht bei Minus → (−3)² = 9, aber −3² = −(3²) = −9. Ohne Klammer gehört das Minus nicht zur Basis – Potenz kommt vor dem Vorzeichen dran (Hoch vor Punkt vor Strich).", "Gerade Anzahl von Minusfaktoren gibt Plus, ungerade gibt Minus → (−2)³ = −8, (−2)⁴ = 16."], "fallen": [{"falle": "Exponenten multipliziert statt addiert", "falsch": "2³ · 2⁴ = 2¹²", "richtig": "2³ · 2⁴ = 2⁷", "warum": "Faktoren zählen → 3 + 4 = 7 Zweien"}, {"falle": "Klammer beim Quadrieren ignoriert", "falsch": "(−5x)² = −25x²", "richtig": "(−5x)² = 25x²", "warum": "(−5x) · (−5x): Minus mal Minus gibt Plus"}], "ueben": [{"stufe": "leicht", "aufgabe": "2³ · 2²", "schritte": [{"g": "Gleiche Basis mal → Hochzahlen addieren"}, {"g": "2³ · 2² = 2³⁺² = 2⁵"}, {"g": "2⁵ = 32"}], "loesung": "2⁵ = 32", "hinweis": "Exponenten addieren"}, {"stufe": "leicht", "aufgabe": "x³ · x⁴", "schritte": [{"g": "Gleiche Basis mal → Hochzahlen addieren"}, {"g": "x³ · x⁴ = x³⁺⁴ = x⁷"}], "loesung": "x⁷", "hinweis": "Gleiche Basis"}, {"stufe": "leicht", "aufgabe": "(−2)³", "schritte": [{"g": "(−2) · (−2) · (−2)"}, {"g": "(−2) · (−2) = 4, dann 4 · (−2) = −8"}, {"g": "Ungerade Anzahl Minus → Ergebnis negativ: −8"}], "loesung": "−8", "hinweis": "Ungerade Anzahl Minus"}, {"stufe": "leicht", "aufgabe": "(−3)² und −3²", "schritte": [{"g": "(−3)² = (−3) · (−3) = 9 – die Klammer quadriert das Minus MIT"}, {"g": "−3² = −(3 · 3) = −9 – ohne Klammer gilt das Minus erst NACH dem Quadrieren"}, {"g": "Ergebnis: 9 und −9"}], "loesung": "9 und −9", "hinweis": "Klammer entscheidet"}, {"stufe": "leicht", "aufgabe": "(3x)²", "schritte": [{"g": "Jeder Faktor wird quadriert"}, {"g": "(3x)² = 3² · x² = 9x²"}], "loesung": "9x²", "hinweis": "Jeder Faktor wird quadriert"}, {"stufe": "mittel", "aufgabe": "(2x)³", "schritte": [{"g": "Potenz einer Klammer: jeder Faktor wird potenziert"}, {"g": "(2x)³ = 2³ · x³"}, {"g": "= 8x³"}], "loesung": "8x³", "hinweis": "Potenz einer Klammer: jeder Faktor wird potenziert – (2x)³ = 2³ · x³ = 8x³."}, {"stufe": "mittel", "aufgabe": "a² · a³ · a", "schritte": [{"g": "a allein heißt a¹"}, {"g": "Hochzahlen addieren: 2 + 3 + 1 = 6"}, {"g": "a² · a³ · a = a⁶"}], "loesung": "a⁶", "hinweis": "Gleiche Basis mal: Hochzahlen addieren. a² · a³ · a¹ = a²⁺³⁺¹ = a⁶."}, {"stufe": "mittel", "aufgabe": "0,3y³ · (−1 1/6 · y⁵)", "schritte": [{"g": "Zahlen mal Zahlen, Potenzen mal Potenzen"}, {"g": "0,3 · (−7/6) = −0,35; y³ · y⁵ = y⁸ (Hochzahlen addieren)."}, {"g": "Ergebnis: −0,35y⁸"}], "loesung": "−0,35y⁸", "hinweis": "Zahlen mal Zahlen, Potenzen mal Potenzen → 0,3 · (−7/6) = −0,35; y³ · y⁵ = y⁸ (Hochzahlen addieren)."}, {"stufe": "mittel", "aufgabe": "(7/3)s²t⁵ · (3s²t)²", "schritte": [{"g": "Erst die Klammer-Potenz: (3s²t)² = 9s⁴t²"}, {"g": "Zahlen: 7/3 · 9 = 21"}, {"g": "s: s² · s⁴ = s⁶ · t: t⁵ · t² = t⁷"}, {"g": "Ergebnis: 21s⁶t⁷"}], "loesung": "21s⁶t⁷", "hinweis": "Erst (3s²t)² = 9s⁴t²; 7/3 · 9 = 21"}, {"stufe": "mittel", "aufgabe": "(2x)³ − (−11x³ + 5x)", "schritte": [{"g": "Erst (2x)³ = 8x³; das Minus vor der Klammer dreht die Vorzeichen"}, {"g": "8x³ + 11x³ − 5x."}, {"g": "Ergebnis: 19x³ − 5x"}], "loesung": "19x³ − 5x", "hinweis": "Erst (2x)³ = 8x³; das Minus vor der Klammer dreht die Vorzeichen → 8x³ + 11x³ − 5x."}]}], "uplus": [{"stufe": "", "aufgabe": "2⁵ · 2³ als Zahl", "schritte": [{"g": "Hochzahlen addieren: 2⁵ · 2³ = 2⁸"}, {"g": "2⁸ = 256"}], "loesung": "256", "hinweis": "Gleiche Basis mal: Hochzahlen addieren. 2⁵ · 2³ = 2⁸ = 256."}, {"stufe": "", "aufgabe": "Was ist größer: 2¹⁰ oder 10³?", "schritte": [{"g": "Beide ausrechnen und vergleichen"}, {"g": "2¹⁰ = 1024 und 10³ = 1000"}, {"g": "2¹⁰ ist größer."}], "loesung": "2¹⁰", "hinweis": "Beide ausrechnen und vergleichen → 2¹⁰ = 1024 und 10³ = 1000 → 2¹⁰ ist größer."}, {"stufe": "", "aufgabe": "(10²)³ als Zehnerpotenz", "schritte": [{"g": "Quadrat hoch drei"}, {"g": "10² · 10² · 10² – Exponenten addieren"}, {"g": "Ergebnis: 10⁶"}], "loesung": "10⁶", "hinweis": "Quadrat hoch drei → 10² · 10² · 10² – Exponenten addieren"}], "transfer": [{"stufe": "", "aufgabe": "Ein Blatt Papier ist 0,1 mm dick. Du faltest es 10-mal (jedes Falten verdoppelt die Dicke). Wie dick ist der Stapel?", "schritte": [{"g": "Jedes Falten verdoppelt → nach 10-mal: 2¹⁰"}, {"g": "2¹⁰ = 1024"}, {"g": "0,1 mm · 1024 = 102,4 mm"}, {"g": "Antwort: gut 10 cm – Potenzen wachsen schneller, als man denkt"}], "loesung": "102,4 mm (ca. 10 cm)", "hinweis": "Dicke = 0,1 mm · 2¹⁰ = 0,1 · 1024 = 102,4 mm ≈ 10 cm. Antwort: gut 10 cm – Potenzen wachsen schneller, als man denkt."}, {"stufe": "", "aufgabe": "Veranschauliche T(a) = 3a² geometrisch.", "schritte": [{"g": "a² ist die Fläche eines Quadrats mit Seite a"}, {"g": "3a² = drei solcher Quadrate nebeneinander"}, {"g": "Oder: ein Rechteck mit den Seiten a und 3a"}], "loesung": "Skizze", "hinweis": "Drei Quadrate mit Seitenlänge a (je Fläche a²) – oder ein Rechteck mit den Seiten a und 3a."}], "wpool": [{"aufgabe": "2⁴", "schritte": [{"g": "2 · 2 · 2 · 2"}, {"g": "= 16"}], "loesung": "16"}, {"aufgabe": "x² · x³", "schritte": [{"g": "Hochzahlen addieren"}, {"g": "x² · x³ = x⁵"}], "loesung": "x⁵"}, {"aufgabe": "(−1)⁷", "schritte": [{"g": "Ungerade Hochzahl → Minus bleibt"}, {"g": "(−1)⁷ = −1"}], "loesung": "−1"}, {"aufgabe": "(5a)²", "schritte": [{"g": "Jeder Faktor wird quadriert"}, {"g": "(5a)² = 5² · a² = 25a²"}], "loesung": "25a²"}, {"aufgabe": "−2²", "schritte": [{"g": "Ohne Klammer: erst quadrieren, dann das Minus"}, {"g": "−2² = −(2 · 2) = −4"}], "loesung": "−4"}]}, "B3": {"id": "B3", "titel": "Winkel-Detektiv", "kerne": [{"name": "", "verstehen": ["An einer Geradenkreuzung gilt: Gegenüberliegende Winkel (Scheitelwinkel) sind gleich groß, nebeneinanderliegende (Nebenwinkel) ergänzen sich zu 180°. Beispiel aus dem Buch: Ist ein Winkel 45°, dann ist sein Scheitelwinkel 45° und jeder Nebenwinkel 180° − 45° = 135°.", "Schneidet eine Gerade zwei PARALLELE Geraden, sind Stufenwinkel gleich groß und Wechselwinkel gleich groß. Wichtig: Das gilt nur bei Parallelen – prüfe das immer zuerst!", "In jedem Dreieck beträgt die Winkelsumme 180°. Warum? Zeichne durch eine Ecke die Parallele zur Gegenseite: Nach dem Wechselwinkelsatz erscheinen dort alle drei Innenwinkel nebeneinander – zusammen eine halbe Drehung, also 180°. Im Viereck sind es 360° (zwei Dreiecke), im n-Eck (n − 2) · 180°."], "fallen": [{"falle": "Nebenwinkel zu 90° ergänzt", "falsch": "Nebenwinkel von 120° = −30°/„geht nicht“", "richtig": "180° − 120° = 60°", "warum": "Nebenwinkel ergänzen sich zu 180°, nicht zu 90°"}, {"falle": "Stufenwinkel ohne Parallelen benutzt", "falsch": "„Stufenwinkel, also gleich“ bei beliebigen Geraden", "richtig": "Erst Parallelität prüfen/begründen", "warum": "Stufen-/Wechselwinkelsatz gilt nur bei g ∥ h"}], "ueben": [{"stufe": "leicht", "aufgabe": "Zwei Geraden schneiden sich, ein Winkel misst 45°. Wie groß sind sein Scheitelwinkel und sein Nebenwinkel?", "schritte": [{"g": "Scheitelwinkel liegen sich am Schnittpunkt GEGENÜBER – sie sind immer gleich groß → 45°"}, {"g": "Nebenwinkel liegen direkt NEBENEINANDER – zusammen bilden sie eine Gerade, also 180°"}, {"g": "Nebenwinkel: 180° − 45° = 135°"}, {"g": "Ergebnis: Scheitelwinkel 45°, Nebenwinkel 135°"}], "loesung": "45° und 135°", "hinweis": "Scheitelwinkel liegen sich gegenüber und sind gleich groß (45°). Nebenwinkel ergänzen sich zu 180° → 180° − 45° = 135°."}, {"stufe": "leicht", "aufgabe": "In einem Dreieck sind α = 46° und γ = 67°. Wie groß ist der Winkel β?", "schritte": [{"g": "Winkelsumme im Dreieck: Die drei Innenwinkel ergeben zusammen IMMER 180°"}, {"g": "Also: β = 180° − α − γ"}, {"g": "β = 180° − 46° − 67°"}, {"g": "β = 67°"}], "loesung": "67°", "hinweis": "Winkelsumme im Dreieck: Alle drei Winkel zusammen ergeben 180°. β = 180° − 46° − 67°."}, {"stufe": "leicht", "aufgabe": "Ein rechtwinkliges Dreieck hat einen spitzen Winkel von 35°. Wie groß ist der andere spitze Winkel?", "schritte": [{"g": "Winkelsumme im Dreieck: 180°; der rechte Winkel hat 90°"}, {"g": "90° + 35° + x = 180°"}, {"g": "x = 180° − 90° − 35° = 55°"}], "loesung": "55°", "hinweis": "Winkelsumme 180°, der rechte Winkel hat 90° → 90° + 35° + x = 180° → x = 55°."}, {"stufe": "leicht", "aufgabe": "Ein Viereck hat die Winkel 80°, 70° und 110°. Wie groß ist der vierte Winkel?", "schritte": [{"g": "Winkelsumme im Viereck: 360° (eine Diagonale zerlegt das Viereck in 2 Dreiecke → 2 · 180°)"}, {"g": "Der vierte Winkel: 360° − 80° − 70° − 110° = 100°"}], "loesung": "100°", "hinweis": "Winkelsumme im Viereck → 360°. Der vierte Winkel → 360° − 80° − 70° − 110° = 100°."}, {"stufe": "leicht", "aufgabe": "Die Geraden g und h sind parallel und werden geschnitten. Wie groß ist der Stufenwinkel zum 72°-Winkel?", "schritte": [{"g": "Stufenwinkel liegen an den zwei Parallelen in „gleicher Stufe“ – auf derselben Seite der schneidenden Geraden"}, {"g": "Stufenwinkelsatz: An Parallelen sind Stufenwinkel gleich groß"}, {"g": "Stufenwinkel = 72°"}], "loesung": "72°", "hinweis": "Stufenwinkelsatz: An geschnittenen Parallelen sind Stufenwinkel gleich groß – also ebenfalls 72°."}, {"stufe": "mittel", "aufgabe": "In einem gleichschenkligen Dreieck ist α = 54°, die beiden anderen Winkel sind gleich groß (β = γ). Wie groß ist β?", "schritte": [{"g": "Winkelsumme im Dreieck: 180°"}, {"g": "Für β und γ bleiben: 180° − 54° = 126°"}, {"g": "Gleichschenklig heißt: die beiden Basiswinkel β und γ sind gleich groß"}, {"g": "126° : 2 = 63°"}, {"g": "Ergebnis: β = γ = 63°"}], "loesung": "63°", "hinweis": "Winkelsumme 180°: Für β und γ bleiben 180° − 54° = 126°. Da beide gleich groß sind → 126° → 2 = 63°."}, {"stufe": "mittel", "aufgabe": "In einem Dreieck ist α doppelt so groß wie β (α = 2β) und γ ist 1,5-mal so groß wie β (γ = 1,5β). Wie groß sind die drei Winkel?", "schritte": [{"g": "Alle Winkel durch β ausdrücken und in die Winkelsumme (180°) einsetzen"}, {"g": "2β + β + 1,5β = 4,5β = 180°"}, {"g": "β = 40°. Dann α = 2 · 40° und γ = 1,5 · 40°."}, {"g": "Ergebnis: β = 40°, α = 80°, γ = 60°"}], "loesung": "β = 40°, α = 80°, γ = 60°", "hinweis": "Alle Winkel durch β ausdrücken und in die Winkelsumme (180°) einsetzen → 2β + β + 1,5β = 4,5β = 180° → β = 40°. Dann α = 2 · 40° und γ = 1,5 · 40°."}, {"stufe": "mittel", "aufgabe": "Wie groß ist ein Innenwinkel in einem regelmäßigen 8-Eck (Form des Stoppschilds)?", "schritte": [{"g": "Innenwinkelsumme im n-Eck: (n − 2) · 180° – denn das n-Eck zerfällt von einer Ecke aus in n − 2 Dreiecke"}, {"g": "Beim 8-Eck: 6 · 180° = 1080°"}, {"g": "Regelmäßig heißt: alle Innenwinkel sind gleich groß"}, {"g": "1080° : 8 = 135°"}], "loesung": "135°", "hinweis": "Innenwinkelsumme im n-Eck → (n − 2) · 180°. Beim 8-Eck → 6 · 180° = 1080°. Regelmäßig heißt alle gleich → 1080° → 8 = 135°."}, {"stufe": "mittel", "aufgabe": "In einem Dreieck ist β doppelt so groß wie α, und α ist um 40° kleiner als γ. Wie groß sind die drei Winkel?", "schritte": [{"g": "Alle Winkel durch α ausdrücken und in die Winkelsumme einsetzen: α + 2α + (α + 40°) = 180°"}, {"g": "4α = 140°"}, {"g": "α = 35°."}, {"g": "Ergebnis: α = 35°, β = 70°, γ = 75°"}], "loesung": "α = 35°, β = 70°, γ = 75°", "hinweis": "Alle Winkel durch α ausdrücken und in die Winkelsumme einsetzen: α + 2α + (α + 40°) = 180° → 4α = 140° → α = 35°."}, {"stufe": "mittel", "aufgabe": "In einem Dreieck sind α = 50° und β = 60°. Wie groß ist der Außenwinkel bei C?", "schritte": [{"g": "Der Außenwinkel entsteht, wenn man eine Seite über die Ecke hinaus verlängert – er ist der Nebenwinkel des Innenwinkels"}, {"g": "Außenwinkelsatz: Außenwinkel = Summe der beiden NICHT anliegenden Innenwinkel"}, {"g": "50° + 60° = 110°"}, {"g": "Kontrolle: Innenwinkel bei C = 180° − 50° − 60° = 70°; Nebenwinkel 180° − 70° = 110° ✓"}], "loesung": "110°", "hinweis": "Außenwinkel = Summe der nicht anliegenden Innenwinkel"}]}], "uplus": [{"stufe": "", "aufgabe": "An einer Doppelkreuzung sind 88°, 57° und 45° auf einer Geradenseite markiert. Kann das stimmen?", "schritte": [{"g": "Eine Gerade ist ein gestreckter Winkel: 180°. Deshalb müssen alle Winkel auf EINER Geradenseite zusammen 180° ergeben"}, {"g": "88° + 57° + 45° = 190°"}, {"g": "190° ≠ 180° → das kann NICHT stimmen"}], "loesung": "Nein", "hinweis": "88° + 57° + 45° = 190° ≠ 180° – die drei Winkel auf einer Geradenseite müssen 180° ergeben"}, {"stufe": "", "aufgabe": "Ein Viereck hat die Winkel 80°, 70° und zwei gleich große Winkel α. Wie groß ist α?", "schritte": [{"g": "Winkelsumme im Viereck: 360° (das Viereck zerfällt in 2 Dreiecke → 2 · 180°)"}, {"g": "Für die beiden α bleiben: 360° − 80° − 70° = 210°"}, {"g": "Beide α sind gleich groß → 210° : 2 = 105°"}, {"g": "α = 105°"}], "loesung": "105°", "hinweis": "Winkelsumme im Viereck → 360°. Für die beiden α bleiben 360° − 80° − 70° = 210° → α = 105°."}], "transfer": [{"stufe": "", "aufgabe": "Zwei Parallelen werden von einer Geraden geschnitten. Einer der acht Winkel misst 118°. Gib alle acht Winkel an und begründe mit den Winkelsätzen.", "schritte": [{"g": "Nebenwinkel ergänzen sich zu 180° → 180° − 118° = 62°"}, {"g": "Scheitelwinkel sind gleich groß → an der ersten Kreuzung: 118°, 62°, 118°, 62°"}, {"g": "Stufenwinkelsatz: An Parallelen sind Stufenwinkel gleich groß → dieselben vier Werte an der zweiten Kreuzung"}, {"g": "Ergebnis: 4 × 118° und 4 × 62°"}], "loesung": "4 × 118° und 4 × 62°", "hinweis": "Nebenwinkel → 180° − 118° = 62°. Scheitelwinkel verdoppeln beide Werte an der ersten Kreuzung; Stufenwinkelsatz überträgt sie auf die zweite. Jeder Schritt mit Satzname."}, {"stufe": "", "aufgabe": "Dreieck: β ist doppelt so groß wie α, γ ist um 30° größer als α. Stelle eine Gleichung auf und berechne alle Winkel.", "schritte": [{"g": "Alle Winkel durch α ausdrücken und in die Winkelsumme (180°) einsetzen"}, {"g": "α + 2α + (α + 30°) = 180°"}, {"g": "4α = 150°", "op": "| − 30°"}, {"g": "α = 37,5°", "op": "| : 4"}, {"g": "Probe: 37,5° + 75° + 67,5° = 180° ✓"}, {"g": "Ergebnis: α = 37,5°, β = 75°, γ = 67,5°"}], "loesung": "α = 37,5°, β = 75°, γ = 67,5°", "hinweis": "α + 2α + (α + 30°) = 180° → 4α = 150° → α = 37,5°. Probe → 37,5° + 75° + 67,5° = 180° ✓"}], "wpool": [{"aufgabe": "Wie groß ist der Scheitelwinkel zu 71°?", "schritte": [{"g": "Scheitelwinkel liegen sich am Schnittpunkt zweier Geraden gegenüber"}, {"g": "Regel: Scheitelwinkel sind immer gleich groß"}, {"g": "Scheitelwinkel = 71°"}], "loesung": "71°"}, {"aufgabe": "Wie groß ist der Nebenwinkel zu 120°?", "schritte": [{"g": "Nebenwinkel liegen nebeneinander und bilden zusammen eine Gerade – eine Gerade ist ein gestreckter Winkel (180°)"}, {"g": "Regel: Nebenwinkel ergänzen sich zu 180°"}, {"g": "180° − 120° = 60°"}], "loesung": "60°"}, {"aufgabe": "Ein Dreieck hat die Winkel 90° und 35°. Wie groß ist der dritte Winkel?", "schritte": [{"g": "Winkelsumme im Dreieck: Alle drei Winkel ergeben zusammen 180°"}, {"g": "180° − 90° − 35° = 55°"}], "loesung": "55°"}, {"aufgabe": "Wie groß ist die Winkelsumme im Viereck?", "schritte": [{"g": "Eine Diagonale zerlegt jedes Viereck in 2 Dreiecke"}, {"g": "Jedes Dreieck hat die Winkelsumme 180°"}, {"g": "2 · 180° = 360°"}], "loesung": "360°"}, {"aufgabe": "Wie groß ist die Winkelsumme im Sechseck?", "schritte": [{"g": "Ein Sechseck zerfällt von einer Ecke aus in 4 Dreiecke (allgemein: n − 2 Dreiecke)"}, {"g": "Jedes Dreieck hat die Winkelsumme 180°"}, {"g": "4 · 180° = 720°"}], "loesung": "720°"}]}, "B4": {"id": "B4", "titel": "Daten auf einen Blick", "kerne": [{"name": "", "verstehen": ["Der Median ist der mittlere Wert der GEORDNETEN Liste – ordne also immer zuerst! Bei gerader Anzahl nimmst du den Mittelwert der beiden mittleren Werte. Die Spannweite ist der Abstand zwischen kleinstem und größtem Wert → Spannweite = größter Wert − kleinster Wert. Sie zeigt dir, wie weit die Daten auseinanderliegen.", "Quartil kommt von „Viertel“: Die Quartile teilen die geordnete Liste in vier gleich große Teile. Unteres Quartil (Q1) → ein Viertel der Werte liegt darunter oder ist gleich groß. Oberes Quartil (Q3) → drei Viertel der Werte liegen darunter oder sind gleich groß. Zwischen Q1 und Q3 liegt also genau die mittlere Hälfte aller Daten.", "Ein Boxplot zeigt fünf Kennwerte auf einen Blick: Minimum, unteres Quartil, Median, oberes Quartil, Maximum. Die Box umfasst die mittlere Hälfte aller Daten – vom unteren Quartil (ein Viertel der Daten liegt darunter oder ist gleich groß) bis zum oberen Quartil. Die Striche links und rechts („Antennen“ oder Whisker) reichen bis Minimum und Maximum. Der Strich in der Box ist der Median.", "Wichtig (steht so auch im Buch): Der Durchschnitt wird im Boxplot NICHT dargestellt. Eine kurze Box heißt: Die mittlere Hälfte der Daten liegt eng beieinander."], "fallen": [{"falle": "Median aus ungeordneter Liste", "falsch": "Median von 12, 3, 15, 8, 7 ist 15", "richtig": "Ordnen: 3, 7, 8, 12, 15 → Median 8", "warum": "Erst ordnen, dann Mitte"}, {"falle": "Boxplot-Strich als Durchschnitt gelesen", "falsch": "„Der Strich in der Box ist der Mittelwert“", "richtig": "Der Strich ist der Median", "warum": "Der Durchschnitt wird im Boxplot nicht veranschaulicht"}], "ueben": [{"stufe": "leicht", "aufgabe": "Bestimme den Median von 12, 3, 15, 8, 7.", "schritte": [{"g": "Der Median ist der MITTLERE Wert der geordneten Liste"}, {"g": "Erst der Größe nach ordnen: 3, 7, 8, 12, 15"}, {"g": "5 Werte → der 3. Wert steht genau in der Mitte"}, {"g": "Median = 8"}], "loesung": "8", "hinweis": "Median: erst der Größe nach ordnen (3, 7, 8, 12, 15) – der Wert genau in der Mitte ist der Median."}, {"stufe": "leicht", "aufgabe": "Bestimme die Spannweite von 3, 9, 4, 12, 7.", "schritte": [{"g": "Spannweite = größter Wert minus kleinster Wert"}, {"g": "12 − 3 = 9."}], "loesung": "9", "hinweis": "Spannweite = größter Wert minus kleinster Wert → 12 − 3 = 9."}, {"stufe": "leicht", "aufgabe": "Median von 4, 7, 9, 12", "schritte": [{"g": "Der Median ist der mittlere Wert der geordneten Liste"}, {"g": "Gerade Anzahl (4 Werte) → Mittelwert der beiden mittleren Werte nehmen"}, {"g": "(7 + 9) : 2 = 8"}, {"g": "Median = 8"}], "loesung": "8", "hinweis": "Gerade Anzahl → (7 + 9) : 2"}, {"stufe": "leicht", "aufgabe": "Welcher Anteil der Daten liegt in der Box eines Boxplots?", "schritte": [{"g": "Die Quartile teilen die geordneten Daten in vier gleich große Viertel („Quartil“ kommt von „Viertel“)"}, {"g": "Die Box reicht vom unteren Quartil (¼ der Daten darunter) bis zum oberen Quartil (¾ darunter)"}, {"g": "Dazwischen liegt genau die mittlere Hälfte der Daten → 50 %"}], "loesung": "50 % (die mittlere Hälfte)", "hinweis": ""}, {"stufe": "mittel", "aufgabe": "Datenreihe 5, 6, 2, 3, 6, 6, 1, 7, 2, 3, 3, 4, 10, 4: Median, Quartile, Spannweite (für einen Boxplot)", "schritte": [{"g": "Erst der Größe nach ordnen (14 Werte): 1, 2, 2, 3, 3, 3, 4, 4, 5, 6, 6, 6, 7, 10"}, {"g": "Median = mittlerer Wert; gerade Anzahl → (4 + 4) : 2 = 4"}, {"g": "Unteres Quartil Q1 = Mitte der unteren Hälfte → 3; oberes Quartil Q3 = Mitte der oberen Hälfte → 6"}, {"g": "Spannweite = größter − kleinster Wert: 10 − 1 = 9"}, {"g": "Ergebnis: Median 4; Q1 = 3; Q3 = 6; Spannweite 9"}], "loesung": "Median 4; Q1 = 3; Q3 = 6; Spannweite 9", "hinweis": "Ordnen (14 Werte) → 1, 2, 2, 3, 3, 3, 4, 4, 5, 6, 6, 6, 7, 10. Median = (4 + 4) : 2 = 4. Quartile: in beiden Konventionen 3 und 6. Spannweite 10 − 1 = 9."}, {"stufe": "mittel", "aufgabe": "Noten-Beispiel des Buches (26 Werte): Median 3, unteres Quartil 2, oberes Quartil 3,5 – erkläre, was das untere Quartil hier bedeutet.", "schritte": [{"g": "„Quartil“ kommt von „Viertel“: Die Quartile teilen die geordneten Werte in vier gleich große Teile"}, {"g": "Unteres Quartil = 2 heißt: ein Viertel der Werte ist ≤ 2"}, {"g": "Also: Ein Viertel der Arbeiten hat Note 2 oder besser"}], "loesung": "Ein Viertel der Arbeiten hat Note 2 oder besser", "hinweis": ""}, {"stufe": "mittel", "aufgabe": "Boxplot ablesen: Spannweite, Median, Quartile", "schritte": [{"g": "Spannweite = größter Wert − kleinster Wert → hier: von Note 1 bis 5,5"}, {"g": "Der Strich IN der Box ist  : p · 100"}, {"g": "K = 180 : 3 · 100"}, {"g": "180 : 3 = 60 → 60 · 100 = 6000"}, {"g": "Antwort: höchstens 6000 € Darlehen"}], "loesung": "6000 €", "hinweis": "K = Z/p · 100 = 180/3 · 100 = 6000. Antwort: höchstens 6000 €."}], "wpool": [{"aufgabe": "100 € liegen ein Jahr zu 5 % an. Wie viel Zinsen gibt es?", "schritte": [{"g": "Zinsformel: Z = K · p : 100 – denn „5 % vom Kapital“ heißt K · 5/100"}, {"g": "100 · 5 : 100 = 5 → 5 €"}], "loesung": "5 €"}, {"aufgabe": "200 € liegen ein Jahr zu 3 % an. Wie viel Zinsen gibt es?", "schritte": [{"g": "Zinsformel: Z = K · p : 100 (Zinsen = Kapital mal Zinssatz, geteilt durch 100)"}, {"g": "200 · 3 : 100 = 6 → 6 €"}], "loesung": "6 €"}, {"aufgabe": "200 € bringen in einem Jahr 4 € Zinsen. Wie hoch ist der Zinssatz?", "schritte": [{"g": "Der Zinssatz misst die Zinsen im Verhältnis zum Kapital"}, {"g": "Zinsformel Z = K · p : 100, nach p umgestellt → p = Z : K · 100"}, {"g": "4 : 200 · 100 = 2 → 2 %"}], "loesung": "2 %"}, {"aufgabe": "Ein Kapital bringt bei 2 % Zinssatz 10 € Zinsen im Jahr. Wie hoch ist das Kapital?", "schritte": [{"g": "Zinsformel Z = K · p : 100, nach K umgestellt → K = Z : p · 100"}, {"g": "10 : 2 · 100 = 500 → 500 €"}], "loesung": "500 €"}, {"aufgabe": "1000 € liegen ein halbes Jahr zu 6 % an. Wie viel Zinsen gibt es?", "schritte": [{"g": "Zinsformel: Z = K · p : 100 – sie gilt für ein GANZES Jahr"}, {"g": "Jahres-Zinsen: 1000 · 6 : 100 = 60 €"}, {"g": "Das Geld liegt nur ein HALBES Jahr → die Hälfte", "op": "| : 2"}, {"g": "60 : 2 = 30 → 30 €"}], "loesung": "30 €"}]}, "C1": {"id": "C1", "titel": "Dreiecke konstruieren wie ein Profi", "kerne": [{"name": "", "verstehen": ["Zwei Figuren sind kongruent, wenn sie deckungsgleich sind – gleiche Form UND gleiche Größe. Bei Dreiecken musst du nicht alle sechs Stücke vergleichen. Drei passende reichen, das sagen die Kongruenzsätze: sss (drei Seiten), sws (zwei Seiten und der EINGESCHLOSSENE Winkel), wsw (eine Seite und die beiden anliegenden Winkel) und Ssw (zwei Seiten und der Gegenwinkel der größeren Seite).", "Beispiel aus dem Buch → c = 5 cm, α = 80°, β = 55° und c′ = 5 cm, α′ = 80°, γ′ = 45°. Sieht verschieden aus? Rechne β′ = 180° − 80° − 45° = 55° – schon passt wsw, die Dreiecke sind kongruent.", "Vor jeder Konstruktion prüfst du, ob das Dreieck überhaupt existiert: Die Winkelsumme darf 180° nicht sprengen, und je zwei Seiten müssen zusammen länger sein als die dritte (Dreiecksungleichung). Dann: Planfigur skizzieren, gegebene Stücke farbig markieren, konstruieren, Vorgehen beschreiben."], "fallen": [{"falle": "Winkelsumme nicht geprüft", "falsch": "a = 4 cm, β = 95°, γ = 90° „konstruieren“", "richtig": "Geht nicht – 95° + 90° = 185° > 180°", "warum": "Erst Existenz prüfen"}, {"falle": "sws ohne eingeschlossenen Winkel", "falsch": "Zwei Seiten + irgendein Winkel = eindeutig", "richtig": "Der Winkel muss ZWISCHEN den Seiten liegen", "warum": "Sonst gilt nur Ssw – und nur mit Gegenwinkel der größeren Seite"}], "ueben": [{"stufe": "leicht", "aufgabe": "Von einem Dreieck kennst du zwei Seiten und den Winkel dazwischen. Lässt es sich eindeutig zeichnen?", "schritte": [{"g": "Kongruent heißt: deckungsgleich – gleiche Form UND gleiche Größe"}, {"g": "Kongruenzsatz sws: Zwei Seiten und der EINGESCHLOSSENE Winkel legen ein Dreieck eindeutig fest"}, {"g": "Genau das ist hier gegeben → Ja, immer eindeutig"}], "loesung": "Ja, immer (sws)", "hinweis": "", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 0}, {"stufe": "leicht", "aufgabe": "Zwei Dreiecke haben die Seiten a = 4, b = 6, c = 7 und a′ = 6, b′ = 7, c′ = 4 (je cm). Sind sie kongruent?", "schritte": [{"g": "Kongruenzsatz sss: Stimmen zwei Dreiecke in allen DREI Seiten überein, sind sie kongruent"}, {"g": "Beide haben dieselben drei Seitenlängen 4, 6, 7 – nur anders benannt"}, {"g": "→ Ja, kongruent (sss)"}], "loesung": "Ja (sss – gleiche drei Seiten, nur umbenannt)", "hinweis": "", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 0}, {"stufe": "leicht", "aufgabe": "Kann ein Dreieck die Seiten 2 cm, 3 cm und 6 cm haben?", "schritte": [{"g": "Dreiecksungleichung: Zwei Seiten zusammen müssen LÄNGER sein als die dritte – sonst kommen die Enden nicht zusammen"}, {"g": "2 + 3 = 5 < 6 ✗"}, {"g": "→ Nein, unmöglich"}], "loesung": "Nein (2 + 3 < 6)", "hinweis": "Dreiecksungleichung", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 1}, {"stufe": "leicht", "aufgabe": "Zwei Dreiecke: c = 5 cm, α = 80°, β = 55° und c′ = 5 cm, α′ = 80°, γ′ = 45°. Sind sie kongruent?", "schritte": [{"g": "Beim zweiten Dreieck fehlt β′ → Winkelsumme im Dreieck: 180°"}, {"g": "β′ = 180° − 80° − 45° = 55°"}, {"g": "Kongruenzsatz wsw: Eine Seite und die beiden ANLIEGENDEN Winkel legen ein Dreieck eindeutig fest"}, {"g": "Beide: c = 5, α = 80°, β = 55° → Ja, kongruent (wsw)"}], "loesung": "Ja (β′ = 55° → wsw)", "hinweis": "", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 0}, {"stufe": "mittel", "aufgabe": "Ein Dreieck soll a = 4 cm, β = 95° und γ = 90° haben. Lässt es sich konstruieren?", "schritte": [{"g": "Winkelsumme im Dreieck: Alle drei Winkel zusammen sind 180° – mehr geht nicht"}, {"g": "Schon zwei Winkel zusammen: 95° + 90° = 185° > 180°"}, {"g": "→ Nein, nicht konstruierbar"}], "loesung": "Nein (Winkelsumme > 180°)", "hinweis": "", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 1}, {"stufe": "mittel", "aufgabe": "Konstruiere ein Dreieck aus a = 9 cm, c = 6,5 cm, γ = 40°. Planfigur + Beschreibung.", "loesung": "Musterlösung: γ liegt bei C zwischen a und b: CB = 9 cm zeichnen, in C den 40°-Winkel antragen, Kreis um B mit r = 6,5 cm schneidet den freien Schenkel (zwei Schnittpunkte möglich → Ssw-Fall diskutieren)", "hinweis": "", "format": "SK"}, {"stufe": "mittel", "aufgabe": "Konstruiere ein Dreieck aus a = 5 cm, b = 4,5 cm, h_c = 2,5 cm. Beschreibe dein Vorgehen.", "loesung": "Musterlösung: Parallele im Abstand 2,5 cm zu c nutzen; C liegt auf ihr; Kreise um C mit b und a schneiden c", "hinweis": "", "format": "SK"}, {"stufe": "mittel", "aufgabe":  der Punkt C eines Dreiecks auf einem Halbkreis über der Strecke AB (dem Thaleskreis), dann hat das Dreieck bei C einen rechten Winkel – γ = 90°. Egal, wo auf dem Halbkreis C liegt!", "Der Satz gilt auch rückwärts (Umkehrung): Ist das Dreieck ABC bei C rechtwinklig, dann liegt C auf dem Thaleskreis über AB. Die Hypotenusenmitte ist also immer der Umkreismittelpunkt eines rechtwinkligen Dreiecks.", "Wozu? Damit konstruierst du rechte Winkel ohne Geodreieck (Punkt auf dem Thaleskreis wählen) – und sogar Tangenten an einen Kreis: Thaleskreis über der Strecke PM zeichnen, seine Schnittpunkte mit dem Kreis sind die Berührpunkte. Das steht genau so im Buch."], "fallen": [{"falle": "Rechten Winkel falsch verortet", "falsch": "Der rechte Winkel liegt bei A oder B", "richtig": "Bei C – dem Punkt AUF dem Halbkreis", "warum": "AB ist der Durchmesser, C der „Wanderpunkt“"}, {"falle": "Umkehrung vergessen", "falsch": "„Thales gilt nur in eine Richtung“", "richtig": "Rechtwinklig bei C ⇒ C liegt auf dem Thaleskreis", "warum": "Satz UND Umkehrung"}], "ueben": [{"stufe": "leicht", "aufgabe": "C liegt auf einem Halbkreis über AB (AB = Durchmesser). Welcher Winkel des Dreiecks ABC ist ein rechter?", "schritte": [{"g": "Satz des Thales: Liegt C auf einem Halbkreis über AB (AB = Durchmesser), dann hat das Dreieck ABC bei C einen rechten Winkel"}, {"g": "→ der rechte Winkel liegt bei C"}], "loesung": "der bei C", "hinweis": "", "format": "MC"}, {"stufe": "leicht", "aufgabe": "Dreieck im Thaleskreis: α = 35°. Wie groß ist β?", "schritte": [{"g": "Satz des Thales: Im Halbkreis über dem Durchmesser ist der Winkel bei C immer 90° → γ = 90°"}, {"g": "Winkelsumme im Dreieck: 180°"}, {"g": "β = 180° − 90° − 35°"}, {"g": "β = 55°"}], "loesung": "55°", "hinweis": "γ = 90°, also β = 180° − 90° − 35°", "format": "E"}, {"stufe": "leicht", "aufgabe": "Ein Dreieck liegt im Thaleskreis und hat den Winkel α = 25°. Wie groß ist β?", "schritte": [{"g": "Satz des Thales: Der Winkel bei C ist 90°. Winkelsumme"}, {"g": "β = 180° − 90° − 25° = 65°."}], "loesung": "65°", "hinweis": "Satz des Thales: Der Winkel bei C ist 90°. Winkelsumme → β = 180° − 90° − 25° = 65°.", "format": "E"}, {"stufe": "leicht", "aufgabe": "Wo liegt der Umkreismittelpunkt eines rechtwinkligen Dreiecks?", "schritte": [{"g": "Umkehrung des Thales-Satzes: Ist das Dreieck bei C rechtwinklig, dann liegt C auf dem Halbkreis über AB"}, {"g": "AB (die Hypotenuse) ist dann der Durchmesser des Umkreises"}, {"g": "→ Der Umkreismittelpunkt liegt in der Mitte der Hypotenuse"}], "loesung": "In der Mitte der Hypotenuse", "hinweis": "Umkehrung des Satzes", "format": "MC"}, {"stufe": "mittel", "aufgabe": "Thaleskreis über AB mit Mittelpunkt D, α = 25°. Bestimme die Innenwinkel des Dreiecks ADC.", "schritte": [{"g": "DA und DC sind beide Radien des Kreises → DA = DC = r"}, {"g": "Zwei gleiche Seiten heißt: Dreieck ADC ist gleichschenklig"}, {"g": "Im gleichschenkligen Dreieck sind die Basiswinkel gleich groß → bei A und bei C je 25°"}, {"g": "Winkelsumme: 180° − 25° − 25° = 130°"}, {"g": "Ergebnis: 25°, 25°, 130°"}], "loesung": "25°, 25°, 130°", "hinweis": "DA = DC = r → gleichschenklig; Basiswinkel 25°; 180° − 50° = 130°", "format": "E (3 FELDER)"}, {"stufe": "mittel", "aufgabe": "Gleiche Figur: Bestimme β im Dreieck BDC.", "schritte": [{"g": "Nebenwinkel ergänzen sich zu 180° → Winkel BDC = 180° − 130° = 50°"}, {"g": "DB und DC sind beide Radien → Dreieck BDC ist gleichschenklig"}, {"g": "Basiswinkel gleich groß: (180° − 50°) : 2 = 65°"}, {"g": "Probe mit Thales: α + β = 25° + 65° = 90° ✓ (rechter Winkel bei C)"}], "loesung": "65°", "hinweis": "Winkel BDC = 180° − 130° = 50° (Nebenwinkel); DB = DC → gleichschenklig → (180° − 50°) : 2 = 65°. Probe: α + β = 25° + 65° = 90° ✓", "format": "E"}, {"stufe": "mittel", "aufgabe": "Beschreibe, wie du NUR mit Zirkel und Lineal die Tangenten von einem Punkt P an einen Kreis (Mittelpunkt M) konstruierst.", "loesung": "Checkliste: Strecke PM; Thaleskreis über PM; Schnittpunkte mit dem Kreis sind die Berührpunkte; P mit ihnen verbinden", "hinweis": "", "format": "SK"}]}], "uplus": [{"stufe": "", "aufgabe": "Richtig oder falsch? „Jedes Dreieck, dessen Ecke C auf dem VOLLkreis über AB liegt, ist rechtwinklig.“", "schritte": [{"g": "Der Satz des Thales gilt für jeden HALBkreis über dem Durchmesser AB"}, {"g": "Oberer UND unterer Halbkreis sind beide Thaleskreise über AB – zusammen der Vollkreis"}, {"g": "→ Richtig"}], "loesung": "Richtig (oberer und unterer Halbkreis)", "hinweis": "Beide Halbkreise sind Thaleskreise über AB", "format": "MC", "mc": ["Richtig", "Falsch"], "mcCorrect": 0}, {"stufe": "", "aufgabe": "Ein Dreieck hat die Winkel 90°, 30°, 60°, Hypotenuse AB = 8 cm. Wie groß ist der Umkreisradius?", "schritte": [{"g": "Umkehrung des Thales-Satzes: Beim rechtwinkligen Dreieck liegt der Umkreismittelpunkt in der Mitte der Hypotenuse"}, {"g": "Der Umkreisradius ist also die halbe Hypotenuse"}, {"g": "r = 8 : 2 = 4"}, {"g": "Ergebnis: 4 cm"}], "loesung": "4 cm", "hinweis": "Umkreismittelpunkt = Hypotenusenmitte → r = 8 : 2", "format": "E"}], "transfer": [{"stufe": "", "aufgabe": "Begründe mit dem Satz des Thales und seiner Umkehrung: Der Umkreisradius eines rechtwinkligen Dreiecks ist halb so lang wie die Hypotenuse.", "loesung": "Musterlösung", "hinweis": "Umkehrung: C liegt auf dem Thaleskreis über AB → der Kreis über AB durch C ist der Umkreis; sein Mittelpunkt ist die Hypotenusenmitte, sein Radius AB/2.", "format": "SK"}, {"stufe": "", "aufgabe": "Über einer Strecke AB = 6 cm sollen alle Punkte C markiert werden, für die das Dreieck ABC rechtwinklig bei C ist. Konstruiere die Ortslinie und begründe.", "loesung": "Thaleskreis (beide Halbkreise) über AB, ohne A und B selbst", "hinweis": "Satz (Halbkreis → 90°) und Umkehrung (90° → Halbkreis) zusammen ergeben: genau die Kreislinie.", "format": "SK"}], "wpool": [{"aufgabe": "Ein Dreieck liegt im Thaleskreis (AB ist Durchmesser). Wie groß ist der Winkel γ bei C?", "schritte": [{"g": "Satz des Thales: Dreieck im Halbkreis, AB = Durchmesser → rechter Winkel bei C"}, {"g": "γ = 90°"}], "loesung": "90°"}, {"aufgabe": "Ein Dreieck liegt im Thaleskreis, α = 40°. Wie groß ist β?", "schritte": [{"g": "Satz des Thales: rechter Winkel bei C → γ = 90°"}, {"g": "Winkelsumme im Dreieck: 180°"}, {"g": "β = 180° − 90° − 40° = 50°"}], "loesung": "50°"}, {"aufgabe": "Über welcher Seite liegt der Thaleskreis eines rechtwinkligen Dreiecks?", "schritte": [{"g": "Satz des Thales: Der rechte Winkel liegt dem Durchmesser GEGENÜBER"}, {"g": "Dem rechten Winkel gegenüber liegt die längste Seite – die Hypotenuse"}, {"g": "→ über der Hypotenuse"}], "loesung": "Über der Hypotenuse"}, {"aufgabe": "Thaleskreis über PM schneidet Kreis um M – was sind die Schnittpunkte?", "schritte": [{"g": "Satz des Thales: Im Schnittpunkt steht der Radius senkrecht auf der Verbindung zu P (rechter Winkel im Halbkreis)"}, {"g": "Eine Gerade, die den Kreis berührt und senkrecht auf dem Radius steht, ist eine Tangente"}, {"g": "→ die Schnittpunkte sind die Berührpunkte der Tangenten"}], "loesung": "Berührpunkte der Tangenten"}, {"aufgabe": "AB = 10 cm ist der Durchmesser, C liegt auf dem Thaleskreis. Wie groß ist der Umkreisradius?", "schritte": [{"g": "Nach dem Satz des Thales ist AB zugleich Durchmesser des Umkreises"}, {"g": "Umkreisradius = halber Durchmesser"}, {"g": "10 : 2 = 5 → 5 cm"}], "loesung": "5 cm"}]}, "C4": {"id": "C4", "titel": "Terme rückwärts – Faktorisieren", "kerne": [{"name": "", "verstehen": ["Faktorisieren heißt: eine Summe als Produkt schreiben – also rückwärts denken. Weg 1: Ausklammern. Steckt in jedem Summanden derselbe Faktor, ziehst du ihn heraus → 6x² + 9x = 3x · (2x + 3). Prüfe durch Ausmultiplizieren!", "Weg 2: Binomische Formeln rückwärts. x² + 6x + 9 hat die Bauart a² + 2ab + b² → (x + 3)². Und x² − 9 ist eine Differenz zweier Quadrate → 3. Formel → (x + 3)(x − 3).", "So erkennst du die Bauart: Sind erster und letzter Summand Quadrate? Passt das mittlere Glied zu 2ab? Bei nur zwei Gliedern mit Minus: Differenz von Quadraten. Warum das Ganze? Produkte kann man kürzen und Gleichungen damit lösen – dein Vorsprung für Klasse 8."], "fallen": [{"falle": "Differenz von Quadraten als Quadrat gelesen", "falsch": "x² − 9 = (x − 3)²", "richtig": "x² − 9 = (x + 3)(x − 3)", "warum": "(x − 3)² = x² − 6x + 9 – das mittlere Glied fehlt hier aber"}, {"falle": "Nur teilweise ausgeklammert", "falsch": "6x² + 9x = 3(2x² + 3x)", "richtig": "6x² + 9x = 3x(2x + 3)", "warum": "Auch x steckt in beiden Summanden – immer den GRÖSSTEN gemeinsamen Faktor nehmen"}], "ueben": [{"stufe": "leicht", "aufgabe": "5x + 10", "schritte": [{"g": "Gemeinsamer Faktor 5"}, {"g": "5x + 10 = 5 · x + 5 · 2"}, {"g": "= 5(x + 2)"}], "loesung": "5(x + 2)", "hinweis": "Ausklammern", "format": "E"}, {"stufe": "leicht", "aufgabe": "7a − 21", "schritte": [{"g": "Gemeinsamer Faktor 7"}, {"g": "7a − 21 = 7 · a − 7 · 3"}, {"g": "= 7(a − 3)"}], "loesung": "7(a − 3)", "hinweis": "Ausklammern", "format": "E"}, {"stufe": "leicht", "aufgabe": "x² + 10x + 25", "schritte": [{"g": "1. Formel rückwärts: a² + 2ab + b² = (a + b)². Probe"}, {"g": "25 = 5², Mittelglied 2 · x · 5 = 10x passt."}, {"g": "Ergebnis: (x + 5)²"}], "loesung": "(x + 5)²", "hinweis": "1. Formel rückwärts: a² + 2ab + b² = (a + b)². Probe → 25 = 5², Mittelglied 2 · x · 5 = 10x passt.", "format": "E"}, {"stufe": "leicht", "aufgabe": "x² − 25", "schritte": [{"g": "x² − 25 ist eine Differenz zweier Quadrate: x² und 25 = 5²"}, {"g": "3. Formel rückwärts anwenden: a² − b² = (a + b)(a − b)"}, {"g": "Ergebnis: (x + 5)(x − 5)"}], "loesung": "(x + 5)(x − 5)", "hinweis": "3. Formel rückwärts: a² − b² = (a + b)(a − b). Hier → 25 = 5².", "format": "E"}, {"stufe": "leicht", "aufgabe": "3x² + 6x", "schritte": [{"g": "Größter gemeinsamer Faktor: 3x"}, {"g": "3x² = 3x · x und 6x = 3x · 2"}, {"g": "= 3x(x + 2)"}], "loesung": "3x(x + 2)", "hinweis": "Größter gemeinsamer Faktor", "format": "E"}, {"stufe": "mittel", "aufgabe": "x² − 10x + 25", "schritte": [{"g": "2. Formel rückwärts: a² − 2ab + b² = (a − b)². Probe"}, {"g": "25 = 5², Mittelglied 2 · x · 5 = 10x passt."}, {"g": "Ergebnis: (x − 5)²"}], "loesung": "(x − 5)²", "hinweis": "2. Formel rückwärts: a² − 2ab + b² = (a − b)². Probe → 25 = 5², Mittelglied 2 · x · 5 = 10x passt.", "format": "E"}, {"stufe": "mittel", "aufgabe": "4x² − 9", "schritte": [{"g": "Quadrate erkennen"}, {"g": "(2x)² und 3²"}, {"g": "Ergebnis: (2x + 3)(2x − 3)"}], "loesung": "(2x + 3)(2x − 3)", "hinweis": "Quadrate erkennen → (2x)² und 3²", "format": "E"}, {"stufe": "mittel", "aufgabe": "18a² − 8", "schritte": [{"g": "Erst 2 ausklammern"}, {"g": "2(9a² − 4), dann 3. Formel"}, {"g": "Ergebnis: 2(3a + 2)(3a − 2)"}], "loesung": "2(3a + 2)(3a − 2)", "hinweis": "Erst 2 ausklammern → 2(9a² − 4), dann 3. Formel", "format": "E"}, {"stufe": "mittel", "aufgabe": "x² + 14x + 49", "schritte": [{"g": "1. Formel rückwärts"}, {"g": "49 = 7², und das Mittelglied 2 · x · 7 = 14x passt."}, {"g": "Ergebnis: (x + 7)²"}], "loesung": "(x + 7)²", "hinweis": "1. Formel rückwärts → 49 = 7², und das Mittelglied 2 · x · 7 = 14x passt.", "format": "E"}, {"stufe": "mittel", "aufgabe": "Ergänze das Kästchen: −2ab · (□) = −2ab + a²b", "schritte": [{"g": "Rückwärts dividieren; Probe"}, {"g": "−2ab · 1 = −2ab; −2ab · (−a/2) = a²b"}, {"g": "Ergebnis: 1 − a/2"}], "loesung": "1 − a/2", "hinweis": "Rückwärts dividieren; Probe → −2ab · 1 = −2ab; −2ab · (−a/2) = a²b", "format": "E"}]}], "uplus": [{"stufe": "", "aufgabe": "16x² − 24x + 9", "schritte": [{"g": "2. Formel rückwärts"}, {"g": "(4x)² = 16x², 3² = 9, und das Mittelglied 2 · 4x · 3 = 24x passt ✓."}, {"g": "Ergebnis: (4x − 3)²"}], "loesung": "(4x − 3)²", "hinweis": "2. Formel rückwärts → (4x)² = 16x², 3² = 9, und das Mittelglied 2 · 4x · 3 = 24x passt ✓.", "format": "E"}, {"stufe": "", "aufgabe": "50 − 2x²", "schritte": [{"g": "Erst den gemeinsamen Faktor 2 ausklammern"}, {"g": "2(25 − x²). Dann 3. Formel rückwärts"}, {"g": "25 − x² = (5 + x)(5 − x)."}, {"g": "Ergebnis: 2(5 + x)(5 − x)"}], "loesung": "2(5 + x)(5 − x)", "hinweis": "Erst den gemeinsamen Faktor 2 ausklammern → 2(25 − x²). Dann 3. Formel rückwärts → 25 − x² = (5 + x)(5 − x).", "format": "E"}], "transfer": [{"stufe": "", "aufgabe": "Rechne geschickt im Kopf mit einer binomischen Formel: a) 99² b) 102 · 98", "schritte": [{"g": "a) 99 = 100 − 1 → 2. Formel"}, {"g": "(100 − 1)² = 10000 − 200 + 1 = 9801"}, {"g": "b) 102 · 98 = (100 + 2)(100 − 2) → 3. Formel"}, {"g": "10000 − 4 = 9996"}], "loesung": "9801 und 9996", "hinweis": "a) (100 − 1)² = 10000 − 200 + 1 = 9801. b) (100 + 2)(100 − 2) = 10000 − 4 = 9996.", "format": "E"}, {"stufe": "", "aufgabe": "Der Term x² + 12x + 36 beschreibt einen quadratischen Garten. Wie lang ist seine Seite? Deute das Ergebnis geometrisch.", "schritte": [{"g": "Bauart prüfen: x² und 36 = 6² sind Quadrate · 2 · x · 6 = 12x passt"}, {"g": "x² + 12x + 36 = (x + 6)²"}, {"g": "Seite des Gartens: x + 6"}, {"g": "Geometrisch: Quadrat x² + zwei Rechtecke 6x + Quadrat 36 = ein großes Quadrat"}], "loesung": "x + 6", "hinweis": "x² + 12x + 36 = (x + 6)². Geometrisch: Quadrat x², zwei Rechtecke 6x, Quadrat 36 – zusammen ein Quadrat der Seite x + 6 (Flächenmodell wie B1).", "format": "E + SK"}], "wpool": [{"aufgabe": "x² − 1", "schritte": [{"g": "Differenz zweier Quadrate: 1 = 1²"}, {"g": "3. Formel → (x + 1)(x − 1)"}], "loesung": "(x + 1)(x − 1)"}, {"aufgabe": "4x + 8", "schritte": [{"g": "Gemeinsamer Faktor 4"}, {"g": "= 4(x + 2)"}], "loesung": "4(x + 2)"}, {"aufgabe": "x² − 4x + 4", "schritte": [{"g": "Bauart: x² und 4 = 2², Mittelglied 2 · x · 2 = 4x mit Minus"}, {"g": "2. Formel → (x − 2)²"}], "loesung": "(x − 2)²"}, {"aufgabe": "9x² − 16", "schritte": [{"g": "9x² = (3x)² und 16 = 4²"}, {"g": "3. Formel → (3x + 4)(3x − 4)"}], "loesung": "(3x + 4)(3x − 4)"}, {"aufgabe": "100 − y²", "schritte": [{"g": "100 = 10²"}, {"g": "3. Formel → (10 + y)(10 − y)"}], "loesung": "(10 + y)(10 − y)"}]}, "C5": {"id": "C5", "titel": "Term-Profi: mehrere Variablen", "kerne": [{"name": "", "verstehen": ["Terme mit mehreren Variablen sehen wild aus – bis du ihre Struktur erkennst. Frage 1: Was ist die ÄUSSERSTE Rechenart? 3 · (x + 2) ist ein Produkt (aus Zahl und Summe), (a + b)² eine Potenz, a/b ein Quotient. Mit diesen Fachbegriffen beschreibst du jeden Term.", "Frage 2: Was ist gleichartig? Nur Glieder mit GENAU denselben Variablen und Exponenten darfst du zusammenfassen → 2xy + 3xy = 5xy, aber a²b und ab² bleiben getrennt – schau genau auf die Hochzahlen.", "Frage 3 bei „äquivalent oder nicht?“: Forme um oder setze eine Testzahl ein. Achtung: EINE Übereinstimmung beweist nichts – ein einziges Gegenbeispiel widerlegt aber sicher (das kennst du aus den Klassenarbeiten)."], "fallen": [{"falle": "Verschiedene Variablen zusammengezogen", "falsch": "2a + 3b = 5ab", "richtig": "2a + 3b lässt sich nicht zusammenfassen", "warum": "Nur gleichartige Glieder addieren"}, {"falle": "Exponenten ignoriert", "falsch": "a²b + ab² = 2a²b²", "richtig": "a²b + ab² bleibt stehen", "warum": "a²b und ab² sind NICHT gleichartig"}], "ueben": [{"stufe": "leicht", "aufgabe": "Welche Termart hat 3 · (x + 2)?", "schritte": [{"g": "Die ÄUSSERSTE Rechenart zählt: hier wird multipliziert"}, {"g": "→ Produkt"}], "loesung": "Produkt", "hinweis": "", "format": "MC"}, {"stufe": "leicht", "aufgabe": "4a + 2b − a + 3b", "schritte": [{"g": "a-Glieder: 4a − a = 3a"}, {"g": "b-Glieder: 2b + 3b = 5b"}, {"g": "Ergebnis: 3a + 5b"}], "loesung": "3a + 5b", "hinweis": "Gleichartige sortieren", "format": "E"}, {"stufe": "leicht", "aufgabe": "4ab + 3ab", "schritte": [{"g": "Gleiche Variablen zusammenfassen"}, {"g": "(4 + 3)ab = 7ab"}], "loesung": "7ab", "hinweis": "Gleiche Variablen zusammenfassen: (4 + 3)ab = 7ab.", "format": "E"}, {"stufe": "leicht", "aufgabe": "a²b + 2a²b + ab²", "schritte": [{"g": "a²b und ab² sind VERSCHIEDENE Sorten"}, {"g": "a²b-Glieder: 1 + 2 = 3 → 3a²b"}, {"g": "Ergebnis: 3a²b + ab²"}], "loesung": "3a²b + ab²", "hinweis": "ab² bleibt getrennt!", "format": "E"}, {"stufe": "leicht", "aufgabe": "Welche Termart hat (a + b)²?", "schritte": [{"g": "Zuletzt wird quadriert"}, {"g": "→ Potenz (Quadrat einer Summe)"}], "loesung": "Potenz (Quadrat einer Summe)", "hinweis": "", "format": "MC"}, {"stufe": "mittel", "aufgabe": "T(a; b) = 2a + 3b² für a = 6, b = −1", "schritte": [{"g": "Einsetzen mit Klammer: b = −1"}, {"g": "3 · (−1)² = 3 · 1 = 3"}, {"g": "2 · 6 + 3 = 12 + 3"}, {"g": "= 15"}], "loesung": "15", "hinweis": "Klammer um −1: 3 · (−1)² = 3", "format": "E"}, {"stufe": "mittel", "aufgabe": "Vereinfache: 0,5 · (0,3a − 4b²) + 3b · (0,25b − (−2a))", "schritte": [{"g": "Beide Klammern ausmultiplizieren (Minus mal Minus wird Plus!)"}, {"g": "0,15a − 2b² + 0,75b² + 6ab, dann die b²-Glieder zusammenfassen."}, {"g": "Ergebnis: 0,15a − 1,25b² + 6ab"}], "loesung": "0,15a − 1,25b² + 6ab", "hinweis": "Beide Klammern ausmultiplizieren (Minus mal Minus wird Plus!) → 0,15a − 2b² + 0,75b² + 6ab, dann die b²-Glieder zusammenfassen.", "format": "E"}, {"stufe": "mittel", "aufgabe": "Vereinfache: −a(6b − 12a) · 1/3 − 6ab", "schritte": [{"g": "Erst die Klammer ausmultiplizieren"}, {"g": "−6ab + 12a². Dann mal 1/3: −2ab + 4a². Zum Schluss − 6ab und zusammenfassen."}, {"g": "Ergebnis: 4a² − 8ab"}], "loesung": "4a² − 8ab", "hinweis": "Erst die Klammer ausmultiplizieren → −6ab + 12a². Dann mal 1/3: −2ab + 4a². Zum Schluss − 6ab und zusammenfassen.", "format": "E"}, {"stufe": "mittel", "aufgabe": "Welche Terme sind äquivalent zu −0,5y + 1? (i) (y − 2) · (−0,5) (ii) (−y − 2) · 0,5 (iii) y + 0,5² − 1,5y (iv) −(0,5y + 1)", "schritte": [{"g": "Jeden Kandidaten ausmultiplizieren"}, {"g": "(i) (y − 2) · (−0,5) = −0,5y + 1 ✓"}, {"g": "(ii) −0,5y − 1 ✗ · (iii) −0,5y + 0,25 ✗ · (iv) −0,5y − 1 ✗"}, {"g": "→ nur (i)"}], "loesung": "nur (i)", "hinweis": "(ii) −0,5y − 1; (iii) −0,5y + 0,25; (iv) −0,5y − 1", "format": "MC"}, {"stufe": "mittel", "aufgabe": "Welche Terme sind äquivalent zu a² − b³? (i) (a + a) − (b + b + b) (ii) 2a² − b · b² − a² function isoHeute(){ return new Date().toISOString().slice(0,10); }
function isoPlus(iso,t){ const d=new Date(iso+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+t); return d.toISOString().slice(0,10); }
function heuteSicher(){ const h=isoHeute(); let m=null;
  try{ m=localStorage.getItem("mb_maxdatum"); }catch(e){}
  if(!m||h>m){ try{ localStorage.setItem("mb_maxdatum",h); }catch(e){} return h; }
  return m; }
function geraetId(){ let g=null; try{ g=localStorage.getItem("mb_geraet"); }catch(e){}
  if(!g){ const a=new Uint8Array(16); crypto.getRandomValues(a);
    g=[...a].map(b=>b.toString(16).padStart(2,"0")).join("");
    try{ localStorage.setItem("mb_geraet",g); }catch(e){} }
  return g; }
function ticketLesen(){ try{ return JSON.parse(localStorage.getItem("mb_ticket")||"null"); }catch(e){ return null; } }

function serverDatum(a){ if(a&&/^\d{4}-\d{2}-\d{2}$/.test(a.heute||"")){ try{ localStorage.setItem("mb_maxdatum",a.heute); }catch(e){} } }
function ticketAus(a){ serverDatum(a); return {bis:a.ticketBis,gueltigBis:a.gueltigBis,geraete:a.geraete,maxGeraete:a.maxGeraete,geprueft:heuteSicher()}; }
async function serverFragen(pfad,code){
  const ctl=("AbortController" in window)? new AbortController() : null;
  const uhr=ctl? setTimeout(()=>{ try{ ctl.abort(); }catch(e){} }, 8000) : null;
  try{
    const r=await fetch(LIZENZ_SERVER+pfad,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({code:canonCode(code),geraet:geraetId()}), signal: ctl? ctl.signal : undefined});
    return await r.json();
  } finally { if(uhr) clearTimeout(uhr); } }
function erneuernImHintergrund(code){
  serverFragen("/pruefen",code).then(a=>{
    if(a&&a.ok){ ticketSchreiben(ticketAus(a)); }
    else if(a&&(a.grund==="gesperrt"||a.grund==="abgelaufen"||a.grund==="unbekannt")){
      try{ localStorage.removeItem("mb_ticket"); }catch(e){} }
  }).catch(()=>{}); }
function canonCode(s){ return (s||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
async function codeHash(s){ const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("").slice(0,32); }
async function verifyUnlock(){ const c=localStorage.getItem("mb_unlock"); if(!c) return false;
  let lokal=false; try{ lokal=UNLOCK_HASHES.includes(await codeHash(canonCode(c))); }catch(e){ lokal=false; }
  if(!lokal) return false;
  const h=heuteSicher(); const t=ticketLesen();
  if(t&&t.bis&&h<=t.bis){ if(t.geprueft!==h) erneuernImHintergrund(c); return true; }
  try{
    const a=await serverFragen("/pruefen",c);
    if(a&&a.ok){ ticketSchreiben(ticketAus(a)); return true; }
    LIZENZ_ANTWORT=a||null; return false;
  }catch(e){
    if(t&&t.bis&&h<=isoPlus(t.bis,KULANZ_TAGE)) return true;
    if(!t){ ticketSchreiben({bis:isoPlus(h,VORLAEUFIG_TAGE),vorlaeufig:true}); return true; }
    LIZENZ_ANTWORT={grund:"offline"}; return false;
  } }

function lizenzKasten(){

  let bis=""; try{ if(t.gueltigBis) bis=new Date(t.gueltigBis+"T00:00").toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"}); }catch(e){}
  const zeilen=[];
  if(bis) zeilen.push("Euer Zugang gilt bis <strong>"+bis+"</strong>.");
  else if(t.vorlaeufig) zeilen.push("Euer Zugang ist vorläufig freigeschaltet – beim nächsten Start mit Internet wird er dauerhaft bestätigt.");
  if(t.geraete) zeilen.push("In Benutzung auf "+t.geraete+" von "+t.maxGeraete+" Geräten eures Haushalts.");

    '<p class="muted" style="font-size:.9rem;margin-top:8px">'+zeilen.join(" ")+'</p>'+
    '<p class="muted" style="font-size:.9rem">Alle Lerndaten bleiben auf diesem Gerät. Zur Prüfung des Zugangs wird nur eine zufällige Gerätekennung übertragen – kein Name, keine E-Mail-Adresse.</p>'+

/* ---------- Helpers ---------- */
const $=id=>document.getElementById(id);
const main=$("main"), statusbar=$("statusbar");
function escAttr(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
/* esc: zusaetzlich werden alle Pfeile optisch auf Zeichenmitte gehoben (Rueckmeldung Annette 13.08.2026) -
   gilt automatisch in der GESAMTEN App, weil jeder sichtbare Text durch esc laeuft. Fuer Attribute escAttr nutzen! */
function escBase(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/→/g,'<span class="pf">→</span>'); }
// Brüche app-weit mit echtem Bruchstrich (gestapelt) statt Schrägstrich – Anweisung Annette 13.08.2026.
// Nur echte Brüche: Zahl-oder-EINZELbuchstabe / Zahl-oder-EINZELbuchstabe mit Wortgrenzen –
// „und/oder“, „Stufen-/Wechselwinkelsatz“, „AB/2“, URLs usw. bleiben unangetastet (kein Lookbehind: alte Safari-Versionen).
function esc(t){ return escBase(t).replace(/(^|[^A-Za-z0-9\u00C0-\u024F])(\d+|[A-Za-z])\/(\d+|[A-Za-z])(?![A-Za-z0-9\u00C0-\u024F])/g,'$1<span class="frac"><span class="num">$2</span><span class="den">$3</span></span>'); }
function renderTextT(t){
  // escBase statt esc: Im Check bleiben Tipp-Beispiele fürs TIPPEN („z. B. 3/4“) im Schrägstrich-Format –
  // angezeigte Brüche stehen dort als FRAC-Platzhalter und werden hier gestapelt.
  let h=escBase(t);
  h=h.replace(/FRAC23/g,'<span class="frac"><span class="num">2</span><span class="den">3</span></span>');
  h=h.replace(/FRAC49/g,'<span class="frac"><span class="num">4</span><span class="den">9</span></span>');
  h=h.replace(/FRAC35/g,'<span class="frac"><span class="num">3</span><span class="den">5</span></span>');
  return h;
}
let notiertTimer=null;
function notiert(msg,ms){ // ms: Anzeigedauer; Standard kurz, für erklärende Bestätigungen 10 s (Anweisung Annette 11.08.2026)
  const n=$("notiert"); n.textContent=msg||"Danke, notiert!"; n.classList.add("show");
  if(notiertTimer) clearTimeout(notiertTimer);

function confetti(){
  const c=document.createElement("canvas"); c.id="cf";
  c.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:50";
  document.body.appendChild(c);
  const x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#0E6E45","#FF5E3A","#D8431E","#DEF3E6","#FBE3DA"];
  const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height/2,v:2+Math.random()*3,r:3+Math.random()*4,col:cols[Math.floor(Math.random()*cols.length)],w:Math.random()*2-1}));
  let t=0; (function fall(){ t++; x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{ p.y+=p.v; p.x+=p.w; x.fillStyle=p.col; x.fillRect(p.x,p.y,p.r,p.r*1.6); });
    if(t<160) requestAnimationFrame(fall); else c.remove(); })();
}

/* ---------- Rechenfläche v1 ---------- */
function mountScratch(container, nr){
  const wrap=document.createElement("div"); wrap.className="scratch";
  const head=document.createElement("div"); head.className="row"; head.style.justifyContent="space-between";
  head.innerHTML='<span class="muted" style="font-size:.9rem">Rechenfläche – Stift, Finger oder Maus. <em>Dein Schmierblatt: Schreib wie im Heft, Brüche gern übereinander – gewertet wird nur das Ergebnis, das du oben einträgst.</em></span>';
  const clear=document.createElement("button"); clear.className="btn ghost small"; clear.textContent="Leeren";
  head.appendChild(clear); wrap.appendChild(head);
  const cv=document.createElement("canvas"); wrap.appendChild(cv); container.appendChild(wrap);
  const ctx=cv.getContext("2d");
  function strokes(){ return S.strokes[nr]||(S.strokes[nr]=[]); }
  function redraw(){
    ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);
    strokes().forEach(st=>{ if(st.length<2)return; ctx.beginPath(); ctx.moveTo(st[0],st[1]);
      for(let i=2;i<st.length;i+=2) ctx.lineTo(st[i],st[i+1]); ctx.stroke(); });
  }
  function resize(){
    const w=cv.clientWidth, h=cv.clientHeight;
    cv.width=w*devicePixelRatio; cv.height=h*devicePixelRatio;
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    ctx.lineWidth=2; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#173B2E";
    redraw();
  }
  let cur=null;
  cv.addEventListener("pointerdown",e=>{ cv.setPointerCapture(e.pointerId); const r=cv.getBoundingClientRect();
    cur=[Math.round(e.clientX-r.left),Math.round(e.clientY-r.top)]; strokes().push(cur); });
  cv.addEventListener("pointermove",e=>{ if(!cur)return; const r=cv.getBoundingClientRect();
    cur.push(Math.round(e.clientX-r.left),Math.round(e.clientY-r.top)); redraw(); });
  const up=()=>{ if(cur){ cur=null; save(); } };
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
  clear.addEventListener("click",()=>{ S.strokes[nr]=[]; save(); redraw(); });
  requestAnimationFrame(resize);
}

let HIST_APPLY=false;
function histSnap(){ return {screen:S?S.screen:null, idx:S?S.idx:0, curDay:S?S.curDay:null,
  ustep:(S&&S.unit)?S.unit.step:null, midx:(S&&S.unit)?(S.unit.mixIdx||0):null, tag:(S&&S.unit)?S.unit.tag:null}; }
function pushHist(){ if(HIST_APPLY||!PID||!S) return; try{ history.pushState({mb:histSnap()},""); }catch(e){} }
window.addEventListener("popstate",e=>{
  const st=e.state&&e.state.mb; if(!st||!st.screen||!PID) return;
