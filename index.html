/* Bonus-Umbau (Auftrag Annette 11.08.2026): Der Bonus wird JEDEM Kind angeboten, mit klarer
   Reihenfolge: (1) Themen, die im gewählten Zeitplan keinen Platz gefunden haben – namentlich
   genannt und ZUERST empfohlen; (2) der Vorsprung ("Hatten wir noch nicht"); (3) freie Themenwahl
   über alle übrigen Themen – auch solche, die das Kind noch nicht hatte. Das Kind entscheidet. */
function bonusCard(plan, diag){
  const restIds=[]; plan.rest.forEach(r=>{ if(restIds.indexOf(r.id)<0) restIds.push(r.id); });
  const vorIds=plan.bonus.map(b=>b.id);
  const abM=id=>{ const s=diag[id]; return s==="sitzt"||s==="plan_ab_mittel"||s==="optional_ab_mittel"; };
  const btn=(id,abm)=>'<button class="opt" style="display:inline-block;width:auto;margin:6px 6px 0 0" data-bonus="'+id+'" data-abm="'+(abm?1:0)+'">'+esc(skillTitle(id))+'</button>';
  const restBtns=restIds.map(id=>btn(id,(plan.rest.find(r=>r.id===id)||{}).abMittel)).join("");
  const vorBtns=plan.bonus.map(b=>btn(b.id,b.abMittel)).join("");
  const freiBtns=SKILLS.map(s=>s.id).filter(id=>CONTENT[id]&&restIds.indexOf(id)<0&&vorIds.indexOf(id)<0).map(id=>btn(id,abM(id))).join("");
  return '<div class="card">'+
    '<strong>Dein Bonus – du entscheidest.</strong>'+

/* Antwort-Matching (erweitert nach Beta-Feedback 29.07.2026):
   Terme (^-Notation, Groß/klein, Reihenfolge), Textantworten mit Klammerzusatz,
   Aufzählungen (reihenfolgeunabhängig), Name=Wert-Antworten (Winkel, auch ausgeschrieben) */
/*MATCH-START*/
const GREEK={alpha:"α",alfa:"α",beta:"β",gamma:"γ",delta:"δ",epsilon:"ε",lambda:"λ",my:"μ",mu:"μ",phi:"φ"};
function normTxt(t){ return String(t).toLowerCase().replace(/−/g,"-").replace(/\s+/g," ").replace(/[.!?]\s*$/,"").trim(); }
function termNorm(t){
  return String(t).toLowerCase().replace(/−/g,"-").replace(/\s+/g,"")
    .replace(/[⁰¹²³⁴⁵⁶⁷⁸⁹]+/g,m=>"^"+[...m].map(c=>"⁰¹²³⁴⁵⁶⁷⁸⁹".indexOf(c)).join(""))
    .replace(/[·*]/g,"");
}
function isTermLike(t){
  const n=termNorm(t);
  return /^[+\-]?[0-9a-zα-ω^+\-]+$/.test(n) && /[a-zα-ω]/.test(n) && !/[a-zα-ω]{5,}/.test(n);
}
function monoKey(m){ // "16x^2" -> "16|x^2" · "-8xy" -> "-8|x^1,y^1" · "y^2" -> "1|y^2"
  let sign=1, t=m;
  if(t[0]==="+") t=t.slice(1); else if(t[0]==="-"){ sign=-1; t=t.slice(1); }
  const cm=t.match(/^\d+(?:,\d+)?/); const coef=cm?parseFloat(cm[0].replace(",",".")):1;
  t=cm?t.slice(cm[0].length):t;
  const vars=[]; const re=/([a-zα-ω])(?:\^(\d+))?/g; let mm;
  while((mm=re.exec(t))) vars.push(mm[1]+"^"+(mm[2]||"1"));
  vars.sort();

}
function termEq(a,b){
  const split=t=>{ const n=termNorm(t); if(/[()=\/]/.test(n)) return null;
    const parts=n.replace(/([+\-])/g,"§$1").split("§").filter(Boolean);
    return parts.length?parts.map(monoKey).sort():null; };

  if(!pa||!pb) return null;
  return pa.length===pb.length && pa.every((x,i)=>x===pb[i]);
}
function parsePairs(t){ // "β = 40°, α = 80°" / "Alpha=80°, Beta=40°" -> {β:40, α:80}
  const parts=String(t).replace(/−/g,"-").split(/[;,]/).map(x=>x.trim()).filter(Boolean);
  if(!parts.length) return null;
  const out={};
  for(const p of parts){
    const m=p.match(/^(?:winkel\s+)?([A-Za-zÄÖÜäöüα-ωΑ-Ω][A-Za-zäöü]*)\s*=\s*(-?\d+(?:[.,]\d+)?(?:\s*\/\s*\d+)?)\s*(?:°|€|%|[a-zA-Z]{1,3}[²³]?)?$/i);
    if(!m) return null;
    let k=m[1].toLowerCase(); if(GREEK[k]) k=GREEK[k];
    const v=parseFracValue(m[2].replace(/\s/g,"")); if(!isFinite(v)) return null;
    out[k]=v;
  }

}
function splitEnum(t){ // kurze Aufzählung "sss, sws, wsw, Ssw" -> normierte sortierte Teile
  const ps=String(t).split(/[,;]|\s+und\s+/i).map(x=>x.trim()).filter(Boolean);
  if(ps.length<2 || ps.some(p=>/\s/.test(p)||p.length>12) || !ps.some(p=>/[a-zA-Zα-ωÄÖÜäöü]/.test(p))) return null;
  return ps.map(normTxt).sort();
}
function numericInput(t){ // Zahl/Bruch/gemischte Zahl + optional kurze Einheit
  return /^-?\d+(?:[.,]\d+)?(?:\s*\/\s*\d+|\s+\d+\/\d+)?\s*(?:°|€|%|[a-zA-Z]{1,3}[²³]?)?$/.test(String(t).replace(/−/g,"-").trim());
}
function solMatches(sol, input){
  const s=String(sol).replace(/−/g,"-").trim();
  const inp=String(input).replace(/−/g,"-").trim();
  // 1) Name=Wert-Antworten (z. B. Winkel): reihenfolgeunabhängig, griechisch auch ausgeschrieben
  const ps=parsePairs(s), pi=parsePairs(inp);
  if(ps&&pi){
    const ks=Object.keys(ps), ki=Object.keys(pi);
    if(ks.length===ki.length&&ks.every(k=>k in pi)) return ks.every(k=>Math.abs(ps[k]-pi[k])<0.005);
    return null; // Namen passen nicht zusammen -> lieber selbst vergleichen
  }
  // 2) Aufzählungen: als Menge vergleichen (Reihenfolge und Groß/klein egal)
  const es=splitEnum(s);
  if(es){
    const ei=splitEnum(inp);
    if(ei) return es.length===ei.length&&es.every((x,i)=>x===ei[i]);
  }
  // 3) Zahlen/Brüche: Kandidaten aus der Lösung (Anfang + Werte nach "=", keine Potenz-Basen, keine Variablen-Koeffizienten)
  if(numericInput(inp)){
    const inFrac=parseFracValue(inp.replace(/\s*(?:°|€|%|[a-zA-Z]{1,3}[²³]?)$/,""));
    if(isFinite(inFrac)){
      const cands=[];
      const add=(t,lead)=>{ if(!t)return; t=t.trim();
        if(lead && /^-?\d+(?:,\d+)?[⁰¹²³⁴⁵⁶⁷⁸⁹^]/.test(t)) return; // "2⁵ = …": Basis ist kein Ergebnis
        const f=t.match(/^-?\d+\/\d+/); const n=t.match(/^-?\d+(?:,\d+)?/);
        if(f&&!/^[a-zα-ω]/i.test(t.slice(f[0].length))){ const [x,y]=f[0].split("/").map(Number); if(y)cands.push(x/y); }
        else if(n&&!/^[a-zα-ω]/i.test(t.slice(n[0].length))){ cands.push(parseFloat(n[0].replace(",","."))); } }; // "16x²…": Koeffizient ist kein Ergebnis
      add(s, true);
      for(const m of s.matchAll(/=\s*(-?[\d,\/]+)([a-zα-ω]?)/gi)){ if(!m[2]) add(m[1]); }
      if(cands.length) return cands.some(v=>isFinite(v)&&Math.abs(inFrac-v)<0.005);

  if(isTermLike(s)&&isTermLike(inp)){

  const ni=normTxt(inp.replace(/\s*\([^)]*\)/g," "));

  const first=core.split(/[\s,]+/)[0];
  if(W.includes(first)&&W.includes(ni)) return first===ni;
  if(core&&core.split(" ").length<=2&&!/\d/.test(core)&&/[a-zα-ωäöü]/.test(ni)) return false;
  return null;
}

function unitSteps(skill, abMittel, minuten, blockIdx){
  const c=CONTENT[skill]; if(!c||!c.kerne||!c.kerne.length) return null;
  const kern=c.kerne[Math.min(blockIdx||0, c.kerne.length-1)];
  const hatStufen=kern.ueben.some(u=>u.stufe);
  const leicht=kern.ueben.filter(u=>u.stufe==="leicht"), mittel=kern.ueben.filter(u=>u.stufe!=="leicht");
  let kernTasks;
  if(!hatStufen) kernTasks=kern.ueben.slice(0,5);
  else kernTasks = abMittel ? mittel.slice(0,5) : leicht.slice(0,2).concat(mittel.slice(0,3));
  const steps=[{typ:"verstehen",kern},{typ:"fallen",kern}];
  kernTasks.forEach(u=>steps.push({typ:"aufgabe",u}));
  if(minuten>=20) steps.push({typ:"mix"});
  else steps.push({typ:"mix", limit:2}); // Mini-Mix bei 15 Min. (Entscheidung Annette 09.08.2026): täglich wiederholen gilt in JEDER Konstellation
  if(minuten>=30){
    const extra = c.uplus.length ? c.uplus.slice(0,4) : (abMittel?mittel.slice(5,8):mittel.slice(3,6));
    extra.forEach(u=>steps.push({typ:"aufgabe",u,extra:true}));
  }
  if(minuten>=45 && (blockIdx||0)===c.kerne.length-1)
    c.transfer.slice(0,2).forEach(t=>steps.push({typ:"aufgabe",u:{stufe:"Transfer",aufgabe:t.aufgabe,loesung:t.loesung,hinweis:t.hinweis},extra:true}));
  return steps;
}

/* Plan-Umbau-Schutz (11.08.2026, Regel-2-Befund zur Mail-Aussage "Fortschritt bleibt"):

   nie gelerntes Thema. Deshalb: Erledigte Tage werden anhand ihres INHALTS (Thema|Block bzw.
   n-ter Mix-Tag) auf die neuen Tag-Nummern uebertragen; erledigte Themen, die im neuen Plan

function planKeyMap(){
  const zaehler={};
  return buildPlan(effectiveDiag(),S.config).days.filter(d=>d.id!=="CHECK").map(d=>{
    const basis=d.id==="MIX"?"MIX":d.id+"|"+(d.block||0);
    const n=zaehler[basis]=(zaehler[basis]||0)+1;
    return {tag:d.tag, id:d.id, key:basis+"#"+n};
  });
}
function withPlanRemap(fn){
  const alt=planKeyMap();
  const doneKeys=alt.filter(e=>S.daysDone[e.tag]).map(e=>e.key);
  const curAlt=(typeof S.curDay==="number")?alt.find(e=>e.tag===S.curDay):null;
  fn();
  const neu=planKeyMap(); const nd={};
  for(const e of neu){ if(doneKeys.indexOf(e.key)>=0) nd[e.tag]=true; }
  for(const k of doneKeys){ // erledigte Themen ohne Platz im neuen Plan: bleiben gelernt
    if(!neu.some(e=>e.key===k)&&k.indexOf("MIX")!==0){ (S.bonusDone||(S.bonusDone={}))[k.split("|")[0]]=true; }
  }
  S.daysDone=nd;
  if(curAlt){ const e2=neu.find(e=>e.key===curAlt.key); if(e2){ S.curDay=e2.tag; if(S.unit&&S.unit.skill===curAlt.id) S.unit.tag=e2.tag; } }
  save();
}
function gelernteSkills(){
  // Themen, deren Lerntag im Plan bereits abgeschlossen ist (die "Vortage")
  const plan=buildPlan(effectiveDiag(),S.config); const g=new Set();
  for(const d of plan.days){ if(d.id!=="CHECK"&&d.id!=="MIX"&&S.daysDone[d.tag]) g.add(d.id); }
  for(const id of Object.keys(S.bonusDone||{})) g.add(id); // im Bonus abgeschlossene Themen zaehlen ebenfalls als gelernt
  return g;
}
function mixPool(exceptSkill){
  // Fix 11.08.2026 (Entscheidung Annette): Der Wiederholmix zieht NUR aus Themen, die schon
  // gelernt wurden (erledigte Lerntage) oder beim Check sassen – vorher zog die "vereinfachte v1"
  // aus ALLEN Themen, sobald irgendein Tag erledigt war (auch aus noch ungelernten). Damit stimmen
  // Lernplan-Text ("Wiederholmix aus den Vortagen"), Salespage und Kaeufer-Mails mit dem Verhalten ueberein.
  const diag=effectiveDiag(); const gel=gelernteSkills(); const pool=[];
  for(const sk of SKILLS){
    if(sk.id===exceptSkill||!CONTENT[sk.id]) continue;
    if(diag[sk.id]==="sitzt"||gel.has(sk.id)) CONTENT[sk.id].wpool.forEach(w=>pool.push({skill:sk.id,...w}));
  }
  // stabil mischen (Seed: Tag + Anzahl bereits gemeisterter Mix-Aufgaben), dann:
  // Aufgaben, die schon einmal richtig gelöst wurden, kommen NICHT erneut dran,
  // solange es noch ungespielte Alternativen gibt (Beta-Feedback 29.07.).
  const dayN=typeof S.curDay==="number"?S.curDay:97;
  const seed=dayN*7919+Object.keys(S.mixDone||{}).length*104651+7;
  const idx=pool.map((_,i)=>i).sort((a,b)=>(((a+1)*seed)%104729)-(((b+1)*seed)%104729));
  const fresh=[], done=[];
  for(const i of idx) ((S.mixDone||{})[mixKey(pool[i])]?done:fresh).push(pool[i]);
  // erst wenn ALLE Aufgaben einmal gemeistert sind, darf wiederholt werden (dann ist Wiederholen der Zweck)
  return (fresh.length?fresh:done).slice(0,4);
}
function renderDay(){

function renderMixBlock(kopf, day, limit){
  if(!S.unit.mixItems){ S.unit.mixItems=mixPool(day.id).slice(0, limit||4); save(); } // Auswahl pro Tag festhalten
  const items=S.unit.mixItems;
  if(!items.length){ S.unit.step++; save(); return renderDay(); }
  const i=S.unit.mixIdx||0;
  if(i>=items.length){ S.unit.step++; S.unit.mixIdx=0; save(); return renderDay(); }
  const it=items[i];
  const weiter=()=>{ S.unit.mixIdx=(S.unit.mixIdx||0)+1; save(); renderDay(); window.scrollTo(0,0); pushHist(); };
  const merkRichtig=()=>{ S.mixDone[mixKey(it)]=true; };
  const merkFalsch=(fbAdd)=>{
    S.netz[it.skill]=(S.netz[it.skill]||0)+1;
    if(S.netz[it.skill]>=2&&!S.netzPlan.includes(it.skill)){
      withPlanRemap(()=>{ S.netzPlan.push(it.skill); }); // Plan-Umbau-Schutz: Haken wandern inhaltsgetreu mit
      fbAdd.push('<div class="info">Dieses Thema nehmen wir sicherheitshalber nochmal in deinen Plan – kein Rückschritt, nur kurz auffrischen.</div>'); }
  };
  const anw=mixAnweisung(it.aufgabe, it.loesung);
  main.innerHTML='<div class="card">'+kopf+'<span class="pill">Wiederholmix</span>'+
    (anw?'<p style="margin:12px 0 0;font-weight:600">'+esc(anw)+'</p>':"")+

    '<div class="row" style="margin-top:16px"><button class="btn" id="uok">Ergebnis übernehmen</button>'+
    '<button class="btn ghost small" id="uskip">Überspringen</button>'+
    ((S.unit.mixIdx||0)>0||S.unit.step>0?'<button class="btn ghost small" id="uback">‹ Zurück</button>':'')+'</div>'+erklaerHtml(it.skill)+'<div id="feedback"></div></div>';
  bindErklaer();
  $("uok").addEventListener("click",()=>{
    const val=$("uans").value.trim(); if(val==="") return $("uans").focus();
    const res=solMatches(it.loesung,val);
    $("uok").disabled=true;
    if(res===true){ merkRichtig(); save();
      $("feedback").innerHTML='<div class="banner"><strong>Sitzt!</strong> '+esc(it.loesung)+'</div>'+schrittBlock(it)+'<button class="btn block" id="nx2">Weiter</button>';
      bindWeg();
      $("nx2").addEventListener("click",weiter);
    } else if(res===false){ const adds=[]; merkFalsch(adds); save();
      $("feedback").innerHTML='<div class="warn"><strong>Noch nicht ganz</strong> – richtig ist: '+esc(it.loesung)+'</div>'+schrittBlock(it)+adds.join("")+'<button class="btn block" id="nx2">Weiter</button>';
      bindWeg();
      $("nx2").addEventListener("click",weiter);
    } else { // nicht automatisch prüfbar -> Selbstabgleich statt pauschalem "falsch"
      $("feedback").innerHTML='<div class="info"><strong>Vergleiche selbst – Lösung: '+esc(it.loesung)+'</strong></div>'+schrittBlock(it)+
        '<p style="margin-top:10px"><strong>Hattest du es richtig?</strong></p>'+
        '<div class="row"><button class="btn" id="mxJa">Hatte ich richtig</button>'+
        '<button class="btn ghost" id="mxNein">Noch nicht ganz</button></div><div id="fb2"></div>';
      bindWeg();
      $("mxJa").addEventListener("click",()=>{ merkRichtig(); save(); weiter(); });
      $("mxNein").addEventListener("click",()=>{ const adds=[]; merkFalsch(adds); save();
        if(adds.length){ $("fb2").innerHTML=adds.join("")+'<button class="btn block" id="nx3">Weiter</button>'; $("mxJa").disabled=true; $("mxNein").disabled=true; $("nx3").addEventListener("click",weiter); }
        else weiter(); });
    }
  });
  $("uskip").addEventListener("click",weiter);
  if($("uback")) $("uback").addEventListener("click",()=>{
    if((S.unit.mixIdx||0)>0) S.unit.mixIdx--; else S.unit.step--;
    save(); renderDay(); window.scrollTo(0,0); pushHist();
  });
}

function exportBackup(){
  const nm=(profiles().find(p=>p.id===PID)||{}).name||"profil";
  const d=new Date().toISOString().slice(0,10);
  const blob=new Blob([JSON.stringify({app:"mathe-booster",pid:PID,name:nm,date:d,version:APP_VERSION,unlock:localStorage.getItem("mb_unlock")||null,state:S})],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download="mathe-booster-sicherung-"+nm.toLowerCase().replace(/[^a-z0-9äöüß]+/gi,"-")+"-"+d+".json"; a.click();
  setTimeout(()=>alert("Deine Sicherung wurde als Datei\n„"+a.download+"“\nin deinen Downloads gespeichert. Bewahre sie gut auf – mit „Sicherung laden“ kannst du deinen Lernstand jederzeit wiederherstellen."),150);
}
function importBackup(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const o=JSON.parse(r.result);
    if(!o||typeof o!=="object"||o.app!=="mathe-booster"||!o.state) throw 0;
    const cur=(profiles().find(p=>p.id===PID)||{}).name||"dieses Profil";
    const when=o.date?(" vom "+new Date(o.date).toLocaleDateString("de-DE")):"";
    let msg="⚠️ Achtung: Damit wird der komplette aktuelle Lernstand von „"+cur+"“ ersetzt – durch die Sicherung"+(o.name?(" von „"+o.name+"“"):"")+when+".\n\nAlles, was du seit dieser Sicherung gelernt hast, geht verloren.\n\nSicherung wirklich laden?";
    if(o.name&&o.name!==cur) msg="Diese Sicherung stammt von einem anderen Profil („"+o.name+"“). Du bist gerade als „"+cur+"“ angemeldet.\n\n"+msg;
    e.target.value="";
    if(!confirm(msg)) return;
    S=o.state; save(); initS(); // initS lädt aus dem Speicher nach und ergänzt fehlende Felder
    if(o.unlock){ localStorage.setItem("mb_unlock",o.unlock); }
    verifyUnlock().then(v=>{ UNLOCKED=v||UNLOCKED; alert("Sicherung geladen – dein Lernstand ist wiederhergestellt."); render(); });
    return;
  }catch(err){ e.target.value=""; alert("Das ist leider keine gültige Sicherungs-Datei des Mathe-Boosters."); } };
  r.readAsText(f);
}

function renderThemen(){

      '<button class="btn block" id="goCheck">Zum Mathe-Check</button>'+
    '</div>';
    return $("goCheck").addEventListener("click",()=>show("start"));
  }
  const diag=effectiveDiag(), plan=buildPlan(diag,S.config), gel=gelernteSkills();
  const restIds=[]; plan.rest.forEach(r=>{ if(restIds.indexOf(r.id)<0) restIds.push(r.id); });
  const sitzt=[], auffrischen=[], vorsprung=[];
  for(const s of SKILLS){
    const st=diag[s.id];
    if(st==="sitzt") sitzt.push(s);
    else if(st==="optional"||st==="optional_ab_mittel") vorsprung.push(s);

  }
  const zeile=(s,extra)=>'<p style="margin:6px 0 0;padding-left:1.1em;text-indent:-1.1em">• '+esc(s.titel)+(extra||"")+'</p>';
  const haken=s=>gel.has(s.id)?' <strong style="color:var(--accent)">✓ geschafft</strong>':'';
  main.innerHTML='<div class="card">'+
    '<strong style="font-size:1.1rem">Deine Themen im Überblick</strong>'+
    '<p class="muted" style="margin-top:6px">So hat dein Mathe-Check die '+SKILLS.length+' Themen deines Boosters eingeordnet – und du siehst, was du schon geschafft hast.</p>'+
  '</div>'+
  (sitzt.length?'<div class="card"><strong>Kannst du schon</strong>'+
    '<p class="muted" style="margin:4px 0 0;font-size:.9rem">In diesen Themen hast du schon gute Kenntnisse – die sparst du dir komplett.</p>'+
    '<div style="margin-top:6px">'+sitzt.map(s=>zeile(s)).join("")+'</div></div>':"")+
  (auffrischen.length?'<div class="card"><strong>Frischst du gerade auf</strong>'+
    '<p class="muted" style="margin:4px 0 0;font-size:.9rem">Hier braucht es noch etwas Auffrischung – diese Themen stehen in deinem Lernplan'+(restIds.length?' oder warten in deinem Bonus':'')+'.</p>'+
    '<div style="margin-top:6px">'+auffrischen.map(s=>zeile(s, gel.has(s.id)?haken(s):(restIds.indexOf(s.id)>=0?' <span class="muted">– wartet in deinem Bonus</span>':''))).join("")+'</div></div>':"")+
  (vorsprung.length?'<div class="card"><strong>Dein Vorsprung</strong>'+
    '<p class="muted" style="margin:4px 0 0;font-size:.9rem">„Hatten wir noch nicht" – kein Muss. Wenn du magst, findest du diese Themen in deinem Bonus.</p>'+
    '<div style="margin-top:6px">'+vorsprung.map(s=>zeile(s,haken(s))).join("")+'</div></div>':"")+
  '<div class="card"><button class="btn block" id="goPlan">'+(S.planCreated?'Zum Lernplan':'Lernplan erstellen')+'</button></div>';
  $("goPlan").addEventListener("click",()=>show(S.planCreated?"plan":"anpassen"));
}

function renderFormeln(){
  const fr=esc; // Brüche mit Bruchstrich macht esc() seit 1.32 app-weit
  const R=(t,f,w)=>'<p style="margin:12px 0 0"><strong>'+esc(t)+'</strong>'+(f?'<br>'+fr(f):'')+(w?'<br><span class="muted">'+fr(w)+'</span>':'')+'</p>';
  const K=(titel,inhalt)=>'<div class="card"><strong style="font-size:1.05rem;color:var(--secondary)">'+esc(titel)+'</strong>'+inhalt+'</div>';
  main.innerHTML=
  '<div class="card">'+
    '<strong style="font-size:1.1rem">Deine Formelsammlung – Klasse 7</strong>'+
    '<p style="margin-top:10px">Alle Regeln, Formeln und Sätze aus deinem Booster an einem Ort – zum Nachschlagen, wann immer du sie brauchst. Zu jeder Formel steht dabei, was sie bedeutet und warum sie gilt.</p>'+
  '</div>'+
  K("Rechenregeln für alle Zahlen",
    R("Die Reihenfolge beim Rechnen","Klammern → Hochzahlen (Potenzen) → Punkt (· und :) → Strich (+ und −)","Was in Klammern steht, kommt immer zuerst. Danach Potenzen, dann Mal und Geteilt, ganz zum Schluss Plus und Minus.")+
    R("Vorzeichenregeln bei Mal und Geteilt","Plus mal Plus = Plus  |  Minus mal Minus = Plus  |  Plus mal Minus = Minus","Gleiche Vorzeichen geben Plus, verschiedene geben Minus – bei Geteilt genauso. Beispiel: (−3) · (−4) = 12, aber 3 · (−4) = −12.")+
    R("Minus vor der Klammer","−(a + b) = −a − b","Das Minus dreht JEDES Vorzeichen in der Klammer um. Beispiel: 5 − (−3) = 5 + 3 = 8 – Minus vor Minus wird Plus.")+
    R("Plus und Minus bei ganzen Zahlen","Gleiche Vorzeichen: addieren, Vorzeichen behalten. Verschiedene: Unterschied bilden","−2 + (−7) = −9. Bei −7 + 12 gewinnt die 12, weil ihr Abstand zur Null (ihr Betrag) größer ist → 5.")+
    R("Potenzen","a³ = a · a · a – die Hochzahl zählt die Faktoren","2⁵ = 2 · 2 · 2 · 2 · 2 = 32. Bei gleicher Basis: 2³ · 2⁴ = 2⁷ (Hochzahlen addieren). Produkt in der Klammer: (2x)³ = 8x³ – jeder Faktor wird potenziert.")+
    R("Vorsicht beim Minus vor Potenzen","(−3)² = 9, aber −3² = −9","Ohne Klammer gehört das Minus nicht zur Basis – Hoch kommt vor dem Vorzeichen dran. Gerade Anzahl Minusfaktoren gibt Plus, ungerade Minus: (−2)³ = −8, (−2)⁴ = 16."))+
  K("Brüche",
    R("Erweitern und Kürzen","Zähler UND Nenner mit derselben Zahl malnehmen oder teilen","Der Wert des Bruchs bleibt dabei gleich: 1/2 = 2/4 = 50/100.")+
    R("Plus und Minus","Erst gleichnamig machen (gemeinsamer Nenner), dann nur die Zähler verrechnen","2/3 + 1/4 → Hauptnenner 12 → 8/12 + 3/12 = 11/12. Der Nenner bleibt! Am Ende kürzen, wenn es geht.")+
    R("Mal","Zähler mal Zähler, Nenner mal Nenner","3/4 · 2/5 = 6/20 = 3/10. „2/3 von 3/4“ heißt 2/3 · 3/4 – „von“ bedeutet mal. Tipp: vor dem Rechnen kürzen.")+
    R("Geteilt","Mit dem Kehrbruch malnehmen","1/4 : 5/6 = 1/4 · 6/5 = 6/20 = 3/10. Der Kehrbruch entsteht durch Vertauschen von Zähler und Nenner.")+
    R("Gemischte Zahlen","1 1/2 = 3/2","Ganze in den Bruch packen: 1 = 2/2, dazu 1/2 → 3/2."))+
  K("Kommazahlen",
    R("Plus und Minus","Komma unter Komma schreiben, Lücken mit Nullen füllen","6,4 + 24,75 → 6,40 + 24,75 = 31,15 – dann stellenweise rechnen wie mit ganzen Zahlen.")+
    R("Mal","Erst ohne Komma rechnen, dann Nachkommastellen beider Zahlen zusammenzählen","0,3 · 5 → 3 · 5 = 15, eine Nachkommastelle → 1,5.")+
    R("Geteilt","Komma bei beiden Zahlen gleich weit verschieben, bis der Divisor ganz ist","12,34 : 0,8 = 123,4 : 8. Ergebnis immer mit einer Überschlagsrechnung prüfen."))+
  K("Einheiten umrechnen",
    R("Längen","1 km = 1000 m  |  1 m = 100 cm  |  1 cm = 10 mm","In die kleinere Einheit: malnehmen. In die größere: teilen. 3,5 km = 3500 m, 250 cm = 2,5 m.")+
    R("Masse und Geld","1 t = 1000 kg  |  1 kg = 1000 g  |  1 € = 100 ct","Bei 10, 100, 1000 verschiebst du einfach das Komma.")+
    R("Zeit","1 h = 60 min  |  1 min = 60 s","Vorsicht: Hier ist die Umrechnungszahl 60, nicht 100! 1,5 h sind 90 min, nicht 150."))+
  K("Prozent",
    R("Die wichtigste Regel","1 = 100 %","Das Ganze ist immer 100 %, und 100 % = 100/100 = 1. Daraus folgt: 20 % = 0,2 · 80 % = 0,8 · 50 % = 0,5.")+
    R("Was Prozent heißt","1 % = 1/100 = 0,01","Prozent bedeutet „von Hundert“ – ein Hundertstel. Prozent → Dezimalzahl: Komma 2 Stellen nach links (5 % = 0,05). Dezimalzahl → Prozent: Komma 2 Stellen nach rechts (0,375 = 37,5 %).")+
    R("Prozentwert berechnen","W = G · p (Prozentwert = Grundwert mal Prozentsatz)","25 % von 92 € → 92 · 0,25 = 23 €. Der Grundwert G ist das Ganze, der Prozentwert W der Anteil.")+
    R("Preis wird gesenkt","100 % − Rabatt-% = Rest-% → als Dezimalzahl → mal Preis","Um 20 % gesenkt: 100 % − 20 % = 80 % → 0,8 → 0,8 · 60 € = 48 €.")+
    R("Preis wird erhöht","100 % + Aufschlag-% → als Dezimalzahl → mal Preis","Um 15 % erhöht: 100 % + 15 % = 115 % → 1,15 → 1,15 · 40 € = 46 €. Genauso die Mehrwertsteuer: netto · 1,19 = Preis mit 19 % MwSt.")+
    R("Rückwärts rechnen","Neuer Preis : Faktor = alter Preis","32 € NACH 20 % Rabatt sind 80 % vom alten Preis → 32 : 0,8 = 40 €.")+
    R("Prozentpunkte","Unterschied zweier Prozentangaben","Von 40 % auf 45 % sind es 5 Prozentpunkte – aber 5/40 = 12,5 % Zuwachs."))+
  K("Zinsen",
    R("Die Zinsformel","Z = K · p/100 (Zinsen = Kapital mal Zinssatz, geteilt durch 100)","Zinsen sind ein Prozentsatz vom Kapital – „p % von K“. 400 € zu 2 %: Z = 400 · 2/100 = 8 €.")+
    R("Zinssatz gesucht","p = Z : K · 100","Der Zinssatz misst die Zinsen im Verhältnis zum Kapital. 6,25 € auf 250 €: 6,25 : 250 · 100 = 2,5 %.")+
    R("Kapital gesucht","K = Z : p · 100","240 € Zinsen bei 4 %: 240 : 4 · 100 = 6000 €.")+
    R("Kürzer als ein Jahr","Zeitanteil dazunehmen","Die Formel gilt für ein GANZES Jahr. Ein halbes Jahr bringt die halben Jahreszinsen, ein Vierteljahr ein Viertel."))+
  K("Dreisatz und Zuordnungen",
    R("Proportional („je mehr, desto mehr“)","Über die Einheit: erst teilen, dann malnehmen","3 kg kosten 5,40 € → 1 kg kostet 5,40 : 3 = 1,80 € → 5 kg kosten 1,80 · 5 = 9 €.")+
    R("Antiproportional („je mehr, desto weniger“)","Das Produkt bleibt gleich","6 Arbeiter brauchen 10 Tage → Gesamtarbeit 6 · 10 = 60 Arbeitstage → 4 Arbeiter brauchen 60 : 4 = 15 Tage."))+
  K("Terme und Gleichungen",
    R("Termwert","Zahl einsetzen und ausrechnen – negative Zahlen in Klammern!","T(x) = 2x² − 5 mit x = −3: 2 · (−3)² − 5 = 2 · 9 − 5 = 13.")+
    R("Zusammenfassen","Nur gleichartige Glieder verrechnen","7x − 2x = 5x und 3 + 5 = 8 – aber x-Glieder und Zahlen kannst du nicht mischen. Auch bei mehreren Variablen: 2xy + 3xy = 5xy, doch a²b und ab² bleiben getrennt.")+
    R("Ausmultiplizieren","a · (b + c) = a · b + a · c","Die Zahl vor der Klammer mal JEDES Glied in der Klammer: 3 · (x + 2) = 3x + 6.")+
    R("Ausklammern (Faktorisieren)","a · b + a · c = a · (b + c)","Das Ausmultiplizieren rückwärts: 6x² + 9x = 3x · (2x + 3). Prüfe durch Ausmultiplizieren!")+
    R("Gleichungen lösen","Auf BEIDEN Seiten dasselbe tun – wie bei einer Waage","4x − 7 = 13 | + 7 → 4x = 20 | : 4 → x = 5. Den Schritt an den Rand schreiben, am Ende die Probe: 4 · 5 − 7 = 13 ✓."))+
  K("Die drei binomischen Formeln",
    R("1. Formel","(a + b)² = a² + 2ab + b²","(a + b)² heißt (a + b) · (a + b) – jeder mit jedem: a² + ab + ab + b². Das mittlere Glied kommt DOPPELT, deshalb 2ab. Beispiel: (x + 3)² = x² + 6x + 9.")+
    R("2. Formel","(a − b)² = a² − 2ab + b²","Wie die 1., nur mit Minus beim mittleren Glied. Das b² bleibt Plus, denn (−b) · (−b) = +b². Beispiel: (x − 5)² = x² − 10x + 25.")+
    R("3. Formel","(a + b) · (a − b) = a² − b²","Die gemischten Produkte heben sich auf: −ab + ab = 0. Beispiel: (x + 4)(x − 4) = x² − 16.")+
    R("Warum die 1. Formel stimmt – das Flächenmodell","Ein Quadrat mit Seite a + b zerfällt in a², b² und ZWEI Rechtecke a · b","Alle vier Teilflächen zusammen: a² + 2ab + b² – dieselbe Fläche wie (a + b)². Darum das doppelte Mittelglied.")+
    R("Rückwärts erkennen (Faktorisieren)","x² + 6x + 9 = (x + 3)²  |  x² − 9 = (x + 3)(x − 3)","Sind erster und letzter Summand Quadrate? Passt das Mittelglied zu 2ab? Zwei Glieder mit Minus → Differenz zweier Quadrate → 3. Formel."))+
  K("Winkel",
    R("Winkelarten","spitz < 90°  |  recht = 90°  |  stumpf zwischen 90° und 180°  |  gestreckt = 180°","Eine Gerade ist ein gestreckter Winkel – deshalb ergeben alle Winkel auf einer Geradenseite zusammen 180°.")+
    R("Scheitelwinkel","Scheitelwinkel sind gleich groß","Sie liegen sich am Schnittpunkt zweier Geraden gegenüber.")+
    R("Nebenwinkel","Nebenwinkel ergänzen sich zu 180°","Sie liegen nebeneinander und bilden zusammen eine Gerade. Nebenwinkel zu 120°: 180° − 120° = 60°.")+
    R("Stufen- und Wechselwinkel","An PARALLELEN sind Stufenwinkel gleich groß – Wechselwinkel auch","Stufenwinkel liegen in „gleicher Stufe“ auf derselben Seite der schneidenden Geraden.")+
    R("Winkelsumme im Dreieck","α + β + γ = 180°","Die drei Innenwinkel ergeben zusammen immer 180°. Fehlender Winkel: 180° minus die beiden anderen.")+
    R("Winkelsumme im Viereck","360°","Eine Diagonale zerlegt jedes Viereck in 2 Dreiecke → 2 · 180° = 360°.")+
    R("Winkelsumme im n-Eck","(n − 2) · 180°","Das n-Eck zerfällt von einer Ecke aus in n − 2 Dreiecke. Sechseck: 4 · 180° = 720°.")+
    R("Außenwinkelsatz","Außenwinkel = Summe der beiden nicht anliegenden Innenwinkel","Der Außenwinkel entsteht durch Verlängern einer Seite – er ist der Nebenwinkel des Innenwinkels.")+
    R("Gleichschenkliges Dreieck","Die beiden Basiswinkel sind gleich groß","Zwei gleiche Seiten → zwei gleiche Winkel. Bei α = 54°: für β und γ bleiben 126° → je 63°."))+
  K("Dreiecke, Konstruktion und Thales",
    R("Dreiecksungleichung","Zwei Seiten zusammen müssen LÄNGER sein als die dritte","Sonst kommen die Enden nicht zusammen: 2 + 3 = 5 < 6 → unmöglich.")+
    R("Die vier Kongruenzsätze","sss  |  sws  |  wsw  |  Ssw","Kongruent heißt deckungsgleich. sss: drei Seiten. sws: zwei Seiten + eingeschlossener Winkel. wsw: eine Seite + beide anliegenden Winkel. Ssw: zwei Seiten + Gegenwinkel der GRÖSSEREN Seite. Jede dieser Angaben legt ein Dreieck eindeutig fest.")+
    R("Ortslinien","Kreis  |  Mittelsenkrechte  |  Winkelhalbierende","Alle Punkte mit gleichem Abstand zu EINEM Punkt: Kreis. Zu ZWEI Punkten: Mittelsenkrechte. Zu zwei Schenkeln: Winkelhalbierende.")+
    R("Umkreis und Inkreis","Mittelsenkrechte → Ecken  |  Winkelhalbierende → Seiten","Die drei Mittelsenkrechten treffen sich im Umkreismittelpunkt (gleich weit von allen Ecken), die drei Winkelhalbierenden im Inkreismittelpunkt (gleich weit von allen Seiten).")+
    R("Satz des Thales","Liegt C auf dem Halbkreis über AB (AB = Durchmesser), ist der Winkel bei C ein rechter","Gilt auch rückwärts (Umkehrung): Ist das Dreieck bei C rechtwinklig, liegt C auf dem Thaleskreis über AB. Deshalb: Umkreismittelpunkt eines rechtwinkligen Dreiecks = Mitte der Hypotenuse, Umkreisradius = halbe Hypotenuse."))+
  K("Fläche, Umfang, Volumen",
    R("Rechteck","A = a · b  |  U = 2 · (a + b)","Der Umfang ist der Weg einmal außen herum, die Fläche sagt, wie viel hineinpasst. Umfang in cm, Fläche in cm²!")+
    R("Quadrat","A = a²  |  U = 4 · a","Ein Rechteck mit vier gleichen Seiten.")+
    R("Dreieck","A = 1/2 · g · h","Ein halbes Rechteck aus Grundseite g und Höhe h.")+
    R("Parallelogramm","A = g · h","Grundseite mal Höhe – die Höhe steht senkrecht auf der Grundseite.")+
    R("Trapez","A = 1/2 · (a + c) · h","Mittelwert der beiden parallelen Seiten mal Höhe.")+
    R("Quader und Würfel","V = a · b · c  |  Würfel: V = a³","Volumen in cm³ oder m³. Brücke zu den Litern: 1 dm³ = 1 l.")+
    R("Komplizierte Flächen","Zerlegen oder ergänzen","In Rechtecke zerlegen oder zu einem Rechteck ergänzen – der wichtigste Trick."))+
  K("Daten und Boxplot",
    R("Median","Der mittlere Wert der GEORDNETEN Liste","Erst ordnen! Bei gerader Anzahl: Mittelwert der beiden mittleren Werte. Der Median teilt die Daten in zwei Hälften – 50 % liegen darunter.")+
    R("Spannweite","größter Wert − kleinster Wert","Sie zeigt, wie weit die Daten auseinanderliegen.")+
    R("Quartile","Q1 = Viertelgrenze unten  |  Q3 = Viertelgrenze oben","„Quartil“ kommt von „Viertel“: Ein Viertel der Werte liegt unter Q1, drei Viertel unter Q3. Zwischen Q1 und Q3 liegt die mittlere Hälfte.")+
    R("Boxplot","Fünf Kennwerte: Minimum  |  Q1  |  Median  |  Q3  |  Maximum","Die Box reicht von Q1 bis Q3 (mittlere Hälfte), der Strich darin ist der Median, die Antennen reichen bis Minimum und Maximum. Der Durchschnitt wird NICHT dargestellt!"))+
  '<div class="card"><button class="btn block" id="fsBack">Zur Startseite</button></div>';
  $("fsBack").addEventListener("click",()=>show("start"));
}

function renderInfo(){
  const li=t=>'<p style="margin:6px 0 0;padding-left:1.1em;text-indent:-1.1em">• '+t+'</p>';
  main.innerHTML=
  '<div class="card">'+
    '<strong style="font-size:1.1rem">Willkommen beim Mathe-Booster!</strong>'+
    '<p style="margin-top:10px"><strong>Das Ziel:</strong> Du schließt in zwei bis drei Wochen deine Mathe-Lücken aus der 7. Klasse und/oder festigst die Grundlagen, auf denen die 8. Klasse aufbaut – mit deinem persönlichen Lernplan, in kleinen Portionen und ohne Druck.</p>'+
    '<p>Du machst zuerst einen kurzen Mathe-Check – damit nur geübt wird, was noch nicht sitzt oder aufgefrischt werden sollte. Dahinter stecken 22 Themen mit über 440 Aufgaben, abgeglichen mit echten Klassenarbeiten der 7. Klasse.</p>'+
  '</div>'+
  '<div class="card">'+
    '<strong style="font-size:1.1rem">So funktioniert dein Booster</strong>'+
    '<p style="margin-top:10px"><strong>1. Check:</strong> Zuerst kommt dein Mathe-Check – kein Test, keine Note. Er zeigt, was du schon kannst und wo du noch Übungsbedarf hast.</p>'+
    '<p><strong>2. Plan:</strong> Was du kannst, überspringst du. Für den Rest bekommst du deinen eigenen Lernplan.</p>'+
    '<p><strong>3. Üben:</strong> Jeder Lerntag hat ein Thema, das kurz erklärt wird, dann übst du. Am Ende eines Lerntags wiederholst du.</p>'+
  '</div>'+
  '<div class="card">'+
    '<strong>Dein Plan, deine Regeln</strong>'+
    '<p style="margin-top:10px"><strong>1.</strong> <strong>Wochen und Tage</strong> bestimmen, wie viele Themen du machst. Passen nicht alle Themen in deinen Lernplan? Kein Problem. Die Grundlagen-Themen kommen zuerst in den Plan, denn auf ihnen baut alles Weitere auf. Die übrigen findest du unten im Lernplan in deinem <strong>Bonus</strong> und kannst sie dort zuerst bearbeiten – so verpasst du kein Thema. Und sobald in deinem Plan wieder Platz ist, rücken sie automatisch nach.</p>'+
    '<p><strong>2.</strong> <strong>Du entscheidest, wie lange du übst:</strong> Die von dir gewählte Zeit pro Tag bestimmt, wie ausführlich du ein Thema übst. Sie bestimmt nicht, wie viele Themen du bekommst.</p>'+
    '<p><strong>3.</strong> Ändern kannst du alles jederzeit unter <strong>„Anpassen“</strong> – dein Fortschritt bleibt.</p>'+
    '<p><strong>4.</strong> Lust auf mehr? Einfach mit dem nächsten Baustein im Lernplan weitermachen. Pause gemacht? Kein Problem – du machst genau da weiter, wo du aufgehört hast.</p>'+
    '<p><strong>5.</strong> <strong>Dein Bonus</strong> steht unten im Lernplan – für alles, was freiwillig ist: Themen, die nicht mehr in deinen Zeitplan gepasst haben (die zeigen wir dir zuerst), deine „Hatten wir noch nicht“-Themen und jedes Thema, das du vertiefen willst. Du entscheidest, was du übst – und was du im Bonus schaffst, kommt in deine Wiederholung.</p>'+
  '</div>'+
  '<div class="card">'+
    '<strong>Damit nichts verloren geht</strong>'+
    '<p style="margin-top:10px"><strong>Wichtig: Immer die neueste Version nutzen.</strong> Öffne die App dafür immer neu über deinen Link oder dein Lesezeichen. Dein Fortschritt bleibt dabei erhalten.</p>'+
    '<p><strong>Wichtig ist nur:</strong> Lösche nicht die Browserdaten bzw. die Websitedaten. Dort wird dein Fortschritt gespeichert. Ansonsten musst du von vorne beginnen.</p>'+
    '<p><strong>Übt ihr auf mehreren Geräten?</strong><br>Dein Lernstand liegt nur auf dem Gerät, auf dem du gerade übst – er wandert nicht automatisch mit.</p>'+
    '<p>Dann gilt eine einfache Regel: immer auf dem zuletzt genutzten Gerät unter <strong>„Fortschritt“</strong> eine Sicherung exportieren und sie auf dem nächsten Gerät wieder laden.</p>'+
    '<p>So machst du genau dort weiter, wo du aufgehört hast.</p>'+
    '<p><strong>Und bitte denk daran:</strong><br>Wenn jemand die Browserdaten löscht, ist der Lernstand weg – leg dir deshalb ab und zu eine Sicherung an.</p>'+
    '<p style="margin-top:12px">Viel Freude beim Lernen wünscht dir<br><span style="color:var(--secondary);font-size:1.1rem">Annette C. Breuer</span></p>'+
    '<p class="muted" style="font-size:.9rem">Fragen, Wünsche oder einen Fehler entdeckt? Schreib mir gern: <a href="mailto:annette.c.breuer@gmail.com" style="color:var(--secondary)">annette.c.breuer@gmail.com</a></p>'+
    '<p class="muted" style="font-size:.85rem">Version: '+esc(APP_VERSION)+'</p>'+
    '<button class="btn block" id="homeBtn">Zur Startseite</button>'+
  '</div>'+
  lizenzKasten();
  $("homeBtn").addEventListener("click",()=>show("start"));
  geraetAbmelden();
}

/* iPhone-Fix (Beta-Feedback Sophie): Solange ein Eingabefeld den Fokus hat, scrollt iOS die Seite
   beim Runterscrollen immer wieder zum Feld zurück ("hochgesprungen"). Deshalb: Beim ersten Tippen
   außerhalb des Feldes den Fokus lösen – die Tastatur klappt zu, Scrollen und Buttons funktionieren normal. */
document.addEventListener("touchstart",e=>{
  const a=document.activeElement;
  if(a&&a.tagName==="INPUT"&&e.target!==a) a.blur();
},{passive:true});

/* ---------- Navigation ---------- */
$("navStart").addEventListener("click",()=>show("start"));
$("navThemen").addEventListener("click",()=>show("themen"));
$("navFormeln").addEventListener("click",()=>show("formeln"));
$("navInfo").addEventListener("click",()=>show("info"));
$("brand").addEventListener("click",()=>show("info"));
$("navProgress").addEventListener("click",()=>show("fortschritt"));
$("navAdjust").addEventListener("click",()=>{ if(S.done) show("anpassen"); else notiert("Erst dein Mathe-Check – dann dein Plan!"); });
$("navProfile").addEventListener("click",()=>{ PROF_VIEW=true; render(); window.scrollTo(0,0); });

verifyUnlock().then(v=>{ UNLOCKED=v; render(); try{ history.replaceState({mb:S?histSnap():null},""); }catch(e){} });
