<!DOCTYPE html>
<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Mathe-Booster</title>
<style>
:root{
  --bg-page:#FBF8F2; --bg-surface:#FFFFFF; --color-heading:#173B2E; --color-text:#173B2E;
  --color-muted:#766F60; --color-border:#EDE8DE;
  --accent:#0E6E45; --accent-hover:#0B5838; --on-accent:#FFFFFF; --accent-tint:#DEF3E6;
  --secondary:#D8431E; --secondary-hover:#B8380F; --on-secondary:#FFFFFF; --secondary-tint:#FBE3DA;

  --radius-sm:10px; --radius-md:14px; --space-1:8px; --space-2:16px; --space-3:24px; --space-4:40px; --maxw:560px;
}
@media (min-width:900px){
  html{font-size:18px;}
  :root{--maxw:780px;--space-1:10px;--space-2:22px;--space-3:36px;--space-4:56px;--radius-md:16px;}
  header.app h1{font-size:1.2rem;}
  .nav button{padding:10px 16px;font-size:.9rem;}
}
@media (max-width:560px){
  header.app .brand{flex-wrap:wrap;}
  .nav{justify-content:flex-start;width:100%;}
  .nav button{padding:7px 10px;font-size:.8rem;}
}
@media print{header.app,.nav,.noprint,.status,footer.legal{display:none!important}body{background:#fff;padding-bottom:0}.card{border:1px solid #ccc}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-page);color:var(--color-text);font-family:var(--font-base);line-height:var(--lh-body);padding-bottom:var(--space-3);}

.card{background:var(--bg-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-3);margin-bottom:var(--space-2);}
button{font-family:inherit;font-size:1rem;cursor:pointer;border-radius:var(--radius-sm);border:1px solid transparent;padding:12px 18px;}
.btn{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.btn:hover{background:var(--accent-hover);}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--accent);}
.btn.ghost:hover{background:var(--accent-tint);}
.btn.block{display:block;width:100%;margin-top:var(--space-2);}
.btn.small{padding:8px 12px;font-size:.9rem;}
.opt{border:1px solid var(--color-border);background:#fff;border-radius:var(--radius-sm);padding:10px 14px;cursor:pointer;display:block;width:100%;text-align:left;font-size:1rem;margin-top:8px;font-family:inherit;color:var(--color-text);}
.opt.active{background:var(--accent-tint);border-color:var(--accent);color:var(--accent);font-weight:600;}
label.fld{display:block;font-weight:600;margin-top:var(--space-3);color:var(--color-heading);}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-size:.8rem;background:#FAF5E9;border:1px solid var(--secondary);color:var(--color-heading);}
.bar{height:9px;background:var(--color-border);border-radius:999px;overflow:hidden;margin:10px 0 var(--space-2);}
.bar>div{height:100%;background:var(--accent);width:0;transition:width .3s;}
.bar.koralle>div{background:var(--koralle);}
.prompt{font-size:1.35rem;font-weight:700;color:var(--color-heading);margin:var(--space-2) 0;line-height:1.35;}
.ex{font-style:italic;color:var(--secondary);margin-bottom:var(--space-2);}
input[type=text]{width:100%;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-sm);font-size:1.1rem;font-family:inherit;}
.unitrow{display:flex;align-items:center;gap:10px;}
.unitrow input{flex:1;}
.unit{font-weight:600;color:var(--color-heading);white-space:nowrap;}
.banner{background:var(--accent-tint);border:1px solid var(--color-border);border-left:4px solid var(--koralle);border-radius:0;padding:var(--space-2);margin:var(--space-3) 0;}
.info{background:#fff;border:1px solid var(--color-border);border-left:4px solid var(--koralle);border-radius:0;padding:12px 14px;font-size:1rem;color:var(--color-text);margin:var(--space-2) 0;}
.warn{background:#F7ECD8;border:1px solid #E4C98A;color:#6B4E1E;border-radius:var(--radius-sm);padding:10px 12px;margin:10px 0;}
table.plan{width:100%;border-collapse:collapse;font-size:.9rem;}
table.plan th,table.plan td{border:1px solid var(--color-border);padding:6px 8px;text-align:left;}
table.plan th{background:var(--accent);color:#FFFFFF;}
table.plan tr.today td{background:var(--accent-tint);font-weight:600;}
.status{width:calc(100% - 2*var(--space-2));max-width:calc(var(--maxw) - 2*var(--space-2));margin:0 auto var(--space-3);background:var(--bg-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px var(--space-2);font-size:.95rem;}
footer.legal{max-width:var(--maxw);margin:var(--space-3) auto 0;padding:0 var(--space-2) var(--space-2);text-align:center;font-size:.8rem;color:var(--color-muted);}
footer.legal a{color:var(--color-muted);}
.muted{color:var(--color-muted);}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.hidden{display:none!important;}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.1;}
.frac .num{border-bottom:1.5px solid currentColor;padding:0 4px;}
.frac .den{padding:0 4px;}
.pf{display:inline-block;vertical-align:0.08em;margin:0 4px;font-weight:700;}
.scratch{margin-top:var(--space-2);}
.scratch canvas{width:100%;height:220px;background:#fff;border:1px dashed var(--color-border);border-radius:var(--radius-sm);touch-action:none;display:block;}

/* ---------- Antwortprüfung (Leitfaden Abschn. 6: Komma/Punkt, Brüche, gemischte Zahlen) ---------- */
function parseNum(s){
  if(typeof s!=="string") return NaN;
  s=s.trim().replace(/−/g,"-").replace(/\s+/g,"");
  if(/^-?\d+\/\d+$/.test(s)){ const [a,b]=s.split("/").map(Number); return b?a/b:NaN; }
  s=s.replace(/\./g, s.includes(",")?"":".").replace(",",".");
  const v=parseFloat(s);
  return isFinite(v)?v:NaN;
}
function parseFracValue(s){
  if(typeof s!=="string") return NaN;
  s=s.trim().replace(/−/g,"-");
  let m=s.match(/^(-?\d+)\s+(\d+)\/(\d+)$/); // gemischte Zahl "1 1/9"
  if(m){ const g=+m[1], z=+m[2], n=+m[3]; if(!n) return NaN; return (g<0?-1:1)*(Math.abs(g)+z/n); }
  m=s.match(/^(-?\d+)\/(\d+)$/);
  if(m){ const z=+m[1], n=+m[2]; if(!n) return NaN; return z/n; }
  return parseNum(s);
}
function isCorrect(nr, ans){
  const k=KEY[nr]; if(k===undefined||ans===undefined||ans===null) return false;
  if(k.t==="mc") return ans===k.v;
  if(k.t==="num"){ const v=parseNum(String(ans)); return isFinite(v)&&Math.abs(v-k.v)<0.005; }
  if(k.t==="frac"){ const v=parseFracValue(String(ans)); return isFinite(v)&&Math.abs(v-k.v[0]/k.v[1])<0.005; }
  if(k.t==="pair"){
    if(!Array.isArray(ans)||ans.length<2) return false;
    const a=parseNum(String(ans[0])), b=parseNum(String(ans[1]));
    return isFinite(a)&&isFinite(b)&&Math.abs(a-k.v[0])<0.005&&Math.abs(b-k.v[1])<0.005;
  }
  if(k.t==="term"){
    if(Array.isArray(ans)){ // Alt-Antworten aus der Kästchen-Version (vor 30.07.): weiter fair werten
      if(!k.legacy||ans.length<2) return false;
      const a=parseNum(String(ans[0])), b=parseNum(String(ans[1]));
      return isFinite(a)&&isFinite(b)&&Math.abs(a-k.legacy[0])<0.005&&Math.abs(b-k.legacy[1])<0.005;
    }
    return termEq(String(ans), k.v)===true; // ganzer Term inkl. Vorzeichen (Reihenfolge/Schreibweise egal)
  }
  return false;
}

function taskResult(nr, answers, hwnn){
  if(hwnn && hwnn[nr]) return "h";
  if(answers[nr]===undefined) return "x";
  return isCorrect(nr, answers[nr]) ? "r" : "f";
}
function diagnose(answers, hwnn){
  const out={};
  for(const sk of SKILLS){
    if(sk.rang==="F"){
      out[sk.id] = taskResult(sk.tasks[0], answers, hwnn)==="r" ? "sitzt" : "plan";
    } else if(sk.rang==="A"){
      const l=taskResult(sk.leicht, answers, hwnn), m=taskResult(sk.mittel, answers, hwnn);
      if(m==="r" && (l==="r"||l==="h")) out[sk.id]="sitzt";           // mittel beherrscht
      else if(l==="r" && (m==="f"||m==="x")) out[sk.id]="plan_ab_mittel";
      else if(l==="r" && m==="h") out[sk.id]="optional_ab_mittel";     // HWNN zählt nie als Lücke
      else if(l==="h") out[sk.id]="optional";
      else out[sk.id]="plan";                                          // leicht falsch/leer → von Beginn an
    } else {
      const r=taskResult(sk.tasks[0], answers, hwnn);
      out[sk.id] = r==="r" ? "sitzt" : (r==="h" ? "optional" : "plan");
    }
  }
  return out;
}

/* ---------- Plan-Builder (Priorität F → A → B → C, optional ans Ende) ---------- */
function bausteinLabel(min){ return min>=45?"Thema + Mix + Extra + Knobeln":min>=30?"Thema + Mix + Extra":min>=20?"Thema + Mix":"Thema"; }
function buildPlan(diag, cfg){
  cfg = Object.assign({wochen:2, tage:5, minuten:20}, cfg||{});
  const order = ["F","A","B","C"];
  const queue=[], bonus=[];
  for(const rang of order){
    for(const sk of SKILLS){
      if(sk.rang!==rang) continue;
      const st=diag[sk.id];
      if(st==="plan"||st==="plan_ab_mittel"){
        const n=sk.blocks||1;
        for(let i=0;i<n;i++) queue.push({id:sk.id, abMittel:st==="plan_ab_mittel", block:i, titel:sk.titel+(n>1?" ("+(i+1)+"/"+n+")":"")});
      } else if(st==="optional"||st==="optional_ab_mittel"){
        bonus.push({id:sk.id, abMittel:st==="optional_ab_mittel", titel:sk.titel});
      }
    }
  }
  const totalDays=cfg.wochen*cfg.tage, days=[], label=bausteinLabel(cfg.minuten);
  let qi=0;
  for(let d=1; d<=totalDays; d++){
    const checkpoint = d%cfg.tage===0;
    if(d===1) days.push({tag:1, baustein:"Check", thema:"Dein Mathe-Check", id:"CHECK", done:true});
    else if(checkpoint) days.push({tag:d, baustein:"Mix-Tag", thema:"Wiederholung quer durch die Woche", id:"MIX"});
    else if(qi<queue.length){ const q=queue[qi++]; days.push({tag:d, baustein:label, thema:q.titel, id:q.id, abMittel:q.abMittel, block:q.block||0}); }
    else days.push({tag:d, baustein:"Mix", thema:"Wiederholmix – dranbleiben und festigen", id:"MIX"});
  }
  return {days, rest:queue.slice(qi), bonus, cfg};
}

inweis": "Auf Nenner 100 erweitern"}, {"stufe": "leicht", "aufgabe": "Schreibe als Prozentangabe: 0,3", "loesung": "30 %", "hinweis": "Komma zwei Stellen nach rechts"}, {"stufe": "mittel", "aufgabe": "Schreibe als Dezimalzahl und als Bruch: 12,5 %", "loesung": "0,125 = 1/8", "hinweis": "12,5 % = 125/1000 – mit 125 kürzen → 1/8."}, {"stufe": "mittel", "aufgabe": "Schreibe als Dezimalzahl und als Bruch: 87,5 %", "loesung": "0,875 = 7/8", "hinweis": "87,5 % = 875/1000 – mit 125 kürzen → 7/8."}, {"stufe": "mittel", "aufgabe": "Schreibe als Prozentangabe: 7/8", "loesung": "87,5 %", "hinweis": "Bruch in Prozent → 7 : 8 = 0,875 = 87,5 %."}, {"stufe": "mittel", "aufgabe": "Schreibe als Prozentangabe: 32/400", "loesung": "8 %", "hinweis": "Kürzen auf Nenner 100: 8/100"}, {"stufe": "mittel", "aufgabe": "Schreibe als Prozentangabe: 1,05", "loesung": "105 %", "hinweis": "Mehr als das Ganze ist möglich"}, {"stufe": "mittel", "aufgabe": "Schreibe als Prozentangabe: 0,003", "loesung": "0,3 %", "hinweis": "Komma zwei Stellen nach rechts"}, {"stufe": "mittel", "aufgabe": "Schreibe als Prozentangabe (auf 2 Stellen gerundet): 2/9", "loesung": "≈ 22,22 %", "hinweis": "Teile aus → 2 : 9 = 0,2222… – gerundet 22,22 %."}]}], "uplus": [], "transfer": [{"aufgabe": "In einer Klasse mit 40 Kindern fahren 12 mit dem Rad zur Schule. Wie viel Prozent sind das?", "loesung": "30 %", "hinweis": "Anteil → 12/40 = 3/10 = 30/100 = 30 %. Antwort → 30 % der Kinder fahren mit dem Rad."}, {"aufgabe": "Von den Haushalten in Deutschland sind 42 % Einpersonenhaushalte, 34 % 2-Personen-, 12 % 3-Personen- und 9 % 4-Personen-Haushalte. Wie viel Prozent der Haushalte haben 5 und mehr Personen?", "loesung": "3 %", "hinweis": "Das Ganze sind 100 % → 100 − 42 − 34 − 12 − 9 = 3. Antwort → 3 % der Haushalte haben 5 und mehr Personen."}], "wpool": [{"aufgabe": "Schreibe 50 % als Bruch.", "loesung": "1/2"}, {"aufgabe": "Schreibe 0,2 als Prozentangabe.", "loesung": "20 %"}, {"aufgabe": "Schreibe 10 % als Dezimalzahl.", "loesung": "0,1"}, {"aufgabe": "Schreibe 3/10 als Prozentangabe.", "loesung": "30 %"}, {"aufgabe": "Schreibe 1 % als Dezimalzahl.", "loesung": "0,01"}]}, "F6": {"id": "F6", "titel": "Fläche, Umfang, Volumen – so geht’s", "kerne": [{"name": "", "verstehen": ["Der Umfang ist der Weg einmal außen herum: Beim Rechteck U = 2 · (a + b), beim Quadrat U = 4 · a. Der Flächeninhalt sagt, wie viel hineinpasst: Rechteck A = a · b, Quadrat A = a². Miss beides nie in derselben Einheit – Umfang in cm, Fläche in cm²!", "Die Formeln aus dem Grundwissen: Dreieck A = 1/2 · g · h (halbes Rechteck!), Parallelogramm A = g · h, Trapez A = 1/2 · (a + c) · h. Komplizierte Flächen zerlegst du in Rechtecke oder ergänzt sie zu Rechtecken – das ist der wichtigste Trick.", "Beim Quader gilt V = a · b · c, gemessen in cm³ oder m³. Merke die Brücke zu den Litern → 1 dm³ = 1 l. Ein Würfel ist ein Quader mit drei gleichen Kanten → V = a³."], "fallen": [{"falle": "Umfang und Fläche verwechselt", "falsch": "Rechteck 7 cm × 4 cm: A = 22 cm²", "richtig": "A = 7 · 4 = 28 cm²; 22 cm ist der UMFANG", "warum": "U zählt den Rand (2 · (7 + 4)), A das Innere"}, {"falle": "Dreieck ohne die Hälfte", "falsch": "A = g · h", "richtig": "A = 1/2 · g · h", "warum": "Ein Dreieck ist ein halbes Rechteck/Parallelogramm"}], "ueben": [{"stufe": "leicht", "aufgabe": "Ein Rechteck hat die Seiten a = 7 cm und b = 4 cm. Berechne Umfang und Flächeninhalt.", "loesung": "U = 22 cm; A = 28 cm²", "hinweis": "U = 2 · (7 + 4); A = 7 · 4"}, {"stufe": "leicht", "aufgabe": "Ein Quadrat hat die Seite a = 6 cm. Berechne Umfang und Flächeninhalt.", "loesung": "U = 24 cm; A = 36 cm²", "hinweis": "Quadrat: Umfang U = 4 · a = 4 · 6, Fläche A = a · a = 6²."}, {"stufe": "leicht", "aufgabe": "Ein Dreieck hat die Grundseite g = 8 cm und die Höhe h = 5 cm. Berechne den Flächeninhalt.", "loesung": "20 cm²", "hinweis": "Dreiecksformel → A = ½ · g · h = ½ · 8 · 5."}, {"stufe": "leicht", "aufgabe": "Ein Quader hat die Kanten a = 4 cm, b = 3 cm und c = 2 cm. Berechne das Volumen.", "loesung": "24 cm³", "hinweis": "Quader → V = a · b · c = 4 · 3 · 2."}, {"stufe": "leicht", "aufgabe": "1 dm³ = ____ l", "loesung": "1", "hinweis": ""}, {"stufe": "mittel", "aufgabe": "Ein Parallelogramm hat die Grundseite g = 9 cm und die Höhe h = 4 cm. Berechne den Flächeninhalt.", "loesung": "36 cm²", "hinweis": "Parallelogramm → A = g · h = 9 · 4."}, {"stufe": "mittel", "aufgabe": "Ein Trapez hat die parallelen Seiten a = 8 cm und c = 4 cm und die Höhe h = 5 cm. Berechne den Flächeninhalt.", "loesung": "30 cm²", "hinweis": "Trapez → A = ½ · (a + c) · h = ½ · 12 · 5."}, {"stufe": "mittel", "aufgabe": "Ein Rechteck hat A = 54 cm² und a = 9 cm. Berechne b und den Umfang.", "loesung": "b = 6 cm; U = 30 cm", "hinweis": "b = 54 : 9; U = 2 · (9 + 6) – Formel rückwärts"}, {"stufe": "mittel", "aufgabe": "Aus einem Rechteck (10 cm × 6 cm) ist an einer Ecke ein Quadrat (2 cm × 2 cm) herausgeschnitten. Berechne den Flächeninhalt der L-Form.", "loesung": "56 cm²", "hinweis": "Ergänzen statt mühsam zerlegen: großes Rechteck 10 · 6 = 60 cm², davon das fehlende Quadrat 2 · 2 = 4 cm² abziehen."}, {"stufe": "mittel", "aufgabe": "Ein Quader hat V = 120 cm³, a = 6 cm, b = 5 cm. Berechne c.", "loesung": "c = 4 cm", "hinweis": "Formel rückwärts → c = V : (a · b) = 120 : 30."}, {"stufe": "mittel", "aufgabe": "Ein Würfel hat die Kante a = 3 cm. Berechne das Volumen.", "loesung": "27 cm³", "hinweis": "Würfel → V = a³ = 3 · 3 · 3."}]}], "uplus": [], "transfer": [{"aufgabe": "Ein Zimmer ist 4,5 m lang und 3,2 m breit. a) Wie viel m² Teppich brauchst du? b) Wie viele Meter Fußleiste, wenn die Tür 0,9 m breit ist?", "loesung": "a) 14,4 m² b) 14,5 m", "hinweis": "a) A = 4,5 · 3,2 = 14,4. b) U = 2 · (4,5 + 3,2) = 15,4; minus Tür → 15,4 − 0,9 = 14,5. Antwortsatz mit Einheiten."}, {"aufgabe": "Ein Aquarium ist innen 60 cm lang, 30 cm breit und 40 cm hoch. Wie viele Liter passen hinein?", "loesung": "72 l", "hinweis": "V = 60 · 30 · 40 = 72000 cm³ = 72 dm³ = 72 l."}], "wpool": [{"aufgabe": "Berechne den Umfang eines Quadrats mit a = 5 cm.", "loesung": "20 cm"}, {"aufgabe": "Berechne die Fläche eines Rechtecks mit 6 cm × 3 cm.", "loesung": "18 cm²"}, {"aufgabe": "Berechne die Fläche eines Dreiecks mit g = 6 cm und h = 4 cm.", "loesung": "12 cm²"}, {"aufgabe": "Berechne das Volumen eines Würfels mit a = 2 cm.", "loesung": "8 cm³"}, {"aufgabe": "3 dm³ = ____ l", "loesung": "3"}]}, "A2": {"id": "A2", "kerne": [{"name": "", "verstehen": ["Eine Variable ist ein Platzhalter für eine Zahl. Beispiel: Ein Stift kostet x Euro. 5 Stifte und 3 € Versand kosten dann 5x + 3 Euro. Der Term merkt sich die Rechnung – egal, was der Stift kostet. Kostet er 2 €, rechnest du 5 · 2 + 3 = 13. Das nennt man den Termwert: Einsetzen und ausrechnen.", "Wichtig beim Einsetzen negativer Zahlen: Klammern! T(x) = 2x² − 5 mit x = −3 heißt 2 · (−3)² − 5 = 2 · 9 − 5 = 13."], "fallen": [{"falle": "Reihenfolge beim Übersetzen", "falsch": "„5 Stifte à x € plus 3 €“ → 5 + 3x", "richtig": "5x + 3", "warum": "5-mal der Stiftpreis, dazu einmal 3 € – die Struktur des Textes zählt, nicht die Wortreihenfolge"}, {"falle": "Einsetzen ohne Klammer", "falsch": "T(−3) = 2 · −3² − 5 = −23", "richtig": "2 · (−3)² − 5 = 13", "warum": "Ohne Klammer wird erst 3² gerechnet und das Minus bleibt stehen"}], "ueben": [{"stufe": "leicht", "loesung": "3x", "hinweis": "„Das Dreifache“ heißt mal 3 – aus „mal“ wird ein Produkt → 3x.", "aufgabe": "„Das Dreifache von x“", "mc": ["3x", "x + 3", "x³", "3 − x"], "mcCorrect": 0}, {"stufe": "leicht", "loesung": "2·(x + 4)", "hinweis": "Klammer sichert die Summe", "aufgabe": "„Die Summe aus x und 4, dann mal 2“", "mc": ["2", "(x + 4)", "2x + 4", "x + 8", "2x", "4"], "mcCorrect": 1}, {"stufe": "leicht", "loesung": "21", "hinweis": "Setze 5 für x ein → 4 · 5 + 1 = 21.", "aufgabe": "T(x) = 4x + 1: berechne T(5)"}, {"stufe": "leicht", "loesung": "8", "hinweis": "Setze 4 für x ein → 20 − 3 · 4 = 20 − 12.", "aufgabe": "T(x) = 20 − 3x: berechne T(4)"}, {"stufe": "leicht", "loesung": "50 − 3k", "hinweis": "Struktur: Startbetrag minus Kosten", "aufgabe": "Eine Kinokarte kostet k €. Du kaufst 3 Karten und zahlst mit 50 €. Welcher Term beschreibt dein Restgeld?", "mc": ["50 − 3k", "3k − 50", "50 + 3k", "47k"], "mcCorrect": 0}, {"stufe": "mittel", "loesung": "13", "hinweis": "Klammer ums Minus → 2 · 9 − 5", "aufgabe": "T(x) = 2x² − 5: berechne T(−3)"}, {"stufe": "mittel", "loesung": "6", "hinweis": "Setze −2 mit Klammern ein → (−2)² − (−2) = 4 + 2.", "aufgabe": "T(x) = x² − x: berechne T(−2)"}, {"stufe": "mittel", "loesung": "9 + 2x", "hinweis": "Grundgebühr einmal, Filmpreis x-mal", "aufgabe": "Streaming: 9 € Grundgebühr + 2 € je Film (x Filme)", "mc": ["9 + 2x", "11x", "9x + 2", "2", "(9 + x)"], "mcCorrect": 0}, {"stufe": "mittel", "loesung": "12", "hinweis": "Setze 3 ein → 3 + 3² = 3 + 9 – die Tabelle wächst mit x².", "aufgabe": "Wertetabelle von T(x) = 3 + x²: T(0)=3, T(1)=4, T(2)=7. Berechne T(3)"}, {"stufe": "mittel", "loesung": "−14", "hinweis": "Setze −3 mit Klammern ein → 4 · (−3) − 2.", "aufgabe": "T(x) = 4x − 2: berechne T(−3)"}, {"stufe": "mittel", "loesung": "−48", "hinweis": "Setze 5 ein: erst die Klammer (5 + 4 = 9), dann −5 · 9 − 3.", "aufgabe": "T(x) = −5 · (x + 4) − 3: berechne T(5)"}]}], "uplus": [{"stufe": "", "loesung": "3", "hinweis": "Setze x = 5 und y = 2 ein → 3 · (5 − 2 · 2) = 3 · 1.", "aufgabe": "T(x; y) = 3 · (x − 2y): berechne T(5; 2)"}, {"stufe": "", "loesung": "0", "hinweis": "Setze −1 mit Klammern ein → (−1)³ − (−1) = −1 + 1.", "aufgabe": "T(x) = x³ − x: berechne T(−1)"}, {"stufe": "", "loesung": "Grundgebühr", "hinweis": "Terme interpretieren", "aufgabe": "Im Term 1,19 · (3 + 0,5x) für eine Rechnung mit 19 % Aufschlag – wofür steht die 3?", "mc": ["Grundgebühr in €", "Preis pro Stück", "Anzahl", "Aufschlag"], "mcCorrect": 0}, {"stufe": "", "loesung": "27", "hinweis": "Setze a = 0 und b = −3 ein → 2 · 0 + 3 · (−3)² = 0 + 3 · 9.", "aufgabe": "T(a; b) = 2a + 3b²: berechne T(0; −3)"}], "transfer": [{"aufgabe": "Tarif A: 5 € Grundgebühr + 0,10 € je Minute. Tarif B: 0,20 € je Minute. Stelle beide Terme auf. Bei wie vielen Minuten kosten beide gleich viel?", "loesung": "50 Min.", "hinweis": "A: 5 + 0,1x; B: 0,2x. Gleichsetzen → 5 + 0,1x = 0,2x → 5 = 0,1x → x = 50"}, {"aufgabe": "Streichholz-Dreiecke: Das erste Dreieck braucht 3 Hölzer, jedes weitere 2. Begründe, dass A(d) = 3 + 2·(d − 1) passt, und berechne A(10)", "loesung": "21", "hinweis": "Jedes neue Dreieck teilt eine Seite: nur 2 neue Hölzer. A(10) = 3 + 2 · 9 = 21"}, {"aufgabe": "Fehlersuche: Leon setzt in T(x) = 2x² die Zahl x = −3 ein und erhält −18. Finde seinen Fehler und berechne richtig.", "loesung": "18", "hinweis": "Leon rechnete 2 · (−3²) = −18. Richtig: Klammer ums Minus, 2 · (−3)² = 2 · 9 = 18"}], "wpool": [{"aufgabe": "T(x) = 5x − 2. Berechne T(3).", "loesung": "13"}, {"aufgabe": "Schreibe als Term: „x geteilt durch 4, dann plus 1“", "loesung": "x/4 + 1"}, {"aufgabe": "T(x) = x². Berechne T(−5).", "loesung": "25"}, {"aufgabe": "Schreibe als Term: „Die Summe aus 3x und 5“", "loesung": "3x + 5"}], "titel": "Vom Text zum Term"}, "A3": {"id": "A3", "kerne": [{"name": "Zusammenfassen", "verstehen": ["7x + 3 − 2x + 5: Hier stehen zwei Sorten von Gliedern – welche mit x und reine Zahlen. Nur gleiche Sorten darfst du verrechnen → 7x − 2x = 5x und 3 + 5 = 8. Ergebnis → 5x + 8. Stell dir x als Kiste vor → 7 Kisten minus 2 Kisten sind 5 Kisten – aber Kisten und lose Zahlen kannst du nicht mischen."], "fallen": [{"falle": "Ungleiches verrechnet", "falsch": "3x + 2 = 5x", "richtig": "3x + 2 bleibt 3x + 2", "warum": "x-Glieder und Zahlen sind verschiedene Sorten"}, {"falle": "x verschwindet", "falsch": "4x − x = 4", "richtig": "4x − x = 3x", "warum": "x heißt 1x → 4 Kisten minus 1 Kiste"}], "ueben": [{"stufe": "leicht", "loesung": "11x", "hinweis": "", "aufgabe": "8x + 3x"}, {"stufe": "leicht", "loesung": "5y", "hinweis": "", "aufgabe": "9y − 4y"}, {"stufe": "leicht", "loesung": "5a + 2", "hinweis": "Merk dir: a allein heißt 1a – also 6a − 1a = 5a.", "aufgabe": "6a + 2 − a"}, {"stufe": "leicht", "loesung": "2b + 7", "hinweis": "Vorzeichen wandert mit dem Glied", "aufgabe": "7 − 3b + 5b"}, {"stufe": "leicht", "loesung": "2x", "hinweis": "", "aufgabe": "x + x"}, {"stufe": "mittel", "loesung": "3x + 4y", "hinweis": "zwei Variablensorten getrennt sammeln", "aufgabe": "5x + 3y − 2x + y"}, {"stufe": "mittel", "loesung": "3x² + 2x", "hinweis": "x² und x sind verschiedene Sorten!", "aufgabe": "4x² + 2x − x²"}, {"stufe": "mittel", "loesung": "−a + 7", "hinweis": "Minus vor Minus wird Plus → −(−2a) wird +2a.", "aufgabe": "−3a + 7 − (−2a)"}, {"stufe": "mittel", "loesung": "1,7x", "hinweis": "geht auch mit Kommazahlen", "aufgabe": "0,5x + 1,2x"}]}, {"name": "Klammern rein und raus", "verstehen": ["3 · (2x − 4): Die 3 multipliziert JEDEN Summanden in der Klammer → 3 · 2x − 3 · 4 = 6x − 12. Denk an ein Rechteck mit Breite 3 und Länge 2x − 4: seine Fläche ist beides zugleich. Steht ein Minus vor der Klammer, dreht es alle Vorzeichen → −2 · (3x − 5) = −6x + 10. Rückwärts heißt Ausklammern → 12x + 8 = 4 · (3x + 2) – den gemeinsamen Faktor herausziehen."], "fallen": [{"falle": "Nur den ersten Summanden multipliziert", "falsch": "3(2x − 4) = 6x − 4", "richtig": "6x − 12", "warum": "JEDER Summand wird multipliziert"}, {"falle": "Minus vor der Klammer vergessen", "falsch": "3 − 5(−a + 4) = 3 − 5a + 20", "richtig": "3 + 5a − 20 = 5a − 17", "warum": "−5 · (−a) = +5a und −5 · 4 = −20"}], "ueben": [{"stufe": "leicht", "loesung": "2x + 6", "hinweis": "", "aufgabe": "2 · (x + 3)"}, {"stufe": "leicht", "loesung": "10a − 5", "hinweis": "", "aufgabe": "5 · (2a − 1)"}, {"stufe": "leicht", "loesung": "−3x − 6", "hinweis": "Minusfaktor macht beide negativ", "aufgabe": "−3 · (x + 2)"}, {"stufe": "leicht", "loesung": "2x − 3", "hinweis": "geht auch mit Brüchen", "aufgabe": "½ · (4x − 6)"}, {"stufe": "leicht", "loesung": "3 · (2x + 3)", "hinweis": "gemeinsamer Faktor 3", "aufgabe": "Klammere aus: 6x + 9"}, {"stufe": "mittel", "loesung": "5a − 17", "hinweis": "", "aufgabe": "3 − 5 · (−a + 4)"}, {"stufe": "mittel", "loesung": "10z − 5", "hinweis": "erst die Klammer mal 3, dann zusammenfassen", "aufgabe": "z − (5/3 − 3z) · 3"}, {"stufe": "mittel", "loesung": "8xy − 10x", "hinweis": "Variablen multiplizieren: x · y = xy", "aufgabe": "2x · (4y − 5)"}, {"stufe": "mittel", "loesung": "4a · (3b − 2)", "hinweis": "größten gemeinsamen Faktor ziehen", "aufgabe": "Klammere aus: 12ab − 8a"}]}], "uplus": [{"stufe": "", "loesung": "2xy − 10x − 3y", "hinweis": "Jede Klammer einzeln ausmultiplizieren, dann Gleichartiges zusammenfassen → 8xy − 10x − 6xy − 3y.", "aufgabe": "2x(4y − 5) − 3y(2x + 1)"}, {"stufe": "", "loesung": "7x − 13y", "hinweis": "Erst beide Klammern auflösen (das „: 2“ wirkt auf beide Glieder!) → 5x − 5y + 2x − 8y, dann zusammenfassen.", "aufgabe": "5(x − y) + (4x − 16y) : 2"}, {"stufe": "", "loesung": "−x + 7", "hinweis": "Minus vor der Klammer dreht alle Vorzeichen → −3 + x − 2x + 10, dann zusammenfassen.", "aufgabe": "−(3 − x) + 2(−x + 5)"}, {"stufe": "", "loesung": "b; 3a", "hinweis": "Verteilungsgesetz: a · (b + 3) = a·b + a·3 = ab + 3a – vergleiche Kästchen für Kästchen.", "aufgabe": "Kästchen: a · (▢ + 3) = a·b + ▢"}], "transfer": [{"aufgabe": "Fehlersuche: Mia rechnet 4 · (x − 3) = 4x − 3. Beschreibe ihren Fehler und rechne richtig.", "loesung": "4x − 12", "hinweis": "Mia hat nur x mit 4 multipliziert; die −3 muss auch → 4x − 12 (Aufgabentyp aus realer Stegreifaufgabe 2)"}, {"aufgabe": "Aus einem 4 cm × 6 cm-Rechteck wird ein Quadrat (Seite x) herausgeschnitten. Gib zwei verschiedene Terme für die Restfläche an und zeige, dass sie äquivalent sind.", "loesung": "24 − x²", "hinweis": "Weg 1: 6 · 4 − x · x. Weg 2 (Zerlegung) → 4 · (6 − x) + x · (4 − x) = 24 − 4x + 4x − x² = 24 − x²"}, {"aufgabe": "Zeige durch Umformen, dass (y − 2) · (−0,5) und −0,5y + 1 äquivalent sind.", "loesung": "s. rechts", "hinweis": "(y − 2)(−0,5) = −0,5y + 1 – jeden Summanden multiplizieren; gleiche Termstruktur → äquivalent"}], "wpool": [{"aufgabe": "9x − 5x", "loesung": "4x"}, {"aufgabe": "4 · (a + 2)", "loesung": "4a + 8"}, {"aufgabe": "−2 · (x − 3)", "loesung": "−2x + 6"}, {"aufgabe": "10y + 2 − 4y", "loesung": "6y + 2"}], "titel": "Terme aufräumen"}, "A4": {"id": "A4", "kerne": [{"name": "", "verstehen": ["Eine Gleichung ist eine Waage im Gleichgewicht. Was du auf einer Seite tust, musst du auch auf der anderen tun – sonst kippt sie. Beispiel → 4x − 7 = 13. Erst +7 auf beiden Seiten → 4x = 20. Dann durch 4: x = 5. Den Schritt schreibst du rechts an den Rand: | + 7 und | : 4. Zum Schluss die Probe → 4 · 5 − 7 = 13 ✓ – damit weißt du selbst, dass du richtig liegst."], "fallen": [{"falle": "Nur eine Seite verändert", "falsch": "4x − 7 = 13 → 4x = 13", "richtig": "4x = 20", "warum": "+7 muss auf BEIDEN Seiten passieren"}, {"falle": "Vorzeichen beim Seitenwechsel", "falsch": "5x = 2x + 9 → 3x = 9 ✓, aber: 5x − 3 = 9 → 5x = 6", "richtig": "5x = 12", "warum": "−3 wandert als +3 auf die andere Seite"}], "ueben": [{"stufe": "leicht", "loesung": "x = 7", "hinweis": "Auf beiden Seiten − 5 rechnen – die Gleichung bleibt im Gleichgewicht.", "aufgabe": "x + 5 = 12"}, {"stufe": "leicht", "loesung": "x = 7", "hinweis": "Auf beiden Seiten durch 3 teilen.", "aufgabe": "3x = 21"}, {"stufe": "leicht", "loesung": "x = 3", "hinweis": "Auf beiden Seiten + 4 rechnen.", "aufgabe": "x − 4 = −1"}, {"stufe": "leicht", "loesung": "x = 4", "hinweis": "Zwei Schritte → erst − 1 auf beiden Seiten, dann durch 2 teilen.", "aufgabe": "2x + 1 = 9"}, {"stufe": "leicht", "loesung": "x = 15", "hinweis": "Auf beiden Seiten mal 3 nehmen.", "aufgabe": "x : 3 = 5"}, {"stufe": "mittel", "loesung": "x = 7", "hinweis": "erst Klammer auflösen, dann x auf eine Seite", "aufgabe": "3 · (x − 2) = x + 8"}, {"stufe": "mittel", "loesung": "x = 4", "hinweis": "Bring die x auf eine Seite → − 2x auf beiden Seiten, dann + 3.", "aufgabe": "5x − 3 = 2x + 9"}, {"stufe": "mittel", "loesung": "x = 3", "hinweis": "negativer Koeffizient", "aufgabe": "7 − 2x = 1"}, {"stufe": "mittel", "loesung": "x = 3", "hinweis": "Klammer + Seitenwechsel", "aufgabe": "4 · (x + 1) = 2x + 10"}]}], "uplus": [{"stufe": "", "loesung": "x = ½", "hinweis": "Erst alle Klammern auflösen, dann x auf eine Seite → 15x − 9 − 24 + 24x = 9x − 18 → 39x − 33 = 9x − 18 → 30x = 15.", "aufgabe": "3(5x − 3) − 6(4 − 4x) = 9(x − 2)"}, {"stufe": "", "loesung": "x = 3", "hinweis": "Erst alle Klammern auflösen, dann x auf eine Seite → 12x − 84 − 8 + 12x = 5x − 35 → 24x − 92 = 5x − 35 → 19x = 57.", "aufgabe": "6(2x − 14) − 4(2 − 3x) = 5(x − 7)"}, {"stufe": "", "loesung": "−21", "hinweis": "links → 2 · 8 − 12 = 4; rechts → 25 + c = 4 → c = −21", "aufgabe": "Ergänze rechts, sodass x = 5 Lösung ist: 2(x + 3) − 12 = 5x ▢"}, {"stufe": "", "loesung": "x = 6", "hinweis": "Klammer auflösen (6x − 2 = 5x + 4), dann 5x abziehen und 2 addieren → x = 6.", "aufgabe": "2 · (3x − 1) = 5x + 4"}, {"stufe": "", "loesung": "x = −1", "hinweis": "Beide Klammern auflösen → 4x + 4 = −9x − 9. Dann alle x nach links → 13x = −13.", "aufgabe": "2(2x + 2) = 3(−3x − 3)"}, {"stufe": "", "loesung": "x = 1", "hinweis": "Links und rechts erst vereinfachen → 7x − 4 = −x + 4. Dann x sammeln → 8x = 8.", "aufgabe": "−4(−2x + 1) − x = −(x − 2) − (x − 1) + x + 1"}, {"stufe": "", "loesung": "wahr für alle x (allgemeingültig)", "hinweis": "Nach dem Auflösen sind beide Seiten identisch → 12x − 16 = 12x − 16 → 0 = 0. Eine wahre Aussage ohne x heißt: JEDE Zahl ist Lösung.", "aufgabe": "Beschreibe den Sonderfall: 2(6x − 8) = −4(−3x + 4)"}], "transfer": [{"aufgabe": "Fünf Freunde kaufen Eisbecher. Zwei nehmen Sahne (je 0,70 € Aufpreis), zusammen zahlen sie 27,90 €. Berechne mit x-Ansatz den Preis eines Bechers ohne Sahne.", "loesung": "5,30 €", "hinweis": "Gleichung aufstellen → 5 Becher plus 2 Sahne-Aufpreise = Gesamtpreis. 5x + 2 · 0,70 = 27,90 → 5x = 26,50 → x = 5,30."}, {"aufgabe": "Eine Rechteckseite ist 3 cm länger als die andere. Verlängert man beide um 1 cm, wächst die Fläche um 22 cm². Berechne die ursprünglichen Seiten mit x-Ansatz.", "loesung": "9 cm und 12 cm", "hinweis": "Seiten x und x + 3 ansetzen; neue Fläche = alte Fläche + 22: (x + 1)(x + 4) = x(x + 3) + 22 → 2x = 18 → x = 9."}, {"aufgabe": "Im Dreieck ist β doppelt so groß wie α, und α ist 40° kleiner als γ. Stelle eine Gleichung auf und berechne alle Winkel.", "loesung": "35°, 70°, 75°", "hinweis": "α + 2α + (α + 40°) = 180° → 4α = 140° → α = 35°"}], "wpool": [{"aufgabe": "x + 9 = 4", "loesung": "x = −5"}, {"aufgabe": "5x = −20", "loesung": "x = −4"}, {"aufgabe": "2x − 3 = 7", "loesung": "x = 5"}, {"aufgabe": "x : 2 = −3", "loesung": "x = −6"}], "titel": "Gleichungen lösen – Schritt für Schritt"}, "A5": {"id": "A5", "kerne": [{"name": "", "verstehen": ["Prozent heißt „von Hundert“ → 25 % sind 25 von 100, also ein Viertel. 25 % von 84 € rechnest du als 84 · 0,25 = 21 € – oder über 1 % → 84 : 100 = 0,84 mal 25. Drei Größen spielen mit: der Grundwert G (das Ganze, 84 €), der Prozentsatz p (25 %) und der Prozentwert W (der Anteil, 21 €). Merksatz → W = G · p.", "Preis-Änderungen gehen am schnellsten mit dem Faktor → +15 % heißt · 1,15, −20 % heißt · 0,8. Und rückwärts? Wenn 32 € schon der Preis NACH 20 % Rabatt sind, gilt 0,8 · G = 32 → G = 40 €."], "fallen": [{"falle": "Prozentzahl addiert", "falsch": "40 € + 15 % = 55 €", "richtig": "40 · 1,15 = 46 €", "warum": "15 % VON 40 sind 6 € – Prozent ist ein Anteil, keine Euro-Zahl"}, {"falle": "Rabatt rückwärts falsch", "falsch": "32 € + 20 % = 38,40 €", "richtig": "32 : 0,8 = 40 €", "warum": "Die 20 % beziehen sich auf den ALTEN Preis (Grundwert), nicht auf 32 €"}], "ueben": [{"stufe": "leicht", "loesung": "25 €", "hinweis": "10 % ist ein Zehntel – einfach durch 10 teilen.", "aufgabe": "10 % von 250 €"}, {"stufe": "leicht", "loesung": "43 kg", "hinweis": "50 % ist die Hälfte.", "aufgabe": "50 % von 86 kg"}, {"stufe": "leicht", "loesung": "21 €", "hinweis": "25 % ist ein Viertel – durch 4 teilen.", "aufgabe": "25 % von 84 €"}, {"stufe": "leicht", "loesung": "3 m", "hinweis": "1 % ist ein Hundertstel – durch 100 teilen.", "aufgabe": "1 % von 300 m"}, {"stufe": "leicht", "loesung": "9 €", "hinweis": "Trick → erst 10 % nehmen (4,50 €), dann verdoppeln.", "aufgabe": "20 % von 45 €"}, {"stufe": "mittel", "loesung": "46 €", "hinweis": "Plus 15 % heißt mal 1,15 – ein Schritt statt zwei.", "aufgabe": "Ein Preis von 40 € steigt um 15 %. Wie hoch ist der neue Preis?"}, {"stufe": "mittel", "loesung": "45 €", "hinweis": "Minus 25 % heißt mal 0,75 – es bleiben 75 %.", "aufgabe": "60 € werden um 25 % gesenkt. Wie hoch ist der neue Preis?"}, {"stufe": "mittel", "loesung": "40 €", "hinweis": "Nach 20 % Rabatt sind 32 € genau 80 % → 32 : 0,8 ergibt den alten Preis.", "aufgabe": "Nach 20 % Rabatt kostet eine Jeans 32 €. Was hat sie vorher gekostet?"}, {"stufe": "mittel", "loesung": "20 %", "hinweis": "Anteil bilden → 12 von 60 = 12/60 = 1/5 – das sind 20 %.", "aufgabe": "12 von 60 Schülern fahren Rad. Wie viel Prozent?"}]}], "uplus": [{"stufe": "", "loesung": "400 €", "hinweis": "20 % mehr heißt → 480 € sind 120 % vom Vorjahrespreis. 1,2 · G = 480 → G = 480 : 1,2 = 400.", "aufgabe": "Ein Fernseher kostet 480 € – das sind 20 % mehr als im Vorjahr. Wie hoch war der Vorjahrespreis?"}, {"stufe": "", "loesung": "150 €", "hinweis": "30 % Rabatt heißt → 105 € sind 70 % vom alten Preis. 0,7 · G = 105 → G = 105 : 0,7 = 150.", "aufgabe": "Eine Jacke wurde um 30 % reduziert und kostet jetzt 105 €. Wie hoch war der ursprüngliche Preis?"}, {"stufe": "", "loesung": "96 %", "hinweis": "0,8 · 1,2 = 0,96 – die 20 % beziehen sich auf verschiedene Grundwerte", "aufgabe": "Ein Preis wird erst um 20 % gesenkt, dann um 20 % erhöht. Wie viel Prozent des Ausgangspreises sind das?"}, {"stufe": "", "loesung": "3000 €", "hinweis": "25 % Abzug heißt → 75 % bleiben – 4000 · 0,75.", "aufgabe": "Brutto 4000 € im Monat, 25 % Abzüge. Wie viel bleibt netto?"}, {"stufe": "", "loesung": "2 %", "hinweis": "Anteil bilden → 130 : 6500 = 0,02 – das sind 2 %.", "aufgabe": "Wie viel Prozent sind 130 m von 6500 m?"}, {"stufe": "", "loesung": "120 l", "hinweis": "Grundwert gesucht: Prozentwert geteilt durch Prozentsatz. 2,5 % = 0,025 → 3 : 0,025 = 120.", "aufgabe": "2,5 % sind 3 l. Wie viel ist das Ganze?"}, {"stufe": "", "loesung": "25 %", "hinweis": "Vergleiche mit dem alten Wert → 165 : 132 = 1,25 – also 25 % mehr.", "aufgabe": "Die Wohnfläche eines Hauses wurde durch einen Anbau von 132 m² auf 165 m² vergrößert. Um wie viel Prozent?"}, {"stufe": "", "loesung": "1,09 €", "hinweis": "2,75 € ≙ 84 % des regulären Dreierpreises → 2,75 : 0,84 = 3,27…; : 3 ≈ 1,09", "aufgabe": "Ein Händler wirbt: „3 Packungen nur 2,75 €. Damit sparen Sie 16 %.“ Berechne den Preis einer Einzelpackung."}], "transfer": [{"aufgabe": "Ein Fahrrad kostet netto 250 €. Wie viel kostet es mit 19 % Mehrwertsteuer?", "loesung": "297,50 €", "hinweis": "Plus 19 % heißt mal 1,19: 250 · 1,19 = 297,50."}, {"aufgabe": "Die Zustimmung steigt von 40 % auf 45 %. Ergänze: Das sind ▢ Prozentpunkte mehr und ▢ % Zuwachs.", "loesung": "5; 12,5", "hinweis": "Differenz 5 Punkte; relativer Zuwachs 5/40 = 12,5 % (Lehrplan: „Prozent vs. Prozentpunkte“)"}, {"aufgabe": "Paul: „Erst 10 % Rabatt, dann wieder 10 % drauf – dann kostet es wieder gleich viel!“ Prüfe die Aussage.", "loesung": "falsch: 99 %", "hinweis": "Die Prozente beziehen sich auf verschiedene Grundwerte → 0,9 · 1,1 = 0,99 → der Preis liegt 1 % unter dem Start."}], "wpool": [{"aufgabe": "10 % von 90 €", "loesung": "9 €"}, {"aufgabe": "75 % von 40 kg", "loesung": "30 kg"}, {"aufgabe": "100 € werden um 30 % gesenkt. Wie viel sind es danach?", "loesung": "70 €"}, {"aufgabe": "5 % von 200 m", "loesung": "10 m"}], "titel": "Prozente durchschauen"}, "A6": {"id": "A6", "kerne": [{"name": "", "verstehen": ["Bevor du rechnest, entscheide: Je mehr, desto MEHR (proportional – doppelte Menge, doppelter Preis) oder je mehr, desto WENIGER (antiproportional – doppelt so viele Helfer, halbe Zeit)? Beispiel proportional → 3 kg Äpfel kosten 5,40 €. Über die Einheit → 1 kg kostet 5,40 : 3 = 1,80 €, also 5 kg → 1,80 · 5 = 9 €. Das Dreisatz-Schema schreibt das in drei Zeilen mit Pfeilen (: 3 und · 5).", "Beispiel antiproportional → 6 Bauarbeiter brauchen 10 Tage. Die GESAMTARBEIT bleibt gleich → 6 · 10 = 60 Arbeitstage. 4 Arbeiter brauchen 60 : 4 = 15 Tage. Hier bleibt das Produkt gleich, nicht der Quotient."], "fallen": [{"falle": "Antiproportional proportional gerechnet", "falsch": "6 Arbeiter → 10 Tage, also 4 Arbeiter → 6,7 Tage", "richtig": "15 Tage", "warum": "Weniger Arbeiter brauchen MEHR Zeit – erst die Je-mehr-desto-Frage stellen!"}, {"falle": "Ohne Einheit gesprungen", "falsch": "3 kg → 5,40 €, dann wild multipliziert", "richtig": "über 1 kg gehen", "warum": "Der Zwischenschritt „1 Einheit“ macht jeden Dreisatz sicher"}], "ueben": [{"stufe": "leicht", "loesung": "9 €", "hinweis": "3-mal so viel kaufen heißt 3-mal so viel zahlen → 3 € · 3.", "aufgabe": "2 kg kosten 3 €. Was kosten 6 kg?"}, {"stufe": "leicht", "loesung": "8 €", "hinweis": "Doppelte Menge, doppelter Preis → 4 € · 2.", "aufgabe": "5 Hefte kosten 4 €. Was kosten 10 Hefte?"}, {"stufe": "leicht", "loesung": "3,60 €", "hinweis": "3-mal so viel → 1,20 € · 3.", "aufgabe": "100 g kosten 1,20 €. Was kosten 300 g?"}, {"stufe": "leicht", "loesung": "3 €", "hinweis": "Halbe Menge, halber Preis → 6 € → 2.", "aufgabe": "4 Stifte kosten 6 €. Was kosten 2 Stifte?"}, {"stufe": "leicht", "loesung": "36 km", "hinweis": "3-mal so lange unterwegs, 3-mal so weit → 12 km · 3.", "aufgabe": "In 1 Stunde schaffst du 12 km. Wie weit in 3 Stunden?"}, {"stufe": "mittel", "loesung": "9 €", "hinweis": "Dreisatz über 1 kg → 5,40 : 3 = 1,80 €, dann mal 5.", "aufgabe": "3 kg Äpfel kosten 5,40 €. Was kosten 5 kg?"}, {"stufe": "mittel", "loesung": "15 Tage", "hinweis": "antiproportional → 60 : 4", "aufgabe": "6 Bauarbeiter brauchen 10 Tage. Wie lange brauchen 4?"}, {"stufe": "mittel", "loesung": "16 h", "hinweis": "Gesamtarbeit → 8 · 6 = 48 Maschinenstunden. 3 Maschinen → 48 : 3 = 16 h.", "aufgabe": "8 Maschinen schaffen einen Auftrag in 6 Stunden. Wie lange brauchen 3 Maschinen?"}, {"stufe": "mittel", "loesung": "2,40 €", "hinweis": "Dreisatz über 1 Heft → 5,60 : 7 = 0,80 €, dann mal 3.", "aufgabe": "7 Hefte kosten 5,60 €. Was kosten 3 Hefte?"}, {"stufe": "mittel", "loesung": "c) und d)", "hinweis": "Quotient f(x)/x konstant? c) 3,5 ✓ d) 1,4 ✓; a) fällt (8; 2; 0,67), b) steigt (1; 2; 3)", "aufgabe": "Welche Zuordnung ist proportional? Begründe. a) x: 1, 2, 3 → f(x): 8, 4, 2 b) x: 1, 2, 3 → f(x): 1, 4, 9 c) x: 2, 3, 5 → f(x): 7, 10,5, 17,5 d) x: 2, 3, 4 → f(x): 2,8, 4,2, 5,6"}, {"stufe": "mittel", "loesung": "f(x) = 0,4x", "hinweis": "Steigung = y-Wert : x-Wert = 1,6 : 4 = 0,4 – also f(x) = 0,4x.", "aufgabe": "Eine proportionale Zuordnung enthält den Wert f(4) = 1,6. Gib den Funktionsterm an."}]}], "uplus": [{"stufe": "", "loesung": "6,40 €", "hinweis": "Einheiten! 800 g = 250 g · 3,2 → 2 € · 3,2 (kombiniert Fertigkeit F4)", "aufgabe": "250 g Käse kosten 2 €. Was kosten 0,8 kg?"}, {"stufe": "", "loesung": "6 h", "hinweis": "Gesamtarbeit → 4 · 9 = 36 Rohrstunden. 6 Rohre → 36 : 6 = 6 h.", "aufgabe": "4 Rohre füllen ein Becken in 9 Stunden. Wie lange brauchen 6 Rohre?"}, {"stufe": "", "loesung": "antiproportional", "hinweis": "mehr Personen, weniger Zeit", "aufgabe": "Anzahl der Personen ↔ Zeit, bis eine Pizza aufgegessen ist. Proportional oder antiproportional?", "mc": ["antiproportional", "proportional", "weder noch"], "mcCorrect": 0}, {"stufe": "", "loesung": "525 g", "hinweis": "Dreisatz über 1 Person → 300 : 4 = 75 g, dann mal 7.", "aufgabe": "Ein Rezept für 4 Personen braucht 300 g Mehl. Wie viel für 7 Personen?"}], "transfer": [{"aufgabe": "Prüfe mit Begründung, ob die Tabelle proportional sein kann: x: 1 | 2 | 4 und y: 2 | 4 | 7", "loesung": "nein", "hinweis": "Proportional heißt: y : x überall gleich. 2:1 = 2, 4:2 = 2, aber 7:4 = 1,75 → beim letzten Paar müsste y = 8 sein (Begründungsaufgabe)"}, {"aufgabe": "„Doppelt so viele Maler, halbe Zeit – das gilt immer!“ Nimm Stellung: Wo stimmt das Modell, wo nicht?", "loesung": "SK", "hinweis": "Modell gilt, solange sich die Maler nicht behindern und die Arbeit teilbar ist; bei 100 Malern in einem kleinen Zimmer bricht es zusammen (Modellkritik, Selbstkontrolle per Musterlösung)"}, {"aufgabe": "3 Pumpen leeren einen Teich in 8 Stunden. Wie viele Pumpen braucht man, um ihn in 6 Stunden zu leeren?", "loesung": "4 Pumpen", "hinweis": "24 Pumpenstunden : 6 h = 4 – hier ist die gesuchte Größe die Anzahl"}], "wpool": [{"aufgabe": "2 Kugeln Eis kosten 5 €. Was kosten 4?", "loesung": "10 €"}, {"aufgabe": "10 Arbeiter brauchen 3 Tage. Wie lange brauchen 5?", "loesung": "6 Tage"}, {"aufgabe": "150 g kosten 1,80 €. Was kosten 50 g?", "loesung": "0,60 €"}, {"aufgabe": "2 Personen putzen 6 h. Wie lange brauchen 3 Personen?", "loesung": "4 h"}], "titel": "Der Dreisatz – dein Alltagswerkzeug"}, "A1": {"id": "A1", "kerne": [{"name": "Plus und Minus", "verstehen": ["Schau auf die Zahlengerade: Bei Plus gehst du nach rechts, bei Minus nach links. Beispiel → −7 + 12. Du startest bei −7 und gehst 12 Schritte nach rechts – du landest bei 5. Also → −7 + 12 = 5.", "Der Betrag einer Zahl ist ihr Abstand zur Null: |−3| = 3 und |3| = 3. Beim Rechnen mit Vorzeichen vergleichst du oft die Beträge – z. B. bei −7 + 12 gewinnt die 12, weil ihr Betrag größer ist.", "Die Regel: Haben beide Zahlen das gleiche Vorzeichen, addierst du und behältst das Vorzeichen (−2 + (−7) = −9). Haben sie verschiedene Vorzeichen, rechnest du den Unterschied aus – das Vorzeichen bestimmt die Zahl, die weiter von der Null entfernt ist (−7 + 12 = 5, aber −12 + 7 = −5).", "Und wenn ein Minus vor der Klammer steht? Dann dreht es das Vorzeichen in der Klammer um → 5 − (−3) = 5 + 3 = 8. Merk dir: Minus vor Minus wird Plus."], "fallen": [{"falle": "Vorzeichen der „größeren“ Zahl ignoriert", "falsch": "−7 + 12 = −19", "richtig": "−7 + 12 = 5", "warum": "Verschiedene Vorzeichen: Unterschied 12 − 7 = 5; die 12 ist weiter von Null weg und ist positiv"}, {"falle": "Minusklammer nicht umgedreht", "falsch": "5 − (−3) = 2", "richtig": "5 − (−3) = 8", "warum": "Minus vor der Klammer dreht um → 5 + 3"}], "ueben": [{"stufe": "leicht", "loesung": "5", "hinweis": "Unterschied 9 − 4, Vorzeichen der 9", "aufgabe": "−4 + 9"}, {"stufe": "leicht", "loesung": "−5", "hinweis": "Unterschied 8 − 3, Vorzeichen der −8-Richtung", "aufgabe": "3 − 8"}, {"stufe": "leicht", "loesung": "−11", "hinweis": "Gleiche Richtung (beide minus) → 6 + 5, Vorzeichen −", "aufgabe": "−6 − 5"}, {"stufe": "leicht", "loesung": "−9", "hinweis": "Plusklammer weglassen → −2 − 7", "aufgabe": "−2 + (−7)"}, {"stufe": "leicht", "loesung": "8", "hinweis": "Minus vor Minus wird Plus → 5 + 3", "aufgabe": "5 − (−3)"}, {"stufe": "mittel", "loesung": "0", "hinweis": "Erst Klammer → −12 + 7 + 5", "aufgabe": "−12 + 7 − (−5)"}, {"stufe": "mittel", "loesung": "5", "hinweis": "Minus vor einer negativen Zahl wird Plus → 3,5 − (−1,5) = 3,5 + 1,5 – auch mit Kommazahlen.", "aufgabe": "3,5 − (−1,5)"}, {"stufe": "mittel", "loesung": "−1/2", "hinweis": "Unterschied 3/4 − 1/4 = 2/4, kürzen; Vorzeichen −", "aufgabe": "−3/4 + 1/4"}, {"stufe": "mittel", "loesung": "0", "hinweis": "Von links → −15 + 8 = −7, dann −7 + 7 = 0", "aufgabe": "−15 + 8 + 7"}]}, {"name": "Mal und Geteilt", "verstehen": ["(−3) · 4 heißt: viermal die −3, also −3 − 3 − 3 − 3 = −12. Minus mal Plus gibt Minus – so weit, so logisch. Aber warum gibt Minus mal Minus Plus? Schau dir dieses Muster an → 3 · (−4) = −12, dann 2 · (−4) = −8, dann 1 · (−4) = −4, dann 0 · (−4) = 0. Bei jedem Schritt wird das Ergebnis um 4 größer. Geht das Muster weiter, kommt (−1) · (−4) = +4. Das Muster zwingt das Plus!", "Die Regel: Gleiche Vorzeichen → Ergebnis positiv. Verschiedene Vorzeichen → Ergebnis negativ. Sie gilt genauso fürs Teilen → 18 : (−9) = −2, aber (−36) : (−4) = 9."], "fallen": [{"falle": "Minus mal Minus bleibt Minus", "falsch": "(−3) · (−4) = −12", "richtig": "(−3) · (−4) = 12", "warum": "Gleiche Vorzeichen → positiv (siehe Muster-Reihe)"}, {"falle": "Vorzeichen beim Teilen vergessen", "falsch": "12 : (−3) = 4", "richtig": "12 : (−3) = −4", "warum": "Verschiedene Vorzeichen → negativ"}], "ueben": [{"stufe": "leicht", "loesung": "−15", "hinweis": "Verschiedene Vorzeichen → negativ", "aufgabe": "(−5) · 3"}, {"stufe": "leicht", "loesung": "24", "hinweis": "Gleiche Vorzeichen → positiv", "aufgabe": "(−6) · (−4)"}, {"stufe": "leicht", "loesung": "−2", "hinweis": "Verschiedene Vorzeichen → negativ", "aufgabe": "18 : (−9)"}, {"stufe": "leicht", "loesung": "9", "hinweis": "Gleiche Vorzeichen → positiv", "aufgabe": "(−36) : (−4)"}, {"stufe": "leicht", "loesung": "1", "hinweis": "Gleiche Vorzeichen → positiv", "aufgabe": "(−1) · (−1)"}, {"stufe": "mittel", "loesung": "−6", "hinweis": "Schrittweise → (−2)·(−3) = 6, dann 6·(−1) = −6 (ungerade Anzahl Minus → minus)", "aufgabe": "(−2) · (−3) · (−1)"}, {"stufe": "mittel", "loesung": "8", "hinweis": "Von links → (−24):6 = −4, dann (−4)·(−2) = 8", "aufgabe": "(−24) : 6 · (−2)"}, {"stufe": "mittel", "loesung": "−4", "hinweis": "Auch mit Kommazahlen: verschiedene Vorzeichen → negativ", "aufgabe": "(−0,5) · 8"}, {"stufe": "mittel", "loesung": "9 und −9", "hinweis": "(−3)² = (−3)·(−3) = 9; bei −3² gilt: erst Potenz (3² = 9), dann das Minus davor → −9", "aufgabe": "(−3)² und −3²"}]}], "uplus": [{"stufe": "", "loesung": "0", "hinweis": "Erst Punkt → (−3)·4 = −12; dann −12 + 12 = 0", "aufgabe": "(−3) · 4 − (−12)"}, {"stufe": "", "loesung": "25", "hinweis": "Erst Klammer → 2 − 7 = −5; dann −5 · (−5) = 25", "aufgabe": "−5 · (2 − 7)"}, {"stufe": "", "loesung": "2", "hinweis": "Punkt vor Strich → −4 + 6 = 2", "aufgabe": "24 : (−6) + (−3) · (−2)"}, {"stufe": "", "loesung": "−10", "hinweis": "Klammer → −5; Minus davor → +5; dann 5 · (−2) = −10", "aufgabe": "−(4 − 9) · (−2)"}, {"stufe": "", "loesung": "−8", "hinweis": "Ungerade Anzahl Minuszeichen → Ergebnis negativ → (−2)·(−2)·(−2) = 4·(−2) = −8.", "aufgabe": "(−2)³"}, {"stufe": "", "loesung": "−3/4", "hinweis": "Punkt vor Strich → 2/3 · (−3/8) = −1/4; −1/2 − 1/4", "aufgabe": "−0,5 + 2/3 · (−3/8)"}, {"stufe": "", "loesung": "0,2 (= 1/5)", "hinweis": "Einheitliche Darstellung → −3/10 + 6/10 − 1/10 = 2/10", "aufgabe": "−0,3 + 3/5 − 0,1"}, {"stufe": "", "loesung": "−0,1", "hinweis": "Erst Division → 0,5 · 4/5 = 0,4; dann 0,3 − 0,4", "aufgabe": "0,3 − 0,5 : 5/4"}, {"stufe": "", "loesung": "−47", "hinweis": "Ausmultiplizieren → −40 − 7", "aufgabe": "8 · (−5 − 7/8)"}], "transfer": [{"aufgabe": "Morgens zeigt das Thermometer −8 °C. Bis mittags steigt die Temperatur um 15 °C. Wie warm ist es mittags?", "loesung": "7 °C", "hinweis": "Ansatz → −8 + 15. Unterschied 15 − 8 = 7, die 15 ist positiv und weiter von Null. Mittags sind es 7 °C."}, {"aufgabe": "Auf Linas Konto sind −23,50 € (das Konto ist überzogen). Ihre Oma überweist 40 €. Wie viel ist danach auf dem Konto?", "loesung": "16,50 €", "hinweis": "Ansatz → −23,50 + 40. Unterschied 40 − 23,50 = 16,50, positiv. Danach sind 16,50 € auf dem Konto."}, {"aufgabe": "Eine Drohne fliegt 35 m über dem Meeresspiegel, ein U-Boot fährt 48 m darunter (−48 m). Wie groß ist der Höhenunterschied?", "loesung": "83 m", "hinweis": "Ansatz → 35 − (−48) = 35 + 48 = 83. Der Höhenunterschied beträgt 83 m. (Falle → 35 − 48 = −13 wäre falsch – Abstand heißt Differenz der Höhen, das Minus der Tiefe muss umgedreht werden.)"}], "wpool": [{"aufgabe": "−9 + 4", "loesung": "−5"}, {"aufgabe": "(−7) · (−2)", "loesung": "14"}, {"aufgabe": "6 − 10", "loesung": "−4"}, {"aufgabe": "−20 : 5", "loesung": "−4"}, {"aufgabe": "−3 + (−3)", "loesung": "−6"}], "titel": "Plus, Minus und die Vorzeichen im Griff"}, "B1": {"id": "B1", "titel": "Die binomischen Formeln knacken", "kerne": [{"name": "", "verstehen": ["Rechne (x + 3)². Das heißt (x + 3) · (x + 3). Multipliziere jeden mit jedem: x² + 3x + 3x + 9 = x² + 6x + 9. Genau das sagt die 1. binomische Formel → (a + b)² = a² + 2ab + b². Das mittlere Glied 2ab entsteht, weil das gemischte Produkt zweimal vorkommt.", "Warum das stimmt, zeigt ein Quadrat mit Seitenlänge a + b: Es zerfällt in ein Quadrat a², ein Quadrat b² und zwei Rechtecke a · b. Zusammen: a² + 2ab + b².", "Die anderen beiden → (a − b)² = a² − 2ab + b² (2. Formel, Minus nur beim mittleren Glied) und (a + b)(a − b) = a² − b² (3. Formel – hier heben sich die gemischten Produkte auf). Mit den Formeln rechnest du schneller und sicherer als mit Ausmultiplizieren – und du erkennst sie später beim Faktorisieren wieder."], "fallen": [{"falle": "Mittleres Glied vergessen", "falsch": "(x + 3)² = x² + 9", "richtig": "(x + 3)² = x² + 6x + 9", "warum": "Das gemischte Produkt kommt zweimal vor → 2 · x · 3 = 6x"}, {"falle": "2. und 3. Formel verwechselt", "falsch": "(a − b)² = a² − b²", "richtig": "(a − b)² = a² − 2ab + b²", "warum": "a² − b² gehört zu (a + b)(a − b); beim Quadrat bleibt +b²"}], "ueben": [{"stufe": "leicht", "aufgabe": "(x + 2)²", "loesung": "x² + 4x + 4", "hinweis": "1. Formel (a + b)² = a² + 2ab + b². Mittelglied → 2 · x · 2 = 4x."}, {"stufe": "leicht", "aufgabe": "(x − 5)²", "loesung": "x² − 10x + 25", "hinweis": "2. Formel (a − b)² = a² − 2ab + b². Mittelglied → 2 · x · 5 = 10x, mit Minus."}, {"stufe": "leicht", "aufgabe": "(x + 4)(x − 4)", "loesung": "x² − 16", "hinweis": "3. Formel (a + b)(a − b) = a² − b². Hier: x² − 4² = x² − 16."}, {"stufe": "leicht", "aufgabe": "(a + 7)²", "loesung": "a² + 14a + 49", "hinweis": "1. Formel (a + b)² = a² + 2ab + b². Mittelglied → 2 · a · 7 = 14a."}, {"stufe": "leicht", "aufgabe": "(3 + x)²", "loesung": "9 + 6x + x²", "hinweis": "Auch wenn die Zahl vorn steht: gleiche Formel"}, {"stufe": "mittel", "aufgabe": "(3a + b)²", "loesung": "9a² + 6ab + b²", "hinweis": "1. Formel mit a → 3a → (3a)² = 9a², Mittelglied 2 · 3a · b = 6ab, dazu b²."}, {"stufe": "mittel", "aufgabe": "(4x − y)²", "loesung": "16x² − 8xy + y²", "hinweis": "2. Formel (a − b)² = a² − 2ab + b² mit a → 4x → (4x)² = 16x², Mittelglied 2 · 4x · y = 8xy mit Minus, dazu y²."}, {"stufe": "mittel", "aufgabe": "(2x + 5)(2x − 5)", "loesung": "4x² − 25", "hinweis": "3. Formel (a + b)(a − b) = a² − b² mit a → 2x → (2x)² = 4x², minus 5² = 25."}, {"stufe": "mittel", "aufgabe": "(5a − 2b)²", "loesung": "25a² − 20ab + 4b²", "hinweis": "2. Formel → (5a)² = 25a², Mittelglied 2 · 5a · 2b = 20ab mit Minus, dazu (2b)² = 4b²."}, {"stufe": "mittel", "aufgabe": "Ergänze: x² − ▢x + 16 = (x − 4)²", "loesung": "8", "hinweis": "Rückwärts lesen → 2 · x · 4"}]}], "uplus": [{"stufe": "", "aufgabe": "(2x + y)(2x − y) − 2 · (2x)²", "loesung": "−4x² − y²", "hinweis": "Erst 3. Formel → (2x + y)(2x − y) = 4x² − y². Dann 2 · (2x)² = 8x² abziehen → 4x² − y² − 8x² = −4x² − y²."}, {"stufe": "", "aufgabe": "(2x − 3)² − (x + 2) · (1/2 + x)", "loesung": "3x² − 14,5x + 8", "hinweis": "Links 2. Formel → 4x² − 12x + 9. Rechts ausmultiplizieren: x² + 2,5x + 1. Beim Abziehen dreht das Minus alle Vorzeichen der Klammer."}], "transfer": [{"stufe": "", "aufgabe": "Begründe mit einer Skizze, warum (a + b)² = a² + 2ab + b² gilt.", "loesung": "Flächenmodell", "hinweis": "Quadrat mit Seite a + b zerlegen: ein Quadrat a², ein Quadrat b², zwei Rechtecke a · b. Gesamtfläche a² + 2ab + b²."}, {"stufe": "", "aufgabe": "Rechne geschickt im Kopf: a) 21² b) 19 · 21", "loesung": "441 und 399", "hinweis": "a) (20 + 1)² = 400 + 40 + 1 = 441. b) (20 − 1)(20 + 1) = 400 − 1 = 399."}, {"stufe": "", "aufgabe": "Von einem Rechteck ist eine Seite 3 cm länger als die andere. Verlängert man beide Seiten um 1 cm, wächst der Flächeninhalt um 22 cm². Wie lang sind die ursprünglichen Seiten?", "loesung": "9 cm und 12 cm", "hinweis": "Seiten x und x + 3 ansetzen; neue Fläche = alte Fläche + 22: (x + 1)(x + 4) = x(x + 3) + 22 → 2x = 18 → x = 9. Seiten → 9 cm und 12 cm. Probe → 10 · 13 = 130 = 9 · 12 + 22 ✓"}], "wpool": [{"aufgabe": "(x + 1)²", "loesung": "x² + 2x + 1"}, {"aufgabe": "(x − 2)²", "loesung": "x² − 4x + 4"}, {"aufgabe": "(x + 5)(x − 5)", "loesung": "x² − 25"}, {"aufgabe": "Rechne 31² im Kopf – Trick: 1. binomische Formel mit (30 + 1)².", "loesung": "961"}, {"aufgabe": "Welche Formel steckt in a² − 49?", "loesung": "3. (a + 7)(a − 7)"}]}, "B2": {"id": "B2", "titel": "Potenzen – kurz geschrieben, viel drin", "kerne": [{"name": "", "verstehen": ["2⁵ heißt: fünfmal die 2 multiplizieren → 2 · 2 · 2 · 2 · 2 = 32. Die kleine Zahl (Exponent) zählt die Faktoren. Deshalb gilt → 2³ · 2⁴ = (2 · 2 · 2) · (2 · 2 · 2 · 2) = 2⁷ – bei gleicher Basis addierst du die Exponenten.", "Steht ein Produkt in der Klammer, wird jeder Faktor potenziert → (2x)³ = 2³ · x³ = 8x³. Und Vorsicht bei Minus → (−3)² = 9, aber −3² = −(3²) = −9. Ohne Klammer gehört das Minus nicht zur Basis – Potenz kommt vor dem Vorzeichen dran (Hoch vor Punkt vor Strich).", "Gerade Anzahl von Minusfaktoren gibt Plus, ungerade gibt Minus → (−2)³ = −8, (−2)⁴ = 16."], "fallen": [{"falle": "Exponenten multipliziert statt addiert", "falsch": "2³ · 2⁴ = 2¹²", "richtig": "2³ · 2⁴ = 2⁷", "warum": "Faktoren zählen → 3 + 4 = 7 Zweien"}, {"falle": "Klammer beim Quadrieren ignoriert", "falsch": "(−5x)² = −25x²", "richtig": "(−5x)² = 25x²", "warum": "(−5x) · (−5x): Minus mal Minus gibt Plus"}], "ueben": [{"stufe": "leicht", "aufgabe": "2³ · 2²", "loesung": "2⁵ = 32", "hinweis": "Exponenten addieren"}, {"stufe": "leicht", "aufgabe": "x³ · x⁴", "loesung": "x⁷", "hinweis": "Gleiche Basis"}, {"stufe": "leicht", "aufgabe": "(−2)³", "loesung": "−8", "hinweis": "Ungerade Anzahl Minus"}, {"stufe": "leicht", "aufgabe": "(−3)² und −3²", "loesung": "9 und −9", "hinweis": "Klammer entscheidet"}, {"stufe": "leicht", "aufgabe": "(3x)²", "loesung": "9x²", "hinweis": "Jeder Faktor wird quadriert"}, {"stufe": "mittel", "aufgabe": "(2x)³", "loesung": "8x³", "hinweis": "Potenz einer Klammer: jeder Faktor wird potenziert – (2x)³ = 2³ · x³ = 8x³."}, {"stufe": "mittel", "aufgabe": "a² · a³ · a", "loesung": "a⁶", "hinweis": "Gleiche Basis mal: Hochzahlen addieren. a² · a³ · a¹ = a²⁺³⁺¹ = a⁶."}, {"stufe": "mittel", "aufgabe": "0,3y³ · (−1 1/6 · y⁵)", "loesung": "−0,35y⁸", "hinweis": "Zahlen mal Zahlen, Potenzen mal Potenzen → 0,3 · (−7/6) = −0,35; y³ · y⁵ = y⁸ (Hochzahlen addieren)."}, {"stufe": "mittel", "aufgabe": "(7/3)s²t⁵ · (3s²t)²", "loesung": "21s⁶t⁷", "hinweis": "Erst (3s²t)² = 9s⁴t²; 7/3 · 9 = 21"}, {"stufe": "mittel", "aufgabe": "(2x)³ − (−11x³ + 5x)", "loesung": "19x³ − 5x", "hinweis": "Erst (2x)³ = 8x³; das Minus vor der Klammer dreht die Vorzeichen → 8x³ + 11x³ − 5x."}]}], "uplus": [{"stufe": "", "aufgabe": "2⁵ · 2³ als Zahl", "loesung": "256", "hinweis": "Gleiche Basis mal: Hochzahlen addieren. 2⁵ · 2³ = 2⁸ = 256."}, {"stufe": "", "aufgabe": "Was ist größer: 2¹⁰ oder 10³?", "loesung": "2¹⁰", "hinweis": "Beide ausrechnen und vergleichen → 2¹⁰ = 1024 und 10³ = 1000 → 2¹⁰ ist größer."}, {"stufe": "", "aufgabe": "(10²)³ als Zehnerpotenz", "loesung": "10⁶", "hinweis": "Quadrat hoch drei → 10² · 10² · 10² – Exponenten addieren"}], "transfer": [{"stufe": "", "aufgabe": "Ein Blatt Papier ist 0,1 mm dick. Du faltest es 10-mal (jedes Falten verdoppelt die Dicke). Wie dick ist der Stapel?", "loesung": "102,4 mm (ca. 10 cm)", "hinweis": "Dicke = 0,1 mm · 2¹⁰ = 0,1 · 1024 = 102,4 mm ≈ 10 cm. Antwort: gut 10 cm – Potenzen wachsen schneller, als man denkt."}, {"stufe": "", "aufgabe": "Veranschauliche T(a) = 3a² geometrisch.", "loesung": "Skizze", "hinweis": "Drei Quadrate mit Seitenlänge a (je Fläche a²) – oder ein Rechteck mit den Seiten a und 3a."}], "wpool": [{"aufgabe": "2⁴", "loesung": "16"}, {"aufgabe": "x² · x³", "loesung": "x⁵"}, {"aufgabe": "(−1)⁷", "loesung": "−1"}, {"aufgabe": "(3x)²", "loesung": "9x²"}, {"aufgabe": "−2²", "loesung": "−4"}]}, "B3": {"id": "B3", "titel": "Winkel-Detektiv", "kerne": [{"name": "", "verstehen": ["An einer Geradenkreuzung gilt: Gegenüberliegende Winkel (Scheitelwinkel) sind gleich groß, nebeneinanderliegende (Nebenwinkel) ergänzen sich zu 180°. Beispiel aus dem Buch: Ist ein Winkel 45°, dann ist sein Scheitelwinkel 45° und jeder Nebenwinkel 180° − 45° = 135°.", "Schneidet eine Gerade zwei PARALLELE Geraden, sind Stufenwinkel gleich groß und Wechselwinkel gleich groß. Wichtig: Das gilt nur bei Parallelen – prüfe das immer zuerst!", "In jedem Dreieck beträgt die Winkelsumme 180°. Warum? Zeichne durch eine Ecke die Parallele zur Gegenseite: Nach dem Wechselwinkelsatz erscheinen dort alle drei Innenwinkel nebeneinander – zusammen eine halbe Drehung, also 180°. Im Viereck sind es 360° (zwei Dreiecke), im n-Eck (n − 2) · 180°."], "fallen": [{"falle": "Nebenwinkel zu 90° ergänzt", "falsch": "Nebenwinkel von 120° = −30°/„geht nicht“", "richtig": "180° − 120° = 60°", "warum": "Nebenwinkel ergänzen sich zu 180°, nicht zu 90°"}, {"falle": "Stufenwinkel ohne Parallelen benutzt", "falsch": "„Stufenwinkel, also gleich“ bei beliebigen Geraden", "richtig": "Erst Parallelität prüfen/begründen", "warum": "Stufen-/Wechselwinkelsatz gilt nur bei g ∥ h"}], "ueben": [{"stufe": "leicht", "aufgabe": "Zwei Geraden schneiden sich, ein Winkel misst 45°. Wie groß sind sein Scheitelwinkel und sein Nebenwinkel?", "loesung": "45° und 135°", "hinweis": "Scheitelwinkel liegen sich gegenüber und sind gleich groß (45°). Nebenwinkel ergänzen sich zu 180° → 180° − 45° = 135°."}, {"stufe": "leicht", "aufgabe": "In einem Dreieck sind α = 46° und γ = 67°. Wie groß ist der Winkel β?", "loesung": "67°", "hinweis": "Winkelsumme im Dreieck: Alle drei Winkel zusammen ergeben 180°. β = 180° − 46° − 67°."}, {"stufe": "leicht", "aufgabe": "Ein rechtwinkliges Dreieck hat einen spitzen Winkel von 35°. Wie groß ist der andere spitze Winkel?", "loesung": "55°", "hinweis": "Winkelsumme 180°, der rechte Winkel hat 90° → 90° + 35° + x = 180° → x = 55°."}, {"stufe": "leicht", "aufgabe": "Ein Viereck hat die Winkel 80°, 70° und 110°. Wie groß ist der vierte Winkel?", "loesung": "100°", "hinweis": "Winkelsumme im Viereck → 360°. Der vierte Winkel → 360° − 80° − 70° − 110° = 100°."}, {"stufe": "leicht", "aufgabe": "Die Geraden g und h sind parallel und werden geschnitten. Wie groß ist der Stufenwinkel zum 72°-Winkel?", "loesung": "72°", "hinweis": "Stufenwinkelsatz: An geschnittenen Parallelen sind Stufenwinkel gleich groß – also ebenfalls 72°."}, {"stufe": "mittel", "aufgabe": "In einem gleichschenkligen Dreieck ist α = 54°, die beiden anderen Winkel sind gleich groß (β = γ). Wie groß ist β?", "loesung": "63°", "hinweis": "Winkelsumme 180°: Für β und γ bleiben 180° − 54° = 126°. Da beide gleich groß sind → 126° → 2 = 63°."}, {"stufe": "mittel", "aufgabe": "In einem Dreieck ist α doppelt so groß wie β (α = 2β) und γ ist 1,5-mal so groß wie β (γ = 1,5β). Wie groß sind die drei Winkel?", "loesung": "β = 40°, α = 80°, γ = 60°", "hinweis": "Alle Winkel durch β ausdrücken und in die Winkelsumme (180°) einsetzen → 2β + β + 1,5β = 4,5β = 180° → β = 40°. Dann α = 2 · 40° und γ = 1,5 · 40°."}, {"stufe": "mittel", "aufgabe": "Wie groß ist ein Innenwinkel in einem regelmäßigen 8-Eck (Form des Stoppschilds)?", "loesung": "135°", "hinweis": "Innenwinkelsumme im n-Eck → (n − 2) · 180°. Beim 8-Eck → 6 · 180° = 1080°. Regelmäßig heißt alle gleich → 1080° → 8 = 135°."}, {"stufe": "mittel", "aufgabe": "In einem Dreieck ist β doppelt so groß wie α, und α ist um 40° kleiner als γ. Wie groß sind die drei Winkel?", "loesung": "α = 35°, β = 70°, γ = 75°", "hinweis": "Alle Winkel durch α ausdrücken und in die Winkelsumme einsetzen: α + 2α + (α + 40°) = 180° → 4α = 140° → α = 35°."}, {"stufe": "mittel", "aufgabe": "In einem Dreieck sind α = 50° und β = 60°. Wie groß ist der Außenwinkel bei C?", "loesung": "110°", "hinweis": "Außenwinkel = Summe der nicht anliegenden Innenwinkel"}]}], "uplus": [{"stufe": "", "aufgabe": "An einer Doppelkreuzung sind 88°, 57° und 45° auf einer Geradenseite markiert. Kann das stimmen?", "loesung": "Nein", "hinweis": "88° + 57° + 45° = 190° ≠ 180° – die drei Winkel auf einer Geradenseite müssen 180° ergeben"}, {"stufe": "", "aufgabe": "Ein Viereck hat die Winkel 80°, 70° und zwei gleich große Winkel α. Wie groß ist α?", "loesung": "105°", "hinweis": "Winkelsumme im Viereck → 360°. Für die beiden α bleiben 360° − 80° − 70° = 210° → α = 105°."}], "transfer": [{"stufe": "", "aufgabe": "Zwei Parallelen werden von einer Geraden geschnitten. Einer der acht Winkel misst 118°. Gib alle acht Winkel an und begründe mit den Winkelsätzen.", "loesung": "4 × 118° und 4 × 62°", "hinweis": "Nebenwinkel → 180° − 118° = 62°. Scheitelwinkel verdoppeln beide Werte an der ersten Kreuzung; Stufenwinkelsatz überträgt sie auf die zweite. Jeder Schritt mit Satzname."}, {"stufe": "", "aufgabe": "Dreieck: β ist doppelt so groß wie α, γ ist um 30° größer als α. Stelle eine Gleichung auf und berechne alle Winkel.", "loesung": "α = 37,5°, β = 75°, γ = 67,5°", "hinweis": "α + 2α + (α + 30°) = 180° → 4α = 150° → α = 37,5°. Probe → 37,5° + 75° + 67,5° = 180° ✓"}], "wpool": [{"aufgabe": "Wie groß ist der Scheitelwinkel zu 71°?", "loesung": "71°"}, {"aufgabe": "Wie groß ist der Nebenwinkel zu 120°?", "loesung": "60°"}, {"aufgabe": "Ein Dreieck hat die Winkel 90° und 35°. Wie groß ist der dritte Winkel?", "loesung": "55°"}, {"aufgabe": "Wie groß ist die Winkelsumme im Viereck?", "loesung": "360°"}, {"aufgabe": "Wie groß ist die Winkelsumme im Sechseck?", "loesung": "720°"}]}, "B4": {"id": "B4", "titel": "Daten auf einen Blick", "kerne": [{"name": "", "verstehen": ["Der Median ist der mittlere Wert der GEORDNETEN Liste – ordne also immer zuerst! Bei gerader Anzahl nimmst du den Mittelwert der beiden mittleren Werte. Die Spannweite ist der Abstand zwischen kleinstem und größtem Wert.", "Ein Boxplot zeigt fünf Kennwerte auf einen Blick: Minimum, unteres Quartil, Median, oberes Quartil, Maximum. Die Box umfasst die mittlere Hälfte aller Daten – vom unteren Quartil (ein Viertel der Daten liegt darunter oder ist gleich groß) bis zum oberen Quartil. Die Striche links und rechts („Antennen“ oder Whisker) reichen bis Minimum und Maximum. Der Strich in der Box ist der Median.", "Wichtig (steht so auch im Buch): Der Durchschnitt wird im Boxplot NICHT dargestellt. Eine kurze Box heißt: Die mittlere Hälfte der Daten liegt eng beieinander."], "fallen": [{"falle": "Median aus ungeordneter Liste", "falsch": "Median von 12, 3, 15, 8, 7 ist 15", "richtig": "Ordnen: 3, 7, 8, 12, 15 → Median 8", "warum": "Erst ordnen, dann Mitte"}, {"falle": "Boxplot-Strich als Durchschnitt gelesen", "falsch": "„Der Strich in der Box ist der Mittelwert“", "richtig": "Der Strich ist der Median", "warum": "Der Durchschnitt wird im Boxplot nicht veranschaulicht"}], "ueben": [{"stufe": "leicht", "aufgabe": "Bestimme den Median von 12, 3, 15, 8, 7.", "loesung": "8", "hinweis": "Median: erst der Größe nach ordnen (3, 7, 8, 12, 15) – der Wert genau in der Mitte ist der Median."}, {"stufe": "leicht", "aufgabe": "Bestimme die Spannweite von 3, 9, 4, 12, 7.", "loesung": "9", "hinweis": "Spannweite = größter Wert minus kleinster Wert → 12 − 3 = 9."}, {"stufe": "leicht", "aufgabe": "Median von 4, 7, 9, 12", "loesung": "8", "hinweis": "Gerade Anzahl → (7 + 9) : 2"}, {"stufe": "leicht", "aufgabe": "Welcher Anteil der Daten liegt in der Box eines Boxplots?", "loesung": "50 % (die mittlere Hälfte)", "hinweis": ""}, {"stufe": "mittel", "aufgabe": "Datenreihe 5, 6, 2, 3, 6, 6, 1, 7, 2, 3, 3, 4, 10, 4: Median, Quartile, Spannweite (für einen Boxplot)", "loesung": "Median 4; Q1 = 3; Q3 = 6; Spannweite 9", "hinweis": "Ordnen (14 Werte) → 1, 2, 2, 3, 3, 3, 4, 4, 5, 6, 6, 6, 7, 10. Median = (4 + 4) : 2 = 4. Quartile: in beiden Konventionen 3 und 6. Spannweite 10 − 1 = 9."}, {"stufe": "mittel", "aufgabe": "Noten-Beispiel des Buches (26 Werte): Median 3, unteres Quartil 2, oberes Quartil 3,5 – erkläre, was das untere Quartil hier bedeutet.", "loesung": "Ein Viertel der Arbeiten hat Note 2 oder besser", "hinweis": ""}, {"stufe": "mittel", "aufgabe": "Boxplot ablesen: Spannweite, Median, Quartile", "loesung": "Noten 1 bis 5,5; Median 2,5; Quartile 2 und 3,5", "hinweis": ""}]}], "uplus": [{"stufe": "", "aufgabe": "Zwei Klassen schreiben dieselbe Arbeit. Boxplot A hat eine kurze Box, Boxplot B eine lange (gleicher Median). Welche Klasse ist im Mittelfeld homogener?", "loesung": "Klasse A", "hinweis": "Kurze Box = mittlere Hälfte eng beieinander"}], "transfer": [{"stufe": "", "aufgabe": "Deine Klasse sammelt die Anzahl der Geschwister: 0, 1, 1, 0, 2, 3, 1, 0, 1, 2, 1, 4. Bestimme alle fünf Kennwerte und zeichne den Boxplot. Beschreibe die Verteilung in zwei Sätzen.", "loesung": "Min 0, Q1 0,5, Median 1, Q3 2, Max 4", "hinweis": "Ordnen (12 Werte) → 0, 0, 0, 1, 1, 1, 1, 1, 2, 2, 3, 4. Median = (1 + 1) : 2 = 1. Untere Hälfte 0, 0, 0, 1, 1, 1 → Q1 = 0,5; obere Hälfte 1, 1, 2, 2, 3, 4 → Q3 = 2. Spannweite 4. Interpretation: Die Hälfte hat höchstens 1 Geschwister; Ausreißer nach oben (4)."}], "wpool": [{"aufgabe": "Bestimme den Median von 1, 3, 5.", "loesung": "3"}, {"aufgabe": "Bestimme die Spannweite von Daten, die von 2 bis 11 reichen.", "loesung": "9"}, {"aufgabe": "Welcher Anteil der Daten liegt in der Box eines Boxplots?", "loesung": "50 %"}, {"aufgabe": "Bestimme den Median von 2, 4, 6, 8.", "loesung": "5"}, {"aufgabe": "Was zeigt der Strich in der Box eines Boxplots an?", "loesung": "Median"}]}, "B5": {"id": "B5", "titel": "Zinsen verstehen", "kerne": [{"name": "", "verstehen": ["Zinsrechnung ist Prozentrechnung mit neuen Namen – so steht es im Buch: Zinssatz p % entspricht dem Prozentsatz, das Kapital K dem Grundwert und die (Jahres-)Zinsen Z dem Prozentwert. Das Kapital ist das Geld, das du der Bank überlässt; die Zinsen sind das Geld, das du dafür bekommst.", "Die drei Grundaufgaben löst du mit einer Formel: Zinsen Z = K · p/100 (Beispiel → 400 € zu 2 % → 8 €). Zinssatz p = Z/K · 100 (Beispiel → 6,25 € Zinsen auf 250 € → 2,5 %). Kapital K = Z/p · 100 (Beispiel → 240 € Zinsen bei 4 % → 6000 €).", "Liegt das Geld kürzer als ein Jahr an, zählst du den Zeitanteil dazu: Ein halbes Jahr bringt die halben Jahreszinsen, ein Vierteljahr ein Viertel."], "fallen": [{"falle": "Z und K beim Zinssatz vertauscht", "falsch": "p = K/Z · 100", "richtig": "p = Z/K · 100", "warum": "Der Zinssatz misst die Zinsen im Verhältnis zum Kapital"}, {"falle": "Zeitanteil vergessen", "falsch": "500 € zu 4 % für ½ Jahr → 20 €", "richtig": "20 € · ½ = 10 €", "warum": "Jahreszins gilt für ein GANZES Jahr"}], "ueben": [{"stufe": "leicht", "aufgabe": "400 € liegen ein Jahr zu 2 % Zinssatz an. Wie viel Zinsen gibt es?", "loesung": "8 €", "hinweis": "Zinsformel → Z = K · p/100. Hier → 400 · 2/100 = 8 €."}, {"stufe": "leicht", "aufgabe": "250 € bringen in einem Jahr 6,25 € Zinsen. Wie hoch ist der Zinssatz?", "loesung": "2,5 %", "hinweis": "Zinssatz gesucht → p = Z : K · 100. Hier → 6,25 : 250 · 100 = 2,5 %."}, {"stufe": "leicht", "aufgabe": "Für ein Darlehen zahlt man bei 4 % Zinssatz 240 € Zinsen im Jahr. Wie hoch ist das Darlehen?", "loesung": "6000 €", "hinweis": "Kapital gesucht → K = Z : p · 100. Hier → 240 : 4 · 100 = 6000 €."}, {"stufe": "leicht", "aufgabe": "280 € liegen ein Jahr zu 0,75 % Zinssatz an. Wie viel Zinsen gibt es?", "loesung": "2,10 €", "hinweis": "Zinsformel → Z = K · p/100. Hier → 280 · 0,75/100 = 2,10 €."}, {"stufe": "leicht", "aufgabe": "5000 € liegen ein Jahr zu 3,75 % Zinssatz an. Wie viel Zinsen gibt es?", "loesung": "187,50 €", "hinweis": "Zinsformel → Z = K · p/100. Hier → 5000 · 3,75/100 = 187,50 €."}, {"stufe": "mittel", "aufgabe": "Kapital K = 1500 €, Zinssatz p = 2 %. Berechne die Jahreszinsen Z.", "loesung": "30 €", "hinweis": "Zinsformel → Z = K · p/100. Hier → 1500 · 2/100 = 30 €."}, {"stufe": "mittel", "aufgabe": "Zinsen Z = 41,25 €, Zinssatz p = 2 3/4 %. Berechne das Kapital K.", "loesung": "1500 €", "hinweis": "Kapital gesucht → K = Z : p · 100. Mit p = 2 3/4 % = 2,75 % → K = 41,25 : 2,75 · 100 = 1500 €."}, {"stufe": "mittel", "aufgabe": "Kapital K = 1100 €, Jahreszinsen Z = 44 €. Berechne den Zinssatz p.", "loesung": "4 %", "hinweis": "Zinssatz gesucht → p = Z : K · 100. Hier → 44 : 1100 · 100 = 4 %."}, {"stufe": "mittel", "aufgabe": "Kapital K = 4000 €, Jahreszinsen Z = 240 €. Berechne den Zinssatz p.", "loesung": "6 %", "hinweis": "Zinssatz gesucht → p = Z : K · 100. Hier → 240 : 4000 · 100 = 6 %."}, {"stufe": "mittel", "aufgabe": "Zinsen Z = 30 €, Zinssatz p = 12 %. Berechne das Kapital K.", "loesung": "250 €", "hinweis": "Kapital gesucht → K = Z : p · 100. Hier → 30 : 12 · 100 = 250 €."}, {"stufe": "mittel", "aufgabe": "Kapital K = 873,40 €, Zinssatz p = 5 %. Berechne die Jahreszinsen Z.", "loesung": "43,67 €", "hinweis": "Zinsformel → Z = K · p/100. Hier → 873,40 · 5/100 = 43,67 €."}]}], "uplus": [{"stufe": "", "aufgabe": "500 € liegen ein halbes Jahr zu 4 % Zinssatz an. Wie viel Zinsen gibt es?", "loesung": "10 €", "hinweis": "Erst die Jahreszinsen → 500 · 4/100 = 20 €. Ein halbes Jahr bringt die Hälfte → 10 €."}, {"stufe": "", "aufgabe": "1200 € liegen 3 Monate zu 4 % Zinssatz an. Wie viel Zinsen gibt es?", "loesung": "12 €", "hinweis": "Erst die Jahreszinsen → 1200 · 4/100 = 48 €. 3 Monate sind ein Vierteljahr → 48 : 4 = 12 €."}], "transfer": [{"stufe": "", "aufgabe": "Katharina und Mario haben je 600 €, Anlage für 2 Jahre. Katharina: 2 % pro Jahr. Mario: erst 1 %, dann 3 %. Wer bekommt mehr? Begründe durch Rechnung.", "loesung": "Katharina (24,24 € zu 24,18 €)", "hinweis": "Katharina → 600 · 1,02 = 612; 612 · 1,02 = 624,24 → 24,24 € Zinsen. Mario → 600 · 1,01 = 606; 606 · 1,03 = 624,18 → 24,18 €. Der Unterschied entsteht, weil Katharinas Zinsen im 2. Jahr mitverzinst werden."}, {"stufe": "", "aufgabe": "Familie Berg kann höchstens 180 € Zinsen pro Jahr zahlen. Die Bank verlangt 3 %. Wie hoch darf das Darlehen höchstens sein?", "loesung": "6000 €", "hinweis": "K = Z/p · 100 = 180/3 · 100 = 6000. Antwort: höchstens 6000 €."}], "wpool": [{"aufgabe": "100 € liegen ein Jahr zu 5 % an. Wie viel Zinsen gibt es?", "loesung": "5 €"}, {"aufgabe": "200 € liegen ein Jahr zu 3 % an. Wie viel Zinsen gibt es?", "loesung": "6 €"}, {"aufgabe": "200 € bringen in einem Jahr 4 € Zinsen. Wie hoch ist der Zinssatz?", "loesung": "2 %"}, {"aufgabe": "Ein Kapital bringt bei 2 % Zinssatz 10 € Zinsen im Jahr. Wie hoch ist das Kapital?", "loesung": "500 €"}, {"aufgabe": "1000 € liegen ein halbes Jahr zu 6 % an. Wie viel Zinsen gibt es?", "loesung": "30 €"}]}, "C1": {"id": "C1", "titel": "Dreiecke konstruieren wie ein Profi", "kerne": [{"name": "", "verstehen": ["Zwei Figuren sind kongruent, wenn sie deckungsgleich sind – gleiche Form UND gleiche Größe. Bei Dreiecken musst du nicht alle sechs Stücke vergleichen. Drei passende reichen, das sagen die Kongruenzsätze: sss (drei Seiten), sws (zwei Seiten und der EINGESCHLOSSENE Winkel), wsw (eine Seite und die beiden anliegenden Winkel) und Ssw (zwei Seiten und der Gegenwinkel der größeren Seite).", "Beispiel aus dem Buch → c = 5 cm, α = 80°, β = 55° und c′ = 5 cm, α′ = 80°, γ′ = 45°. Sieht verschieden aus? Rechne β′ = 180° − 80° − 45° = 55° – schon passt wsw, die Dreiecke sind kongruent.", "Vor jeder Konstruktion prüfst du, ob das Dreieck überhaupt existiert: Die Winkelsumme darf 180° nicht sprengen, und je zwei Seiten müssen zusammen länger sein als die dritte (Dreiecksungleichung). Dann: Planfigur skizzieren, gegebene Stücke farbig markieren, konstruieren, Vorgehen beschreiben."], "fallen": [{"falle": "Winkelsumme nicht geprüft", "falsch": "a = 4 cm, β = 95°, γ = 90° „konstruieren“", "richtig": "Geht nicht: 95° + 90° = 185° > 180°", "warum": "Erst Existenz prüfen"}, {"falle": "sws ohne eingeschlossenen Winkel", "falsch": "Zwei Seiten + irgendein Winkel = eindeutig", "richtig": "Der Winkel muss ZWISCHEN den Seiten liegen", "warum": "Sonst gilt nur Ssw – und nur mit Gegenwinkel der größeren Seite"}], "ueben": [{"stufe": "leicht", "aufgabe": "Von einem Dreieck kennst du zwei Seiten und den Winkel dazwischen. Lässt es sich eindeutig zeichnen?", "loesung": "Ja, immer (sws)", "hinweis": "", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 0}, {"stufe": "leicht", "aufgabe": "Zwei Dreiecke haben die Seiten a = 4, b = 6, c = 7 und a′ = 6, b′ = 7, c′ = 4 (je cm). Sind sie kongruent?", "loesung": "Ja (sss – gleiche drei Seiten, nur umbenannt)", "hinweis": "", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 0}, {"stufe": "leicht", "aufgabe": "Kann ein Dreieck die Seiten 2 cm, 3 cm und 6 cm haben?", "loesung": "Nein (2 + 3 < 6)", "hinweis": "Dreiecksungleichung", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 1}, {"stufe": "leicht", "aufgabe": "Zwei Dreiecke: c = 5 cm, α = 80°, β = 55° und c′ = 5 cm, α′ = 80°, γ′ = 45°. Sind sie kongruent?", "loesung": "Ja (β′ = 55° → wsw)", "hinweis": "", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 0}, {"stufe": "mittel", "aufgabe": "Ein Dreieck soll a = 4 cm, β = 95° und γ = 90° haben. Lässt es sich konstruieren?", "loesung": "Nein (Winkelsumme > 180°)", "hinweis": "", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 1}, {"stufe": "mittel", "aufgabe": "Konstruiere ein Dreieck aus a = 9 cm, c = 6,5 cm, γ = 40°. Planfigur + Beschreibung.", "loesung": "Musterlösung: γ liegt bei C zwischen a und b: CB = 9 cm zeichnen, in C den 40°-Winkel antragen, Kreis um B mit r = 6,5 cm schneidet den freien Schenkel (zwei Schnittpunkte möglich → Ssw-Fall diskutieren)", "hinweis": "", "format": "SK"}, {"stufe": "mittel", "aufgabe": "Konstruiere ein Dreieck aus a = 5 cm, b = 4,5 cm, h_c = 2,5 cm. Beschreibe dein Vorgehen.", "loesung": "Musterlösung: Parallele im Abstand 2,5 cm zu c nutzen; C liegt auf ihr; Kreise um C mit b und a schneiden c", "hinweis": "", "format": "SK"}, {"stufe": "mittel", "aufgabe": "Sind die Dreiecke kongruent? c = 4,5 cm, α = 77°, β = 38° und c′ = 4,5 cm, α′ = 77°, γ′ = 55°", "loesung": "Nein (β′ = 180° − 77° − 55° = 48° ≠ 38°)", "hinweis": "", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 1}]}], "uplus": [{"stufe": "", "aufgabe": "Richtig oder falsch? „Zwei Dreiecke sind kongruent, wenn sie in drei Seiten übereinstimmen.“", "loesung": "Richtig (sss)", "hinweis": "", "format": "MC", "mc": ["Richtig", "Falsch"], "mcCorrect": 0}, {"stufe": "", "aufgabe": "Richtig oder falsch? „Zwei Dreiecke sind kongruent, wenn sie in der Länge einer Seite und im Flächeninhalt übereinstimmen.“", "loesung": "Falsch", "hinweis": "Gegenbeispiel: gleiche Grundseite, gleiche Höhe, aber verschiedene Form", "format": "MC", "mc": ["Richtig", "Falsch"], "mcCorrect": 1}], "transfer": [{"stufe": "", "aufgabe": "Die Höhe eines Kirchturms soll bestimmt werden: Von den Endpunkten der 80 m langen, auf den Turm zulaufenden Standlinie AB misst man die Winkel α = 25° und β = 62°. Bestimme die Höhe durch eine maßstäbliche Dreieckskonstruktion.", "loesung": "≈ 50 m (Zeichengenauigkeit ± 3 m)", "hinweis": "Maßstab wählen (z. B. 1 cm ≙ 10 m): AB = 8 cm; in A den Winkel 25°, in B den Nebenwinkel von 62° antragen → Spitze C; Höhe von C auf die Gerade AB messen und zurückrechnen.", "format": "SK"}, {"stufe": "", "aufgabe": "Konstruiere ein Dreieck mit den angegebenen Größen: b = 5 cm, γ = 115°, s_b = 4 cm (Seitenhalbierende). Beschreibe dein Vorgehen.", "loesung": "Musterlösung in der App", "hinweis": "Planfigur: s_b verbindet B mit der Mitte von b. Konstruktionsweg über Teildreieck.", "format": "SK"}], "wpool": [{"aufgabe": "Nenne die vier Kongruenzsätze (Kurzzeichen).", "loesung": "sss, sws, wsw, Ssw"}, {"aufgabe": "Kann ein Dreieck die Seiten 5, 5 und 9 haben?", "loesung": "Ja (5 + 5 > 9)"}, {"aufgabe": "Kann ein Dreieck zwei Winkel mit 100° und 90° haben?", "loesung": "Nein"}, {"aufgabe": "Gegeben sind zwei Seiten und der Gegenwinkel der größeren Seite. Ist das Dreieck damit eindeutig festgelegt?", "loesung": "Ja (Ssw)"}, {"aufgabe": "Gegeben sind die Seiten a und b und der eingeschlossene Winkel γ. Welcher Kongruenzsatz passt?", "loesung": "sws"}]}, "C2": {"id": "C2", "titel": "Zirkel und Lineal – deine Werkzeuge", "kerne": [{"name": "", "verstehen": ["Konstruieren heißt: nur mit Zirkel und Lineal arbeiten – so steht es auch im Buch. Die wichtigsten Werkzeuge sind Ortslinien: Alle Punkte mit gleichem Abstand zu EINEM Punkt liegen auf einem Kreis. Alle Punkte mit gleichem Abstand zu ZWEI Punkten A und B liegen auf der Mittelsenkrechten von AB – sie steht senkrecht auf der Strecke und halbiert sie. Alle Punkte mit gleichem Abstand zu zwei Schenkeln liegen auf der Winkelhalbierenden.", "Mittelsenkrechte konstruieren: Zwei Kreise mit gleichem Radius um A und B, die sich schneiden – die Gerade durch die Schnittpunkte ist die Mittelsenkrechte. Sie ist zugleich die Symmetrieachse der Strecke.", "Im Dreieck treffen sich die drei Mittelsenkrechten in einem Punkt: dem Umkreismittelpunkt (gleich weit von allen ECKEN). Die drei Winkelhalbierenden treffen sich im Inkreismittelpunkt (gleich weit von allen SEITEN). Merkhilfe: Mittelsenkrechte → Ecken, Winkelhalbierende → Seiten."], "fallen": [{"falle": "Ortslinien verwechselt", "falsch": "„Gleich weit von A und B → Winkelhalbierende“", "richtig": "Mittelsenkrechte von AB", "warum": "Winkelhalbierende gehört zu zwei SCHENKELN, nicht zu zwei Punkten"}, {"falle": "Umkreis mit Winkelhalbierenden konstruiert", "falsch": "Umkreismittelpunkt = Schnitt der Winkelhalbierenden", "richtig": "Schnitt der MITTELSENKRECHTEN", "warum": "Der Umkreis läuft durch die Ecken – gleicher Abstand zu Ecken = Mittelsenkrechte"}], "ueben": [{"stufe": "leicht", "aufgabe": "Alle Punkte, die von A und B gleich weit entfernt sind, liegen auf …", "loesung": "der Mittelsenkrechten von AB", "hinweis": "", "format": "MC"}, {"stufe": "leicht", "aufgabe": "Konstruiere die Mittelsenkrechte einer Strecke AB = 6 cm nur mit Zirkel und Lineal.", "loesung": "Checkliste: zwei gleiche Kreise um A und B, Gerade durch die Schnittpunkte; steht senkrecht, halbiert AB", "hinweis": "", "format": "SK"}, {"stufe": "leicht", "aufgabe": "Welche Linie trifft im Dreieck den Punkt, der von allen drei Seiten gleich weit entfernt ist?", "loesung": "Winkelhalbierende (Inkreismittelpunkt)", "hinweis": "", "format": "MC"}, {"stufe": "leicht", "aufgabe": "Welche Linien liefern den Umkreismittelpunkt und welche den Inkreismittelpunkt eines Dreiecks?", "loesung": "Mittelsenkrechten / Winkelhalbierenden", "hinweis": "Umkreis: gleicher Abstand zu den ECKEN → Mittelsenkrechten. Inkreis: gleicher Abstand zu den SEITEN → Winkelhalbierenden.", "format": "MC"}, {"stufe": "mittel", "aufgabe": "Zeichne ein Dreieck mit c = 6 cm, α = 35°, β = 112°. a) Konstruiere den Umkreis und bestimme seinen Radius. b) Konstruiere den Inkreis und bestimme seinen Radius.", "loesung": "Checkliste: Umkreis durch alle drei Ecken (Mittelsenkrechten), Inkreis berührt alle drei Seiten (Winkelhalbierende); Radius messen", "hinweis": "", "format": "SK"}, {"stufe": "mittel", "aufgabe": "Konstruiere im Dreieck ABC den Spiegelpunkt von A an der Geraden CB.", "loesung": "Checkliste: Lot von A auf CB (Lotfußpunkt F), Strecke AF über F hinaus abtragen", "hinweis": "", "format": "SK"}, {"stufe": "mittel", "aufgabe": "Welche besonderen Vierecke sind achsensymmetrisch? Nenne mindestens drei.", "loesung": "z. B. Quadrat, Rechteck, Raute, Drachenviereck, gleichschenkliges (achsensymmetrisches) Trapez", "hinweis": "", "format": "SK"}]}], "uplus": [{"stufe": "", "aufgabe": "Konstruiere die Winkelhalbierende eines 70°-Winkels und begründe, warum deine Konstruktion funktioniert.", "loesung": "Checkliste: Kreis um Scheitel schneidet beide Schenkel; zwei gleiche Kreise um die Schnittpunkte; Gerade durch Scheitel und Kreuzungspunkt. Begründung: alle Konstruktionspunkte sind von beiden Schenkeln gleich weit entfernt", "hinweis": "", "format": "SK"}], "transfer": [{"stufe": "", "aufgabe": "Ein Brunnen soll von den Häusern A und B gleich weit entfernt sein und genau 30 m von der geraden Straße g entfernt liegen. Konstruiere alle möglichen Brunnenpunkte (Maßstab wählen).", "loesung": "Schnittpunkte der Mittelsenkrechten von AB mit der Parallelen zu g im Abstand 30 m (0, 1 oder 2 Lösungen)", "hinweis": "Ortslinien kombinieren: „gleich weit von A und B“ → Mittelsenkrechte; „fester Abstand zu g“ → Parallele. Schnittpunkte markie
