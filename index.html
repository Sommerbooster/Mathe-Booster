00"}, {"aufgabe": "2,5 m = ____ cm", "loesung": "250"}, {"aufgabe": "1 h 20 min = ____ min", "loesung": "80"}, {"aufgabe": "0,5 km = ____ m", "loesung": "500"}, {"aufgabe": "3 € 5 ct = ____ ct", "loesung": "305"}]}, "F5": {"id": "F5", "titel": "Prozent? Kenn ich!", "kerne": [{"name": "", "verstehen": ["25 % Rabatt – was heißt das eigentlich? Ein Prozent bedeutet „eins von hundert“, also ein Hundertstel: 1 % = 1/100 = 0,01. Deshalb ist 25 % = 25/100 = 1/4 = 0,25. Prozent, Bruch und Dezimalzahl sind drei Schreibweisen für denselben Anteil.", "Prozent → Dezimalzahl: Zahl ohne %-Symbol schreiben und Komma um 2 Stellen nach links: 5 % = 0,05. Dezimalzahl → Prozent: Komma um 2 Stellen nach rechts und %-Symbol anhängen: 0,375 = 37,5 %.", "Bruch → Prozent: Erweitere oder kürze auf den Nenner 100 (1/5 = 20/100 = 20 %). Geht das nicht glatt, teile Zähler durch Nenner und verschiebe das Komma: 5/8 = 5 : 8 = 0,625 = 62,5 %. Wichtig: Eine Prozentangabe ist nur sinnvoll, wenn klar ist, was das Ganze (die 100 %) ist."], "fallen": [{"falle": "Komma nur eine Stelle verschoben", "falsch": "5 % = 0,5", "richtig": "5 % = 0,05", "warum": "Prozent heißt Hundertstel: 5/100 – zwei Stellen"}, {"falle": "Zähler als Prozentzahl gelesen", "falsch": "1/5 = 5 %", "richtig": "1/5 = 20 %", "warum": "Auf Nenner 100 erweitern: 1/5 = 20/100"}], "ueben": [{"stufe": "leicht", "aufgabe": "Schreibe als Dezimalzahl und als Bruch (vollständig gekürzt): 40 %", "loesung": "0,4 = 2/5", "hinweis": "Prozent heißt Hundertstel: 40 % = 40/100 – mit 20 kürzen."}, {"stufe": "leicht", "aufgabe": "Schreibe als Dezimalzahl und als Bruch: 75 %", "loesung": "0,75 = 3/4", "hinweis": "75 % = 75/100 – mit 25 kürzen: 3/4."}, {"stufe": "leicht", "aufgabe": "Schreibe als Dezimalzahl und als Bruch: 5 %", "loesung": "0,05 = 1/20", "hinweis": "5 % = 5/100 – mit 5 kürzen: 1/20."}, {"stufe": "leicht", "aufgabe": "Schreibe als Prozentangabe: 1/4", "loesung": "25 %", "hinweis": "Auf Nenner 100 erweitern"}, {"stufe": "leicht", "aufgabe": "Schreibe als Prozentangabe: 0,3", "loesung": "30 %", "hinweis": "Komma zwei Stellen nach rechts"}, {"stufe": "mittel", "aufgabe": "Schreibe als Dezimalzahl und als Bruch: 12,5 %", "loesung": "0,125 = 1/8", "hinweis": "12,5 % = 125/1000 – mit 125 kürzen: 1/8."}, {"stufe": "mittel", "aufgabe": "Schreibe als Dezimalzahl und als Bruch: 87,5 %", "loesung": "0,875 = 7/8", "hinweis": "87,5 % = 875/1000 – mit 125 kürzen: 7/8."}, {"stufe": "mittel", "aufgabe": "Schreibe als Prozentangabe: 7/8", "loesung": "87,5 %", "hinweis": "Bruch in Prozent: 7 : 8 = 0,875 = 87,5 %."}, {"stufe": "mittel", "aufgabe": "Schreibe als Prozentangabe: 32/400", "loesung": "8 %", "hinweis": "Kürzen auf Nenner 100: 8/100"}, {"stufe": "mittel", "aufgabe": "Schreibe als Prozentangabe: 1,05", "loesung": "105 %", "hinweis": "Mehr als das Ganze ist möglich"}, {"stufe": "mittel", "aufgabe": "Schreibe als Prozentangabe: 0,003", "loesung": "0,3 %", "hinweis": "Komma zwei Stellen nach rechts"}, {"stufe": "mittel", "aufgabe": "Schreibe als Prozentangabe (auf 2 Stellen gerundet): 2/9", "loesung": "≈ 22,22 %", "hinweis": "Teile aus: 2 : 9 = 0,2222… – gerundet 22,22 %."}]}], "uplus": [], "transfer": [{"aufgabe": "In einer Klasse mit 40 Kindern fahren 12 mit dem Rad zur Schule. Wie viel Prozent sind das?", "loesung": "30 %", "hinweis": "Anteil: 12/40 = 3/10 = 30/100 = 30 %. Antwort: 30 % der Kinder fahren mit dem Rad."}, {"aufgabe": "Von den Haushalten in Deutschland sind 42 % Einpersonenhaushalte, 34 % 2-Personen-, 12 % 3-Personen- und 9 % 4-Personen-Haushalte. Wie viel Prozent der Haushalte haben 5 und mehr Personen?", "loesung": "3 %", "hinweis": "Das Ganze sind 100 %: 100 − 42 − 34 − 12 − 9 = 3. Antwort: 3 % der Haushalte haben 5 und mehr Personen."}], "wpool": [{"aufgabe": "50 % als Bruch", "loesung": "1/2"}, {"aufgabe": "0,2 als Prozentangabe", "loesung": "20 %"}, {"aufgabe": "10 % als Dezimalzahl", "loesung": "0,1"}, {"aufgabe": "3/10 als Prozentangabe", "loesung": "30 %"}, {"aufgabe": "1 % als Dezimalzahl", "loesung": "0,01"}]}, "F6": {"id": "F6", "titel": "Fläche, Umfang, Volumen – so geht’s", "kerne": [{"name": "", "verstehen": ["Der Umfang ist der Weg einmal außen herum: Beim Rechteck U = 2 · (a + b), beim Quadrat U = 4 · a. Der Flächeninhalt sagt, wie viel hineinpasst: Rechteck A = a · b, Quadrat A = a². Miss beides nie in derselben Einheit – Umfang in cm, Fläche in cm²!", "Die Formeln aus dem Grundwissen: Dreieck A = 1/2 · g · h (halbes Rechteck!), Parallelogramm A = g · h, Trapez A = 1/2 · (a + c) · h. Komplizierte Flächen zerlegst du in Rechtecke oder ergänzt sie zu Rechtecken – das ist der wichtigste Trick.", "Beim Quader gilt V = a · b · c, gemessen in cm³ oder m³. Merke die Brücke zu den Litern: 1 dm³ = 1 l. Ein Würfel ist ein Quader mit drei gleichen Kanten: V = a³."], "fallen": [{"falle": "Umfang und Fläche verwechselt", "falsch": "Rechteck 7 cm × 4 cm: A = 22 cm²", "richtig": "A = 7 · 4 = 28 cm²; 22 cm ist der UMFANG", "warum": "U zählt den Rand (2 · (7 + 4)), A das Innere"}, {"falle": "Dreieck ohne die Hälfte", "falsch": "A = g · h", "richtig": "A = 1/2 · g · h", "warum": "Ein Dreieck ist ein halbes Rechteck/Parallelogramm"}], "ueben": [{"stufe": "leicht", "aufgabe": "Rechteck mit a = 7 cm, b = 4 cm: Umfang und Flächeninhalt?", "loesung": "U = 22 cm; A = 28 cm²", "hinweis": "U = 2 · (7 + 4); A = 7 · 4"}, {"stufe": "leicht", "aufgabe": "Quadrat mit a = 6 cm: Umfang und Flächeninhalt?", "loesung": "U = 24 cm; A = 36 cm²", "hinweis": "Quadrat: Umfang U = 4 · a = 4 · 6, Fläche A = a · a = 6²."}, {"stufe": "leicht", "aufgabe": "Dreieck mit g = 8 cm, h = 5 cm: Flächeninhalt?", "loesung": "20 cm²", "hinweis": "Dreiecksformel: A = ½ · g · h = ½ · 8 · 5."}, {"stufe": "leicht", "aufgabe": "Quader mit a = 4 cm, b = 3 cm, c = 2 cm: Volumen?", "loesung": "24 cm³", "hinweis": "Quader: V = a · b · c = 4 · 3 · 2."}, {"stufe": "leicht", "aufgabe": "1 dm³ = ____ l", "loesung": "1", "hinweis": ""}, {"stufe": "mittel", "aufgabe": "Parallelogramm mit g = 9 cm, h = 4 cm: Flächeninhalt?", "loesung": "36 cm²", "hinweis": "Parallelogramm: A = g · h = 9 · 4."}, {"stufe": "mittel", "aufgabe": "Trapez mit a = 8 cm, c = 4 cm, h = 5 cm: Flächeninhalt?", "loesung": "30 cm²", "hinweis": "Trapez: A = ½ · (a + c) · h = ½ · 12 · 5."}, {"stufe": "mittel", "aufgabe": "Ein Rechteck hat A = 54 cm² und a = 9 cm. Berechne b und den Umfang.", "loesung": "b = 6 cm; U = 30 cm", "hinweis": "b = 54 : 9; U = 2 · (9 + 6) – Formel rückwärts"}, {"stufe": "mittel", "aufgabe": "L-förmige Fläche: Rechteck 10 cm × 6 cm, aus einer Ecke ist ein Quadrat 2 cm × 2 cm herausgeschnitten. Flächeninhalt?", "loesung": "56 cm²", "hinweis": "Zerlegen/Ergänzen: 60 − 4"}, {"stufe": "mittel", "aufgabe": "Ein Quader hat V = 120 cm³, a = 6 cm, b = 5 cm. Berechne c.", "loesung": "c = 4 cm", "hinweis": "Formel rückwärts: c = V : (a · b) = 120 : 30."}, {"stufe": "mittel", "aufgabe": "Würfel mit a = 3 cm: Volumen?", "loesung": "27 cm³", "hinweis": "Würfel: V = a³ = 3 · 3 · 3."}]}], "uplus": [], "transfer": [{"aufgabe": "Ein Zimmer ist 4,5 m lang und 3,2 m breit. a) Wie viel m² Teppich brauchst du? b) Wie viele Meter Fußleiste, wenn die Tür 0,9 m breit ist?", "loesung": "a) 14,4 m² b) 14,5 m", "hinweis": "a) A = 4,5 · 3,2 = 14,4. b) U = 2 · (4,5 + 3,2) = 15,4; minus Tür: 15,4 − 0,9 = 14,5. Antwortsatz mit Einheiten."}, {"aufgabe": "Ein Aquarium ist innen 60 cm lang, 30 cm breit und 40 cm hoch. Wie viele Liter passen hinein?", "loesung": "72 l", "hinweis": "V = 60 · 30 · 40 = 72000 cm³ = 72 dm³ = 72 l."}], "wpool": [{"aufgabe": "Umfang Quadrat a = 5 cm", "loesung": "20 cm"}, {"aufgabe": "Fläche Rechteck 6 cm × 3 cm", "loesung": "18 cm²"}, {"aufgabe": "Fläche Dreieck g = 6 cm, h = 4 cm", "loesung": "12 cm²"}, {"aufgabe": "Volumen Würfel a = 2 cm", "loesung": "8 cm³"}, {"aufgabe": "3 dm³ = ____ l", "loesung": "3"}]}, "A2": {"id": "A2", "kerne": [{"name": "", "verstehen": ["Eine Variable ist ein Platzhalter für eine Zahl. Beispiel: Ein Stift kostet x Euro. 5 Stifte und 3 € Versand kosten dann 5x + 3 Euro. Der Term merkt sich die Rechnung – egal, was der Stift kostet. Kostet er 2 €, rechnest du 5 · 2 + 3 = 13. Das nennt man den Termwert: Einsetzen und ausrechnen.", "Wichtig beim Einsetzen negativer Zahlen: Klammern! T(x) = 2x² − 5 mit x = −3 heißt 2 · (−3)² − 5 = 2 · 9 − 5 = 13."], "fallen": [{"falle": "Reihenfolge beim Übersetzen", "falsch": "„5 Stifte à x € plus 3 €“ → 5 + 3x", "richtig": "5x + 3", "warum": "5-mal der Stiftpreis, dazu einmal 3 € – die Struktur des Textes zählt, nicht die Wortreihenfolge"}, {"falle": "Einsetzen ohne Klammer", "falsch": "T(−3) = 2 · −3² − 5 = −23", "richtig": "2 · (−3)² − 5 = 13", "warum": "Ohne Klammer wird erst 3² gerechnet und das Minus bleibt stehen"}], "ueben": [{"stufe": "leicht", "loesung": "3x", "hinweis": "„Das Dreifache“ heißt mal 3 – aus „mal“ wird ein Produkt: 3x.", "aufgabe": "„Das Dreifache von x“", "mc": ["3x", "x + 3", "x³", "3 − x"], "mcCorrect": 0}, {"stufe": "leicht", "loesung": "2·(x + 4)", "hinweis": "Klammer sichert die Summe", "aufgabe": "„Die Summe aus x und 4, dann mal 2“", "mc": ["2", "(x + 4)", "2x + 4", "x + 8", "2x", "4"], "mcCorrect": 1}, {"stufe": "leicht", "loesung": "21", "hinweis": "Setze 5 für x ein: 4 · 5 + 1 = 21.", "aufgabe": "T(x) = 4x + 1: berechne T(5)"}, {"stufe": "leicht", "loesung": "8", "hinweis": "Setze 4 für x ein: 20 − 3 · 4 = 20 − 12.", "aufgabe": "T(x) = 20 − 3x: berechne T(4)"}, {"stufe": "leicht", "loesung": "50 − 3k", "hinweis": "Struktur: Startbetrag minus Kosten", "aufgabe": "Kinokarte k €, 3 Karten, du zahlst mit 50 €. Restgeld?", "mc": ["50 − 3k", "3k − 50", "50 + 3k", "47k"], "mcCorrect": 0}, {"stufe": "mittel", "loesung": "13", "hinweis": "Klammer ums Minus: 2 · 9 − 5", "aufgabe": "T(x) = 2x² − 5: berechne T(−3)"}, {"stufe": "mittel", "loesung": "6", "hinweis": "Setze −2 mit Klammern ein: (−2)² − (−2) = 4 + 2.", "aufgabe": "T(x) = x² − x: berechne T(−2)"}, {"stufe": "mittel", "loesung": "9 + 2x", "hinweis": "Grundgebühr einmal, Filmpreis x-mal", "aufgabe": "Streaming: 9 € Grundgebühr + 2 € je Film (x Filme)", "mc": ["9 + 2x", "11x", "9x + 2", "2", "(9 + x)"], "mcCorrect": 0}, {"stufe": "mittel", "loesung": "12", "hinweis": "Setze 3 ein: 3 + 3² = 3 + 9 – die Tabelle wächst mit x².", "aufgabe": "Wertetabelle von T(x) = 3 + x²: T(0)=3, T(1)=4, T(2)=7. Berechne T(3)"}, {"stufe": "mittel", "loesung": "−14", "hinweis": "Setze −3 mit Klammern ein: 4 · (−3) − 2.", "aufgabe": "T(x) = 4x − 2: berechne T(−3)"}, {"stufe": "mittel", "loesung": "−48", "hinweis": "Setze 5 ein: erst die Klammer (5 + 4 = 9), dann −5 · 9 − 3.", "aufgabe": "T(x) = −5 · (x + 4) − 3: berechne T(5)"}]}], "uplus": [{"stufe": "", "loesung": "3", "hinweis": "Setze x = 5 und y = 2 ein: 3 · (5 − 2 · 2) = 3 · 1.", "aufgabe": "T(x; y) = 3 · (x − 2y): berechne T(5; 2)"}, {"stufe": "", "loesung": "0", "hinweis": "Setze −1 mit Klammern ein: (−1)³ − (−1) = −1 + 1.", "aufgabe": "T(x) = x³ − x: berechne T(−1)"}, {"stufe": "", "loesung": "Grundgebühr", "hinweis": "Terme interpretieren", "aufgabe": "Im Term 1,19 · (3 + 0,5x) für eine Rechnung mit 19 % Aufschlag – wofür steht die 3?", "mc": ["Grundgebühr in €", "Preis pro Stück", "Anzahl", "Aufschlag"], "mcCorrect": 0}, {"stufe": "", "loesung": "27", "hinweis": "Setze a = 0 und b = −3 ein: 2 · 0 + 3 · (−3)² = 0 + 3 · 9.", "aufgabe": "T(a; b) = 2a + 3b²: berechne T(0; −3)"}], "transfer": [{"aufgabe": "Tarif A: 5 € Grundgebühr + 0,10 € je Minute. Tarif B: 0,20 € je Minute. Stelle beide Terme auf. Bei wie vielen Minuten kosten beide gleich viel?", "loesung": "50 Min.", "hinweis": "A: 5 + 0,1x; B: 0,2x. Gleichsetzen: 5 + 0,1x = 0,2x → 5 = 0,1x → x = 50"}, {"aufgabe": "Streichholz-Dreiecke: Das erste Dreieck braucht 3 Hölzer, jedes weitere 2. Begründe, dass A(d) = 3 + 2·(d − 1) passt, und berechne A(10)", "loesung": "21", "hinweis": "Jedes neue Dreieck teilt eine Seite: nur 2 neue Hölzer. A(10) = 3 + 2 · 9 = 21"}, {"aufgabe": "Fehlersuche: Leon setzt in T(x) = 2x² die Zahl x = −3 ein und erhält −18. Finde seinen Fehler und berechne richtig.", "loesung": "18", "hinweis": "Leon rechnete 2 · (−3²) = −18. Richtig: Klammer ums Minus, 2 · (−3)² = 2 · 9 = 18"}], "wpool": [{"aufgabe": "T(x) = 5x − 2: T(3)", "loesung": "13"}, {"aufgabe": "MC: „x geteilt durch 4, dann plus 1“", "loesung": "x/4 + 1"}, {"aufgabe": "T(x) = x²: T(−5)", "loesung": "25"}, {"aufgabe": "MC: „Die Summe aus 3x und 5“", "loesung": "3x + 5"}], "titel": "Vom Text zum Term"}, "A3": {"id": "A3", "kerne": [{"name": "Zusammenfassen", "verstehen": ["7x + 3 − 2x + 5: Hier stehen zwei Sorten von Gliedern – welche mit x und reine Zahlen. Nur gleiche Sorten darfst du verrechnen: 7x − 2x = 5x und 3 + 5 = 8. Ergebnis: 5x + 8. Stell dir x als Kiste vor: 7 Kisten minus 2 Kisten sind 5 Kisten – aber Kisten und lose Zahlen kannst du nicht mischen."], "fallen": [{"falle": "Ungleiches verrechnet", "falsch": "3x + 2 = 5x", "richtig": "3x + 2 bleibt 3x + 2", "warum": "x-Glieder und Zahlen sind verschiedene Sorten"}, {"falle": "x verschwindet", "falsch": "4x − x = 4", "richtig": "4x − x = 3x", "warum": "x heißt 1x: 4 Kisten minus 1 Kiste"}], "ueben": [{"stufe": "leicht", "loesung": "11x", "hinweis": "", "aufgabe": "8x + 3x"}, {"stufe": "leicht", "loesung": "5y", "hinweis": "", "aufgabe": "9y − 4y"}, {"stufe": "leicht", "loesung": "5a + 2", "hinweis": "Merk dir: a allein heißt 1a – also 6a − 1a = 5a.", "aufgabe": "6a + 2 − a"}, {"stufe": "leicht", "loesung": "2b + 7", "hinweis": "Vorzeichen wandert mit dem Glied", "aufgabe": "7 − 3b + 5b"}, {"stufe": "leicht", "loesung": "2x", "hinweis": "", "aufgabe": "x + x"}, {"stufe": "mittel", "loesung": "3x + 4y", "hinweis": "zwei Variablensorten getrennt sammeln", "aufgabe": "5x + 3y − 2x + y"}, {"stufe": "mittel", "loesung": "3x² + 2x", "hinweis": "x² und x sind verschiedene Sorten!", "aufgabe": "4x² + 2x − x²"}, {"stufe": "mittel", "loesung": "−a + 7", "hinweis": "Minus vor Minus wird Plus: −(−2a) wird +2a.", "aufgabe": "−3a + 7 − (−2a)"}, {"stufe": "mittel", "loesung": "1,7x", "hinweis": "geht auch mit Kommazahlen", "aufgabe": "0,5x + 1,2x"}]}, {"name": "Klammern rein und raus", "verstehen": ["3 · (2x − 4): Die 3 multipliziert JEDEN Summanden in der Klammer: 3 · 2x − 3 · 4 = 6x − 12. Denk an ein Rechteck mit Breite 3 und Länge 2x − 4: seine Fläche ist beides zugleich. Steht ein Minus vor der Klammer, dreht es alle Vorzeichen: −2 · (3x − 5) = −6x + 10. Rückwärts heißt Ausklammern: 12x + 8 = 4 · (3x + 2) – den gemeinsamen Faktor herausziehen."], "fallen": [{"falle": "Nur den ersten Summanden multipliziert", "falsch": "3(2x − 4) = 6x − 4", "richtig": "6x − 12", "warum": "JEDER Summand wird multipliziert"}, {"falle": "Minus vor der Klammer vergessen", "falsch": "3 − 5(−a + 4) = 3 − 5a + 20", "richtig": "3 + 5a − 20 = 5a − 17", "warum": "−5 · (−a) = +5a und −5 · 4 = −20"}], "ueben": [{"stufe": "leicht", "loesung": "2x + 6", "hinweis": "", "aufgabe": "2 · (x + 3)"}, {"stufe": "leicht", "loesung": "10a − 5", "hinweis": "", "aufgabe": "5 · (2a − 1)"}, {"stufe": "leicht", "loesung": "−3x − 6", "hinweis": "Minusfaktor macht beide negativ", "aufgabe": "−3 · (x + 2)"}, {"stufe": "leicht", "loesung": "2x − 3", "hinweis": "geht auch mit Brüchen", "aufgabe": "½ · (4x − 6)"}, {"stufe": "leicht", "loesung": "3 · (2x + 3)", "hinweis": "gemeinsamer Faktor 3", "aufgabe": "Klammere aus: 6x + 9"}, {"stufe": "mittel", "loesung": "5a − 17", "hinweis": "", "aufgabe": "3 − 5 · (−a + 4)"}, {"stufe": "mittel", "loesung": "10z − 5", "hinweis": "erst die Klammer mal 3, dann zusammenfassen", "aufgabe": "z − (5/3 − 3z) · 3"}, {"stufe": "mittel", "loesung": "8xy − 10x", "hinweis": "Variablen multiplizieren: x · y = xy", "aufgabe": "2x · (4y − 5)"}, {"stufe": "mittel", "loesung": "4a · (3b − 2)", "hinweis": "größten gemeinsamen Faktor ziehen", "aufgabe": "Klammere aus: 12ab − 8a"}]}], "uplus": [{"stufe": "", "loesung": "2xy − 10x − 3y", "hinweis": "8xy − 10x − 6xy − 3y", "aufgabe": "2x(4y − 5) − 3y(2x + 1)"}, {"stufe": "", "loesung": "7x − 13y", "hinweis": "5x − 5y + 2x − 8y", "aufgabe": "5(x − y) + (4x − 16y) : 2"}, {"stufe": "", "loesung": "−x + 7", "hinweis": "−3 + x − 2x + 10", "aufgabe": "−(3 − x) + 2(−x + 5)"}, {"stufe": "", "loesung": "b; 3a", "hinweis": "a(b + 3) = ab + 3a", "aufgabe": "Kästchen: a · (▢ + 3) = a·b + ▢"}], "transfer": [{"aufgabe": "Fehlersuche: Mia rechnet 4 · (x − 3) = 4x − 3. Beschreibe ihren Fehler und rechne richtig.", "loesung": "4x − 12", "hinweis": "Mia hat nur x mit 4 multipliziert; die −3 muss auch: 4x − 12 (Aufgabentyp aus realer Stegreifaufgabe 2)"}, {"aufgabe": "Aus einem 4 cm × 6 cm-Rechteck wird ein Quadrat (Seite x) herausgeschnitten. Gib zwei verschiedene Terme für die Restfläche an und zeige, dass sie äquivalent sind.", "loesung": "24 − x²", "hinweis": "Weg 1: 6 · 4 − x · x. Weg 2 (Zerlegung): 4 · (6 − x) + x · (4 − x) = 24 − 4x + 4x − x² = 24 − x²"}, {"aufgabe": "Zeige durch Umformen, dass (y − 2) · (−0,5) und −0,5y + 1 äquivalent sind.", "loesung": "s. rechts", "hinweis": "(y − 2)(−0,5) = −0,5y + 1 – jeden Summanden multiplizieren; gleiche Termstruktur → äquivalent"}], "wpool": [{"aufgabe": "9x − 5x", "loesung": "4x"}, {"aufgabe": "4 · (a + 2)", "loesung": "4a + 8"}, {"aufgabe": "−2 · (x − 3)", "loesung": "−2x + 6"}, {"aufgabe": "10y + 2 − 4y", "loesung": "6y + 2"}], "titel": "Terme aufräumen"}, "A4": {"id": "A4", "kerne": [{"name": "", "verstehen": ["Eine Gleichung ist eine Waage im Gleichgewicht. Was du auf einer Seite tust, musst du auch auf der anderen tun – sonst kippt sie. Beispiel: 4x − 7 = 13. Erst +7 auf beiden Seiten: 4x = 20. Dann durch 4: x = 5. Den Schritt schreibst du rechts an den Rand: | + 7 und | : 4. Zum Schluss die Probe: 4 · 5 − 7 = 13 ✓ – damit weißt du selbst, dass du richtig liegst."], "fallen": [{"falle": "Nur eine Seite verändert", "falsch": "4x − 7 = 13 → 4x = 13", "richtig": "4x = 20", "warum": "+7 muss auf BEIDEN Seiten passieren"}, {"falle": "Vorzeichen beim Seitenwechsel", "falsch": "5x = 2x + 9 → 3x = 9 ✓, aber: 5x − 3 = 9 → 5x = 6", "richtig": "5x = 12", "warum": "−3 wandert als +3 auf die andere Seite"}], "ueben": [{"stufe": "leicht", "loesung": "x = 7", "hinweis": "Auf beiden Seiten − 5 rechnen – die Gleichung bleibt im Gleichgewicht.", "aufgabe": "x + 5 = 12"}, {"stufe": "leicht", "loesung": "x = 7", "hinweis": "Auf beiden Seiten durch 3 teilen.", "aufgabe": "3x = 21"}, {"stufe": "leicht", "loesung": "x = 3", "hinweis": "Auf beiden Seiten + 4 rechnen.", "aufgabe": "x − 4 = −1"}, {"stufe": "leicht", "loesung": "x = 4", "hinweis": "Zwei Schritte: erst − 1 auf beiden Seiten, dann durch 2 teilen.", "aufgabe": "2x + 1 = 9"}, {"stufe": "leicht", "loesung": "x = 15", "hinweis": "Auf beiden Seiten mal 3 nehmen.", "aufgabe": "x : 3 = 5"}, {"stufe": "mittel", "loesung": "x = 7", "hinweis": "erst Klammer auflösen, dann x auf eine Seite", "aufgabe": "3 · (x − 2) = x + 8"}, {"stufe": "mittel", "loesung": "x = 4", "hinweis": "Bring die x auf eine Seite: − 2x auf beiden Seiten, dann + 3.", "aufgabe": "5x − 3 = 2x + 9"}, {"stufe": "mittel", "loesung": "x = 3", "hinweis": "negativer Koeffizient", "aufgabe": "7 − 2x = 1"}, {"stufe": "mittel", "loesung": "x = 3", "hinweis": "Klammer + Seitenwechsel", "aufgabe": "4 · (x + 1) = 2x + 10"}]}], "uplus": [{"stufe": "", "loesung": "x = ½", "hinweis": "15x − 9 − 24 + 24x = 9x − 18 → 39x − 33 = 9x − 18 → 30x = 15", "aufgabe": "3(5x − 3) − 6(4 − 4x) = 9(x − 2)"}, {"stufe": "", "loesung": "x = 3", "hinweis": "12x − 84 − 8 + 12x = 5x − 35 → 24x − 92 = 5x − 35 → 19x = 57", "aufgabe": "6(2x − 14) − 4(2 − 3x) = 5(x − 7)"}, {"stufe": "", "loesung": "−21", "hinweis": "links: 2 · 8 − 12 = 4; rechts: 25 + c = 4 → c = −21", "aufgabe": "Ergänze rechts, sodass x = 5 Lösung ist: 2(x + 3) − 12 = 5x ▢"}, {"stufe": "", "loesung": "x = 6", "hinweis": "6x − 2 = 5x + 4", "aufgabe": "2 · (3x − 1) = 5x + 4"}, {"stufe": "", "loesung": "x = −1", "hinweis": "4x + 4 = −9x − 9 → 13x = −13", "aufgabe": "2(2x + 2) = 3(−3x − 3)"}, {"stufe": "", "loesung": "x = 1", "hinweis": "7x − 4 = −x + 4 → 8x = 8", "aufgabe": "−4(−2x + 1) − x = −(x − 2) − (x − 1) + x + 1"}, {"stufe": "", "loesung": "wahr für alle x (allgemeingültig)", "hinweis": "12x − 16 = 12x − 16 → 0 = 0", "aufgabe": "Beschreibe den Sonderfall: 2(6x − 8) = −4(−3x + 4)"}], "transfer": [{"aufgabe": "Fünf Freunde kaufen Eisbecher. Zwei nehmen Sahne (je 0,70 € Aufpreis), zusammen zahlen sie 27,90 €. Berechne mit x-Ansatz den Preis eines Bechers ohne Sahne.", "loesung": "5,30 €", "hinweis": "5x + 2 · 0,70 = 27,90 → 5x = 26,50 → x = 5,30"}, {"aufgabe": "Eine Rechteckseite ist 3 cm länger als die andere. Verlängert man beide um 1 cm, wächst die Fläche um 22 cm². Berechne die ursprünglichen Seiten mit x-Ansatz.", "loesung": "9 cm und 12 cm", "hinweis": "(x + 1)(x + 4) = x(x + 3) + 22 → x² + 5x + 4 = x² + 3x + 22 → 2x = 18 → x = 9"}, {"aufgabe": "Im Dreieck ist β doppelt so groß wie α, und α ist 40° kleiner als γ. Stelle eine Gleichung auf und berechne alle Winkel.", "loesung": "35°, 70°, 75°", "hinweis": "α + 2α + (α + 40°) = 180° → 4α = 140° → α = 35°"}], "wpool": [{"aufgabe": "x + 9 = 4", "loesung": "x = −5"}, {"aufgabe": "5x = −20", "loesung": "x = −4"}, {"aufgabe": "2x − 3 = 7", "loesung": "x = 5"}, {"aufgabe": "x : 2 = −3", "loesung": "x = −6"}], "titel": "Gleichungen lösen – Schritt für Schritt"}, "A5": {"id": "A5", "kerne": [{"name": "", "verstehen": ["Prozent heißt „von Hundert“: 25 % sind 25 von 100, also ein Viertel. 25 % von 84 € rechnest du als 84 · 0,25 = 21 € – oder über 1 %: 84 : 100 = 0,84, mal 25. Drei Größen spielen mit: der Grundwert G (das Ganze, 84 €), der Prozentsatz p (25 %) und der Prozentwert W (der Anteil, 21 €). Merksatz: W = G · p.", "Preis-Änderungen gehen am schnellsten mit dem Faktor: +15 % heißt · 1,15, −20 % heißt · 0,8. Und rückwärts? Wenn 32 € schon der Preis NACH 20 % Rabatt sind, gilt 0,8 · G = 32 → G = 40 €."], "fallen": [{"falle": "Prozentzahl addiert", "falsch": "40 € + 15 % = 55 €", "richtig": "40 · 1,15 = 46 €", "warum": "15 % VON 40 sind 6 € – Prozent ist ein Anteil, keine Euro-Zahl"}, {"falle": "Rabatt rückwärts falsch", "falsch": "32 € + 20 % = 38,40 €", "richtig": "32 : 0,8 = 40 €", "warum": "Die 20 % beziehen sich auf den ALTEN Preis (Grundwert), nicht auf 32 €"}], "ueben": [{"stufe": "leicht", "loesung": "25 €", "hinweis": "10 % ist ein Zehntel – einfach durch 10 teilen.", "aufgabe": "10 % von 250 €"}, {"stufe": "leicht", "loesung": "43 kg", "hinweis": "50 % ist die Hälfte.", "aufgabe": "50 % von 86 kg"}, {"stufe": "leicht", "loesung": "21 €", "hinweis": "25 % ist ein Viertel – durch 4 teilen.", "aufgabe": "25 % von 84 €"}, {"stufe": "leicht", "loesung": "3 m", "hinweis": "1 % ist ein Hundertstel – durch 100 teilen.", "aufgabe": "1 % von 300 m"}, {"stufe": "leicht", "loesung": "9 €", "hinweis": "Trick: erst 10 % nehmen (4,50 €), dann verdoppeln.", "aufgabe": "20 % von 45 €"}, {"stufe": "mittel", "loesung": "46 €", "hinweis": "Plus 15 % heißt mal 1,15 – ein Schritt statt zwei.", "aufgabe": "Ein Preis von 40 € steigt um 15 %. Neuer Preis?"}, {"stufe": "mittel", "loesung": "45 €", "hinweis": "Minus 25 % heißt mal 0,75 – es bleiben 75 %.", "aufgabe": "60 € werden um 25 % gesenkt. Neuer Preis?"}, {"stufe": "mittel", "loesung": "40 €", "hinweis": "Nach 20 % Rabatt sind 32 € genau 80 %: 32 : 0,8 ergibt den alten Preis.", "aufgabe": "Nach 20 % Rabatt kostet eine Jeans 32 €. Vorher?"}, {"stufe": "mittel", "loesung": "20 %", "hinweis": "Anteil bilden: 12 von 60 = 12/60 = 1/5 – das sind 20 %.", "aufgabe": "12 von 60 Schülern fahren Rad. Wie viel Prozent?"}]}], "uplus": [{"stufe": "", "loesung": "400 €", "hinweis": "1,2 · G = 480 → G = 400 (Referenz: Sigena-Grundwissenstest B7a)", "aufgabe": "Ein Fernseher kostet 480 € – das sind 20 % mehr als im Vorjahr. Vorjahrespreis?"}, {"stufe": "", "loesung": "150 €", "hinweis": "0,7 · G = 105 → G = 150 (Referenz: Sigena B7c)", "aufgabe": "Eine Jacke wurde um 30 % reduziert und kostet jetzt 105 €. Ursprünglicher Preis?"}, {"stufe": "", "loesung": "96 %", "hinweis": "0,8 · 1,2 = 0,96 – die 20 % beziehen sich auf verschiedene Grundwerte", "aufgabe": "Ein Preis wird erst um 20 % gesenkt, dann um 20 % erhöht. Wie viel Prozent des Ausgangspreises sind das?"}, {"stufe": "", "loesung": "3000 €", "hinweis": "25 % Abzug heißt: 75 % bleiben – 4000 · 0,75.", "aufgabe": "Brutto 4000 € im Monat, 25 % Abzüge. Wie viel bleibt netto?"}, {"stufe": "", "loesung": "2 %", "hinweis": "Anteil bilden: 130 : 6500 = 0,02 – das sind 2 %.", "aufgabe": "Wie viel Prozent sind 130 m von 6500 m?"}, {"stufe": "", "loesung": "120 l", "hinweis": "2,5 % = 0,025. Das Ganze: 3 : 0,025.", "aufgabe": "2,5 % sind 3 l. Wie viel ist das Ganze?"}, {"stufe": "", "loesung": "25 %", "hinweis": "Vergleiche mit dem alten Wert: 165 : 132 = 1,25 – also 25 % mehr.", "aufgabe": "Die Wohnfläche eines Hauses wurde durch einen Anbau von 132 m² auf 165 m² vergrößert. Um wie viel Prozent?"}, {"stufe": "", "loesung": "1,09 €", "hinweis": "2,75 € ≙ 84 % des regulären Dreierpreises: 2,75 : 0,84 = 3,27…; : 3 ≈ 1,09", "aufgabe": "Ein Händler wirbt: „3 Packungen nur 2,75 €. Damit sparen Sie 16 %.“ Berechne den Preis einer Einzelpackung."}], "transfer": [{"aufgabe": "Ein Fahrrad kostet netto 250 €. Mit 19 % Mehrwertsteuer?", "loesung": "297,50 €", "hinweis": "Plus 19 % heißt mal 1,19: 250 · 1,19 = 297,50."}, {"aufgabe": "Die Zustimmung steigt von 40 % auf 45 %. Ergänze: Das sind ▢ Prozentpunkte mehr und ▢ % Zuwachs.", "loesung": "5; 12,5", "hinweis": "Differenz 5 Punkte; relativer Zuwachs 5/40 = 12,5 % (Lehrplan: „Prozent vs. Prozentpunkte“)"}, {"aufgabe": "Paul: „Erst 10 % Rabatt, dann wieder 10 % drauf – dann kostet es wieder gleich viel!“ Prüfe die Aussage.", "loesung": "falsch: 99 %", "hinweis": "0,9 · 1,1 = 0,99 → der Preis liegt 1 % unter dem Start (Begründungsaufgabe wie in realen KAs)"}], "wpool": [{"aufgabe": "10 % von 90 €", "loesung": "9 €"}, {"aufgabe": "75 % von 40 kg", "loesung": "30 kg"}, {"aufgabe": "100 € um 30 % gesenkt", "loesung": "70 €"}, {"aufgabe": "5 % von 200 m", "loesung": "10 m"}], "titel": "Prozente durchschauen"}, "A6": {"id": "A6", "kerne": [{"name": "", "verstehen": ["Bevor du rechnest, entscheide: Je mehr, desto MEHR (proportional – doppelte Menge, doppelter Preis) oder je mehr, desto WENIGER (antiproportional – doppelt so viele Helfer, halbe Zeit)? Beispiel proportional: 3 kg Äpfel kosten 5,40 €. Über die Einheit: 1 kg kostet 5,40 : 3 = 1,80 €, also 5 kg → 1,80 · 5 = 9 €. Das Dreisatz-Schema schreibt das in drei Zeilen mit Pfeilen (: 3 und · 5).", "Beispiel antiproportional: 6 Bauarbeiter brauchen 10 Tage. Die GESAMTARBEIT bleibt gleich: 6 · 10 = 60 Arbeitstage. 4 Arbeiter brauchen 60 : 4 = 15 Tage. Hier bleibt das Produkt gleich, nicht der Quotient."], "fallen": [{"falle": "Antiproportional proportional gerechnet", "falsch": "6 Arbeiter → 10 Tage, also 4 Arbeiter → 6,7 Tage", "richtig": "15 Tage", "warum": "Weniger Arbeiter brauchen MEHR Zeit – erst die Je-mehr-desto-Frage stellen!"}, {"falle": "Ohne Einheit gesprungen", "falsch": "3 kg → 5,40 €, dann wild multipliziert", "richtig": "über 1 kg gehen", "warum": "Der Zwischenschritt „1 Einheit“ macht jeden Dreisatz sicher"}], "ueben": [{"stufe": "leicht", "loesung": "9 €", "hinweis": "3-mal so viel kaufen heißt 3-mal so viel zahlen: 3 € · 3.", "aufgabe": "2 kg kosten 3 €. Was kosten 6 kg?"}, {"stufe": "leicht", "loesung": "8 €", "hinweis": "Doppelte Menge, doppelter Preis: 4 € · 2.", "aufgabe": "5 Hefte kosten 4 €. Was kosten 10 Hefte?"}, {"stufe": "leicht", "loesung": "3,60 €", "hinweis": "3-mal so viel: 1,20 € · 3.", "aufgabe": "100 g kosten 1,20 €. Was kosten 300 g?"}, {"stufe": "leicht", "loesung": "3 €", "hinweis": "Halbe Menge, halber Preis: 6 € : 2.", "aufgabe": "4 Stifte kosten 6 €. Was kosten 2 Stifte?"}, {"stufe": "leicht", "loesung": "36 km", "hinweis": "3-mal so lange unterwegs, 3-mal so weit: 12 km · 3.", "aufgabe": "In 1 Stunde schaffst du 12 km. Wie weit in 3 Stunden?"}, {"stufe": "mittel", "loesung": "9 €", "hinweis": "Dreisatz über 1 kg: 5,40 : 3 = 1,80 €, dann mal 5.", "aufgabe": "3 kg Äpfel kosten 5,40 €. Was kosten 5 kg?"}, {"stufe": "mittel", "loesung": "15 Tage", "hinweis": "antiproportional: 60 : 4", "aufgabe": "6 Bauarbeiter brauchen 10 Tage. Wie lange brauchen 4?"}, {"stufe": "mittel", "loesung": "16 h", "hinweis": "Gesamtarbeit: 8 · 6 = 48 Maschinenstunden. 3 Maschinen: 48 : 3 = 16 h.", "aufgabe": "8 Maschinen schaffen einen Auftrag in 6 Stunden. Wie lange brauchen 3 Maschinen?"}, {"stufe": "mittel", "loesung": "2,40 €", "hinweis": "Dreisatz über 1 Heft: 5,60 : 7 = 0,80 €, dann mal 3.", "aufgabe": "7 Hefte kosten 5,60 €. Was kosten 3 Hefte?"}, {"stufe": "mittel", "loesung": "c) und d)", "hinweis": "Quotient f(x)/x konstant? c) 3,5 ✓ d) 1,4 ✓; a) fällt (8; 2; 0,67), b) steigt (1; 2; 3)", "aufgabe": "Welche Zuordnung ist proportional? Begründe. a) x: 1, 2, 3 → f(x): 8, 4, 2 b) x: 1, 2, 3 → f(x): 1, 4, 9 c) x: 2, 3, 5 → f(x): 7, 10,5, 17,5 d) x: 2, 3, 4 → f(x): 2,8, 4,2, 5,6"}, {"stufe": "mittel", "loesung": "f(x) = 0,4x", "hinweis": "Steigung = y-Wert : x-Wert = 1,6 : 4 = 0,4 – also f(x) = 0,4x.", "aufgabe": "Eine proportionale Zuordnung enthält den Wert f(4) = 1,6. Gib den Funktionsterm an."}]}], "uplus": [{"stufe": "", "loesung": "6,40 €", "hinweis": "Einheiten! 800 g = 250 g · 3,2 → 2 € · 3,2 (kombiniert Fertigkeit F4)", "aufgabe": "250 g Käse kosten 2 €. Was kosten 0,8 kg?"}, {"stufe": "", "loesung": "6 h", "hinweis": "Gesamtarbeit: 4 · 9 = 36 Rohrstunden. 6 Rohre: 36 : 6 = 6 h.", "aufgabe": "4 Rohre füllen ein Becken in 9 Stunden. Wie lange brauchen 6 Rohre?"}, {"stufe": "", "loesung": "antiproportional", "hinweis": "mehr Personen, weniger Zeit", "aufgabe": "Anzahl der Personen ↔ Zeit, bis eine Pizza aufgegessen ist. Proportional oder antiproportional?", "mc": ["antiproportional", "proportional", "weder noch"], "mcCorrect": 0}, {"stufe": "", "loesung": "525 g", "hinweis": "Dreisatz über 1 Person: 300 : 4 = 75 g, dann mal 7.", "aufgabe": "Ein Rezept für 4 Personen braucht 300 g Mehl. Wie viel für 7 Personen?"}], "transfer": [{"aufgabe": "Prüfe mit Begründung, ob die Tabelle proportional sein kann: x: 1 | 2 | 4 und y: 2 | 4 | 7", "loesung": "nein", "hinweis": "Proportional heißt: y : x überall gleich. 2:1 = 2, 4:2 = 2, aber 7:4 = 1,75 → beim letzten Paar müsste y = 8 sein (Begründungsaufgabe)"}, {"aufgabe": "„Doppelt so viele Maler, halbe Zeit – das gilt immer!“ Nimm Stellung: Wo stimmt das Modell, wo nicht?", "loesung": "SK", "hinweis": "Modell gilt, solange sich die Maler nicht behindern und die Arbeit teilbar ist; bei 100 Malern in einem kleinen Zimmer bricht es zusammen (Modellkritik, Selbstkontrolle per Musterlösung)"}, {"aufgabe": "3 Pumpen leeren einen Teich in 8 Stunden. Wie viele Pumpen braucht man, um ihn in 6 Stunden zu leeren?", "loesung": "4 Pumpen", "hinweis": "24 Pumpenstunden : 6 h = 4 – hier ist die gesuchte Größe die Anzahl"}], "wpool": [{"aufgabe": "2 Kugeln Eis kosten 5 €. Was kosten 4?", "loesung": "10 €"}, {"aufgabe": "10 Arbeiter brauchen 3 Tage. Wie lange brauchen 5?", "loesung": "6 Tage"}, {"aufgabe": "150 g kosten 1,80 €. Was kosten 50 g?", "loesung": "0,60 €"}, {"aufgabe": "2 Personen putzen 6 h. Wie lange brauchen 3 Personen?", "loesung": "4 h"}], "titel": "Der Dreisatz – dein Alltagswerkzeug"}, "A1": {"id": "A1", "kerne": [{"name": "Plus und Minus", "verstehen": ["Schau auf die Zahlengerade: Bei Plus gehst du nach rechts, bei Minus nach links. Beispiel: −7 + 12. Du startest bei −7 und gehst 12 Schritte nach rechts – du landest bei 5. Also: −7 + 12 = 5.", "Der Betrag einer Zahl ist ihr Abstand zur Null: |−3| = 3 und |3| = 3. Beim Rechnen mit Vorzeichen vergleichst du oft die Beträge – z. B. bei −7 + 12 gewinnt die 12, weil ihr Betrag größer ist.", "Die Regel: Haben beide Zahlen das gleiche Vorzeichen, addierst du und behältst das Vorzeichen (−2 + (−7) = −9). Haben sie verschiedene Vorzeichen, rechnest du den Unterschied aus – das Vorzeichen bestimmt die Zahl, die weiter von der Null entfernt ist (−7 + 12 = 5, aber −12 + 7 = −5).", "Und wenn ein Minus vor der Klammer steht? Dann dreht es das Vorzeichen in der Klammer um: 5 − (−3) = 5 + 3 = 8. Merk dir: Minus vor Minus wird Plus."], "fallen": [{"falle": "Vorzeichen der „größeren“ Zahl ignoriert", "falsch": "−7 + 12 = −19", "richtig": "−7 + 12 = 5", "warum": "Verschiedene Vorzeichen: Unterschied 12 − 7 = 5; die 12 ist weiter von Null weg und ist positiv"}, {"falle": "Minusklammer nicht umgedreht", "falsch": "5 − (−3) = 2", "richtig": "5 − (−3) = 8", "warum": "Minus vor der Klammer dreht um: 5 + 3"}], "ueben": [{"stufe": "leicht", "loesung": "5", "hinweis": "Unterschied 9 − 4, Vorzeichen der 9", "aufgabe": "−4 + 9"}, {"stufe": "leicht", "loesung": "−5", "hinweis": "Unterschied 8 − 3, Vorzeichen der −8-Richtung", "aufgabe": "3 − 8"}, {"stufe": "leicht", "loesung": "−11", "hinweis": "Gleiche Richtung (beide minus): 6 + 5, Vorzeichen −", "aufgabe": "−6 − 5"}, {"stufe": "leicht", "loesung": "−9", "hinweis": "Plusklammer weglassen: −2 − 7", "aufgabe": "−2 + (−7)"}, {"stufe": "leicht", "loesung": "8", "hinweis": "Minus vor Minus wird Plus: 5 + 3", "aufgabe": "5 − (−3)"}, {"stufe": "mittel", "loesung": "0", "hinweis": "Erst Klammer: −12 + 7 + 5", "aufgabe": "−12 + 7 − (−5)"}, {"stufe": "mittel", "loesung": "5", "hinweis": "3,5 + 1,5 – funktioniert auch mit Kommazahlen", "aufgabe": "3,5 − (−1,5)"}, {"stufe": "mittel", "loesung": "−1/2", "hinweis": "Unterschied 3/4 − 1/4 = 2/4, kürzen; Vorzeichen −", "aufgabe": "−3/4 + 1/4"}, {"stufe": "mittel", "loesung": "0", "hinweis": "Von links: −15 + 8 = −7, dann −7 + 7 = 0", "aufgabe": "−15 + 8 + 7"}]}, {"name": "Mal und Geteilt", "verstehen": ["(−3) · 4 heißt: viermal die −3, also −3 − 3 − 3 − 3 = −12. Minus mal Plus gibt Minus – so weit, so logisch. Aber warum gibt Minus mal Minus Plus? Schau dir dieses Muster an: 3 · (−4) = −12, dann 2 · (−4) = −8, dann 1 · (−4) = −4, dann 0 · (−4) = 0. Bei jedem Schritt wird das Ergebnis um 4 größer. Geht das Muster weiter, kommt (−1) · (−4) = +4. Das Muster zwingt das Plus!", "Die Regel: Gleiche Vorzeichen → Ergebnis positiv. Verschiedene Vorzeichen → Ergebnis negativ. Sie gilt genauso fürs Teilen: 18 : (−9) = −2, aber (−36) : (−4) = 9."], "fallen": [{"falle": "Minus mal Minus bleibt Minus", "falsch": "(−3) · (−4) = −12", "richtig": "(−3) · (−4) = 12", "warum": "Gleiche Vorzeichen → positiv (siehe Muster-Reihe)"}, {"falle": "Vorzeichen beim Teilen vergessen", "falsch": "12 : (−3) = 4", "richtig": "12 : (−3) = −4", "warum": "Verschiedene Vorzeichen → negativ"}], "ueben": [{"stufe": "leicht", "loesung": "−15", "hinweis": "Verschiedene Vorzeichen → negativ", "aufgabe": "(−5) · 3"}, {"stufe": "leicht", "loesung": "24", "hinweis": "Gleiche Vorzeichen → positiv", "aufgabe": "(−6) · (−4)"}, {"stufe": "leicht", "loesung": "−2", "hinweis": "Verschiedene Vorzeichen → negativ", "aufgabe": "18 : (−9)"}, {"stufe": "leicht", "loesung": "9", "hinweis": "Gleiche Vorzeichen → positiv", "aufgabe": "(−36) : (−4)"}, {"stufe": "leicht", "loesung": "1", "hinweis": "Gleiche Vorzeichen → positiv", "aufgabe": "(−1) · (−1)"}, {"stufe": "mittel", "loesung": "−6", "hinweis": "Schrittweise: (−2)·(−3) = 6, dann 6·(−1) = −6 (ungerade Anzahl Minus → minus)", "aufgabe": "(−2) · (−3) · (−1)"}, {"stufe": "mittel", "loesung": "8", "hinweis": "Von links: (−24):6 = −4, dann (−4)·(−2) = 8", "aufgabe": "(−24) : 6 · (−2)"}, {"stufe": "mittel", "loesung": "−4", "hinweis": "Auch mit Kommazahlen: verschiedene Vorzeichen → negativ", "aufgabe": "(−0,5) · 8"}, {"stufe": "mittel", "loesung": "9 und −9", "hinweis": "(−3)² = (−3)·(−3) = 9; bei −3² gilt: erst Potenz (3² = 9), dann das Minus davor → −9", "aufgabe": "(−3)² und −3²"}]}], "uplus": [{"stufe": "", "loesung": "0", "hinweis": "Erst Punkt: (−3)·4 = −12; dann −12 + 12 = 0", "aufgabe": "(−3) · 4 − (−12)"}, {"stufe": "", "loesung": "25", "hinweis": "Erst Klammer: 2 − 7 = −5; dann −5 · (−5) = 25", "aufgabe": "−5 · (2 − 7)"}, {"stufe": "", "loesung": "2", "hinweis": "Punkt vor Strich: −4 + 6 = 2", "aufgabe": "24 : (−6) + (−3) · (−2)"}, {"stufe": "", "loesung": "−10", "hinweis": "Klammer: −5; Minus davor: +5; dann 5 · (−2) = −10", "aufgabe": "−(4 − 9) · (−2)"}, {"stufe": "", "loesung": "−8", "hinweis": "(−2)·(−2)·(−2) = 4·(−2) = −8 (ungerade Anzahl Minus)", "aufgabe": "(−2)³"}, {"stufe": "", "loesung": "−3/4", "hinweis": "Punkt vor Strich: 2/3 · (−3/8) = −1/4; −1/2 − 1/4", "aufgabe": "−0,5 + 2/3 · (−3/8)"}, {"stufe": "", "loesung": "0,2 (= 1/5)", "hinweis": "Einheitliche Darstellung: −3/10 + 6/10 − 1/10 = 2/10", "aufgabe": "−0,3 + 3/5 − 0,1"}, {"stufe": "", "loesung": "−0,1", "hinweis": "Erst Division: 0,5 · 4/5 = 0,4; dann 0,3 − 0,4", "aufgabe": "0,3 − 0,5 : 5/4"}, {"stufe": "", "loesung": "−47", "hinweis": "Ausmultiplizieren: −40 − 7", "aufgabe": "8 · (−5 − 7/8)"}], "transfer": [{"aufgabe": "Morgens zeigt das Thermometer −8 °C. Bis mittags steigt die Temperatur um 15 °C. Wie warm ist es mittags?", "loesung": "7 °C", "hinweis": "Ansatz: −8 + 15. Unterschied 15 − 8 = 7, die 15 ist positiv und weiter von Null. Mittags sind es 7 °C."}, {"aufgabe": "Auf Linas Konto sind −23,50 € (das Konto ist überzogen). Ihre Oma überweist 40 €. Wie viel ist danach auf dem Konto?", "loesung": "16,50 €", "hinweis": "Ansatz: −23,50 + 40. Unterschied 40 − 23,50 = 16,50, positiv. Danach sind 16,50 € auf dem Konto."}, {"aufgabe": "Eine Drohne fliegt 35 m über dem Meeresspiegel, ein U-Boot fährt 48 m darunter (−48 m). Wie groß ist der Höhenunterschied?", "loesung": "83 m", "hinweis": "Ansatz: 35 − (−48) = 35 + 48 = 83. Der Höhenunterschied beträgt 83 m. (Falle: 35 − 48 = −13 wäre falsch – Abstand heißt Differenz der Höhen, das Minus der Tiefe muss umgedreht werden.)"}], "wpool": [{"aufgabe": "−9 + 4", "loesung": "−5"}, {"aufgabe": "(−7) · (−2)", "loesung": "14"}, {"aufgabe": "6 − 10", "loesung": "−4"}, {"aufgabe": "−20 : 5", "loesung": "−4"}, {"aufgabe": "−3 + (−3)", "loesung": "−6"}], "titel": "Plus, Minus und die Vorzeichen im Griff"}, "B1": {"id": "B1", "titel": "Die binomischen Formeln knacken", "kerne": [{"name": "", "verstehen": ["Rechne (x + 3)². Das heißt (x + 3) · (x + 3). Multipliziere jeden mit jedem: x² + 3x + 3x + 9 = x² + 6x + 9. Genau das sagt die 1. binomische Formel: (a + b)² = a² + 2ab + b². Das mittlere Glied 2ab entsteht, weil das gemischte Produkt zweimal vorkommt.", "Warum das stimmt, zeigt ein Quadrat mit Seitenlänge a + b: Es zerfällt in ein Quadrat a², ein Quadrat b² und zwei Rechtecke a · b. Zusammen: a² + 2ab + b².", "Die anderen beiden: (a − b)² = a² − 2ab + b² (2. Formel, Minus nur beim mittleren Glied) und (a + b)(a − b) = a² − b² (3. Formel – hier heben sich die gemischten Produkte auf). Mit den Formeln rechnest du schneller und sicherer als mit Ausmultiplizieren – und du erkennst sie später beim Faktorisieren wieder."], "fallen": [{"falle": "Mittleres Glied vergessen", "falsch": "(x + 3)² = x² + 9", "richtig": "(x + 3)² = x² + 6x + 9", "warum": "Das gemischte Produkt kommt zweimal vor: 2 · x · 3 = 6x"}, {"falle": "2. und 3. Formel verwechselt", "falsch": "(a − b)² = a² − b²", "richtig": "(a − b)² = a² − 2ab + b²", "warum": "a² − b² gehört zu (a + b)(a − b); beim Quadrat bleibt +b²"}], "ueben": [{"stufe": "leicht", "aufgabe": "(x + 2)²", "loesung": "x² + 4x + 4", "hinweis": "1. Formel: 2 · x · 2 = 4x"}, {"stufe": "leicht", "aufgabe": "(x − 5)²", "loesung": "x² − 10x + 25", "hinweis": "2. Formel"}, {"stufe": "leicht", "aufgabe": "(x + 4)(x − 4)", "loesung": "x² − 16", "hinweis": "3. Formel"}, {"stufe": "leicht", "aufgabe": "(a + 7)²", "loesung": "a² + 14a + 49", "hinweis": "1. Formel"}, {"stufe": "leicht", "aufgabe": "(3 + x)²", "loesung": "9 + 6x + x²", "hinweis": "Auch wenn die Zahl vorn steht: gleiche Formel"}, {"stufe": "mittel", "aufgabe": "(3a + b)²", "loesung": "9a² + 6ab + b²", "hinweis": "(3a)² = 9a²; 2 · 3a · b = 6ab"}, {"stufe": "mittel", "aufgabe": "(4x − y)²", "loesung": "16x² − 8xy + y²", "hinweis": "2. Formel mit (4x)²"}, {"stufe": "mittel", "aufgabe": "(2x + 5)(2x − 5)", "loesung": "4x² − 25", "hinweis": "3. Formel mit (2x)²"}, {"stufe": "mittel", "aufgabe": "(5a − 2b)²", "loesung": "25a² − 20ab + 4b²", "hinweis": "2 · 5a · 2b = 20ab"}, {"stufe": "mittel", "aufgabe": "Ergänze: x² − ▢x + 16 = (x − 4)²", "loesung": "8", "hinweis": "Rückwärts lesen: 2 · x · 4"}]}], "uplus": [{"stufe": "", "aufgabe": "(2x + y)(2x − y) − 2 · (2x)²", "loesung": "−4x² − y²", "hinweis": "3. Formel: 4x² − y²; 2 · (2x)² = 8x²; 4x² − y² − 8x²"}, {"stufe": "", "aufgabe": "(2x − 3)² − (x + 2) · (1/2 + x)", "loesung": "3x² − 14,5x + 8", "hinweis": "4x² − 12x + 9 − (x² + 2,5x + 1)"}], "transfer": [{"stufe": "", "aufgabe": "Begründe mit einer Skizze, warum (a + b)² = a² + 2ab + b² gilt.", "loesung": "Flächenmodell", "hinweis": "Quadrat mit Seite a + b zerlegen: ein Quadrat a², ein Quadrat b², zwei Rechtecke a · b. Gesamtfläche a² + 2ab + b²."}, {"stufe": "", "aufgabe": "Rechne geschickt im Kopf: a) 21² b) 19 · 21", "loesung": "441 und 399", "hinweis": "a) (20 + 1)² = 400 + 40 + 1 = 441. b) (20 − 1)(20 + 1) = 400 − 1 = 399."}, {"stufe": "", "aufgabe": "Von einem Rechteck ist eine Seite 3 cm länger als die andere. Verlängert man beide Seiten um 1 cm, wächst der Flächeninhalt um 22 cm². Wie lang sind die ursprünglichen Seiten?", "loesung": "9 cm und 12 cm", "hinweis": "(x + 1)(x + 4) = x(x + 3) + 22 → x² + 5x + 4 = x² + 3x + 22 → 2x = 18 → x = 9. Seiten: 9 cm und 12 cm. Probe: 10 · 13 = 130 = 9 · 12 + 22 ✓"}], "wpool": [{"aufgabe": "(x + 1)²", "loesung": "x² + 2x + 1"}, {"aufgabe": "(x − 2)²", "loesung": "x² − 4x + 4"}, {"aufgabe": "(x + 5)(x − 5)", "loesung": "x² − 25"}, {"aufgabe": "31² im Kopf (Trick!)", "loesung": "961"}, {"aufgabe": "Welche Formel steckt in a² − 49?", "loesung": "3. (a + 7)(a − 7)"}]}, "B2": {"id": "B2", "titel": "Potenzen – kurz geschrieben, viel drin", "kerne": [{"name": "", "verstehen": ["2⁵ heißt: fünfmal die 2 multiplizieren: 2 · 2 · 2 · 2 · 2 = 32. Die kleine Zahl (Exponent) zählt die Faktoren. Deshalb gilt: 2³ · 2⁴ = (2 · 2 · 2) · (2 · 2 · 2 · 2) = 2⁷ – bei gleicher Basis addierst du die Exponenten.", "Steht ein Produkt in der Klammer, wird jeder Faktor potenziert: (2x)³ = 2³ · x³ = 8x³. Und Vorsicht bei Minus: (−3)² = 9, aber −3² = −(3²) = −9. Ohne Klammer gehört das Minus nicht zur Basis – Potenz kommt vor dem Vorzeichen dran (Hoch vor Punkt vor Strich).", "Gerade Anzahl von Minusfaktoren gibt Plus, ungerade gibt Minus: (−2)³ = −8, (−2)⁴ = 16."], "fallen": [{"falle": "Exponenten multipliziert statt addiert", "falsch": "2³ · 2⁴ = 2¹²", "richtig": "2³ · 2⁴ = 2⁷", "warum": "Faktoren zählen: 3 + 4 = 7 Zweien"}, {"falle": "Klammer beim Quadrieren ignoriert", "falsch": "(−5x)² = −25x²", "richtig": "(−5x)² = 25x²", "warum": "(−5x) · (−5x): Minus mal Minus gibt Plus"}], "ueben": [{"stufe": "leicht", "aufgabe": "2³ · 2²", "loesung": "2⁵ = 32", "hinweis": "Exponenten addieren"}, {"stufe": "leicht", "aufgabe": "x³ · x⁴", "loesung": "x⁷", "hinweis": "Gleiche Basis"}, {"stufe": "leicht", "aufgabe": "(−2)³", "loesung": "−8", "hinweis": "Ungerade Anzahl Minus"}, {"stufe": "leicht", "aufgabe": "(−3)² und −3²", "loesung": "9 und −9", "hinweis": "Klammer entscheidet"}, {"stufe": "leicht", "aufgabe": "(3x)²", "loesung": "9x²", "hinweis": "Jeder Faktor wird quadriert"}, {"stufe": "mittel", "aufgabe": "(2x)³", "loesung": "8x³", "hinweis": "2³ = 8"}, {"stufe": "mittel", "aufgabe": "a² · a³ · a", "loesung": "a⁶", "hinweis": "2 + 3 + 1 = 6"}, {"stufe": "mittel", "aufgabe": "0,3y³ · (−1 1/6 · y⁵)", "loesung": "−0,35y⁸", "hinweis": "0,3 · (−7/6) = −0,35; y³ · y⁵ = y⁸"}, {"stufe": "mittel", "aufgabe": "(7/3)s²t⁵ · (3s²t)²", "loesung": "21s⁶t⁷", "hinweis": "Erst (3s²t)² = 9s⁴t²; 7/3 · 9 = 21"}, {"stufe": "mittel", "aufgabe": "(2x)³ − (−11x³ + 5x)", "loesung": "19x³ − 5x", "hinweis": "8x³ + 11x³ − 5x"}]}], "uplus": [{"stufe": "", "aufgabe": "2⁵ · 2³ als Zahl", "loesung": "256", "hinweis": "2⁸ = 256"}, {"stufe": "", "aufgabe": "Was ist größer: 2¹⁰ oder 10³?", "loesung": "2¹⁰", "hinweis": "1024 > 1000"}, {"stufe": "", "aufgabe": "(10²)³ als Zehnerpotenz", "loesung": "10⁶", "hinweis": "Quadrat hoch drei: 10² · 10² · 10² – Exponenten addieren"}], "transfer": [{"stufe": "", "aufgabe": "Ein Blatt Papier ist 0,1 mm dick. Du faltest es 10-mal (jedes Falten verdoppelt die Dicke). Wie dick ist der Stapel?", "loesung": "102,4 mm (ca. 10 cm)", "hinweis": "Dicke = 0,1 mm · 2¹⁰ = 0,1 · 1024 = 102,4 mm ≈ 10 cm. Antwort: gut 10 cm – Potenzen wachsen schneller, als man denkt."}, {"stufe": "", "aufgabe": "Veranschauliche T(a) = 3a² geometrisch.", "loesung": "Skizze", "hinweis": "Drei Quadrate mit Seitenlänge a (je Fläche a²) – oder ein Rechteck mit den Seiten a und 3a."}], "wpool": [{"aufgabe": "2⁴", "loesung": "16"}, {"aufgabe": "x² · x³", "loesung": "x⁵"}, {"aufgabe": "(−1)⁷", "loesung": "−1"}, {"aufgabe": "(3x)²", "loesung": "9x²"}, {"aufgabe": "−2²", "loesung": "−4"}]}, "B3": {"id": "B3", "titel": "Winkel-Detektiv", "kerne": [{"name": "", "verstehen": ["An einer Geradenkreuzung gilt: Gegenüberliegende Winkel (Scheitelwinkel) sind gleich groß, nebeneinanderliegende (Nebenwinkel) ergänzen sich zu 180°. Beispiel aus dem Buch: Ist ein Winkel 45°, dann ist sein Scheitelwinkel 45° und jeder Nebenwinkel 180° − 45° = 135°.", "Schneidet eine Gerade zwei PARALLELE Geraden, sind Stufenwinkel gleich groß und Wechselwinkel gleich groß. Wichtig: Das gilt nur bei Parallelen – prüfe das immer zuerst!", "In jedem Dreieck beträgt die Winkelsumme 180°. Warum? Zeichne durch eine Ecke die Parallele zur Gegenseite: Nach dem Wechselwinkelsatz erscheinen dort alle drei Innenwinkel nebeneinander – zusammen eine halbe Drehung, also 180°. Im Viereck sind es 360° (zwei Dreiecke), im n-Eck (n − 2) · 180°."], "fallen": [{"falle": "Nebenwinkel zu 90° ergänzt", "falsch": "Nebenwinkel von 120° = −30°/„geht nicht“", "richtig": "180° − 120° = 60°", "warum": "Nebenwinkel ergänzen sich zu 180°, nicht zu 90°"}, {"falle": "Stufenwinkel ohne Parallelen benutzt", "falsch": "„Stufenwinkel, also gleich“ bei beliebigen Geraden", "richtig": "Erst Parallelität prüfen/begründen", "warum": "Stufen-/Wechselwinkelsatz gilt nur bei g ∥ h"}], "ueben": [{"stufe": "leicht", "aufgabe": "Zwei Geraden schneiden sich, ein Winkel misst 45°. Scheitelwinkel? Nebenwinkel?", "loesung": "45° und 135°", "hinweis": "Scheitelwinkel gleich; Nebenwinkel 180° − 45°"}, {"stufe": "leicht", "aufgabe": "Dreieck: α = 46°, γ = 67°. β = ?", "loesung": "67°", "hinweis": "Winkelsumme: 180° − 46° − 67°"}, {"stufe": "leicht", "aufgabe": "Rechtwinkliges Dreieck, ein spitzer Winkel 35°. Der andere?", "loesung": "55°", "hinweis": "90° + 35° + x = 180°"}, {"stufe": "leicht", "aufgabe": "Viereck: 80°, 70°, 110°. Vierter Winkel?", "loesung": "100°", "hinweis": "Winkelsumme Viereck 360°"}, {"stufe": "leicht", "aufgabe": "g ∥ h, Stufenwinkel zu 72°?", "loesung": "72°", "hinweis": "Stufenwinkelsatz (Parallelen!)"}, {"stufe": "mittel", "aufgabe": "Gleichschenkliges Dreieck: α = 54°, β = γ. β = ?", "loesung": "63°", "hinweis": "(180° − 54°) : 2"}, {"stufe": "mittel", "aufgabe": "Dreieck: α = 2β, γ = 1,5β. Alle Winkel?", "loesung": "β = 40°, α = 80°, γ = 60°", "hinweis": "2β + β + 1,5β = 180° → 4,5β = 180°"}, {"stufe": "mittel", "aufgabe": "Regelmäßiges 8-Eck (Stoppschild): Innenwinkel?", "loesung": "135°", "hinweis": "(8 − 2) · 180° = 1080°; 1080° : 8"}, {"stufe": "mittel", "aufgabe": "Dreieck: β ist doppelt so groß wie α, α ist um 40° kleiner als γ. Alle Winkel?", "loesung": "α = 35°, β = 70°, γ = 75°", "hinweis": "α + 2α + (α + 40°) = 180° → 4α = 140°"}, {"stufe": "mittel", "aufgabe": "Dreieck: α = 50°, β = 60°. Außenwinkel bei C?", "loesung": "110°", "hinweis": "Außenwinkel = Summe der nicht anliegenden Innenwinkel"}]}], "uplus": [{"stufe": "", "aufgabe": "An einer Doppelkreuzung sind 88°, 57° und 45° auf einer Geradenseite markiert. Kann das stimmen?", "loesung": "Nein", "hinweis": "88° + 57° + 45° = 190° ≠ 180° – die drei Winkel auf einer Geradenseite müssen 180° ergeben"}, {"stufe": "", "aufgabe": "Viereck mit 80°, 70° und zwei gleich großen Winkeln α. α = ?", "loesung": "105°", "hinweis": "2α = 360° − 150°"}], "transfer": [{"stufe": "", "aufgabe": "Zwei Parallelen werden von einer Geraden geschnitten. Einer der acht Winkel misst 118°. Gib alle acht Winkel an und begründe mit den Winkelsätzen.", "loesung": "4 × 118° und 4 × 62°", "hinweis": "Nebenwinkel: 180° − 118° = 62°. Scheitelwinkel verdoppeln beide Werte an der ersten Kreuzung; Stufenwinkelsatz überträgt sie auf die zweite. Jeder Schritt mit Satzname."}, {"stufe": "", "aufgabe": "Dreieck: β ist doppelt so groß wie α, γ ist um 30° größer als α. Stelle eine Gleichung auf und berechne alle Winkel.", "loesung": "α = 37,5°, β = 75°, γ = 67,5°", "hinweis": "α + 2α + (α + 30°) = 180° → 4α = 150° → α = 37,5°. Probe: 37,5° + 75° + 67,5° = 180° ✓"}], "wpool": [{"aufgabe": "Scheitelwinkel von 71°", "loesung": "71°"}, {"aufgabe": "Nebenwinkel von 120°", "loesung": "60°"}, {"aufgabe": "Dreieck: 90° und 35°, dritter Winkel?", "loesung": "55°"}, {"aufgabe": "Winkelsumme im Viereck", "loesung": "360°"}, {"aufgabe": "Winkelsumme im Sechseck", "loesung": "720°"}]}, "B4": {"id": "B4", "titel": "Daten auf einen Blick", "kerne": [{"name": "", "verstehen": ["Der Median ist der mittlere Wert der GEORDNETEN Liste – ordne also immer zuerst! Bei gerader Anzahl nimmst du den Mittelwert der beiden mittleren Werte. Die Spannweite ist der Abstand zwischen kleinstem und größtem Wert.", "Ein Boxplot zeigt fünf Kennwerte auf einen Blick: Minimum, unteres Quartil, Median, oberes Quartil, Maximum. Die Box umfasst die mittlere Hälfte aller Daten – vom unteren Quartil (ein Viertel der Daten liegt darunter oder ist gleich groß) bis zum oberen Quartil. Die Striche links und rechts („Antennen“ oder Whisker) reichen bis Minimum und Maximum. Der Strich in der Box ist der Median.", "Wichtig (steht so auch im Buch): Der Durchschnitt wird im Boxplot NICHT dargestellt. Eine kurze Box heißt: Die mittlere Hälfte der Daten liegt eng beieinander."], "fallen": [{"falle": "Median aus ungeordneter Liste", "falsch": "Median von 12, 3, 15, 8, 7 ist 15", "richtig": "Ordnen: 3, 7, 8, 12, 15 → Median 8", "warum": "Erst ordnen, dann Mitte"}, {"falle": "Boxplot-Strich als Durchschnitt gelesen", "falsch": "„Der Strich in der Box ist der Mittelwert“", "richtig": "Der Strich ist der Median", "warum": "Der Durchschnitt wird im Boxplot nicht veranschaulicht"}], "ueben": [{"stufe": "leicht", "aufgabe": "Median von 12, 3, 15, 8, 7", "loesung": "8", "hinweis": "Ordnen: 3, 7, 8, 12, 15"}, {"stufe": "leicht", "aufgabe": "Spannweite von 3, 9, 4, 12, 7", "loesung": "9", "hinweis": "12 − 3"}, {"stufe": "leicht", "aufgabe": "Median von 4, 7, 9, 12", "loesung": "8", "hinweis": "Gerade Anzahl: (7 + 9) : 2"}, {"stufe": "leicht", "aufgabe": "Welcher Anteil der Daten liegt in der Box eines Boxplots?", "loesung": "50 % (die mittlere Hälfte)", "hinweis": ""}, {"stufe": "mittel", "aufgabe": "Datenreihe 5, 6, 2, 3, 6, 6, 1, 7, 2, 3, 3, 4, 10, 4: Median, Quartile, Spannweite (für einen Boxplot)", "loesung": "Median 4; Q1 = 3; Q3 = 6; Spannweite 9", "hinweis": "Ordnen (14 Werte): 1, 2, 2, 3, 3, 3, 4, 4, 5, 6, 6, 6, 7, 10. Median = (4 + 4) : 2 = 4. Quartile: in beiden Konventionen 3 und 6. Spannweite 10 − 1 = 9."}, {"stufe": "mittel", "aufgabe": "Noten-Beispiel des Buches (26 Werte): Median 3, unteres Quartil 2, oberes Quartil 3,5 – erkläre, was das untere Quartil hier bedeutet.", "loesung": "Ein Viertel der Arbeiten hat Note 2 oder besser", "hinweis": ""}, {"stufe": "mittel", "aufgabe": "Boxplot ablesen: Spannweite, Median, Quartile", "loesung": "Noten 1 bis 5,5; Median 2,5; Quartile 2 und 3,5", "hinweis": ""}]}], "uplus": [{"stufe": "", "aufgabe": "Zwei Klassen schreiben dieselbe Arbeit. Boxplot A hat eine kurze Box, Boxplot B eine lange (gleicher Median). Welche Klasse ist im Mittelfeld homogener?", "loesung": "Klasse A", "hinweis": "Kurze Box = mittlere Hälfte eng beieinander"}], "transfer": [{"stufe": "", "aufgabe": "Deine Klasse sammelt die Anzahl der Geschwister: 0, 1, 1, 0, 2, 3, 1, 0, 1, 2, 1, 4. Bestimme alle fünf Kennwerte und zeichne den Boxplot. Beschreibe die Verteilung in zwei Sätzen.", "loesung": "Min 0, Q1 0,5, Median 1, Q3 2, Max 4", "hinweis": "Ordnen (12 Werte): 0, 0, 0, 1, 1, 1, 1, 1, 2, 2, 3, 4. Median = (1 + 1) : 2 = 1. Untere Hälfte 0, 0, 0, 1, 1, 1 → Q1 = 0,5; obere Hälfte 1, 1, 2, 2, 3, 4 → Q3 = 2. Spannweite 4. Interpretation: Die Hälfte hat höchstens 1 Geschwister; Ausreißer nach oben (4)."}], "wpool": [{"aufgabe": "Median von 1, 3, 5", "loesung": "3"}, {"aufgabe": "Spannweite von 2 bis 11", "loesung": "9"}, {"aufgabe": "Anteil der Daten in der Box", "loesung": "50 %"}, {"aufgabe": "Median von 2, 4, 6, 8", "loesung": "5"}, {"aufgabe": "Was zeigt der Strich in der Box?", "loesung": "Median"}]}, "B5": {"id": "B5", "titel": "Zinsen verstehen", "kerne": [{"name": "", "verstehen": ["Zinsrechnung ist Prozentrechnung mit neuen Namen – so steht es im Buch: Zinssatz p % entspricht dem Prozentsatz, das Kapital K dem Grundwert und die (Jahres-)Zinsen Z dem Prozentwert. Das Kapital ist das Geld, das du der Bank überlässt; die Zinsen sind das Geld, das du dafür bekommst.", "Die drei Grundaufgaben löst du mit einer Formel: Zinsen Z = K · p/100 (Beispiel: 400 € zu 2 % → 8 €). Zinssatz p = Z/K · 100 (Beispiel: 6,25 € Zinsen auf 250 € → 2,5 %). Kapital K = Z/p · 100 (Beispiel: 240 € Zinsen bei 4 % → 6000 €).", "Liegt das Geld kürzer als ein Jahr an, zählst du den Zeitanteil dazu: Ein halbes Jahr bringt die halben Jahreszinsen, ein Vierteljahr ein Viertel."], "fallen": [{"falle": "Z und K beim Zinssatz vertauscht", "falsch": "p = K/Z · 100", "richtig": "p = Z/K · 100", "warum": "Der Zinssatz misst die Zinsen im Verhältnis zum Kapital"}, {"falle": "Zeitanteil vergessen", "falsch": "500 € zu 4 % für ½ Jahr → 20 €", "richtig": "20 € · ½ = 10 €", "warum": "Jahreszins gilt für ein GANZES Jahr"}], "ueben": [{"stufe": "leicht", "aufgabe": "400 € zu 2 % – Jahreszinsen?", "loesung": "8 €", "hinweis": "Z = 400 · 2/100"}, {"stufe": "leicht", "aufgabe": "250 € bringen 6,25 € Zinsen. Zinssatz?", "loesung": "2,5 %", "hinweis": "p = 6,25/250 · 100"}, {"stufe": "leicht", "aufgabe": "Bei 4 % Zinssatz zahlt man 240 € Zinsen. Kapital (Darlehen)?", "loesung": "6000 €", "hinweis": "K = 240/4 · 100"}, {"stufe": "leicht", "aufgabe": "280 € zu 0,75 %?", "loesung": "2,10 €", "hinweis": ""}, {"stufe": "leicht", "aufgabe": "5000 € zu 3,75 %?", "loesung": "187,50 €", "hinweis": ""}, {"stufe": "mittel", "aufgabe": "K = 1500 €, p = 2 %. Z = ?", "loesung": "30 €", "hinweis": ""}, {"stufe": "mittel", "aufgabe": "Z = 41,25 €, p = 2 3/4 %. K = ?", "loesung": "1500 €", "hinweis": "2 3/4 % = 2,75 %; K = 41,25/2,75 · 100"}, {"stufe": "mittel", "aufgabe": "K = 1100 €, Z = 44 €. p = ?", "loesung": "4 %", "hinweis": ""}, {"stufe": "mittel", "aufgabe": "K = 4000 €, Z = 240 €. p = ?", "loesung": "6 %", "hinweis": ""}, {"stufe": "mittel", "aufgabe": "Z = 30 €, p = 12 %. K = ?", "loesung": "250 €", "hinweis": ""}, {"stufe": "mittel", "aufgabe": "K = 873,40 €, p = 5 %. Z = ?", "loesung": "43,67 €", "hinweis": ""}]}], "uplus": [{"stufe": "", "aufgabe": "500 € liegen ein halbes Jahr zu 4 % an. Zinsen?", "loesung": "10 €", "hinweis": "500 · 0,04 = 20; · ½"}, {"stufe": "", "aufgabe": "1200 € liegen 3 Monate zu 4 % an. Zinsen?", "loesung": "12 €", "hinweis": "1200 · 0,04 = 48; · ¼ = 12"}], "transfer": [{"stufe": "", "aufgabe": "Katharina und Mario haben je 600 €, Anlage für 2 Jahre. Katharina: 2 % pro Jahr. Mario: erst 1 %, dann 3 %. Wer bekommt mehr? Begründe durch Rechnung.", "loesung": "Katharina (24,24 € zu 24,18 €)", "hinweis": "Katharina: 600 · 1,02 = 612; 612 · 1,02 = 624,24 → 24,24 € Zinsen. Mario: 600 · 1,01 = 606; 606 · 1,03 = 624,18 → 24,18 €. Der Unterschied entsteht, weil Katharinas Zinsen im 2. Jahr mitverzinst werden."}, {"stufe": "", "aufgabe": "Familie Berg kann höchstens 180 € Zinsen pro Jahr zahlen. Die Bank verlangt 3 %. Wie hoch darf das Darlehen höchstens sein?", "loesung": "6000 €", "hinweis": "K = Z/p · 100 = 180/3 · 100 = 6000. Antwort: höchstens 6000 €."}], "wpool": [{"aufgabe": "100 € zu 5 %", "loesung": "5 €"}, {"aufgabe": "200 € zu 3 %", "loesung": "6 €"}, {"aufgabe": "4 € Zinsen auf 200 € – Zinssatz?", "loesung": "2 %"}, {"aufgabe": "10 € Zinsen bei 2 % – Kapital?", "loesung": "500 €"}, {"aufgabe": "1000 € zu 6 % für ½ Jahr", "loesung": "30 €"}]}, "C1": {"id": "C1", "titel": "Dreiecke konstruieren wie ein Profi", "kerne": [{"name": "", "verstehen": ["Zwei Figuren sind kongruent, wenn sie deckungsgleich sind – gleiche Form UND gleiche Größe. Bei Dreiecken musst du nicht alle sechs Stücke vergleichen. Drei passende reichen, das sagen die Kongruenzsätze: sss (drei Seiten), sws (zwei Seiten und der EINGESCHLOSSENE Winkel), wsw (eine Seite und die beiden anliegenden Winkel) und Ssw (zwei Seiten und der Gegenwinkel der größeren Seite).", "Beispiel aus dem Buch: c = 5 cm, α = 80°, β = 55° und c′ = 5 cm, α′ = 80°, γ′ = 45°. Sieht verschieden aus? Rechne β′ = 180° − 80° − 45° = 55° – schon passt wsw, die Dreiecke sind kongruent.", "Vor jeder Konstruktion prüfst du, ob das Dreieck überhaupt existiert: Die Winkelsumme darf 180° nicht sprengen, und je zwei Seiten müssen zusammen länger sein als die dritte (Dreiecksungleichung). Dann: Planfigur skizzieren, gegebene Stücke farbig markieren, konstruieren, Vorgehen beschreiben."], "fallen": [{"falle": "Winkelsumme nicht geprüft", "falsch": "a = 4 cm, β = 95°, γ = 90° „konstruieren“", "richtig": "Geht nicht: 95° + 90° = 185° > 180°", "warum": "Erst Existenz prüfen"}, {"falle": "sws ohne eingeschlossenen Winkel", "falsch": "Zwei Seiten + irgendein Winkel = eindeutig", "richtig": "Der Winkel muss ZWISCHEN den Seiten liegen", "warum": "Sonst gilt nur Ssw – und nur mit Gegenwinkel der größeren Seite"}], "ueben": [{"stufe": "leicht", "aufgabe": "Von einem Dreieck kennst du zwei Seiten und den Winkel dazwischen. Lässt es sich eindeutig zeichnen?", "loesung": "Ja, immer (sws)", "hinweis": "", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 0}, {"stufe": "leicht", "aufgabe": "a = 4, b = 6, c = 7 und a′ = 6, b′ = 7, c′ = 4 (je cm): kongruent?", "loesung": "Ja (sss – gleiche drei Seiten, nur umbenannt)", "hinweis": "", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 0}, {"stufe": "leicht", "aufgabe": "Kann ein Dreieck die Seiten 2 cm, 3 cm und 6 cm haben?", "loesung": "Nein (2 + 3 < 6)", "hinweis": "Dreiecksungleichung", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 1}, {"stufe": "leicht", "aufgabe": "c = 5 cm, α = 80°, β = 55° und c′ = 5 cm, α′ = 80°, γ′ = 45°: kongruent?", "loesung": "Ja (β′ = 55° → wsw)", "hinweis": "", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 0}, {"stufe": "mittel", "aufgabe": "a = 4 cm, β = 95°, γ = 90°: konstruierbar?", "loesung": "Nein (Winkelsumme > 180°)", "hinweis": "", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 1}, {"stufe": "mittel", "aufgabe": "Konstruiere ein Dreieck aus a = 9 cm, c = 6,5 cm, γ = 40°. Planfigur + Beschreibung.", "loesung": "Musterlösung: γ liegt bei C zwischen a und b: CB = 9 cm zeichnen, in C den 40°-Winkel antragen, Kreis um B mit r = 6,5 cm schneidet den freien Schenkel (zwei Schnittpunkte möglich → Ssw-Fall diskutieren)", "hinweis": "", "format": "SK"}, {"stufe": "mittel", "aufgabe": "Konstruiere ein Dreieck aus a = 5 cm, b = 4,5 cm, h_c = 2,5 cm. Beschreibe dein Vorgehen.", "loesung": "Musterlösung: Parallele im Abstand 2,5 cm zu c nutzen; C liegt auf ihr; Kreise um C mit b und a schneiden c", "hinweis": "", "format": "SK"}, {"stufe": "mittel", "aufgabe": "Sind die Dreiecke kongruent? c = 4,5 cm, α = 77°, β = 38° und c′ = 4,5 cm, α′ = 77°, γ′ = 55°", "loesung": "Nein (β′ = 180° − 77° − 55° = 48° ≠ 38°)", "hinweis": "", "format": "MC", "mc": ["Ja", "Nein"], "mcCorrect": 1}]}], "uplus": [{"stufe": "", "aufgabe": "Richtig oder falsch? „Zwei Dreiecke sind kongruent, wenn sie in drei Seiten übereinstimmen.“", "loesung": "Richtig (sss)", "hinweis": "", "format": "MC", "mc": ["Richtig", "Falsch"], "mcCorrect": 0}, {"stufe": "", "aufgabe": "Richtig oder falsch? „Zwei Dreiecke sind kongruent, wenn sie in der Länge einer Seite und im Flächeninhalt übereinstimmen.“", "loesung": "Falsch", "hinweis": "Gegenbeispiel: gleiche Grundseite, gleiche Höhe, aber verschiedene Form", "format": "MC", "mc": ["Richtig", "Falsch"], "mcCorrect": 1}], "transfer": [{"stufe": "", "aufgabe": "Die Höhe eines Kirchturms soll bestimmt werden: Von den Endpunkten der 80 m langen, auf den Turm zulaufenden Standlinie AB misst man die Winkel α = 25° und β = 62°. Bestimme die Höhe durch eine maßstäbliche Dreieckskonstruktion.", "loesung": "≈ 50 m (Zeichengenauigkeit ± 3 m)", "hinweis": "Maßstab wählen (z. B. 1 cm ≙ 10 m): AB = 8 cm; in A den Winkel 25°, in B den Nebenwinkel von 62° antragen → Spitze C; Höhe von C auf die Gerade AB messen und zurückrechnen.", "format": "SK"}, {"stufe": "", "aufgabe": "Konstruiere ein Dreieck mit den angegebenen Größen: b = 5 cm, γ = 115°, s_b = 4 cm (Seitenhalbierende). Beschreibe dein Vorgehen.", "loesung": "Musterlösung in der App", "hinweis": "Planfigur: s_b verbindet B mit der Mitte von b. Konstruktionsweg über Teildreieck.", "format": "SK"}], "wpool": [{"aufgabe": "Nenne die vier Kongruenzsätze (Kurzzeichen).", "loesung": "sss, sws, wsw, Ssw"}, {"aufgabe": "Seiten 5, 5, 9: konstruierbar?", "loesung": "Ja (5 + 5 > 9)"}, {"aufgabe": "Winkel 100° und 90° in einem Dreieck möglich?", "loesung": "Nein"}, {"aufgabe": "Zwei Seiten + Gegenwinkel der größeren Seite: eindeutig?", "loesung": "Ja (Ssw)"}, {"aufgabe": "Gegeben a, b und γ: welcher Satz?", "loesung": "sws"}]}, "C2": {"id": "C2", "titel": "Zirkel und Lineal – deine Werkzeuge", "kerne": [{"name": "", "verstehen": ["Konstruieren heißt: nur mit Zirkel und Lineal arbeiten – so steht es auch im Buch. Die wichtigsten Werkzeuge sind Ortslinien: Alle Punkte mit gleichem Abstand zu EINEM Punkt liegen auf einem Kreis. Alle Punkte mit gleichem Abstand zu ZWEI Punkten A und B liegen auf der Mittelsenkrechten von AB – sie steht senkrecht auf der Strecke und halbiert sie. Alle Punkte mit gleichem Abstand zu zwei Schenkeln liegen auf der Winkelhalbierenden.", "Mittelsenkrechte konstruieren: Zwei Kreise mit gleichem Radius um A und B, die sich schneiden – die Gerade durch die Schnittpunkte ist die Mittelsenkrechte. Sie ist zugleich die Symmetrieachse der Strecke.", "Im Dreieck treffen sich die drei Mittelsenkrechten in einem Punkt: dem Umkreismittelpunkt (gleich weit von allen ECKEN). Die drei Winkelhalbierenden treffen sich im Inkreismittelpunkt (gleich weit von allen SEITEN). Merkhilfe: Mittelsenkrechte → Ecken, Winkelhalbierende → Seiten."], "fallen": [{"falle": "Ortslinien verwechselt", "falsch": "„Gleich weit von A und B → Winkelhalbierende“", "richtig": "Mittelsenkrechte von AB", "warum": "Winkelhalbierende gehört zu zwei SCHENKELN, nicht zu zwei Punkten"}, {"falle": "Umkreis mit Winkelhalbierenden konstruiert", "falsch": "Umkreismittelpunkt = Schnitt der Winkelhalbierenden", "richtig": "Schnitt der MITTELSENKRECHTEN", "warum": "Der Umkreis läuft durch die Ecken – gleicher Abstand zu Ecken = Mittelsenkrechte"}], "ueben": [{"stufe": "leicht", "aufgabe": "Alle Punkte, die von A und B gleich weit entfernt sind, liegen auf …", "loesung": "der Mittelsenkrechten von AB", "hinweis": "", "format": "MC"}, {"stufe": "leicht", "aufgabe": "Konstruiere die Mittelsenkrechte einer Strecke AB = 6 cm nur mit Zirkel und Lineal.", "loesung": "Checkliste: zwei gleiche Kreise um A und B, Gerade durch die Schnittpunkte; steht senkrecht, halbiert AB", "hinweis": "", "format": "SK"}, {"stufe": "leicht", "aufgabe": "Welche Linie trifft im Dreieck den Punkt, der von allen drei Seiten gleich weit entfernt ist?", "loesung": "Winkelhalbierende (Inkreismittelpunkt)", "hinweis": "", "format": "MC"}, {"stufe": "leicht", "aufgabe": "Ordne zu: Umkreismittelpunkt ↔ ? / Inkreismittelpunkt ↔ ?", "loesung": "Mittelsenkrechten / Winkelhalbierenden", "hinweis": "", "format": "MC"}, {"stufe": "mittel", "aufgabe": "Zeichne ein Dreieck mit c = 6 cm, α = 35°, β = 112°. a) Konstruiere den Umkreis und bestimme seinen Radius. b) Konstruiere den Inkreis und bestimme seinen Radius.", "loesung": "Checkliste: Umkreis durch alle drei Ecken (Mittelsenkrechten), Inkreis berührt alle drei Seiten (Winkelhalbierende); Radius messen", "hinweis": "", "format": "SK"}, {"stufe": "mittel", "aufgabe": "Konstruiere im Dreieck ABC den Spiegelpunkt von A an der Geraden CB.", "loesung": "Checkliste: Lot von A auf CB (Lotfußpunkt F), Strecke AF über F hinaus abtragen", "hinweis": "", "format": "SK"}, {"stufe": "mittel", "aufgabe": "Welche besonderen Vierecke sind achsensymmetrisch? Nenne mindestens drei.", "loesung": "z. B. Quadrat, Rechteck, Raute, Drachenviereck, gleichschenkliges (achsensymmetrisches) Trapez", "hinweis": "", "format": "SK"}]}], "uplus": [{"stufe": "", "aufgabe": "Konstruiere die Winkelhalbierende eines 70°-Winkels und begründe, warum deine Konstruktion funktioniert.", "loesung": "Checkliste: Kreis um Scheitel schneidet beide Schenkel; zwei gleiche Kreise um die Schnittpunkte; Gerade durch Scheitel und Kreuzungspunkt. Begründung: alle Konstruktionspunkte sind von beiden Schenkeln gleich weit entfernt", "hinweis": "", "format": "SK"}], "transfer": [{"stufe": "", "aufgabe": "Ein Brunnen soll von den Häusern A und B gleich weit entfernt sein und genau 30 m von der geraden Straße g entfernt liegen. Konstruiere alle möglichen Brunnenpunkte (Maßstab wählen).", "loesung": "Schnittpunkte der Mittelsenkrechten von AB mit der Parallelen zu g im Abstand 30 m (0, 1 oder 2 Lösungen)", "hinweis": "Ortslinien kombinieren: „gleich weit von A und B“ → Mittelsenkrechte; „fester Abstand zu g“ → Parallele. Schnittpunkte markieren, Sonderfälle nennen.", "format": "SK"}, {"stufe": "", "aufgabe": "In der Planfigur ist M die Mitte der Strecke AB; BD und AE sind die Lote von B und A auf die Gerade durch C und M. Zeige: BD = AE.", "loesung": "Musterlösung: Dreiecke MBD und MAE sind kongruent (wsw: MB = MA, Scheitelwinkel bei M, rechte Winkel)", "hinweis": "", "format": "SK"}], "wpool": [{"aufgabe": "Ortslinie „gleicher Abstand zu einem Punkt“?", "loesung": "Kreis"}, {"aufgabe": "Die Mittelsenkrechte steht … und …", "loesung": "senkrecht auf AB, halbiert AB"}, {"aufgabe": "Inkreis berührt …", "loesung": "alle drei Seiten"}, {"aufgabe": "Umkreis läuft durch …", "loesung": "alle drei Ecken"}, {"aufgabe": "Symmetrieachse einer Strecke?", "loesung": "ihre Mittelsenkrechte"}, {"aufgabe": "Welche Symmetrie hat ein Parallelogramm, das kein Rechteck ist?", "loesung": "Punktsymmetrie (keine Achsensymmetrie)"}]}, "C3": {"id": "C3", "titel": "Der Trick mit dem Halbkreis (Satz des Thales)", "kerne": [{"name": "", "verstehen": ["Der Satz des Thales: Liegt der Punkt C eines Dreiecks auf einem Halbkreis über der Strecke AB (dem Thaleskreis), dann hat das Dreieck bei C einen rechten Winkel – γ = 90°. Egal, wo auf dem Halbkreis C liegt!", "Der Satz gilt auch rückwärts (Umkehrung): Ist das Dreieck ABC bei C rechtwinklig, dann liegt C auf dem Thaleskreis über AB. Die Hypotenusenmitte ist also immer der Umkreismittelpunkt eines rechtwinkligen Dreiecks.", "Wozu? Damit konstruierst du rechte Winkel ohne Geodreieck (Punkt auf dem Thaleskreis wählen) – und sogar Tangenten an einen Kreis: Thaleskreis über der Strecke PM zeichnen, seine Schnittpunkte mit dem Kreis sind die Berührpunkte. Das steht genau so im Buch."], "fallen": [{"falle": "Rechten Winkel falsch verortet", "falsch": "Der rechte Winkel liegt bei A oder B", "richtig": "Bei C – dem Punkt AUF dem Halbkreis", "warum": "AB ist der Durchmesser, C der „Wanderpunkt“"}, {"falle": "Umkehrung vergessen", "falsch": "„Thales gilt nur in eine Richtung“", "richtig": "Rechtwinklig bei C ⇒ C liegt auf dem Thaleskreis", "warum": "Satz UND Umkehrung"}], "ueben": [{"stufe": "leicht", "aufgabe": "C liegt auf einem Halbkreis über AB (AB = Durchmesser). Welcher Winkel des Dreiecks ABC ist ein rechter?", "loesung": "der bei C", "hinweis": "", "format": "MC"}, {"stufe": "leicht", "aufgabe": "Dreieck im Thaleskreis: α = 35°. Wie groß ist β?", "loesung": "55°", "hinweis": "γ = 90°, also β = 180° − 90° − 35°", "format": "E"}, {"stufe": "leicht", "aufgabe": "Dreieck im Thaleskreis: α = 25°. β = ?", "loesung": "65°", "hinweis": "", "format": "E"}, {"stufe": "leicht", "aufgabe": "Wo liegt der Umkreismittelpunkt eines rechtwinkligen Dreiecks?", "loesung": "In der Mitte der Hypotenuse", "hinweis": "Umkehrung des Satzes", "format": "MC"}, {"stufe": "mittel", "aufgabe": "Thaleskreis über AB mit Mittelpunkt D, α = 25°. Bestimme die Innenwinkel des Dreiecks ADC.", "loesung": "25°, 25°, 130°", "hinweis": "DA = DC = r → gleichschenklig; Basiswinkel 25°; 180° − 50° = 130°", "format": "E (3 FELDER)"}, {"stufe": "mittel", "aufgabe": "Gleiche Figur: Bestimme β im Dreieck BDC.", "loesung": "65°", "hinweis": "Winkel BDC = 180° − 130° = 50° (Nebenwinkel); DB = DC → gleichschenklig: (180° − 50°) : 2 = 65°. Probe: α + β = 25° + 65° = 90° ✓", "format": "E"}, {"stufe": "mittel", "aufgabe": "Beschreibe, wie du NUR mit Zirkel und Lineal die Tangenten von einem Punkt P an einen Kreis (Mittelpunkt M) konstruierst.", "loesung": "Checkliste: Strecke PM; Thaleskreis über PM; Schnittpunkte mit dem Kreis sind die Berührpunkte; P mit ihnen verbinden", "hinweis": "", "format": "SK"}]}], "uplus": [{"stufe": "", "aufgabe": "Richtig oder falsch? „Jedes Dreieck, dessen Ecke C auf dem VOLLkreis über AB liegt, ist rechtwinklig.“", "loesung": "Richtig (oberer und unterer Halbkreis)", "hinweis": "Beide Halbkreise sind Thaleskreise über AB", "format": "MC", "mc": ["Richtig", "Falsch"], "mcCorrect": 0}, {"stufe": "", "aufgabe": "Ein Dreieck hat die Winkel 90°, 30°, 60°, Hypotenuse AB = 8 cm. Wie groß ist der Umkreisradius?", "loesung": "4 cm", "hinweis": "Umkreismittelpunkt = Hypotenusenmitte → r = 8 : 2", "format": "E"}], "transfer": [{"stufe": "", "aufgabe": "Begründe mit dem Satz des Thales und seiner Umkehrung: Der Umkreisradius eines rechtwinkligen Dreiecks ist halb so lang wie die Hypotenuse.", "loesung": "Musterlösung", "hinweis": "Umkehrung: C liegt auf dem Thaleskreis über AB → der Kreis über AB durch C ist der Umkreis; sein Mittelpunkt ist die Hypotenusenmitte const STORE="mathebooster_check_v1";
let S = load() || {screen:"start", idx:0, motivation:null, answers:{}, hwnn:{}, probe:{}, strokes:{}, startedAt:null, teil2StartedAt:null, hwnnHintSeen:false, done:false, pausedAfterTeil1:false, config:{wochen:2,tage:5,minuten:20}, planCreated:false, daysDone:{}, netz:{}, netzPlan:[], curDay:null, unit:null};
if(!S.probe) S.probe={};

  for(const id of S.netzPlan){ if(d[id]==="sitzt"||d[id]==="optional"||d[id]==="optional_ab_mittel") d[id]="plan"; }
  return d;
}

/* ---------- Helpers ---------- */
const $=id=>document.getElementById(id);
const main=$("main"), statusbar=$("statusbar");
function esc(t){ return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function renderTextT(t){
  let h=esc(t);
  h=h.replace(/FRAC23/g,'<span class="frac"><span class="num">2</span><span class="den">3</span></span>');
  h=h.replace(/FRAC49/g,'<span class="frac"><span class="num">4</span><span class="den">9</span></span>');

function notiert(msg){ const n=$("notiert"); n.textContent=msg||"Danke, notiert!"; n.classList.add("show"); setTimeout(()=>n.classList.remove("show"),1300); }
function answered(){ return TASKS.filter(t=>S.answers[t.nr]!==undefined||S.hwnn[t.nr]).length; }
function setStatus(){
  if(S.screen==="day"){ statusbar.innerHTML='<div style="text-align:center"><button class="btn ghost small" id="statusBackPlan">Zurück zum Plan</button></div>';
    statusbar.querySelector("#statusBackPlan").addEventListener("click",()=>{ S.unit=null; show("plan"); }); }
  else if(S.done&&S.planCreated){ statusbar.innerHTML='<strong>Dein Plan steht.</strong> <span class="muted">Tippe im Lernplan auf einen Tag und leg los.</span>'; }
  else if(S.done){ statusbar.innerHTML='<strong>Dein Mathe-Check ist geschafft.</strong> <span class="muted">Erstelle jetzt deinen Lernplan.</span>'; }
  else if(S.screen==="task"){ statusbar.innerHTML='<strong>Dein Mathe-Check:</strong> <span class="muted">'+answered()+' von '+TASKS.length+' Aufgaben notiert · kein Test, keine Note</span>'; }
  else { statusbar.innerHTML='<span class="muted">Dein Mathe-Check wartet auf dich – kein Test, keine Note.</span>'; }
}

function confetti(){
  const c=document.createElement("canvas"); c.id="cf";
  c.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:50";
  document.body.appendChild(c);
  const x=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight;
  const cols=["#0E6E45","#FF5E3A","#D8431E","#DEF3E6","#FBE3DA"];
  const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height/2,v:2+Math.random()*3,r:3+Math.random()*4,col:cols[Math.floor(Math.random()*cols.length)],w:Math.random()*2-1}));
  let t=0; (function fall(){ t++; x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{ p.y+=p.v; p.x+=p.w; x.fillStyle=p.col; x.fillRect(p.x,p.y,p.r,p.r*1.6); });
    if(t<160) requestAnimationFrame(fall); else c.remove(); })();
}

/* ---------- Rechenfläche v1 ---------- */
function mountScratch(container, nr){
  const wrap=document.createElement("div"); wrap.className="scratch";
  const head=document.createElement("div"); head.className="row"; head.style.justifyContent="space-between";
  head.innerHTML='<span class="muted" style="font-size:.9rem">Rechenfläche – Stift, Finger oder Maus</span>';
  const clear=document.createElement("button"); clear.className="btn ghost small"; clear.textContent="Leeren";
  head.appendChild(clear); wrap.appendChild(head);
  const cv=document.createElement("canvas"); wrap.appendChild(cv); container.appendChild(wrap);
  const ctx=cv.getContext("2d");
  function strokes(){ return S.strokes[nr]||(S.strokes[nr]=[]); }
  function redraw(){
    ctx.clearRect(0,0,cv.clientWidth,cv.clientHeight);
    strokes().forEach(st=>{ if(st.length<2)return; ctx.beginPath(); ctx.moveTo(st[0],st[1]);
      for(let i=2;i<st.length;i+=2) ctx.lineTo(st[i],st[i+1]); ctx.stroke(); });
  }
  function resize(){
    const w=cv.clientWidth, h=cv.clientHeight;
    cv.width=w*devicePixelRatio; cv.height=h*devicePixelRatio;
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    ctx.lineWidth=2; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#173B2E";
    redraw();
  }
  let cur=null;
  cv.addEventListener("pointerdown",e=>{ cv.setPointerCapture(e.pointerId); const r=cv.getBoundingClientRect();
    cur=[Math.round(e.clientX-r.left),Math.round(e.clientY-r.top)]; strokes().push(cur); });
  cv.addEventListener("pointermove",e=>{ if(!cur)return; const r=cv.getBoundingClientRect();
    cur.push(Math.round(e.clientX-r.left),Math.round(e.clientY-r.top)); redraw(); });
  const up=()=>{ if(cur){ cur=null; save(); } };
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
  clear.addEventListener("click",()=>{ S.strokes[nr]=[]; save(); redraw(); });
  requestAnimationFrame(resize);
}

/* ---------- Screens ---------- */
function show(screen){ S.screen=screen; save(); render(); window.scrollTo(0,0); }

function render(){
  setStatus();
  if(S.screen==="start") return renderStart();
  if(S.screen==="task") return renderTask();
  if(S.screen==="teil1ende") return renderTeil1Ende();
  if(S.screen==="ende") return renderEnde();
  if(S.screen==="anpassen") return renderAnpassen();
  if(S.screen==="plan") return renderPlan();
  if(S.screen==="fortschritt") return renderFortschritt();
  if(S.screen==="day") return renderDay();
  if(S.screen==="info") return renderInfo();
  renderStart();
}

function renderTask(){
  const t=TASKS[S.idx];

  } else if(t.type==="MC"){

  inner+='<div class="row" style="margin-top:20px">'+

    '</div>'+

  main.innerHTML='<div class="card">'+inner+'</div>';
  mountScratch($("scratchhost"), t.nr);

  function goNext(){
    if(t.nr===18){ S.pausedAfterTeil1=false; return show("teil1ende"); }
    if(S.idx+1>=TASKS.length){ S.done=true; save(); return show("ende"); }
    S.idx++; save(); render(); window.scrollTo(0,0);
  }
  if(t.type==="MC"){
    document.querySelectorAll("#opts .opt").forEach(b=>b.addEventListener("click",()=>{
      S.answers[t.nr]=+b.dataset.k; delete S.hwnn[t.nr]; save(); notiert(); setTimeout(goNext,450);

  });
  if($("hwnnBtn")) $("hwnnBtn").addEventListener("click",()=>{
    S.hwnn[t.nr]=true; delete S.answers[t.nr];
    const first=!S.hwnnHintSeen; S.hwnnHintSeen=true; save();

/* ---------- Lerneinheiten-Player (M2.4) ---------- */
function solMatches(sol, input){
  // Vergleich nach Eingabekonventionen: Zahl-/Bruch-Kandidaten aus der Lösung sammeln
  // (Lösungsanfang + jeder Wert nach einem "=", z. B. "2⁵ = 32" oder "U = 24 cm; A = 36 cm²")
  const s=String(sol).replace(/−/g,"-");
  const inFrac=parseFracValue(String(input));
  if(!isFinite(inFrac)) return null;
  const cands=[];
  const add=(t,lead)=>{ if(!t)return;
    if(lead && /^-?\d+(?:,\d+)?[⁰¹²³⁴⁵⁶⁷⁸⁹^]/.test(t.trim())) return; // Potenz wie "2⁵ = …": Basis ist kein Ergebnis
    const f=t.match(/^-?\d+\/\d+/); const n=t.match(/^-?\d+(?:,\d+)?/);
    if(f){ const [x,y]=f[0].split("/").map(Number); if(y)cands.push(x/y); }
    else if(n){ cands.push(parseFloat(n[0].replace(",","."))); } };
  add(s.trim(), true);
  for(const m of s.matchAll(/=\s*(-?[\d,\/]+)/g)) add(m[1]);
  if(!cands.length) return null;
  return cands.some(v=>isFinite(v)&&Math.abs(inFrac-v)<0.005);
}
function unitSteps(skill, abMittel, minuten, blockIdx){
  const c=CONTENT[skill]; if(!c||!c.kerne||!c.kerne.length) return null;
  const kern=c.kerne[Math.min(blockIdx||0, c.kerne.length-1)];
  const hatStufen=kern.ueben.some(u=>u.stufe);
  const leicht=kern.ueben.filter(u=>u.stufe==="leicht"), mittel=kern.ueben.filter(u=>u.stufe!=="leicht");
  let kernTasks;
  if(!hatStufen) kernTasks=kern.ueben.slice(0,5);
  else kernTasks = abMittel ? mittel.slice(0,5) : leicht.slice(0,2).concat(mittel.slice(0,3));
  const steps=[{typ:"verstehen",kern},{typ:"fallen",kern}];
  kernTasks.forEach(u=>steps.push({typ:"aufgabe",u}));
  if(minuten>=20) steps.push({typ:"mix"});
  if(minuten>=30){
    const extra = c.uplus.length ? c.uplus.slice(0,4) : (abMittel?mittel.slice(5,8):mittel.slice(3,6));
    extra.forEach(u=>steps.push({typ:"aufgabe",u,extra:true}));
  }
  if(minuten>=45 && (blockIdx||0)===c.kerne.length-1)
    c.transfer.slice(0,2).forEach(t=>steps.push({typ:"aufgabe",u:{stufe:"Transfer",aufgabe:t.aufgabe,loesung:t.loesung,hinweis:t.hinweis},extra:true}));
  return steps;
}
function mixPool(exceptSkill){
  const diag=effectiveDiag(); const pool=[];
  for(const sk of SKILLS){
    if(sk.id===exceptSkill||!CONTENT[sk.id]) continue;
    const learned=Object.keys(S.daysDone).length>0; // vereinfachte v1: gelernte + sitzende F-Themen
    if(diag[sk.id]==="sitzt"||learned) CONTENT[sk.id].wpool.forEach(w=>pool.push({skill:sk.id,...w}));
  }
  // stabil mischen über Tag als Seed
  const seed=(S.curDay||1)*7919; const out=[];
  const idx=pool.map((_,i)=>i).sort((a,b)=>((a*seed)%104729)-((b*seed)%104729));
  for(const i of idx.slice(0,4)) out.push(pool[i]);
  return out;
}

    '<button class="btn block" id="goBtn">'+(S.done?(S.planCreated?'Zum Lernplan':'Lernplan erstellen'):'Weitermachen')+'</button>'+
  '</div>';
  $("goBtn").addEventListener("click",()=>{ if(!S.done){ show("start"); } else show(S.planCreated?"plan":"anpassen"); });
}

function renderInfo(){
  main.innerHTML='<div class="card">'+
    '<strong>Über den Booster</strong>'+
    '<p>Der Mathe-Booster frischt genau die Mathe-Grundlagen auf, die du im neuen Schuljahr brauchst. Am Anfang steht dein Mathe-Check: kein Test, keine Note – er findet heraus, was du dir sparen kannst. Daraus entsteht dein persönlicher Lernplan mit kurzen Einheiten von 15 bis 45 Minuten.</p>'+
    '<p class="muted" style="font-size:.9rem">Beta-Version für Testfamilien · Fehler gefunden oder etwas unklar? Sag uns einfach Bescheid – genau dafür ist die Testphase da.</p>'+
    '<button class="btn block" id="homeBtn">Zur Startseite</button>'+
  '</div>';
  $("homeBtn").addEventListener("click",()=>show("start"));
}

/* ---------- Navigation ---------- */
$("navStart").addEventListener("click",()=>show("start"));
$("navInfo").addEventListener("click",()=>show("info"));
$("brand").addEventListener("click",()=>show("info"));
$("navProgress").addEventListener("click",()=>show("fortschritt"));
$("navAdjust").addEventListener("click",()=>{ if(S.done) show("anpassen"); else notiert("Erst dein Mathe-Check – dann dein Plan!"); });
$("navProfile").addEventListener("click",()=>{ notiert("Kommt bald!"); });

render();
</script>
</body>
</html>
