<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FBF8F2">
<title>Mathe-Booster</title>
<style>
:root{
  --bg-page:#FBF8F2; --bg-surface:#FFFFFF; --color-heading:#173B2E; --color-text:#173B2E;
  --color-muted:#766F60; --color-border:#EDE8DE;
  --accent:#0E6E45; --accent-hover:#0B5838; --on-accent:#FFFFFF; --accent-tint:#DEF3E6;
  --secondary:#D8431E; --secondary-hover:#B8380F; --on-secondary:#FFFFFF; --secondary-tint:#FBE3DA;
  --koralle:#FF5E3A;
  --font-base:-apple-system,"Helvetica Neue",Arial,system-ui,sans-serif; --lh-body:1.55; --lh-tight:1.15;
  --radius-sm:10px; --radius-md:14px; --space-1:8px; --space-2:16px; --space-3:24px; --space-4:40px; --maxw:560px;
}
@media (min-width:900px){
  html{font-size:18px;}
  :root{--maxw:780px;--space-1:10px;--space-2:22px;--space-3:36px;--space-4:56px;--radius-md:16px;}
  header.app h1{font-size:1.2rem;}
  .nav button{padding:10px 16px;font-size:.9rem;}
}
@media (max-width:560px){
  header.app .brand{flex-wrap:wrap;}
  .nav{justify-content:flex-start;width:100%;}
  .nav button{padding:7px 10px;font-size:.8rem;}
}
@media print{header.app,.nav,.noprint,.status,footer.legal{display:none!important}body{background:#fff;padding-bottom:0}.card{border:1px solid #ccc}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-page);color:var(--color-text);font-family:var(--font-base);line-height:var(--lh-body);padding-bottom:var(--space-3);}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--space-2);}
header.app{padding:var(--space-2);}
header.app .brand{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;max-width:var(--maxw);margin:0 auto;}
header.app h1{font-size:1.05rem;color:var(--color-heading);margin:0;line-height:var(--lh-tight);cursor:pointer;}
.byline{font-size:.9rem;color:var(--secondary);font-weight:400;margin-top:2px;line-height:1.2;}
.nav{display:flex;gap:8px;flex-wrap:wrap;}
.nav button{padding:8px 12px;font-size:.85rem;background:transparent;color:var(--secondary);border:1px solid var(--secondary);border-radius:var(--radius-sm);cursor:pointer;font-family:inherit;}
.nav button:hover{background:var(--secondary-tint);}
.card{background:var(--bg-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-3);margin-bottom:var(--space-2);}
button{font-family:inherit;font-size:1rem;cursor:pointer;border-radius:var(--radius-sm);border:1px solid transparent;padding:12px 18px;}
.btn{background:var(--accent);color:var(--on-accent);border-color:var(--accent);}
.btn:hover{background:var(--accent-hover);}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--accent);}
.btn.ghost:hover{background:var(--accent-tint);}
.btn.block{display:block;width:100%;margin-top:var(--space-2);}
.btn.small{padding:8px 12px;font-size:.9rem;}
.opt{border:1px solid var(--color-border);background:#fff;border-radius:var(--radius-sm);padding:10px 14px;cursor:pointer;display:block;width:100%;text-align:left;font-size:1rem;margin-top:8px;font-family:inherit;color:var(--color-text);}
.opt.active{background:var(--accent-tint);border-color:var(--accent);color:var(--accent);font-weight:600;}
label.fld{display:block;font-weight:600;margin-top:var(--space-3);color:var(--color-heading);}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-size:.8rem;background:#FAF5E9;border:1px solid var(--secondary);color:var(--color-heading);}
.bar{height:9px;background:var(--color-border);border-radius:999px;overflow:hidden;margin:10px 0 var(--space-2);}
.bar>div{height:100%;background:var(--accent);width:0;transition:width .3s;}
.bar.koralle>div{background:var(--koralle);}
.prompt{font-size:1.35rem;font-weight:700;color:var(--color-heading);margin:var(--space-2) 0;line-height:1.35;}
.ex{font-style:italic;color:var(--secondary);margin-bottom:var(--space-2);}
input[type=text]{width:100%;padding:12px;border:1px solid var(--color-border);border-radius:var(--radius-sm);font-size:1.1rem;font-family:inherit;}
.unitrow{display:flex;align-items:center;gap:10px;}
.unitrow input{flex:1;}
.unit{font-weight:600;color:var(--color-heading);white-space:nowrap;}
.banner{background:var(--accent-tint);border:1px solid var(--color-border);border-left:4px solid var(--koralle);border-radius:0;padding:var(--space-2);margin:var(--space-3) 0;}
.info{background:#fff;border:1px solid var(--color-border);border-left:4px solid var(--koralle);border-radius:0;padding:12px 14px;font-size:1rem;color:var(--color-text);margin:var(--space-2) 0;}
.warn{background:#F7ECD8;border:1px solid #E4C98A;color:#6B4E1E;border-radius:var(--radius-sm);padding:10px 12px;margin:10px 0;}
table.plan{width:100%;border-collapse:collapse;font-size:.9rem;}
table.plan th,table.plan td{border:1px solid var(--color-border);padding:6px 8px;text-align:left;}
table.plan th{background:var(--accent);color:#FFFFFF;}
table.plan tr.today td{background:var(--accent-tint);font-weight:600;}
.status{width:calc(100% - 2*var(--space-2));max-width:calc(var(--maxw) - 2*var(--space-2));margin:0 auto var(--space-3);background:var(--bg-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:12px var(--space-2);font-size:.95rem;}
footer.legal{max-width:var(--maxw);margin:var(--space-3) auto 0;padding:0 var(--space-2) var(--space-2);text-align:center;font-size:.8rem;color:var(--color-muted);}
footer.legal a{color:var(--color-muted);}
.muted{color:var(--color-muted);}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.hidden{display:none!important;}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;line-height:1.1;}
.frac .num{border-bottom:1.5px solid currentColor;padding:0 4px;}
.frac .den{padding:0 4px;}
.pf{display:inline-block;vertical-align:0.18em;line-height:1;margin:0 3px;font-weight:700;}
.scratch{margin-top:var(--space-2);}
.scratch canvas{width:100%;height:220px;background:#fff;border:1px dashed var(--color-border);border-radius:var(--radius-sm);touch-action:none;display:block;}
@media (max-width:480px){ .scratch canvas{height:170px;} } /* Handy: weniger scrollen bis zu den Buttons (Beta-Feedback Sophie) */
.gapfields{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:1.15rem;font-weight:600;color:var(--color-heading);}
.gapfields input{width:90px;text-align:center;}
.notiert{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 22px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:10;}
.notiert.show{opacity:1;}
.motrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.motrow .opt{display:inline-block;width:auto;padding:8px 13px;margin-top:0;text-align:center;}
.cfgrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.cfgrow .opt{display:inline-block;width:auto;margin-top:0;}
</style>
</head>

  <div class="brand">
    <div>
      <h1 id="brand" title="Über den Booster">Mathe-Booster</h1>
      <div class="byline">von Annette C. Breuer</div>
    </div>
    <div class="nav">
      <button id="navStart">Start</button>
      <button id="navThemen">Themen</button>
      <button id="navFormeln">Formeln</button>
      <button id="navInfo">Info</button>
      <button id="navProgress">Fortschritt</button>
      <button id="navAdjust">Anpassen</button>
      <button id="navProfile">Profil</button>

</header>

      return isFinite(a)&&isFinite(b)&&Math.abs(a-k.legacy[0])<0.005&&Math.abs(b-k.legacy[1])<0.005; }

  }

}

   es gibt Antworten im Bereich 1-28, und zu KEINER der Nummern 29-38 liegt etwas vor - die gab
   es damals noch nicht. */
function istAlterCheck(st){
  if(!st || !st.done) return false;
  const a=st.answers||{}, h=st.hwnn||{};
  for(let nr=29; nr<=38; nr++) if(a[nr]!==undefined || h[nr]) return false;
  for(let nr=1; nr<=28; nr++) if(a[nr]!==undefined || h[nr]) return true;
  return false;
}

/* ---------- Antwortprüfung (Leitfaden Abschn. 6: Komma/Punkt, Brüche, gemischte Zahlen) ---------- */
function parseNum(s){
  if(typeof s!=="string") return NaN;
  s=s.trim().replace(/−/g,"-").replace(/\s+/g,"");
  if(/^-?\d+\/\d+$/.test(s)){ const [a,b]=s.split("/").map(Number); return b?a/b:NaN; }
  s=s.replace(/\./g, s.includes(",")?"":".").replace(",",".");
  const v=parseFloat(s);
  return isFinite(v)?v:NaN;
}
function parseFracValue(s){
  if(typeof s!=="string") return NaN;
  s=s.trim().replace(/−/g,"-").replace(/\s*\/\s*/g,"/"); // Leerzeichen um den Bruchstrich sind ok (auch bei "1 1 / 9")
  let m=s.match(/^(-?\d+)\s+(\d+)\/(\d+)$/); // gemischte Zahl "1 1/9"
  if(m){ const g=+m[1], z=+m[2], n=+m[3]; if(!n) return NaN; return (g<0?-1:1)*(Math.abs(g)+z/n); }
  m=s.match(/^(-?\d+)\/(\d+)$/);
  if(m){ const z=+m[1], n=+m[2]; if(!n) return NaN; return z/n; }
  return parseNum(s);
}
function isCorrect(nr, ans){
  const k=KEY[nr]; if(k===undefined||ans===undefined||ans===null) return false;
  if(k.t==="mc") return ans===k.v;
  if(k.t==="num"){ const v=parseNum(String(ans)); return isFinite(v)&&Math.abs(v-k.v)<0.005; }
  if(k.t==="frac"){ const v=parseFracValue(String(ans)); return isFinite(v)&&Math.abs(v-k.v[0]/k.v[1])<0.005; }
  if(k.t==="pair"){
    if(!Array.isArray(ans)||ans.length<2) return false;
    const a=parseNum(String(ans[0])), b=parseNum(String(ans[1]));
    return isFinite(a)&&isFinite(b)&&Math.abs(a-k.v[0])<0.005&&Math.abs(b-k.v[1])<0.005;
  }
  if(k.t==="term"){
    if(Array.isArray(ans)){ // Alt-Antworten aus der Kästchen-Version (vor 30.07.): weiter fair werten
      if(!k.legacy||ans.length<2) return false;
      const a=parseNum(String(ans[0])), b=parseNum(String(ans[1]));
      return isFinite(a)&&isFinite(b)&&Math.abs(a-k.legacy[0])<0.005&&Math.abs(b-k.legacy[1])<0.005;
    }
    return solMatches(k.v, String(ans))===true;  // 1.54: derselbe Termrechner wie beim Üben (auch Klammerformen)
  }
  if(k.t==="txt") return solMatches(k.v, String(ans))===true;   // 1.54: kurze Textantworten ("geht nicht")
  return false;
}

/* ---------- Diagnose (Auswertungs-Landkarte, Eingangscheck v4.1 Abschn. 3/6) ----------
   Ergebnis je Aufgabe: "r" richtig · "f" falsch · "h" HWNN · "x" leer/übersprungen
   Status je Fertigkeit: sitzt | plan | plan_ab_mittel | optional | optional_ab_mittel   */
function taskResult(nr, answers, hwnn){
  if(hwnn && hwnn[nr]) return "h";
  if(answers[nr]===undefined) return "x";
  /* 1.62: Jede Antwort wird mit dem Schluessel bewertet, der zu der Frage gehoert, die das Kind
     WIRKLICH gesehen hat. Bei einem Lernstand aus dem 28er-Check sind das fuer die Nummern 1-28
     die alten Fragen; alles ab 29 hat das Kind erst in der heutigen Fassung beantwortet. */
  if(typeof S!=="undefined" && S && S.check28 && nr<=28) return korrekt28(nr, answers[nr]) ? "r" : "f";
  return isCorrect(nr, answers[nr]) ? "r" : "f";
}
function diagnose(answers, hwnn){
  const out={};
  for(const sk of SKILLS){
    if(sk.rang==="F"){
      /* Auch bei "h" (HWNN) -> "plan": Der Knopf ist seit 1.20 auf ALLEN Aufgaben verfuegbar
         (Anweisung Annette 11.08.2026). Bei Grundwissen aus Kl. 5/6 heisst "Hatten wir noch
         nicht" praktisch "weiss ich nicht mehr" - das Thema kommt als Auffrischung in den
         Plan und wird NIE zum Vorsprung, weil alles Weitere darauf aufbaut. */
      out[sk.id] = taskResult(sk.tasks[0], answers, hwnn)==="r" ? "sitzt" : "plan";
    } else if(sk.rang==="A"){
      const l=taskResult(sk.leicht, answers, hwnn), m=taskResult(sk.mittel, answers, hwnn);
      if(m==="r" && (l==="r"||l==="h")) out[sk.id]="sitzt";           // mittel beherrscht
      else if(l==="r" && (m==="f"||m==="x")) out[sk.id]="plan_ab_mittel";
      else if(l==="r" && m==="h") out[sk.id]="optional_ab_mittel";     // HWNN zählt nie als Lücke
      else if(l==="h") out[sk.id]="optional";
      else out[sk.id]="plan";                                          // leicht falsch/leer → von Beginn an
    } else {
      /* 1.54 (Anweisung Annette 18.08.2026): B- und C-Themen haben ZWEI Aufgaben, beide auf
         mittlerem Niveau. „Sitzt" gilt nur, wenn BEIDE richtig sind – ein einzelnes geratenes
         Kreuz kann kein ganzes Thema mehr aus dem Plan nehmen. Weil beide gleich schwer sind,
         gibt es hier kein „ab der Mitte". HWNN zaehlt wie bisher nie als Luecke. */
      let nrs=sk.tasks;
      /* 1.62: Ein Lernstand aus dem 28er-Check kann die zweite Aufgabe gar nicht beantwortet
         haben - es gab sie noch nicht. Dann zaehlt, was das Kind GEFRAGT wurde. Sobald es die
         neue Aufgabe nachholt, gilt wieder die schaerfere Regel aus 1.54 (beide richtig). */
      if(typeof S!=="undefined" && S && S.check28){
        const gesehen=nrs.filter(n=>(answers[n]!==undefined)||(hwnn&&hwnn[n]));
        if(gesehen.length) nrs=gesehen;
      }
      const rs=nrs.map(n=>taskResult(n, answers, hwnn));
      if(rs.every(r=>r==="r")) out[sk.id]="sitzt";
      else if(rs.every(r=>r==="r"||r==="h") && rs.some(r=>r==="h")) out[sk.id]="optional";
      else out[sk.id]="plan";
    }
  }
  return out;
}

/* ---------- Plan-Builder (Priorität F → A → B → C, optional ans Ende) ---------- */
function bausteinLabel(min){ return min>=45?"Thema + Mix + Extra + Knobeln":min>=30?"Thema + Mix + Extra":min>=20?"Thema + Mix":"Thema"; }
function buildPlan(diag, cfg){
  cfg = Object.assign({wochen:2, tage:5, minuten:20}, cfg||{});
  const order = ["F","A","B","C"];
  const queue=[], bonus=[];
  for(const rang of order){
    for(const sk of SKILLS){
      if(sk.rang!==rang) continue;
      const st=diag[sk.id];
      if(st==="plan"||st==="plan_ab_mittel"){
        const n=sk.blocks||1;
        for(let i=0;i<n;i++) queue.push({id:sk.id, abMittel:st==="plan_ab_mittel", block:i, titel:sk.titel+(n>1?" (Teil "+(i+1)+"/"+n+")":"")});
      } else if(st==="optional"||st==="optional_ab_mittel"){
        bonus.push({id:sk.id, abMittel:st==="optional_ab_mittel", titel:sk.titel});
      }
    }
  }
  const totalDays=cfg.wochen*cfg.tage, days=[], label=bausteinLabel(cfg.minuten);
  let qi=0;
  for(let d=1; d<=totalDays; d++){
    const checkpoint = d%cfg.tage===0;
    if(d===1) days.push({tag:1, baustein:"Check", thema:"Dein Mathe-Check", id:"CHECK", done:true});
    else if(checkpoint) days.push({tag:d, baustein:"Mix-Tag", thema:"Wiederholung quer durch die Woche", id:"MIX"});
    else if(qi<queue.length){ const q=queue[qi++]; days.push({tag:d, baustein:label, thema:q.titel, id:q.id, abMittel:q.abMittel, block:q.block||0}); }
    else days.push({tag:d, baustein:"Mix", thema:"Wiederholmix aus gelerntem/beherrschtem Stoff – dranbleiben und festigen", id:"MIX"});
  }
  return {days, rest:queue.slice(qi), bonus, cfg};
}

tte": [{"g": "Beide Kommas um zwei Stellen verschieben", "op": "Divisor ganzzahlig machen"}, {"g": "434,4 : 8"}, {"g": "= 54,3"}], "loesung": "54,3", "hinweis": "Kommaverschiebung: den Divisor zur ganzen Zahl machen und beim Dividenden gleich weit verschieben.", "quelle": "Test Kap. 1, Aufg. 6f · Lösung S. 149 ✓"}]}, "F4": {"id": "F4", "titel": "Einheiten umrechnen – kein Problem", "kerne": [{"name": "", "verstehen": ["3,5 km – wie viele Meter sind das? Jede Einheit hat eine Umrechnungszahl zur nächsten. Bei Längen → 1 km = 1000 m, 1 m = 100 cm, 1 cm = 10 mm. Also 3,5 km = 3500 m. In die größere Einheit geht es zurück durch Teilen → 250 cm = 2,5 m.", "Die wichtigsten Umrechnungszahlen: Masse → 1 t = 1000 kg, 1 kg = 1000 g. Zeit → 1 h = 60 min, 1 min = 60 s – Vorsicht, hier ist die Umrechnungszahl 60, nicht 100! Geld → 1 € = 100 ct.", "Merkregel: Umrechnen heißt multiplizieren oder dividieren mit der Umrechnungszahl. Bei 10, 100, 1000 verschiebst du einfach das Komma. Schreibe die Einheit immer mit ans Ergebnis."], "fallen": [{"falle": "Bei der Zeit mit 100 gerechnet", "falsch": "1,5 h = 150 min", "richtig": "1,5 h = 90 min", "warum": "Umrechnungszahl bei Stunden/Minuten ist 60: 1,5 · 60"}, {"falle": "Falsche Umrechnungszahl bei km", "falsch": "3,5 km = 350 m", "richtig": "3,5 km = 3500 m", "warum": "1 km = 1000 m, also Komma drei Stellen"}], "ueben": [{"stufe": "leicht", "aufgabe": "3 km = ____ m", "schritte": [{"g": "1 km = 1000 m"}, {"g": "3 · 1000 = 3000", "op": "| · 1000"}, {"g": "3 km = 3000 m"}], "loesung": "3000", "hinweis": "Umrechnungszahl 1000: km → m heißt mal 1000."}, {"stufe": "leicht", "aufgabe": "250 cm = ____ m", "schritte": [{"g": "1 cm = 1/100 m  (bzw. 100 cm = 1 m)"}, {"g": "250 : 100 = 2,5", "op": "| : 100"}, {"g": "250 cm = 2,5 m"}], "loesung": "2,5", "hinweis": "Umrechnungszahl 100: cm → m heißt durch 100."}, {"stufe": "leicht", "aufgabe": "4,2 kg = ____ g", "schritte": [{"g": "1 kg = 1000 g"}, {"g": "4,2 · 1000 = 4200", "op": "| · 1000"}, {"g": "4,2 kg = 4200 g"}], "loesung": "4200", "hinweis": "Umrechnungszahl 1000: kg → g heißt mal 1000."}, {"stufe": "mittel", "aufgabe": "1250 g = ____ kg", "schritte": [{"g": "1 g = 1/1000 kg  (bzw. 1000 g = 1 kg)"}, {"g": "1250 : 1000 = 1,25", "op": "| : 1000"}, {"g": "1250 g = 1,25 kg"}], "loesung": "1,25", "hinweis": "Umrechnungszahl 1000: g → kg heißt durch 1000."}, {"stufe": "mittel", "aufgabe": "2 h 15 min = ____ min", "schritte": [{"g": "Stunden zuerst"}, {"g": "2 · 60 = 120 min, dann + 15."}, {"g": "Ergebnis: 135"}], "loesung": "135", "hinweis": "Rechne die Stunden zuerst in Minuten um."}, {"stufe": "mittel", "aufgabe": "3,05 m = ____ cm", "schritte": [{"g": "1 m = 100 cm"}, {"g": "3,05 · 100 = 305", "op": "| · 100"}, {"g": "3,05 m = 305 cm"}], "loesung": "305", "hinweis": "m → cm heißt mal 100 – das Komma wandert zwei Stellen → 3,05 → 305."}, {"stufe": "mittel", "aufgabe": "0,4 t = ____ kg", "schritte": [{"g": "1 t = 1000 kg"}, {"g": "0,4 · 1000 = 400", "op": "| · 1000"}, {"g": "0,4 t = 400 kg"}], "loesung": "400", "hinweis": "Umrechnungszahl 1000: t → kg heißt mal 1000."}, {"stufe": "mittel", "aufgabe": "90 s = ____ min", "schritte": [{"g": "1 s = 1/60 min  (bzw. 60 s = 1 min)"}, {"g": "90 : 60 = 1,5", "op": "| : 60"}, {"g": "90 s = 1,5 min"}], "loesung": "1,5", "hinweis": "s → min heißt durch 60: 90 : 60 = 1,5."}, {"stufe": "mittel", "aufgabe": "12500 m = ____ km", "schritte": [{"g": "1 m = 1/1000 km  (bzw. 1000 m = 1 km)"}, {"g": "12500 : 1000 = 12,5", "op": "| : 1000"}, {"g": "12500 m = 12,5 km"}], "loesung": "12,5", "hinweis": "m → km heißt durch 1000 – das Komma wandert drei Stellen."}, {"stufe": "mittel", "aufgabe": "Karte im Maßstab 1 : 50000. Wie viele km sind 4 cm auf der Karte in Wirklichkeit?", "schritte": [{"g": "Maßstab 1 : 50000 → 1 cm auf der Karte = 50000 cm in echt"}, {"g": "4 · 50000 = 200000 cm", "op": "| · 50000"}, {"g": "200000 cm = 2000 m = 2 km"}, {"g": "Antwort: 2 km"}], "loesung": "2 km", "hinweis": "4 · 50000 = 200000 cm = 2 km"}, {"aufgabe": "Rechne um: 2,5 ha in m²", "loesung": "25000 m²", "hinweis": "Gehe über die Zwischenstufe Ar.", "schritte": [{"g": "1 ha = 100 a", "op": "Umrechnungstabelle"}, {"g": "2,5 ha = 250 a"}, {"g": "1 a = 100 m², also 250 a = 25000 m²"}, {"g": "Ergebnis: 25000 m²"}], "quelle": "analog Grundwissen S. 149 (Umrechnungstabelle Flächeneinheiten)", "stufe": "schwer"}, {"aufgabe": "Rechne um: 0,04 km² in a", "loesung": "400 a", "hinweis": "Zwei Stufen: erst in Hektar, dann in Ar.", "schritte": [{"g": "1 km² = 100 ha", "op": "Umrechnungstabelle"}, {"g": "0,04 km² = 4 ha"}, {"g": "1 ha = 100 a, also 4 ha = 400 a"}, {"g": "Ergebnis: 400 a"}], "quelle": "analog Grundwissen S. 149 (Umrechnungstabelle Flächeneinheiten)", "stufe": "schwer"}]}], "uplus": [], "transfer": [{"aufgabe": "Aus einer 3 m langen Holzlatte werden 3 Bretter zu je 0,85 m gesägt. Wie lang ist das Reststück?", "schritte": [{"g": "Verbraucht"}, {"g": "3 · 0,85 m = 2,55 m. Rest"}, {"g": "3 − 2,55 = 0,45. Antwort: Das Reststück ist 0,45 m (= 45 cm) lang."}], "loesung": "0,45 m", "hinweis": "Rechne zuerst aus, wie viel Holz die drei Bretter verbrauchen."}, {"aufgabe": "Ein Film beginnt um 19:45 Uhr und dauert 1 h 50 min. Wann endet er?", "schritte": [{"g": "In zwei Etappen rechnen: erst die Stunde, dann die Minuten"}, {"g": "19:45 Uhr + 1 h = 20:45 Uhr"}, {"g": "20:45 Uhr + 50 min = 21:35 Uhr"}, {"g": "Antwort: Der Film endet um 21:35 Uhr"}], "loesung": "21:35 Uhr", "hinweis": "19:45 + 1 h = 20:45. 20:45 + 50 min = 21:35. Antwort: Der Film endet um 21:35 Uhr."}], "wpool": [{"aufgabe": "1 kg = ____ g", "schritte": [{"g": "1 kg = 1000 g"}, {"g": "1 · 1000 = 1000", "op": "| · 1000"}, {"g": "1 kg = 1000 g"}], "loesung": "1000", "stufe": "leicht"}, {"aufgabe": "2,5 m = ____ cm", "schritte": [{"g": "1 m = 100 cm"}, {"g": "2,5 · 100 = 250", "op": "| · 100"}, {"g": "2,5 m = 250 cm"}], "loesung": "250", "stufe": "mittel"}, {"aufgabe": "1 h 20 min = ____ min", "schritte": [{"g": "1 h = 60 min"}, {"g": "60 + 20 = 80", "op": "| + 20"}, {"g": "1 h 20 min = 80 min"}], "loesung": "80", "stufe": "mittel"}, {"aufgabe": "0,5 km = ____ m", "schritte": [{"g": "1 km = 1000 m"}, {"g": "0,5 · 1000 = 500", "op": "| · 1000"}, {"g": "0,5 km = 500 m"}], "loesung": "500", "stufe": "mittel"}, {"aufgabe": "3 € 5 ct = ____ ct", "schritte": [{"g": "1 € = 100 ct → 3 € = 300 ct"}, {"g": "300 + 5 = 305", "op": "| + 5"}, {"g": "3 € 5 ct = 305 ct"}], "loesung": "305", "stufe": "mittel"}, {"stufe": "mittel", "aufgabe": "4500 m² = ____ a", "loesung": "45", "quelle": "analog Grundwissen S. 149 (Flächeneinheiten)", "schritte": [{"g": "1 a = 100 m²", "op": "Umrechnungstabelle"}, {"g": "4500 : 100 = 45"}]}, {"stufe": "mittel", "aufgabe": "0,75 h = ____ min", "loesung": "45", "quelle": "analog Grundwissen S. 149 (Zeiteinheiten)", "schritte": [{"g": "1 h = 60 min"}, {"g": "0,75 · 60 = 45"}]}, {"stufe": "mittel", "aufgabe": "2,4 t = ____ kg", "loesung": "2400", "quelle": "analog Grundwissen S. 149 (Masseeinheiten)", "schritte": [{"g": "1 t = 1000 kg"}, {"g": "2,4 · 1000 = 2400"}]}, {"stufe": "mittel", "aufgabe": "350 cm² = ____ dm²", "loesung": "3,5", "quelle": "analog Grundwissen S. 149 (Flächeneinheiten)", "schritte": [{"g": "1 dm² = 100 cm²", "op": "Umrechnungstabelle"}, {"g": "350 : 100 = 3,5"}]}, {"stufe": "mittel", "aufgabe": "1,25 l = ____ ml", "loesung": "1250", "quelle": "analog Grundwissen S. 149 (Hohlmaße)", "schritte": [{"g": "1 l = 1000 ml"}, {"g": "1,25 · 1000 = 1250"}]}, {"stufe": "mittel", "aufgabe": "0,006 km = ____ m", "loesung": "6", "quelle": "analog Grundwissen S. 149 (Längeneinheiten)", "schritte": [{"g": "1 km = 1000 m"}, {"g": "0,006 · 1000 = 6"}]}, {"stufe": "mittel", "aufgabe": "2 kg 300 g = ____ g", "loesung": "2300", "quelle": "analog Grundwissen S. 149 (gemischte Größenangaben)", "schritte": [{"g": "2 kg = 2000 g"}, {"g": "2000 g + 300 g = 2300 g"}]}], "test": [{"stufe": "mittel", "aufgabe": "2,5 m² = ____ cm²", "schritte": [{"g": "1 m² = 10 000 cm²", "op": "Flächen: Faktor 100 je Schritt"}, {"g": "2,5 · 10 000"}, {"g": "= 25 000 cm²"}], "loesung": "25000 cm²", "hinweis": "Bei Flächen ist der Umrechnungsfaktor 100 (nicht 10) – von m² zu cm² also 10 000.", "quelle": "Grundwissen-Band S. 149 (Umrechnungstabelle Flächen); Aufgabentyp wie in der Klassenarbeit"}, {"stufe": "schwer", "aufgabe": "3 500 000 cm³ = ____ m³", "schritte": [{"g": "1 m³ = 1 000 000 cm³", "op": "Volumen: Faktor 1000 je Schritt"}, {"g": "3 500 000 : 1 000 000"}, {"g": "= 3,5 m³"}], "loesung": "3,5 m³", "hinweis": "Bei Volumen ist der Faktor 1000 je Stufe – von cm³ zu m³ sind es 1 000 000.", "quelle": "Grundwissen-Band S. 149 (Umrechnungstabelle Volumen); Aufgabentyp wie in der Klassenarbeit"}]}, "F5": {"id": "F5", "titel": "Prozent? Kenn ich!", "kerne": [{"name": "", "verstehen": ["25 % Rabatt – was heißt das eigentlich? Ein Prozent bedeutet „eins von hundert“, also ein Hundertstel → 1 % = 1/100 = 0,01. Deshalb ist 25 % = 25/100 = 1/4 = 0,25. Prozent, Bruch und Dezimalzahl sind drei Schreibweisen für denselben Anteil.", "Die wichtigste Umrechnung von allen – merke sie dir gut: Das Ganze ist immer 100 %, und 100 % = 100/100 = 1. Also → 1 = 100 %. Daraus folgt alles Weitere → 20 % = 0,2, 80 % = 0,8, 50 % = 0,5. Diese Regel brauchst du in der ganzen Prozentrechnung immer wieder.", "Prozent → Dezimalzahl: Zahl ohne %-Symbol schreiben und Komma um 2 Stellen nach links → 5 % = 0,05. Dezimalzahl → Prozent: Komma um 2 Stellen nach rechts und %-Symbol anhängen → 0,375 = 37,5 %.", "Bruch → Prozent: Erweitere oder kürze auf den Nenner 100 (1/5 = 20/100 = 20 %). Geht das nicht glatt, teile Zähler durch Nenner und verschiebe das Komma → 5/8 = 5 : 8 = 0,625 = 62,5 %. Wichtig: Eine Prozentangabe ist nur sinnvoll, wenn klar ist, was das Ganze (die 100 %) ist."], "fallen": [{"falle": "Komma nur eine Stelle verschoben", "falsch": "5 % = 0,5", "richtig": "5 % = 0,05", "warum": "Prozent heißt Hundertstel → 5/100 – zwei Stellen"}, {"falle": "Zähler als Prozentzahl gelesen", "falsch": "1/5 = 5 %", "richtig": "1/5 = 20 %", "warum": "Auf Nenner 100 erweitern → 1/5 = 20/100"}], "ueben": [{"stufe": "leicht", "aufgabe": "Schreibe als Dezimalzahl und als Bruch (vollständig gekürzt): 40 %", "schritte": [{"g": "Prozent heißt Hundertstel"}, {"g": "40 % = 40/100 – mit 20 kürzen."}, {"g": "Ergebnis: 0,4 = 2/5"}], "loesung": "0,4 = 2/5", "hinweis": "Prozent heißt Hundertstel."}, {"stufe": "leicht", "aufgabe": "Schreibe als Dezimalzahl und als Bruch: 75 %", "schritte": [{"g": "75 % = 75/100 – mit 25 kürzen"}, {"g": "3/4."}, {"g": "Ergebnis: 0,75 = 3/4"}], "loesung": "0,75 = 3/4", "hinweis": "75 % = 75/100 – mit 25 kürzen → 3/4."}, {"stufe": "leicht", "aufgabe": "Schreibe als Dezimalzahl und als Bruch: 5 %", "schritte": [{"g": "5 % = 5/100 – mit 5 kürzen"}, {"g": "1/20."}, {"g": "Ergebnis: 0,05 = 1/20"}], "loesung": "0,05 = 1/20", "hinweis": "5 % = 5/100 – mit 5 kürzen → 1/20."}, {"stufe": "mittel", "aufgabe": "Schreibe als Dezimalzahl und als Bruch: 12,5 %", "schritte": [{"g": "12,5 % = 125/1000 – mit 125 kürzen"}, {"g": "1/8."}, {"g": "Ergebnis: 0,125 = 1/8"}], "loesung": "0,125 = 1/8", "hinweis": "12,5 % = 125/1000 – mit 125 kürzen → 1/8."}, {"stufe": "mittel", "aufgabe": "Schreibe als Dezimalzahl und als Bruch: 87,5 %", "schritte": [{"g": "87,5 % = 875/1000 – mit 125 kürzen"}, {"g": "7/8."}, {"g": "Ergebnis: 0,875 = 7/8"}], "loesung": "0,875 = 7/8", "hinweis": "87,5 % = 875/1000 – mit 125 kürzen → 7/8."}, {"stufe": "mittel", "aufgabe": "Schreibe als Prozentangabe: 7/8", "schritte": [{"g": "Bruch in Prozent"}, {"g": "7 : 8 = 0,875 = 87,5 %."}], "loesung": "87,5 %", "hinweis": "Teile Zähler durch Nenner – das ergibt die Dezimalzahl."}, {"stufe": "mittel", "aufgabe": "Schreibe als Prozentangabe: 32/400", "schritte": [{"g": "Auf Nenner 100 bringen"}, {"g": "32/400 = 8/100", "op": "| kürzen mit 4"}, {"g": "8/100 = 8 %"}], "loesung": "8 %", "hinweis": "Kürzen auf Nenner 100: 8/100"}, {"stufe": "mittel", "aufgabe": "Schreibe als Prozentangabe: 1,05", "schritte": [{"g": "Komma zwei Stellen nach rechts"}, {"g": "1,05 → 105 %"}, {"g": "Mehr als 100 % ist möglich – es ist mehr als das Ganze"}], "loesung": "105 %", "hinweis": "Mehr als das Ganze ist möglich"}, {"stufe": "mittel", "aufgabe": "Schreibe als Prozentangabe: 0,003", "schritte": [{"g": "Komma zwei Stellen nach rechts"}, {"g": "0,003 → 0,3 %"}], "loesung": "0,3 %", "hinweis": "Komma zwei Stellen nach rechts"}, {"stufe": "mittel", "aufgabe": "Schreibe als Prozentangabe (auf 2 Stellen gerundet): 2/9", "schritte": [{"g": "Teile aus"}, {"g": "2 : 9 = 0,2222… – gerundet 22,22 %."}, {"g": "Ergebnis: ≈ 22,22 %"}], "loesung": "≈ 22,22 %", "hinweis": "Teile aus → 2 : 9 = 0,2222… – gerundet 22,22 %."}, {"aufgabe": "Überschlage möglichst genau: 65,6 % von 330", "loesung": "220", "hinweis": "65,6 % liegt ganz nahe bei zwei Dritteln.", "schritte": [{"g": "65,6 % ≈ 66,6 % = 2/3", "op": "auf einen bekannten Bruch runden"}, {"g": "2/3 von 330 = 330 : 3 · 2"}, {"g": "330 : 3 = 110; 110 · 2 = 220"}, {"g": "Ergebnis: ungefähr 220"}], "quelle": "Buch S. 27, Aufg. 15e – 1:1; Buchlösung S. 152 ✓", "stufe": "schwer"}, {"aufgabe": "Berechne im Kopf: 33 1/3 % von 360", "loesung": "120", "hinweis": "33 1/3 % ist genau ein Drittel.", "schritte": [{"g": "33 1/3 % = 1/3", "op": "Prozent als Bruch"}, {"g": "1/3 von 360 = 360 : 3"}, {"g": "Ergebnis: 120"}], "quelle": "Buch S. 27, Aufg. 14h – 1:1; Buchlösung S. 152 ✓", "stufe": "schwer"}]}], "uplus": [], "transfer": [{"aufgabe": "In einer Klasse mit 40 Kindern fahren 12 mit dem Rad zur Schule. Wie viel Prozent sind das?", "schritte": [{"g": "Anteil"}, {"g": "12/40 = 3/10 = 30/100 = 30 %. Antwort"}, {"g": "30 % der Kinder fahren mit dem Rad."}], "loesung": "30 %", "hinweis": "Bilde den Anteil 12 von 40 und erweitere auf den Nenner 100."}, {"aufgabe": "Von den Haushalten in Deutschland sind 42 % Einpersonenhaushalte, 34 % 2-Personen-, 12 % 3-Personen- und 9 % 4-Personen-Haushalte. Wie viel Prozent der Haushalte haben 5 und mehr Personen?", "schritte": [{"g": "Das Ganze sind 100 %"}, {"g": "100 − 42 − 34 − 12 − 9 = 3. Antwort"}, {"g": "3 % der Haushalte haben 5 und mehr Personen."}], "loesung": "3 %", "hinweis": "Das Ganze sind 100 %."}], "wpool": [{"aufgabe": "Schreibe 50 % als Bruch.", "schritte": [{"g": "50 % = 50/100"}, {"g": "kürzen mit 50 → 1/2"}], "loesung": "1/2", "stufe": "leicht"}, {"aufgabe": "Schreibe 0,2 als Prozentangabe.", "schritte": [{"g": "Komma zwei Stellen nach rechts"}, {"g": "0,2 = 0,20 → 20 %"}], "loesung": "20 %", "stufe": "mittel"}, {"aufgabe": "Schreibe 10 % als Dezimalzahl.", "schritte": [{"g": "10 % = 10/100"}, {"g": "10 : 100 = 0,1"}], "loesung": "0,1", "stufe": "leicht"}, {"aufgabe": "Schreibe 3/10 als Prozentangabe.", "schritte": [{"g": "Auf Nenner 100 erweitern"}, {"g": "3/10 = 30/100", "op": "| erweitern mit 10"}, {"g": "30/100 = 30 %"}], "loesung": "30 %", "stufe": "mittel"}, {"aufgabe": "Schreibe 1 % als Dezimalzahl.", "schritte": [{"g": "1 % = 1/100"}, {"g": "1 : 100 = 0,01"}], "loesung": "0,01", "stufe": "mittel"}, {"stufe": "mittel", "aufgabe": "Schreibe 55 % als Bruch (vollständig gekürzt).", "loesung": "11/20", "quelle": "analog Buch S. 22, Aufg. 1c – gleiche Aufgabenart", "schritte": [{"g": "55 % = 55/100", "op": "Prozent heißt „von hundert“"}, {"g": "Kürzen mit 5 → 11/20"}]}, {"stufe": "mittel", "aufgabe": "Schreibe 35 % als Dezimalzahl.", "loesung": "0,35", "quelle": "analog Buch S. 22, Aufg. 1g – gleiche Aufgabenart", "schritte": [{"g": "35 % = 35/100"}, {"g": "35 : 100 = 0,35"}]}, {"stufe": "mittel", "aufgabe": "Schreibe 7/20 als Prozentangabe.", "loesung": "35 %", "quelle": "analog Buch S. 22, Aufg. 1 (Umwandeln in beide Richtungen)", "schritte": [{"g": "Auf den Nenner 100 erweitern: 7/20 = 35/100", "op": "| · 5"}, {"g": "35/100 = 35 %"}]}, {"stufe": "mittel", "aufgabe": "Schreibe 0,08 als Prozentangabe.", "loesung": "8 %", "quelle": "analog Buch S. 22, Aufg. 1 (Umwandeln in beide Richtungen)", "schritte": [{"g": "0,08 = 8/100"}, {"g": "8/100 = 8 %"}]}, {"stufe": "mittel", "aufgabe": "Schreibe 12,5 % als Bruch (vollständig gekürzt).", "loesung": "1/8", "quelle": "Buch S. 22, Aufg. 1j – gleiche Aufgabenart; Buchlösung S. 150 ✓", "schritte": [{"g": "12,5 % = 12,5/100 = 125/1000"}, {"g": "Kürzen mit 125 → 1/8"}]}, {"stufe": "mittel", "aufgabe": "Wie viel Prozent sind 15 von 60?", "loesung": "25 %", "quelle": "analog Buch S. 29, Aufg. 24 (Prozentsatz berechnen)", "schritte": [{"g": "Anteil bilden: 15 : 60 = 0,25"}, {"g": "0,25 = 25 %"}]}, {"stufe": "mittel", "aufgabe": "Schreibe 3/8 als Prozentangabe.", "loesung": "37,5 %", "quelle": "analog Buch S. 22, Aufg. 1 (Bruch als Prozent)", "schritte": [{"g": "3 : 8 = 0,375"}, {"g": "0,375 = 37,5 %"}]}], "test": [{"stufe": "mittel", "aufgabe": "564 ct von 12 € sind wie viel Prozent?", "schritte": [{"g": "Gleiche Einheit: 12 € = 1200 ct"}, {"g": "564 : 1200 = 0,47"}, {"g": "= 47 %"}], "loesung": "47 %", "hinweis": "Zuerst beide Größen in dieselbe Einheit bringen, dann Prozentwert durch Grundwert.", "quelle": "Test Kap. 2, Aufg. 1d · Lösung S. 155 ✓"}, {"stufe": "schwer", "aufgabe": "2,5 % sind 3 l. Wie groß ist der Grundwert?", "schritte": [{"g": "Grundwert = Prozentwert : Prozentsatz"}, {"g": "3 : 0,025"}, {"g": "= 120 l"}], "loesung": "120 l", "hinweis": "Gesucht ist der Grundwert: Prozentwert durch den Prozentsatz als Dezimalzahl teilen.", "quelle": "Test Kap. 2, Aufg. 1f · Lösung S. 155 ✓"}]}, "F6": {"id": "F6", "titel": "Fläche, Umfang, Volumen – so geht’s", "kerne": [{"name": "", "verstehen": ["Der Umfang ist der Weg einmal außen herum: Beim Rechteck U = 2 · (a + b), beim Quadrat U = 4 · a. Der Flächeninhalt sagt, wie viel hineinpasst: Rechteck A = a · b, Quadrat A = a². Miss beides nie in derselben Einheit – Umfang in cm, Fläche in cm²!", "Die Formeln aus dem Grundwissen: Dreieck A = 1/2 · g · h (halbes Rechteck!), Parallelogramm A = g · h, Trapez A = 1/2 · (a + c) · h. Komplizierte Flächen zerlegst du in Rechtecke oder ergänzt sie zu Rechtecken – das ist der wichtigste Trick.", "Beim Quader gilt V = a · b · c, gemessen in cm³ oder m³. Merke die Brücke zu den Litern → 1 dm³ = 1 l. Ein Würfel ist ein Quader mit drei gleichen Kanten → V = a³."], "fallen": [{"falle": "Umfang und Fläche verwechselt", "falsch": "Rechteck 7 cm × 4 cm: A = 22 cm²", "richtig": "A = 7 · 4 = 28 cm²; 22 cm ist der UMFANG", "warum": "U zählt den Rand (2 · (7 + 4)), A das Innere"}, {"falle": "Dreieck ohne die Hälfte", "falsch": "A = g · h", "richtig": "A = 1/2 · g · h", "warum": "Ein Dreieck ist ein halbes Rechteck/Parallelogramm"}], "ueben": [{"stufe": "leicht", "aufgabe": "Ein Rechteck hat die Seiten a = 7 cm und b = 4 cm. Berechne Umfang und Flächeninhalt.", "schritte": [{"g": "Umfang: U = 2 · (a + b)"}, {"g": "U = 2 · (7 + 4) = 2 · 11 = 22 cm"}, {"g": "Fläche: A = a · b"}, {"g": "A = 7 · 4 = 28 cm²"}, {"g": "Antwort: U = 22 cm; A = 28 cm²"}], "loesung": "U = 22 cm; A = 28 cm²", "hinweis": "U = 2 · (7 + 4); A = 7 · 4"}, {"stufe": "leicht", "aufgabe": "Ein Quadrat hat die Seite a = 6 cm. Berechne Umfang und Flächeninhalt.", "schritte": [{"g": "Umfang: U = 4 · a"}, {"g": "U = 4 · 6 = 24 cm"}, {"g": "Fläche: A = a · a"}, {"g": "A = 6 · 6 = 36 cm²"}, {"g": "Antwort: U = 24 cm; A = 36 cm²"}], "loesung": "U = 24 cm; A = 36 cm²", "hinweis": "Quadrat: Umfang U = 4 · a = 4 · 6, Fläche A = a · a = 6²."}, {"stufe": "leicht", "aufgabe": "Ein Dreieck hat die Grundseite g = 8 cm und die Höhe h = 5 cm. Berechne den Flächeninhalt.", "schritte": [{"g": "Dreiecksformel"}, {"g": "A = ½ · g · h = ½ · 8 · 5."}, {"g": "Ergebnis: 20 cm²"}], "loesung": "20 cm²", "hinweis": "Dreiecksformel → A = ½ · g · h = ½ · 8 · 5."}, {"stufe": "mittel", "aufgabe": "Ein Parallelogramm hat die Grundseite g = 9 cm und die Höhe h = 4 cm. Berechne den Flächeninhalt.", "schritte": [{"g": "Parallelogramm"}, {"g": "A = g · h = 9 · 4."}, {"g": "Ergebnis: 36 cm²"}], "loesung": "36 cm²", "hinweis": "Parallelogramm → A = g · h = 9 · 4."}, {"stufe": "mittel", "aufgabe": "Ein Trapez hat die parallelen Seiten a = 8 cm und c = 4 cm und die Höhe h = 5 cm. Berechne den Flächeninhalt.", "schritte": [{"g": "Trapez"}, {"g": "A = ½ · (a + c) · h = ½ · 12 · 5."}, {"g": "Ergebnis: 30 cm²"}], "loesung": "30 cm²", "hinweis": "Trapez → A = ½ · (a + c) · h = ½ · 12 · 5."}, {"stufe": "mittel", "aufgabe": "Ein Rechteck hat A = 54 cm² und a = 9 cm. Berechne b und den Umfang.", "schritte": [{"g": "Formel rückwärts: A = a · b → b = A : a"}, {"g": "b = 54 : 9 = 6 cm"}, {"g": "U = 2 · (9 + 6) = 2 · 15 = 30 cm"}, {"g": "Antwort: b = 6 cm; U = 30 cm"}], "loesung": "b = 6 cm; U = 30 cm", "hinweis": "b = 54 : 9; U = 2 · (9 + 6) – Formel rückwärts"}, {"stufe": "mittel", "aufgabe": "Aus einem Rechteck (10 cm × 6 cm) ist an einer Ecke ein Quadrat (2 cm × 2 cm) herausgeschnitten. Berechne den Flächeninhalt der L-Form.", "schritte": [{"g": "Erst das ganze Rechteck, dann das fehlende Stück abziehen"}, {"g": "Rechteck: 10 · 6 = 60 cm²"}, {"g": "Quadrat: 2 · 2 = 4 cm²"}, {"g": "60 − 4 = 56 cm²", "op": "| − 4"}], "loesung": "56 cm²", "hinweis": "Ergänzen statt mühsam zerlegen: großes Rechteck 10 · 6 = 60 cm², davon das fehlende Quadrat 2 · 2 = 4 cm² abziehen."}, {"stufe": "mittel", "aufgabe": "Ein Quader hat V = 120 cm³, a = 6 cm, b = 5 cm. Berechne c.", "schritte": [{"g": "Formel rückwärts"}, {"g": "c = V : (a · b) = 120 : 30."}, {"g": "Ergebnis: c = 4 cm"}], "loesung": "c = 4 cm", "hinweis": "Formel rückwärts → c = V : (a · b) = 120 : 30."}, {"stufe": "mittel", "aufgabe": "Ein Würfel hat die Kante a = 3 cm. Berechne das Volumen.", "schritte": [{"g": "Würfel"}, {"g": "V = a³ = 3 · 3 · 3."}, {"g": "Ergebnis: 27 cm³"}], "loesung": "27 cm³", "hinweis": "Würfel → V = a³ = 3 · 3 · 3."}, {"aufgabe": "Ein Trapez hat den Flächeninhalt A = 60 cm² und die parallelen Seiten a = 10 cm und c = 5 cm. Berechne die Höhe h.", "loesung": "8 cm", "hinweis": "Stelle die Trapezformel nach h um.", "schritte": [{"g": "Formel: A = 1/2 · (a + c) · h", "op": "Formel benennen"}, {"g": "Nach h umstellen: h = 2A : (a + c)", "op": "Umkehrrechnung"}, {"g": "h = 2 · 60 cm² : (10 cm + 5 cm) = 120 : 15"}, {"g": "Ergebnis: h = 8 cm"}], "quelle": "analog Grundwissen S. 149 (Trapezformel), Umkehraufgabe", "stufe": "schwer"}, {"aufgabe": "Ein Quader hat das Volumen 72 cm³, ist 6 cm lang und 4 cm breit. Wie hoch ist er?", "loesung": "3 cm", "hinweis": "Volumen = Grundfläche · Höhe – rechne die Grundfläche zuerst aus.", "schritte": [{"g": "Formel: V = a · b · h", "op": "Formel benennen"}, {"g": "Grundfläche: 6 cm · 4 cm = 24 cm²"}, {"g": "h = V : Grundfläche = 72 cm³ : 24 cm²"}, {"g": "Ergebnis: h = 3 cm"}], "quelle": "analog Grundwissen S. 160 (Volumen des Quaders), Umkehraufgabe", "stufe": "schwer"}]}], "uplus": [{"stufe": "", "aufgabe": "Ein Rechteck hat den Umfang U = 28 cm und die Länge a = 9 cm. Berechne die Breite b.", "schritte": [{"g": "Umfangsformel: U = 2 · (a + b)"}, {"g": "Einsetzen: 28 = 2 · (9 + b) → 14 = 9 + b", "op": "| : 2"}, {"g": "b = 14 − 9 = 5"}, {"g": "Ergebnis: b = 5 cm"}], "loesung": "5 cm", "hinweis": "Erst durch 2 teilen – dann siehst du, was a + b zusammen ergeben."}, {"stufe": "", "aufgabe": "Ein Dreieck hat den Flächeninhalt A = 24 cm² und die Grundseite g = 8 cm. Berechne die Höhe h.", "schritte": [{"g": "Dreiecksformel: A = 1/2 · g · h"}, {"g": "Einsetzen: 24 = 1/2 · 8 · h = 4 · h"}, {"g": "h = 24 : 4 = 6"}, {"g": "Ergebnis: h = 6 cm"}], "loesung": "6 cm", "hinweis": "Die Formel rückwärts: erst 1/2 · g ausrechnen, dann teilen."}], "transfer": [{"aufgabe": "Ein Zimmer ist 4,5 m lang und 3,2 m breit. a) Wie viel m² Teppich brauchst du? b) Wie viele Meter Fußleiste, wenn die Tür 0,9 m breit ist?", "schritte": [{"g": "a) A = 4,5 · 3,2 = 14,4. b) U = 2 · (4,5 + 3,2) = 15,4; minus Tür"}, {"g": "15,4 − 0,9 = 14,5. Antwortsatz mit Einheiten."}, {"g": "Ergebnis: a) 14,4 m² b) 14,5 m"}], "loesung": "a) 14,4 m² b) 14,5 m", "hinweis": "a) Fläche = Länge mal Breite. b) Erst den ganzen Umfang, dann die Türbreite abziehen."}, {"aufgabe": "Ein Aquarium ist innen 60 cm lang, 30 cm breit und 40 cm hoch. Wie viele Liter passen hinein?", "schritte": [{"g": "Volumen: V = Länge · Breite · Höhe"}, {"g": "V = 60 · 30 · 40 = 72000 cm³"}, {"g": "1000 cm³ = 1 l", "op": "| : 1000"}, {"g": "72000 : 1000 = 72 → 72 l"}], "loesung": "72 l", "hinweis": "V = 60 · 30 · 40 = 72000 cm³ = 72 dm³ = 72 l."}], "wpool": [{"aufgabe": "Berechne den Umfang eines Quadrats mit a = 5 cm.", "schritte": [{"g": "U = 4 · a"}, {"g": "U = 4 · 5 = 20 cm"}], "loesung": "20 cm", "stufe": "leicht"}, {"aufgabe": "Berechne die Fläche eines Rechtecks mit 6 cm × 3 cm.", "schritte": [{"g": "A = a · b"}, {"g": "A = 6 · 3 = 18 cm²"}], "loesung": "18 cm²", "stufe": "leicht"}, {"aufgabe": "Berechne die Fläche eines Dreiecks mit g = 6 cm und h = 4 cm.", "schritte": [{"g": "A = g · h : 2"}, {"g": "A = 6 · 4 : 2 = 24 : 2 = 12 cm²"}], "loesung": "12 cm²", "stufe": "mittel"}, {"aufgabe": "Berechne das Volumen eines Würfels mit a = 2 cm.", "schritte": [{"g": "V = a · a · a"}, {"g": "V = 2 · 2 · 2 = 8 cm³"}], "loesung": "8 cm³", "stufe": "mittel"}, {"aufgabe": "3 dm³ = ____ l", "schritte": [{"g": "1 dm³ = 1 l"}, {"g": "3 · 1 = 3", "op": "| · 1"}, {"g": "3 dm³ = 3 l"}], "loesung": "3", "stufe": "mittel"}, {"stufe": "mittel", "aufgabe": "Ein Rechteck hat den Flächeninhalt A = 48 cm² und die Seite a = 8 cm. Berechne b.", "loesung": "6 cm", "quelle": "analog Grundwissen S. 149 (Flächeninhalt Rechteck), Umkehraufgabe", "schritte": [{"g": "Formel: A = a · b"}, {"g": "Nach b umstellen: b = A : a", "op": "Umkehrrechnung"}, {"g": "48 : 8 = 6 → b = 6 cm"}]}, {"stufe": "mittel", "aufgabe": "Ein Dreieck hat den Flächeninhalt A = 30 cm² und die Höhe h = 5 cm. Berechne die Grundseite g.", "loesung": "12 cm", "quelle": "analog Grundwissen S. 149 (Flächeninhalt Dreieck), Umkehraufgabe", "schritte": [{"g": "Formel: A = 1/2 · g · h"}, {"g": "Nach g umstellen: g = 2A : h", "op": "Umkehrrechnung"}, {"g": "2 · 30 : 5 = 12 → g = 12 cm"}]}, {"stufe": "mittel", "aufgabe": "Ein Würfel hat das Volumen V = 125 cm³. Wie lang ist eine Kante?", "loesung": "5 cm", "quelle": "analog Grundwissen S. 160 (Volumen Würfel), Umkehraufgabe", "schritte": [{"g": "Formel: V = a · a · a"}, {"g": "Gesucht ist die Zahl, die dreimal mit sich selbst 125 ergibt"}, {"g": "5 · 5 · 5 = 125 → a = 5 cm"}]}, {"stufe": "mittel", "aufgabe": "Ein Quadrat hat den Umfang U = 36 cm. Berechne den Flächeninhalt.", "loesung": "81 cm²", "quelle": "analog Grundwissen S. 149 (Quadrat), zweistufige Aufgabe", "schritte": [{"g": "U = 4 · a, also a = 36 : 4 = 9 cm", "op": "Umkehrrechnung"}, {"g": "A = a · a = 9 · 9"}, {"g": "A = 81 cm²"}]}, {"stufe": "mittel", "aufgabe": "Ein Parallelogramm hat a = 9 cm und die zugehörige Höhe h = 4 cm. Berechne den Flächeninhalt.", "loesung": "36 cm²", "quelle": "analog Grundwissen S. 149 (Flächeninhalt Parallelogramm)", "schritte": [{"g": "Formel: A = a · h"}, {"g": "9 · 4 = 36 → 36 cm²"}]}, {"stufe": "mittel", "aufgabe": "Ein Quader ist 5 cm lang, 3 cm breit und 2 cm hoch. Berechne das Volumen.", "loesung": "30 cm³", "quelle": "analog Grundwissen S. 160 (Volumen Quader)", "schritte": [{"g": "Formel: V = a · b · c"}, {"g": "5 · 3 · 2 = 30 → 30 cm³"}]}], "test": [{"stufe": "mittel", "aufgabe": "Ein Rechteck ist (3 + x) cm breit und 6 cm hoch. Berechne den Flächeninhalt für x = 9.", "schritte": [{"g": "A = Breite · Höhe = (3 + x) · 6"}, {"g": "x = 9 einsetzen: (3 + 9) · 6"}, {"g": "= 12 · 6 = 72 cm²"}], "loesung": "72 cm²", "hinweis": "Erst den Term für die Fläche aufstellen, dann einsetzen.", "quelle": "Klassenarbeit 4. Schulaufgabe 06/2017, Aufg. 2a; Formel Grundwissen-Band S. 149"}, {"stufe": "schwer", "aufgabe": "Aus einem Karton 20 cm × 30 cm werden an den vier Ecken Quadrate mit der Seitenlänge 4 cm ausgeschnitten, die Ränder werden hochgeklappt. Berechne das Volumen der Schachtel.", "schritte": [{"g": "Länge und Breite verlieren je zweimal 4 cm"}, {"g": "(20 − 8) · (30 − 8) · 4"}, {"g": "= 12 · 22 · 4"}, {"g": "= 1056 cm³"}], "loesung": "1056 cm³", "hinweis": "An jeder Seite fällt zweimal die Höhe weg – die Höhe der Schachtel ist die Schnittlänge.", "quelle": "Klassenarbeit 2. Schulaufgabe (Terme), Aufg. 3b · Lösungsweg im Dossier ✓"}]}, "A2": {"id": "A2", "kerne": [{"name": "", "verstehen": ["Eine Variable ist ein Platzhalter für eine Zahl. Beispiel: Ein Stift kostet x Euro. 5 Stifte und 3 € Versand kosten dann 5x + 3 Euro. Der Term merkt sich die Rechnung – egal, was der Stift kostet. Kostet er 2 €, rechnest du 5 · 2 + 3 = 13. Das nennt man den Termwert: Einsetzen und ausrechnen.", "Wichtig beim Einsetzen negativer Zahlen: Klammern! T(x) = 2x² − 5 mit x = −3 heißt 2 · (−3)² − 5 = 2 · 9 − 5 = 13."], "fallen": [{"falle": "Reihenfolge beim Übersetzen", "falsch": "„5 Stifte à x € plus 3 €“ → 5 + 3x", "richtig": "5x + 3", "warum": "5-mal der Stiftpreis, dazu einmal 3 € – die Struktur des Textes zählt, nicht die Wortreihenfolge"}, {"falle": "Einsetzen ohne Klammer", "falsch": "T(−3) = 2 · −3² − 5 = −23", "richtig": "2 · (−3)² − 5 = 13", "warum": "Ohne Klammer wird erst 3² gerechnet und das Minus bleibt stehen"}], "ueben": [{"stufe": "leicht", "loesung": "3x", "hinweis": "„Das Dreifache“ heißt mal 3 – aus „mal“ wird ein Produkt.", "aufgabe": "„Das Dreifache von x“", "schritte": [{"g": "„Das Dreifache“ heißt mal 3 – aus „mal“ wird ein Produkt"}, {"g": "3x."}], "mc": ["3x", "x + 3", "x³", "3 − x"], "mcCorrect": 0}, {"stufe": "leicht", "loesung": "2·(x + 4)", "hinweis": "Klammer sichert die Summe", "aufgabe": "„Die Summe aus x und 4, dann mal 2“", "schritte": [{"g": "Erst die Summe bilden: x + 4"}, {"g": "„dann mal 2“ → die GANZE Summe wird verdoppelt"}, {"g": "Die Klammer sichert das: 2·(x + 4)"}], "mc": ["2", "(x + 4)", "2x + 4", "x + 8", "2x", "4"], "mcCorrect": 1}, {"stufe": "leicht", "loesung": "21", "hinweis": "Setze 5 für x ein.", "aufgabe": "T(x) = 4x + 1: berechne T(5)", "schritte": [{"g": "Setze 5 für x ein"}, {"g": "4 · 5 + 1 = 21."}]}, {"stufe": "mittel", "loesung": "13", "hinweis": "Klammer ums Minus → 2 · 9 − 5", "aufgabe": "T(x) = 2x² − 5: berechne T(−3)", "schritte": [{"g": "Klam abe": "T(x) = 3x + 7. Berechne T(−4).", "loesung": "−5", "quelle": "analog Buch S. 89, Aufg. 5 (Termwerte berechnen)", "schritte": [{"g": "Einsetzen mit Klammer: 3 · (−4) + 7", "op": "negative Zahl in Klammern"}, {"g": "−12 + 7"}, {"g": "= −5"}]}, {"aufgabe": "Setze x = 3 ein: 5 − 6/x", "schritte": [{"g": "Für x die 3 einsetzen: 5 − 6/3"}, {"g": "Punkt vor Strich: 6/3 = 2"}, {"g": "5 − 2"}, {"g": "Ergebnis: 3"}], "loesung": "3", "hinweis": "Der Bruchstrich ist auch eine Punktrechnung.", "quelle": "Buch 5.2, Aufg. 5d – Zahlen abgewandelt", "stufe": "mittel"}, {"stufe": "mittel", "aufgabe": "T(a) = a² − 2a. Berechne T(−3).", "loesung": "15", "quelle": "analog KA 1. Stegreifaufgabe, Aufg. 2 (Einsetzen negativer Zahlen)", "schritte": [{"g": "Einsetzen mit Klammern: (−3)² − 2 · (−3)"}, {"g": "(−3)² = 9 und −2 · (−3) = +6"}, {"g": "9 + 6 = 15"}]}, {"stufe": "mittel", "aufgabe": "T(x) = 2x² − 5. Berechne T(3).", "loesung": "13", "quelle": "analog Buch S. 89, Aufg. 5 (Termwert mit Potenz)", "schritte": [{"g": "Einsetzen: 2 · 3² − 5"}, {"g": "3² = 9, also 2 · 9 = 18", "op": "Hoch vor Punkt"}, {"g": "18 − 5 = 13"}]}, {"aufgabe": "Setze x = 4 ein: x/x + x · x − 8/x", "schritte": [{"g": "Für jedes x die 4 einsetzen: 4/4 + 4 · 4 − 8/4"}, {"g": "Alle Punktrechnungen zuerst"}, {"g": "4/4 = 1 und 4 · 4 = 16 und 8/4 = 2"}, {"g": "1 + 16 − 2"}, {"g": "1 + 16 = 17 und 17 − 2 = 15"}, {"g": "Ergebnis: 15"}], "loesung": "15", "hinweis": "Drei Punktrechnungen – erst alle, dann von links nach rechts.", "quelle": "Buch 5.2, Aufg. 5h – Zahlen abgewandelt", "stufe": "mittel"}], "titel": "Vom Text zum Term", "test": [{"stufe": "mittel", "aufgabe": "Stelle eine Formel auf, die den Umfang U eines Quadrats in Abhängigkeit von der Seitenlänge a beschreibt.", "schritte": [{"g": "Ein Quadrat hat vier gleich lange Seiten"}, {"g": "U = a + a + a + a"}, {"g": "U = 4a"}], "loesung": "U = 4a", "hinweis": "Vier gleich lange Seiten – aus der Summe wird ein Produkt.", "quelle": "Test Kap. 5, Aufg. 4 · Lösun
